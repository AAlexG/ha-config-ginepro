# automations_pergola_15.yaml

#==================================================================================
# PERGOLA – INSEGUIMENTO SOLARE + APERTURA AERAZIONE (1 giugno – 1 novembre)
# Versione a 6 movimenti fissi al giorno (eliminato il ciclo dei 10 minuti):
#   08:30 / 10:00 / 11:15 : formula "profile angle" su sun.sun (asse lamelle
#                 145°/325°, corsa 0-100% = 135°, margine ombra = 41°),
#                 +5 punti di scorta perché la posizione deve reggere fino
#                 allo slot successivo mentre il sole sale; arrotondamento
#                 al punto intero. Taratura empirica: 15% alle 12:00 di
#                 luglio (slot 11:15 -> ~17). NOTA: prima mattina ancora
#                 da verificare sul campo.
#   azimut >= 145° (il sole passa il piano lamelle: luglio ~12:30,
#                 ottobre ~11:10, lo scatto segue la stagione da solo):
#                 posizione fissa 97%, regge tutto il primo pomeriggio.
#                 Taratura empirica: 97% h12:40, 95% h13:22, 91% h13:26,
#                 87% h13:46, 80% h15:00.
#                 Trigger di recupero alle 13:00 e 14:00: ripetono la
#                 posizione dello slot corrente (nessun movimento fisico se
#                 gia' in posa) e coprono ricariche/riavvii avvenuti DOPO
#                 l'attraversamento, quando il trigger sull'azimut non puo'
#                 piu' scattare (valuta solo il passaggio falso -> vero).
#   15:00 : lamelle all'80% per aerare la zona sottostante.
#   23:01 : chiusura per la notte (0%). Alle 23:01 e non 23:00 per evitare
#           la corsa con il rilascio del blocco manuale delle 23:00.
# Trigger extra: al rilascio della sicurezza meteo la pergola si riposiziona
# subito al valore dello slot corrente, altrimenti dopo un temporale
# resterebbe chiusa fino allo slot successivo.
# Le posizioni NON vengono piu' ripristinate ogni 10 minuti: uno spostamento
# manuale resta valido fino allo slot successivo.
# Rispetta il flag vacanza, il blocco manuale e la chiusura di sicurezza meteo.
#==================================================================================
- id: pergola_inseguimento_solare
  alias: "Pergola – Inseguimento Solare"
  mode: single
  triggers:
    - trigger: time
      at: "08:30:00"
    - trigger: time
      at: "10:00:00"
    - trigger: time
      at: "11:15:00"
    - trigger: template
      value_template: "{{ state_attr('sun.sun','azimuth') | float(0) >= 145 }}"
    - trigger: time
      at: "13:00:00"
    - trigger: time
      at: "14:00:00"
    - trigger: time
      at: "15:00:00"
    - trigger: time
      at: "23:01:00"
    - trigger: state
      entity_id: input_boolean.pergola_meteo_chiusura
      from: "on"
      to: "off"
  conditions:
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: state
      entity_id: input_boolean.pergola_blocco_manuale
      state: "off"
    - condition: state
      entity_id: input_boolean.pergola_meteo_chiusura
      state: "off"
    - condition: template
      value_template: "{{ '06-01' <= now().strftime('%m-%d') <= '11-01' }}"
  actions:
    - variables:
        normal: 145
        travel: 135
        margin: 41
        az: "{{ state_attr('sun.sun','azimuth') | float(180) }}"
        el: "{{ state_attr('sun.sun','elevation') | float(0) }}"
        c: "{{ cos((az - normal) * pi / 180) }}"
        pct_grezzo: "{{ (((atan(tan(el * pi / 180) / c) * 180 / pi) - margin) / travel) * 100 if c > 0.01 else 0 }}"
        pct: "{{ [[pct_grezzo, 0] | max, 100] | min }}"
        ora: "{{ now().strftime('%H:%M') }}"
        target: >-
          {% if '08:30' <= ora < '15:00' %}{% if az < 145 %}{{ [pct + 5, 100] | min | round | int }}{% else %}97{% endif %}{% elif '15:00' <= ora < '23:00' %}80{% else %}0{% endif %}
    - action: cover.set_cover_tilt_position
      target:
        entity_id: cover.terrazzo_pergola_terrazza
      data:
        tilt_position: "{{ target | int }}"

#==================================================================================
# PERGOLA – CHIUSURA SICUREZZA METEO
# Chiude a 0% se: vento medio > 10 km/h per 3 minuti, raffica > 20 km/h,
# intensita' di pioggia > 0 mm/h, accumulo orario > 0 mm, oppure previsione
# pioggia > 0 mm nelle prossime 3 ore (weather.casa).
#
# v15 - RIMOSSO il controllo sulla radiazione solare (era < 30 W/m2 per 30
# minuti; il commento diceva 150, il codice 30). Motivo: la posizione
# pomeridiana all'80% serve ad AERARE lo spazio sottostante, non solo a fare
# ombra, quindi con luce scarsa e tempo asciutto non c'e' motivo di chiudere.
# Il controllo era inoltre ridondante (la previsione a 3 ore anticipa meglio
# il temporale) e si accendeva ogni sera al calare della luce, lasciando il
# flag alzato tutta la notte e visibile in plancia col tempo sereno.
#
# v15 - AGGIUNTO sensor...rain_rate (intensita' istantanea). hourly_rain e'
# un accumulo dell'ora corrente e si azzera allo scoccare dell'ora: se piove
# alle 10:55, alle 11:00 torna a 0 mentre sta ancora piovendo. rain_rate
# copre quel buco e intercetta la pioggia locale immediatamente; hourly_rain
# resta per dare persistenza all'allarme dopo che ha smesso.
# NOTA: event_rain volutamente NON usato, resta > 0 per ore dopo la pioggia
# e terrebbe la pergola chiusa per l'intera giornata.
#
# v15 - Scrive input_datetime.pergola_meteo_ultimo_allarme (usato dal
# rilascio) e input_text.pergola_meteo_causa (mostrato in plancia Tende).
# Rispetta solo il blocco manuale: la sicurezza meteo ha sempre priorità
# sull'inseguimento solare.
#==================================================================================
- id: pergola_meteo_chiusura
  alias: "Pergola – Chiusura Sicurezza Meteo"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_speed
      above: 10
      for: "00:03:00"
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      above: 20
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_rain_rate
      above: 0
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_hourly_rain
      above: 0
    - trigger: time_pattern
      minutes: "/10"
  conditions:
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: state
      entity_id: input_boolean.pergola_blocco_manuale
      state: "off"
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.casa
      data:
        type: hourly
      response_variable: previsione
    - variables:
        v_vento: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_wind_speed') | float(0) }}"
        v_raffica: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) }}"
        v_rate: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_rain_rate') | float(0) }}"
        v_oraria: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_hourly_rain') | float(0) }}"
        mm_previsti: >-
          {{ (previsione['weather.casa'].forecast[0:3]
             | map(attribute='precipitation')
             | map('float', 0) | list) | max | default(0) }}
    # Secondo blocco separato: usa le variabili del primo.
    # ora_inizio = ora di alzamento del flag (last_changed se gia' alzato,
    # adesso se sta per essere alzato ora), non ora dell'ultimo controllo.
    - variables:
        emergenza: >-
          {{ v_vento > 10 or v_raffica > 20 or v_rate > 0
             or v_oraria > 0 or mm_previsti > 0 }}
        ora_inizio: >-
          {% if is_state('input_boolean.pergola_meteo_chiusura','on') %}
          {{ states.input_boolean.pergola_meteo_chiusura.last_changed
             | as_local | as_timestamp | timestamp_custom('%H:%M') }}
          {% else %}{{ now().strftime('%H:%M') }}{% endif %}
        causa: >-
          {{ ([ ('vento ' ~ (v_vento | round(1)) ~ ' km/h') if v_vento > 10 else none,
                ('raffica ' ~ (v_raffica | round(1)) ~ ' km/h') if v_raffica > 20 else none,
                ('pioggia ' ~ (v_rate | round(1)) ~ ' mm/h') if v_rate > 0 else none,
                ('accumulo ' ~ (v_oraria | round(1)) ~ ' mm') if v_oraria > 0 else none,
                ('previsione ' ~ (mm_previsti | round(1)) ~ ' mm/3h') if mm_previsti > 0 else none ]
              | reject('none') | list | join(' + ')) ~ ' – dalle ' ~ ora_inizio }}
    - condition: template
      value_template: "{{ emergenza }}"
    - action: cover.set_cover_tilt_position
      target:
        entity_id: cover.terrazzo_pergola_terrazza
      data:
        tilt_position: 0
    - action: input_text.set_value
      target:
        entity_id: input_text.pergola_meteo_causa
      data:
        value: "{{ causa }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.pergola_meteo_chiusura
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.pergola_meteo_ultimo_allarme
      data:
        timestamp: "{{ now().timestamp() }}"

#==================================================================================
# PERGOLA – RILASCIO SICUREZZA METEO
# Rilascia il blocco meteo dopo 20 minuti senza alcuna condizione di allarme.
#
# v15 - Il trigger "template + for: 00:20:00" e' stato sostituito da un
# controllo periodico. Un trigger template scatta SOLO sulla transizione
# falso -> vero: finche' esisteva il controllo radiazione quella transizione
# avveniva una volta al giorno all'alba, ma tolto quello, in una giornata
# serena e calma il template sarebbe vero da ore e non scatterebbe mai piu'.
# Il flag alzato dalla sola previsione pioggia sarebbe rimasto acceso a
# tempo indeterminato.
#
# I 20 minuti di anti-rimbalzo sono ora misurati su
# input_datetime.pergola_meteo_ultimo_allarme, scritto dall'automazione di
# chiusura ogni volta che vede un'emergenza. Cosi' l'attesa copre anche la
# previsione pioggia senza doverla ricontrollare qui (evita che chiusura e
# rilascio si rincorrano ogni 10 minuti).
#
# Sfasato di 30 secondi rispetto al ciclo della chiusura per non correre
# con essa sullo stesso minuto.
#
# Il controllo istantaneo di vento/raffica/pioggia resta come seconda rete:
# copre il caso in cui la chiusura non giri (flag vacanza o blocco manuale)
# e quindi non aggiorni piu' il timestamp.
#==================================================================================
- id: pergola_meteo_rilascio
  alias: "Pergola – Rilascio Sicurezza Meteo"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: time_pattern
      minutes: "/10"
      seconds: 30
  conditions:
    - condition: state
      entity_id: input_boolean.pergola_meteo_chiusura
      state: "on"
    - condition: template
      value_template: >-
        {{ now().timestamp()
           - (state_attr('input_datetime.pergola_meteo_ultimo_allarme','timestamp')
              | float(0)) >= 1200 }}
    - condition: template
      value_template: >-
        {{ (states('sensor.hp1000se_pro_pro_v1_6_4_wind_speed') | float(0) <= 10)
           and (states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) <= 20)
           and (states('sensor.hp1000se_pro_pro_v1_6_4_rain_rate') | float(0) <= 0)
           and (states('sensor.hp1000se_pro_pro_v1_6_4_hourly_rain') | float(0) <= 0) }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.pergola_meteo_chiusura
    - action: input_text.set_value
      target:
        entity_id: input_text.pergola_meteo_causa
      data:
        value: "Nessun allarme – rientrato alle {{ now().strftime('%H:%M') }}"

#==================================================================================
# TENDA GIARDINO – Chiusura automatica per vento pericoloso
# (spostata da automations.yaml v114 - era la n.33, id invariato)
#
# Soglia: 40 km/h (raffiche) - margine di sicurezza rispetto alla Classe 3
# UNI EN 13561 (49 km/h). Coerente con soglia vento blocco irrigazione.
# Sensore: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
# Attuatore: PRIMA switch.sonoff_100132fd56_4 (Sonoff smontato da Alex),
# ORA cover.all_house_tenda_terrazzo (integrazione nativa in HA).
#
# NOTA: la chiusura fisica avviene ad ogni raffica >40 km/h se la tenda
# risulta non completamente chiusa. La NOTIFICA e' limitata a 1 al giorno
# tramite input_boolean.tenda_notifica_vento_oggi (reset a mezzanotte,
# vedi automazione successiva).
#==================================================================================
- id: tenda_chiusura_vento
  alias: "Tenda Giardino - Chiusura automatica per raffiche di vento"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      above: 40
  conditions:
    - condition: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      above: 40
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.all_house_tenda_terrazzo
    # Allinea lo stato logico della tenda (v14)
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.tenda_giardino_aperta
    - if:
        - condition: state
          entity_id: input_boolean.tenda_notifica_vento_oggi
          state: "off"
      then:
        - action: notify.mobile_app_cph2653
          data:
            title: "💨 Tenda giardino chiusa - vento"
            message: >-
              Raffica di {{ states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | round(1) }} km/h rilevata.
              Tenda giardino chiusa automaticamente.
            data:
              priority: high
              ttl: 0
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.tenda_notifica_vento_oggi

#==================================================================================
# TENDA GIARDINO – Reset notifica giornaliera vento a mezzanotte
# (spostata da automations.yaml v114 - era la n.33b, id invariato)
#==================================================================================
- id: tenda_reset_notifica_vento_mezzanotte
  alias: "Tenda Giardino - Reset notifica vento a mezzanotte"
  mode: single
  triggers:
    - trigger: time
      at: "23:59:30"
  conditions: []
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.tenda_notifica_vento_oggi
        

#==================================================================================
# PERGOLA – RILASCIO BLOCCO MANUALE (07:00 / 23:00)
# Il blocco attivato da script.pergola_toggle_manuale dura fino al prossimo
# cambio giorno/notte, come descritto nel commento dell'helper
# input_boolean.pergola_blocco_manuale in configuration.yaml.
# (Alla partenza per vacanza il flag viene già azzerato dall'automazione clima.)
#==================================================================================
- id: pergola_blocco_manuale_rilascio
  alias: "Pergola – Rilascio Blocco Manuale"
  mode: single
  triggers:
    - platform: time
      at: "07:00:00"
    - platform: time
      at: "23:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.pergola_blocco_manuale
      state: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.pergola_blocco_manuale
