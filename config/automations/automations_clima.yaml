# automations_clima_78.yaml
#
# v78 (08/10/2026): pergola_blocco_manuale come tutti i flag manuali.
#   - promemoria flag manuali: aggiunto pergola_blocco_manuale.
#   - inizio vacanza non abbassa piu' il flag e non chiude la pergola se il
#     flag e' alzato (la tenda giardino, senza flag, si chiude sempre).
#
# v77 (08/10/2026): nuovo flag input_boolean.caldaia_manuale (config_caldaia_7).
#   - promemoria flag manuali: aggiunto caldaia_manuale.
#   - commutazione stagionale bloccata anche con caldaia_manuale alzato.
#   - rientro e inizio vacanza non toccano il SAT con caldaia_manuale alzato.
#
# v76 (08/10/2026): audit clima A6 e A7.
#   A6: in Heat con la valvola su Caldaia (switch.shelly_box off) i fancoil
#       valutano l'acqua sulla mandata caldaia OTGW invece che sulla mandata
#       della PdC ferma: prima con la caldaia l'aiuto dei fancoil non partiva
#       mai. In Cool e in Heat su Pompa resta la mandata Panasonic.
#   A7: rientro vacanza non imposta piu' il target del SAT (lo calcola
#       clima_sync_sat_target, automations_caldaia_2). Tolto il default di
#       mintemp_notte_inverno_sala, helper rimosso in config_clima_15.
#
# v75 (08/10/2026): free heating nella fascia 21-23 usa come riferimento il
#   minimo piu' alto fra sala, camera Georgi e camera Tania, come il PID
#   heating (automations_pompa_calore_3). In inverno le due camere seguono le
#   stesse regole anche fra le 21 e le 23.
#
# v74 (08/10/2026): correzioni audit clima 08/10.
#   A3: clima_modalita_notte scatta anche al cambio del modo pompa e ricalcola
#       giorno/notte con l'orario della nuova stagione (21 in Cool, 23 in Heat).
#   A4: promemoria flag manuali esteso a pdc_manuale e auto_manuale.
#   A2: in Heat il fancoil camera Tania lavora tutta la notte (21-07) e si
#       spegne alle 07:00; in Cool resta solo 21-23 come prima.
#   A5: tolto input_boolean.clima_pid_attivo (PID sempre attivo): il free
#       cooling spegne la pompa senza piu' controllarlo.
#
# v73 (08/10/2026): clima_commutazione_stagionale senza blocco free
#   cooling/heating. I due flag restano accesi per stagioni intere (free
#   cooling tutto l'autunno, free heating da maggio) e bloccavano il cambio
#   proprio quando serviva. Restano solo le 5 ore di fila.
#
# v72 (08/10/2026): stagione decisa dalla temperatura interna. Riscritta
#   clima_commutazione_stagionale (stesso id): Cool -> Heat se la zona
#   comandante resta 5 ore sotto il minimo invernale, Heat -> Cool se resta
#   5 ore sopra il massimo estivo, con blocco free cooling/heating. Rimosse
#   clima_media_esterna_7gg, clima_passaggio_heat_temperatura_interna (v71) e
#   il default di clima_soglia_inverno. Helper relativi tolti in config_clima.
#
# v71 (08/10/2026): nuova clima_passaggio_heat_temperatura_interna. La pompa
#   passa da Cool a Heat da sola quando sala (giorno) o camera Georgi (notte)
#   restano 30 minuti sotto il minimo invernale, a prescindere dall'esterno.
#
# v70 (04/10/2026): promemoria flag manuali esteso a portone box e cancello grande.
#
# v69 (30/09/2026): riorganizzazione per argomento. Spostate con id invariati:
#   pompa di calore (PID, riaccensione, antigelo, energia) -> automations_pompa_calore
#   caldaia/OTGW/SAT -> automations_caldaia, accumulo gas -> automations_gas.

#==================================================================================
# CLIMA – INIZIALIZZAZIONE VALORI DEFAULT
# Imposta valori di default alla prima accensione o dopo riavvio
#==================================================================================
- id: clima_inizializzazione
  alias: "Clima – Inizializzazione Valori Default"
  description: >
    Applica i valori di default SOLO ai lotti non ancora applicati, tracciati da
    input_number.clima_default_versione.

    Perche' non basta controllare lo stato: un input_number appena creato non e'
    mai 'unknown'. Senza uno stato da ripristinare Home Assistant lo posiziona
    sul proprio 'min', quindi un helper nuovo sembra gia' configurato e un
    controllo su unknown/unavailable non scatta mai. E' cosi' che
    panasonic_mandata_cool_min e _max sono partiti a 10 e 12 invece che ai
    default previsti.

    Nemmeno "vale il min, quindi non e' configurato" funziona: mettere a zero un
    guadagno o una soglia per disattivare una funzione e' una scelta legittima,
    e verrebbe silenziosamente annullata ad ogni riavvio.

    Il contatore parte da 2 perche' il suo 'min' e' 2: alla creazione vale 2,
    cioe' "lotti 1 e 2 gia' acquisiti", e su questo impianto non viene toccato
    nulla. Quando si aggiungono nuovi helper si accoda un lotto con numero
    superiore: solo quelli vengono scritti, e il contatore avanza da solo.
    Portare a mano il contatore a 0 forza la riapplicazione di tutti i default.
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - variables:
        versione_attesa: 2
        versione_applicata: "{{ states('input_number.clima_default_versione') | int(2) }}"
        # Terne [lotto, entita', valore]
        valori_default:
          # --- Lotto 1: parametri storici del sistema clima ---
          - [1, input_number.clima_soglia_solare_boost, 2500]
          - [1, input_number.clima_boost_solare_delta, 2]
          - [1, input_number.panasonic_pid_kp, 2.0]
          - [1, input_number.panasonic_pid_ki, 0.05]
          - [1, input_number.panasonic_pid_kd, 0.2]
          - [1, input_number.maxtemp_giorno_estate_sala, 25]
          - [1, input_number.maxtemp_giorno_estate_letto, 29]
          - [1, input_number.maxtemp_notte_estate_sala, 29]
          - [1, input_number.maxtemp_notte_estate_letto, 25]
          - [1, input_number.maxtemp_notte_estate_tania, 25]
          - [1, input_number.mintemp_giorno_inverno_sala, 22]
          - [1, input_number.mintemp_giorno_inverno_letto, 20]
          - [1, input_number.mintemp_notte_inverno_letto, 22]
          - [1, input_number.mintemp_notte_inverno_tania, 22]
          - [1, input_number.clima_target_emergenza_antigelo, 15]
          - [1, input_number.panasonic_pid_heat_integrale, 0]
          - [1, input_number.panasonic_pid_heat_errore_prec, 0]
          - [1, input_number.clima_delta_naturale_base, 3]
          - [1, input_number.clima_delta_naturale_vento_bonus, 2]
          - [1, input_number.clima_soglia_vento_naturale, 6]
          - [1, input_number.clima_freeheating_setpoint_offset, 5]
          - [1, input_number.clima_freeheating_setpoint_min, 20]
          # --- Lotto 2: limiti di mandata in raffrescamento ---
          - [2, input_number.panasonic_mandata_cool_min, 14]
          - [2, input_number.panasonic_mandata_cool_max, 19]
        da_applicare: >
          {% set ns = namespace(elenco=[]) %}
          {% for v in valori_default %}
            {% if v[0] | int > versione_applicata | int %}
              {% set ns.elenco = ns.elenco + [v] %}
            {% endif %}
          {% endfor %}
          {{ ns.elenco }}
    - repeat:
        for_each: "{{ da_applicare }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ repeat.item[1] }}"
            data:
              value: "{{ repeat.item[2] }}"
    - if:
        - condition: template
          value_template: "{{ versione_applicata | int < versione_attesa | int }}"
      then:
        - action: input_number.set_value
          target:
            entity_id: input_number.clima_default_versione
          data:
            value: "{{ versione_attesa }}"
        - if:
            - condition: template
              value_template: "{{ da_applicare | count > 0 }}"
          then:
            - action: notify.mobile_app_cph2653
              data:
                title: "Clima – default applicati"
                message: >
                  Applicati {{ da_applicare | count }} valori di default
                  (lotti fino al {{ versione_attesa }}):
                  {{ da_applicare | map(attribute=1) | map('replace', 'input_number.', '') | join(', ') }}.

#==================================================================================
# FANCOIL - CLIMA – COMMUTAZIONE MODALITÀ GIORNALIERA
# Giorno dalle 07:00. Notte dalle 21:00 in raffrescamento (modo pompa Cool)
# e dalle 23:00 in riscaldamento. Solo se non in modalita' manuale e casa non
# in vacanza.
#==================================================================================
- id: clima_modalita_giorno
  alias: "Clima – Modalità Giorno (07:00)"
  triggers:
    - trigger: time
      at: "07:00:00"
  conditions:
    # Casa vuota: flag unico input_boolean.vacanza (v48)
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.clima_modalita
          state: "manuale"
  actions:
    - action: input_select.select_option
      target:
        entity_id: input_select.clima_modalita
      data:
        option: "giorno"
    # Mappatura reale degli switch (i nomi entita' sono storici):
    #   switch.camerageorgi_shelly_fancoil_georgi    -> fancoil CAMERA TANIA
    #   switch.camerageorgi_shelly_fancoil_georgi_2  -> fancoil CAMERA GEORGI
    # Alle 07:00 spegni i fancoil delle camere, ma solo quelli non in gestione
    # manuale: quel flag lo abbassa soltanto l'utente.
    # v74: anche camera Tania. In Heat lavora tutta la notte e il controllo
    # periodico delle camere si ferma alle 07:00; in Cool era gia' spento
    # alle 23:00 e il comando non cambia nulla.
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_georgi2_manuale
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.camerageorgi_shelly_fancoil_georgi_2
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_georgi_manuale
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.camerageorgi_shelly_fancoil_georgi
    # Nessun flag di gestione manuale viene abbassato qui: fancoil e
    # deumidificatori restano bloccati finche' e' l'utente ad abbassare il flag
    # dalla plancia. Il promemoria delle 10:00 / 22:00 serve a non dimenticarli.
    # pergola_blocco_manuale non viene toccato qui: dalla v78 lo abbassa solo
    # l'utente (rimossa pergola_blocco_manuale_rilascio).
    # clima_pompa_latch_notte e' stato interno del PID notturno: se non viene
    # azzerato al mattino la soglia di riaccensione resta a target + 2 C anche
    # di giorno.
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.clima_pompa_latch_notte

- id: clima_modalita_notte
  alias: "Clima – Modalità Notte (21:00 estate / 23:00 inverno)"
  description: >
    In raffrescamento (modo pompa Cool) la notte inizia alle 21:00: dalle 21 la
    zona comandante diventano le camere (PID, riaccensione pompa e free cooling
    leggono tutti clima_modalita) e la sala viene abbandonata. D'inverno resta
    alle 23:00, perche' fino a quell'ora la sala e' occupata e deve continuare
    a essere servita dal PID heating e dal setpoint SAT.
    v74: scatta anche al cambio del modo pompa e ricalcola la modalita con
    l'orario della nuova stagione. Prima un passaggio Heat -> Cool fra le 21
    e le 23 lasciava "giorno" tutta la notte (alle 21 la pompa era ancora in
    Heat, alle 23 era gia' in Cool).
  mode: queued
  triggers:
    - trigger: time
      at: "21:00:00"
    - trigger: time
      at: "23:00:00"
    # v74: cambio stagione (clima_commutazione_stagionale o a mano)
    - trigger: state
      entity_id: select.panasonic_heat_pump_main_operating_mode_state
      not_to:
        - unavailable
        - unknown
  conditions:
    # Casa vuota: flag unico input_boolean.vacanza (v48)
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.clima_modalita
          state: "manuale"
  actions:
    # La stagione e' il modo operativo della pompa (v66). Modo non noto: vale
    # l'orario invernale delle 23:00, come prima della v74.
    # Fra le 07:00 e l'inizio notte si torna a giorno solo con il cambio modo
    # (es. Cool -> Heat alle 22: la sala torna servita fino alle 23); il
    # passaggio a giorno delle 07:00 resta a clima_modalita_giorno.
    - variables:
        cool: >
          {{ states('select.panasonic_heat_pump_main_operating_mode_state')
             in ['Cool', 'Cool only'] }}
        inizio_notte: "{{ 21 if cool else 23 }}"
        ora: "{{ now().hour }}"
        nuova: "{{ 'notte' if (ora >= inizio_notte or ora < 7) else 'giorno' }}"
    - condition: template
      value_template: "{{ not is_state('input_select.clima_modalita', nuova) }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.clima_modalita
      data:
        option: "{{ nuova }}"
    # v66: tolto l'azzeramento di pergola_blocco_manuale (dalla v78 lo abbassa
    # solo l'utente) e di clima_pompa_latch_notte (si arma solo dopo le 23:00,
    # qui era gia' spento).

#==================================================================================
# GESTIONE MANUALE FANCOIL E DEUMIDIFICATORE
# In plancia fancoil ogni switch ha accanto il proprio input_boolean.*_manuale
# (tile con toggle diretto). Con il flag alzato tutte le automazioni di
# controllo lasciano l'attuatore com'e'. Il flag lo alza e lo abbassa solo
# l'utente (oppure il distacco carichi, che lo alza): nessuna automazione lo
# abbassa a orario. Il promemoria qui sotto segnala i flag dimenticati.
#==================================================================================

#==================================================================================
# PROMEMORIA FLAG DI GESTIONE MANUALE (10:00 e 22:00)
# Nessuna automazione abbassa piu' i flag manuali di fancoil e deumidificatori:
# li abbassa solo l'utente dalla plancia. Il rischio e' quindi dimenticarne uno
# alzato e tenere fermo il controllo automatico per giorni senza accorgersene.
# Due volte al giorno questa automazione elenca i flag alzati da piu' di un'ora
# e ancora attivi. Sotto l'ora non notifica: un blocco appena messo e' voluto.
# Nota: last_changed riparte da zero a ogni avvio di Home Assistant, quindi
# nella prima ora dopo un riavvio la notifica non scatta.
#==================================================================================
- id: flag_manuali_promemoria
  alias: "Flag manuali – Promemoria (10:00 / 22:00)"
  description: >
    Segnala quali gestioni manuali (fancoil, deumidificatori, portone, cancello,
    pompa di calore, caldaia, auto, pergola) sono alzate da oltre un'ora e ancora attive, per
    poterle abbassare se non servono piu'.
  mode: single
  triggers:
    - trigger: time
      at: "10:00:00"
    - trigger: time
      at: "22:00:00"
  variables:
    flag_elenco:
      - input_boolean.fancoil_georgi_manuale
      - input_boolean.fancoil_georgi2_manuale
      - input_boolean.fancoil_sala_manuale
      - input_boolean.deumidificatore_cantina_manuale
      - input_boolean.deumidificatore_armadio_manuale
      - input_boolean.portone_box_manuale
      - input_boolean.cancello_grande_manuale
      # v74: pompa e auto, alzati anche dal distacco carichi. Con pdc_manuale
      # alzato in inverno la casa resta senza riscaldamento (anche la gestione
      # fonte si ferma).
      - input_boolean.pdc_manuale
      - input_boolean.auto_manuale
      # v77: caldaia (riscaldamento via SAT)
      - input_boolean.caldaia_manuale
      # v78: pergola (prima rilasciata in automatico alle 07:00 e 23:00)
      - input_boolean.pergola_blocco_manuale
    flag_attivi: >
      {% set ns = namespace(elenco=[]) %}
      {% for f in flag_elenco %}
        {% if is_state(f, 'on')
              and (now() - states[f].last_changed).total_seconds() > 3600 %}
          {% set ns.elenco = ns.elenco + [state_attr(f, 'friendly_name') | default(f, true)] %}
        {% endif %}
      {% endfor %}
      {{ ns.elenco }}
  conditions:
    - condition: template
      value_template: "{{ flag_attivi | count > 0 }}"
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "Gestione manuale ancora attiva"
        message: >
          {{ flag_attivi | join(', ') }}.
          Alzata da oltre un'ora: se non ti serve piu', abbassala dalla plancia.
        data:
          tag: flag_manuali_promemoria
          channel: Clima
          importance: high

# fancoil_georgi_prelavoro_sera RIMOSSA (v63): chiamava automation.fancoil_georgi_controllo,
# entita' inesistente (quella reale e' automation.fancoil_georgi_controllo_periodico),
# quindi falliva ogni sera. Era comunque ridondante: il controllo periodico ogni
# 5 minuti scatta gia' alle 21:00:00 con condizione "after 21:00:00" inclusiva.

#==================================================================================
# FANCOIL - CAMERE TANIA E GEORGI – CONTROLLO PERIODICO (ogni 5 minuti)
# Unica automazione che gestisce accensione/spegnimento dei due fancoil in
# base a:
# - Orario (prelavoro 21-23 o notte 23-07)
# - T_georgi vs target stagionale
# - outlet_temp vs soglia efficacia acqua
# Robusta: funziona anche dopo riavvii o eventi mancati
# Le due camere sono zone autonome: ognuna ha il proprio termometro Zigbee e
# i propri target notte, regolabili in plancia clima.
#   camera Tania  -> sensor.termometro_tania_zigbee_temperature
#                    maxtemp_notte_estate_tania / mintemp_notte_inverno_tania
#   camera Georgi -> sensor.termometro_georgi_zigbee_temperature
#                    maxtemp_notte_estate_letto / mintemp_notte_inverno_letto
# I due relay stanno entrambi fisicamente in camera Georgi, ma comandano il
# fancoil di una camera ciascuno.
#==================================================================================
- id: fancoil_georgi_controllo
  alias: "Fancoil Georgi – Controllo Periodico"
  description: >
    Ogni 5 minuti decide lo stato dei fancoil delle camere Tania e Georgi.
    Ogni camera decide in autonomia sul proprio termometro e sui propri target.
    Prelavoro 21-23: controlla entrambi (camera Tania e camera Georgi).
    Notte 23-07: in Cool controlla solo il fancoil camera Georgi (Tania
    spento); in Heat controlla entrambi (v74), come il PID heating che di
    notte segue la camera piu' fredda fra le due.
    Decisione per camera: T_camera vs target camera E outlet_temp vs soglia
    di efficacia dell'acqua calcolata sul target di quella camera.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    # Blocco fancoil in vacanza (flag attivabile anche a mano da plancia clima)
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.clima_modalita
          state: "manuale"
    - condition: time
      after: "21:00:00"
      before: "07:00:00"
    # Guardia dati (v58): l'acqua vale per entrambe le camere, senza di essa
    # nessuna delle due decisioni ha senso. Il controllo si astiene.
    # v76 (A6): in Heat con valvola su Caldaia l'acqua e' la mandata caldaia.
    - condition: template
      value_template: >
        {% set caldaia = is_state('switch.shelly_box', 'off')
           and states('select.panasonic_heat_pump_main_operating_mode_state') in ['Heat', 'Heat only'] %}
        {{ has_value('sensor.opentherm_gateway_otgw_otgw_boiler_flow_water_temperature') if caldaia
           else has_value('sensor.panasonic_heat_pump_main_main_outlet_temp') }}
  actions:
    - variables:
        mode: "{{ states('select.panasonic_heat_pump_main_operating_mode_state') }}"
        # v76 (A6): mandata della fonte che scalda il circuito. Con la valvola
        # su Caldaia (switch.shelly_box off) in Heat la PdC e' ferma e la sua
        # mandata non dice nulla: si usa la mandata caldaia letta dall'OTGW.
        fonte_caldaia: "{{ is_state('switch.shelly_box', 'off') and mode in ['Heat', 'Heat only'] }}"
        outlet: >
          {{ states('sensor.opentherm_gateway_otgw_otgw_boiler_flow_water_temperature') | float(20)
             if fonte_caldaia
             else states('sensor.panasonic_heat_pump_main_main_outlet_temp') | float(20) }}
        ora: "{{ now().hour }}"
        # Prelavoro: 21:00-22:59 — entrambi i fancoil attivi (Tania + Georgi)
        # Notte: 23:00-06:59 — solo il fancoil camera Georgi
        periodo_prelavoro: "{{ ora >= 21 and ora < 23 }}"
        # --- Camera Georgi ---
        # Guardia dati (v58): stesso trattamento gia' in uso per camera Tania.
        georgi_vivo: "{{ has_value('sensor.termometro_georgi_zigbee_temperature') }}"
        t_georgi: "{{ states('sensor.termometro_georgi_zigbee_temperature') | float(25) }}"
        target_estate_georgi: "{{ states('input_number.maxtemp_notte_estate_letto') | float(25) }}"
        target_inverno_georgi: "{{ states('input_number.mintemp_notte_inverno_letto') | float(22) }}"
        # --- Camera Tania ---
        # Se il termometro Tania non risponde la camera viene esclusa dal
        # controllo (fancoil spento) invece di ripiegare su un valore inventato.
        tania_viva: "{{ has_value('sensor.termometro_tania_zigbee_temperature') }}"
        t_tania: "{{ states('sensor.termometro_tania_zigbee_temperature') | float(25) }}"
        target_estate_tania: "{{ states('input_number.maxtemp_notte_estate_tania') | float(25) }}"
        target_inverno_tania: "{{ states('input_number.mintemp_notte_inverno_tania') | float(22) }}"
        # Efficacia acqua: calcolata sul target della singola camera
        # (estate: almeno 4 C sotto; inverno: almeno 6 C sopra)
        acqua_ok_georgi_estate: "{{ outlet <= target_estate_georgi - 4 }}"
        acqua_ok_georgi_inverno: "{{ outlet >= target_inverno_georgi + 6 }}"
        acqua_ok_tania_estate: "{{ outlet <= target_estate_tania - 4 }}"
        acqua_ok_tania_inverno: "{{ outlet >= target_inverno_tania + 6 }}"
        # Free cooling/heating naturale attivo: fancoil sempre spenti,
        # in ogni fascia oraria (prelavoro 21-23 e notte 23-07)
        freecooling_on: "{{ is_state('input_boolean.clima_freecooling_attivo', 'on') }}"
        freeheating_on: "{{ is_state('input_boolean.clima_freeheating_attivo', 'on') }}"
        # Latch notturno: quando entrambe le camere hanno raggiunto il target
        # la pompa viene fermata fino alle 07:00 e i fancoil restano spenti.
        latch_notte: "{{ is_state('input_boolean.clima_pompa_latch_notte', 'on') }}"
        # v66: ISTERESI 0,3 C. Prima la stessa soglia valeva per accendere e
        # spegnere: il fancoil si spegneva appena la camera toccava il target e
        # ripartiva al primo decimo sopra, ciclando ogni 5 minuti. Ora un
        # fancoil acceso resta acceso fino a 0,3 C oltre il target (sotto in
        # estate, sopra in inverno); uno spento parte solo oltre il target.
        isteresi: 0.3
        georgi_acceso: "{{ is_state('switch.camerageorgi_shelly_fancoil_georgi_2', 'on') }}"
        tania_acceso: "{{ is_state('switch.camerageorgi_shelly_fancoil_georgi', 'on') }}"
        soglia_estate_georgi: "{{ target_estate_georgi - isteresi if georgi_acceso else target_estate_georgi }}"
        soglia_inverno_georgi: "{{ target_inverno_georgi + isteresi if georgi_acceso else target_inverno_georgi }}"
        soglia_estate_tania: "{{ target_estate_tania - isteresi if tania_acceso else target_estate_tania }}"
        soglia_inverno_tania: "{{ target_inverno_tania + isteresi if tania_acceso else target_inverno_tania }}"
        # Decisione per camera Georgi
        fancoil_georgi_on: >
          {% if not georgi_vivo %}
            false
          {% elif mode in ['Cool', 'Cool only'] %}
            {{ t_georgi > soglia_estate_georgi and acqua_ok_georgi_estate
               and not freecooling_on and not latch_notte }}
          {% elif mode in ['Heat', 'Heat only'] %}
            {{ t_georgi < soglia_inverno_georgi and acqua_ok_georgi_inverno
               and not freeheating_on }}
          {% else %}
            false
          {% endif %}
        # Decisione per camera Tania
        fancoil_tania_on: >
          {% if not tania_viva %}
            false
          {% elif mode in ['Cool', 'Cool only'] %}
            {{ t_tania > soglia_estate_tania and acqua_ok_tania_estate
               and not freecooling_on and not latch_notte }}
          {% elif mode in ['Heat', 'Heat only'] %}
            {{ t_tania < soglia_inverno_tania and acqua_ok_tania_inverno
               and not freeheating_on }}
          {% else %}
            false
          {% endif %}
    # --- CAMERA GEORGI (switch ..._fancoil_georgi_2) ---
    # Attivo sia nel prelavoro sia di notte. Solo se non in gestione manuale.
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_georgi2_manuale
          state: "off"
      then:
        - if:
            - condition: template
              value_template: "{{ fancoil_georgi_on }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.camerageorgi_shelly_fancoil_georgi_2
          else:
            - action: switch.turn_off
              target:
                entity_id: switch.camerageorgi_shelly_fancoil_georgi_2
    # --- CAMERA TANIA (switch ..._fancoil_georgi) ---
    # Cool: attivo solo nel prelavoro 21-23, alle 23:00 lo spegne
    # fancoil_tania_spegnimento_notte. Heat (v74): attivo tutta la notte,
    # lo spegne clima_modalita_giorno alle 07:00.
    - if:
        - condition: template
          value_template: "{{ periodo_prelavoro or mode in ['Heat', 'Heat only'] }}"
        - condition: state
          entity_id: input_boolean.fancoil_georgi_manuale
          state: "off"
      then:
        - if:
            - condition: template
              value_template: "{{ fancoil_tania_on }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.camerageorgi_shelly_fancoil_georgi
          else:
            - action: switch.turn_off
              target:
                entity_id: switch.camerageorgi_shelly_fancoil_georgi

# fancoil_sala_accendi e fancoil_sala_spegni_target_raggiunto RIMOSSE (v66).
# Decidevano la stessa cosa del controllo periodico qui sotto, che pero'
# spegneva appena T_sala rientrava nel target: i 10 minuti di attesa dello
# spegnimento non avevano effetto e il fancoil ciclava intorno alla soglia.
# Ora l'unico controllo e' quello periodico, con isteresi 0,3 C.

#==================================================================================
# FANCOIL SALA – CONTROLLO PERIODICO (ogni 5 minuti)
# Unico controllo del fancoil sala dalla v66 (accendi/spegni a soglia
# rimosse). Robusto a riavvii ed eventi persi.
#==================================================================================
- id: fancoil_sala_controllo
  alias: "Fancoil Sala – Controllo Periodico Sicurezza"
  description: >
    Ogni 5 minuti decide lo stato del fancoil sala in base a T_sala vs target
    giorno (isteresi 0,3 C) e outlet_temp. Attivo solo in modalita giorno.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    # Blocco fancoil in vacanza (flag attivabile anche a mano da plancia clima)
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    # La sala e' servita solo in modalita giorno: l'orario di fine e' quello
    # del passaggio a notte (21:00 in raffrescamento, 23:00 in riscaldamento).
    - condition: state
      entity_id: input_select.clima_modalita
      state: "giorno"
    - condition: state
      entity_id: input_boolean.fancoil_sala_manuale
      state: "off"
    # Guardia dati (v58): t_sala e outlet ripiegano su 25 e 20 con | float().
    # Con un sensore guasto la decisione girerebbe su numeri inventati e il
    # fancoil verrebbe acceso o spento a caso. Qui il controllo si astiene e
    # lascia l'attuatore com'e': meglio uno stato fermo che uno stato sbagliato.
    - condition: template
      # v76 (A6): in Heat con valvola su Caldaia l'acqua e' la mandata caldaia.
      value_template: >
        {% set caldaia = is_state('switch.shelly_box', 'off')
           and states('select.panasonic_heat_pump_main_operating_mode_state') in ['Heat', 'Heat only'] %}
        {{ has_value('sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature')
           and (has_value('sensor.opentherm_gateway_otgw_otgw_boiler_flow_water_temperature') if caldaia
                else has_value('sensor.panasonic_heat_pump_main_main_outlet_temp')) }}
  actions:
    - variables:
        mode: "{{ states('select.panasonic_heat_pump_main_operating_mode_state') }}"
        t_sala: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature') | float(25) }}"
        # v76 (A6): mandata della fonte che scalda il circuito (vedi camere).
        fonte_caldaia: "{{ is_state('switch.shelly_box', 'off') and mode in ['Heat', 'Heat only'] }}"
        outlet: >
          {{ states('sensor.opentherm_gateway_otgw_otgw_boiler_flow_water_temperature') | float(20)
             if fonte_caldaia
             else states('sensor.panasonic_heat_pump_main_main_outlet_temp') | float(20) }}
        target_sala_estate: "{{ states('input_number.maxtemp_giorno_estate_sala') | float(25) }}"
        soglia_acqua_estate: "{{ states('input_number.maxtemp_giorno_estate_sala') | float(25) - 4 }}"
        target_sala_inverno: "{{ states('input_number.mintemp_giorno_inverno_sala') | float(22) }}"
        soglia_acqua_inverno: "{{ states('input_number.mintemp_giorno_inverno_sala') | float(22) + 6 }}"
        acqua_efficace_estate: "{{ outlet <= soglia_acqua_estate }}"
        acqua_efficace_inverno: "{{ outlet >= soglia_acqua_inverno }}"
        # v66: isteresi 0,3 C come per le camere. Acceso resta acceso fino a
        # 0,3 C oltre il target, spento parte solo oltre il target.
        isteresi: 0.3
        sala_acceso: "{{ is_state('switch.sala_fancoil_sala_shelly_1gen4', 'on') }}"
        temp_sala_fuori_target_estate: >
          {{ t_sala > (target_sala_estate - isteresi if sala_acceso else target_sala_estate) }}
        temp_sala_fuori_target_inverno: >
          {{ t_sala < (target_sala_inverno + isteresi if sala_acceso else target_sala_inverno) }}
        # Free cooling/heating naturale attivo: fancoil sempre spento
        freecooling_on: "{{ is_state('input_boolean.clima_freecooling_attivo', 'on') }}"
        freeheating_on: "{{ is_state('input_boolean.clima_freeheating_attivo', 'on') }}"
        fancoil_sala_on: >
          {% if mode in ['Cool', 'Cool only'] %}
            {{ temp_sala_fuori_target_estate and acqua_efficace_estate and not freecooling_on }}
          {% elif mode in ['Heat', 'Heat only'] %}
            {{ temp_sala_fuori_target_inverno and acqua_efficace_inverno and not freeheating_on }}
          {% else %}
            false
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ fancoil_sala_on }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.sala_fancoil_sala_shelly_1gen4
        - conditions:
            - condition: template
              value_template: "{{ not fancoil_sala_on }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.sala_fancoil_sala_shelly_1gen4

#==================================================================================
# FANCOIL SALA – SPEGNIMENTO FORZATO ALLE 23:00
# Garanzia di spegnimento anche se le altre automazioni hanno perso un evento.
#==================================================================================
- id: fancoil_sala_spegnimento_notte
  alias: "Fancoil Sala – Spegnimento all'ingresso in Notte"
  description: >
    Spegne il fancoil sala quando clima_modalita passa a notte (21:00 in
    estate, 23:00 in inverno). Il secondo trigger alle 23:00 e' la rete di
    sicurezza: garantisce lo spegnimento anche se il cambio di stato e' andato
    perso (riavvio HA, modalita' forzata a mano).
  triggers:
    - trigger: state
      entity_id: input_select.clima_modalita
      to: "notte"
    - trigger: time
      at: "23:00:00"
  conditions:
    # Gestione manuale: il fancoil resta come l'ha lasciato l'utente.
    - condition: state
      entity_id: input_boolean.fancoil_sala_manuale
      state: "off"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.sala_fancoil_sala_shelly_1gen4

#==================================================================================
# FANCOIL CAMERA TANIA – SPEGNIMENTO ALLE 23:00
# In Cool camera Tania partecipa solo al ciclo serale 21-23: alle 23:00 il suo
# fancoil si spegne e resta spento per tutta la notte, da quell'ora il
# controllo periodico gestisce la sola camera Georgi. In Heat (v74) non scatta:
# Tania resta servita fino alle 07:00.
# Mappatura switch: ..._fancoil_georgi -> camera TANIA (nome entita' storico).
#==================================================================================
- id: fancoil_tania_spegnimento_notte
  alias: "Fancoil Tania – Spegnimento Notte (23:00)"
  triggers:
    - trigger: time
      at: "23:00:00"
  conditions:
    # v74: solo fuori dal riscaldamento. In Heat la camera Tania resta servita
    # tutta la notte (fancoil_georgi_controllo) e conta nel PID heating.
    - condition: template
      value_template: >
        {{ states('select.panasonic_heat_pump_main_operating_mode_state')
           not in ['Heat', 'Heat only'] }}
    # Gestione manuale: il fancoil resta come l'ha lasciato l'utente.
    - condition: state
      entity_id: input_boolean.fancoil_georgi_manuale
      state: "off"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.camerageorgi_shelly_fancoil_georgi

#==================================================================================
# CLIMA – FREE COOLING NATURALE – CONTROLLO PERIODICO (ogni 5 minuti)
# Se il delta T_esterna-target e' sotto soglia, o sotto soglia+bonus con vento
# medio 1h >= soglia_vento, il raffrescamento naturale e' sufficiente:
# spegne la pompa di calore (i fancoil sono gli unici emettitori del circuito
# in raffrescamento: tenerla accesa "ammorbidita" vuol dire lavorare a carico
# nullo) e i controlli periodici fancoil leggono il flag e spengono entro
# 5 minuti.
# SOLO IN MODALITA GIORNO (v55). Il free cooling presuppone porte e finestre
# aperte: di notte, con la casa chiusa e nessuno che possa aprire, il ricambio
# d'aria non avviene e il flag bloccherebbe i fancoil delle camere senza che
# nulla raffreschi davvero. All'ingresso in notte il flag lo spegne questo
# stesso controllo (trigger sul passaggio a notte) e lo tiene spento fino
# alle 07:00.
# Il target del delta e' quindi sempre quello della sala.
# Controllo periodico (non a fronte): robusto contro riavvii, freeze
# HeishaMon e trigger persi. Isteresi 0.5 C sulla disattivazione.
# PERSISTENZA (v56): l'attivazione richiede che la condizione meteo sia vera da
# almeno un'ora continuativa. Il conteggio e' delegato a
# binary_sensor.clima_condizione_free_cooling (delay_on 1h, config_clima_7):
# qui si legge solo il suo stato. La disattivazione resta immediata.
# Se il mode Panasonic e' unavailable/unknown il flag non viene toccato.
#==================================================================================
- id: clima_freecooling_controllo
  alias: "Clima – Free Cooling Naturale – Controllo Periodico"
  description: >
    Ogni 5 minuti allinea input_boolean.clima_freecooling_attivo alla condizione
    di raffrescamento naturale. Attiva se la condizione e' matura da un'ora
    (binary_sensor.clima_condizione_free_cooling), disattiva solo oltre 0.5 C di
    isteresi. Notifica una volta al giorno.
    PROPRIETARIO UNICO del flag (v57): nessun'altra automazione lo scrive. Il
    trigger sul passaggio a clima_modalita = notte serve a far girare subito
    questo controllo alle 21:00, cosi' il flag si spegne senza attendere il
    ciclo dei 5 minuti e senza che il flag venga scritto da fuori.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: state
      entity_id: input_select.clima_modalita
      to: "notte"
  actions:
    - variables:
        mode: "{{ states('select.panasonic_heat_pump_main_operating_mode_state') }}"
        t_ext: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') | float(25) }}"
        # Il free cooling esiste solo in modalita giorno, quindi il target di
        # riferimento e' sempre quello della sala. Il ramo notte e' stato
        # rimosso in v55 insieme al free cooling notturno.
        target: "{{ states('input_number.maxtemp_giorno_estate_sala') | float(25) }}"
        vento: "{{ states('sensor.wind_speed_media_1h') | float(0) }}"
        base: "{{ states('input_number.clima_delta_naturale_base') | float(3) }}"
        bonus: "{{ states('input_number.clima_delta_naturale_vento_bonus') | float(2) }}"
        soglia_vento: "{{ states('input_number.clima_soglia_vento_naturale') | float(6) }}"
        delta: "{{ t_ext - target }}"
        flag_on: "{{ is_state('input_boolean.clima_freecooling_attivo', 'on') }}"
        # Vacanza: nessuna attivazione né notifica; flag ripulito se acceso
        vacanza_on: "{{ is_state('input_boolean.vacanza', 'on') }}"
        # Free cooling ammesso solo in modalita giorno (v55)
        giorno_on: "{{ is_state('input_select.clima_modalita', 'giorno') }}"
        # Guardia dati (v58): senza temperatura esterna il delta non e'
        # calcolabile. t_ext qui sopra ripiega su 25 con | float(25), un valore
        # inventato che sembra buono: se la stazione meteo muore mentre il flag
        # e' acceso, la disattivazione girerebbe su quel 25 e potrebbe non
        # scattare mai, lasciando pompa e fancoil fermi con la casa che si
        # scalda. Qui il flag viene spento, non congelato: e' l'unico caso in
        # cui davanti a un sensore morto bisogna agire invece di astenersi.
        t_ext_ok: "{{ has_value('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') }}"
        # Condizione di attivazione: la soglia meteo deve essere soddisfatta da
        # almeno un'ora continuativa. Il ritardo e' nel delay_on del sensore.
        cond_on: "{{ is_state('binary_sensor.clima_condizione_free_cooling', 'on') }}"
        # Condizione di disattivazione: fuori soglia con margine 0.5 C di isteresi
        cond_off: >
          {{ not (delta < (base + 0.5)
                  or (delta < (base + bonus + 0.5) and vento >= soglia_vento)) }}
    - choose:
        # --- ATTIVA: solo in Cool, condizione soddisfatta, flag spento ---
        - conditions:
            - condition: template
              value_template: "{{ t_ext_ok and giorno_on and not vacanza_on and mode in ['Cool', 'Cool only'] and cond_on and not flag_on }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.clima_freecooling_attivo
            # I fancoil sono gli unici emettitori del circuito Panasonic in
            # raffrescamento: con tutti i fancoil fermi tenere la pompa accesa
            # "ammorbidita" significa produrre acqua fredda a carico nullo.
            # In free cooling la pompa si spegne, salvo lucchetto manuale o
            # modalita' manuale (v74: tolto input_boolean.clima_pid_attivo).
            - if:
                # Lucchetto manuale pompa (automations_clima_59)
                - condition: state
                  entity_id: input_boolean.pdc_manuale
                  state: "off"
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: input_select.clima_modalita
                      state: "manuale"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: switch.panasonic_heat_pump_main_heatpump_state
            # Fancoil in pausa: arma la notifica di riaccensione
            # (porte finestre presumibilmente aperte)
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.clima_freecooling_finestre
            - if:
                - condition: state
                  entity_id: input_boolean.clima_freecooling_notifica_oggi
                  state: "off"
              then:
                - action: notify.mobile_app_cph2653
                  data:
                    title: "🌬️ Free cooling attivo"
                    message: >
                      Temperatura esterna {{ states('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') | float(0) | round(1) }}°C,
                      vento medio {{ states('sensor.wind_speed_media_1h') | float(0) | round(1) }} km/h.
                      Pompa spenta, fancoil in pausa: il raffrescamento naturale basta.
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.clima_freecooling_notifica_oggi
        # --- DISATTIVA: flag acceso e condizione uscita (con isteresi) in Cool,
        #     oppure mode noto diverso da Cool (mai su unavailable/unknown) ---
        - conditions:
            - condition: template
              value_template: >
                {{ flag_on and
                   (not t_ext_ok
                    or not giorno_on
                    or vacanza_on
                    or (mode in ['Cool', 'Cool only'] and cond_off)
                    or (mode not in ['Cool', 'Cool only', 'unavailable', 'unknown', 'none'])) }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.clima_freecooling_attivo

#==================================================================================
# FANCOIL – NOTIFICA RIACCENSIONE DOPO FREE COOLING
# Durante il free cooling i fancoil sono fermi e le porte finestre vengono
# aperte. Al primo fancoil che si riaccende (da controllo periodico, accensione
# sala fuori target, toggle manuale o rientro vacanza) notifica quale fancoil
# e' partito, per chiudere le porte finestre. Notifica una sola volta:
# il flag si spegne e i fancoil successivi non notificano. Se il free cooling
# termina senza riaccensioni il flag resta armato fino alla prima riaccensione
# futura.
#==================================================================================
- id: fancoil_riaccensione_dopo_freecooling
  alias: "Fancoil – Riaccensione dopo Free Cooling (chiudi finestre)"
  description: >
    Notifica la prima riaccensione di un fancoil dopo un periodo di free
    cooling, per ricordare di chiudere le porte finestre.
  mode: single
  triggers:
    - platform: state
      entity_id:
        - switch.camerageorgi_shelly_fancoil_georgi
        - switch.camerageorgi_shelly_fancoil_georgi_2
        - switch.sala_fancoil_sala_shelly_1gen4
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.clima_freecooling_finestre
      state: "on"
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "🪟 Fancoil riacceso"
        message: >
          {{ trigger.to_state.attributes.get('friendly_name', trigger.entity_id) }}
          e' acceso: il free cooling e' finito, chiudi le porte finestre.
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.clima_freecooling_finestre

#==================================================================================
# (LIBERO) - la vecchia automazione clima_preraffrescamento_meteo e' stata
# rimossa in automations_clima_54.
# Motivo: abbassava di 1 C il target sala alle 07:30/10:00 se la previsione
# superava i 30 C. Due problemi. Primo, la condizione usava
# state_attr('weather.casa', 'forecast'): quell'attributo e' stato rimosso da
# Home Assistant 2024.4, quindi il template cadeva sempre sul ramo "false" e
# l'automazione non e' mai partita da sola. Secondo, e piu' importante, il
# pre-raffrescamento serale e' ora la modalita notte anticipata alle 21:00:
# la zona comandante diventa le camere e il target su cui lavorano pompa e
# fancoil e' gia' quello notte, quindi non resta nulla da anticipare.
# Rimosso con l'automazione anche l'helper input_boolean.clima_preraffrescamento_attivo
# (config_clima_6).
#==================================================================================

#==================================================================================
# CLIMA – COMMUTAZIONE STAGIONALE (TEMPERATURA INTERNA)
#
# v72: la stagione e' il modo operativo della pompa e la decide la temperatura
# interna, non piu' la media esterna. Sostituisce la vecchia commutazione
# sulla media esterna 7gg (con notifica alle 06:00) e il passaggio a Heat
# della v71: un solo concetto, nessuna stagione "consigliata".
#
# Zona comandante, come il PID (segue input_select.clima_modalita):
#   giorno -> sala          sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature
#   notte  -> camera Georgi sensor.termometro_georgi_zigbee_temperature
# Passaggi:
#   Cool -> Heat: zona sotto il minimo invernale
#                 (mintemp_giorno_inverno_sala / mintemp_notte_inverno_letto)
#                 per 5 ore di fila
#   Heat -> Cool: zona sopra il massimo estivo
#                 (maxtemp_giorno_estate_sala / maxtemp_notte_estate_letto)
#                 per 5 ore di fila
# v73: nessun blocco su free cooling/heating. Quei flag confrontano solo la
# temperatura esterna con le soglie e restano accesi per stagioni intere: il
# free cooling si spegne solo con esterno oltre max estivo sala + 3,5 C, il
# free heating solo con esterno sotto min invernale - 3,5 C. Il filtro contro
# finestre aperte o sole d'inverno sono le 5 ore di fila.
#
# Durata: due contatori in minuti (input_number.clima_minuti_verso_heat e
# _verso_cool), +5 a ogni ciclo con la condizione vera, azzerati appena e'
# falsa. Sono input_number, quindi sopravvivono ai riavvii di HA.
# Sensore della zona non disponibile: contatori congelati (ne' avanti ne'
# azzerati), come le guardie dati v58.
# Lucchetto pdc_manuale o caldaia_manuale (v77), vacanza o modalita manuale:
# contatori azzerati e nessun cambio.
#
# Dopo il cambio fa tutto il resto del sistema, che segue il modo pompa
# (PID, fancoil, SAT, gestione fonte, notte 21/23, free cooling/heating).
# Passando a Cool spegne anche il SAT: se la fonte era la caldaia il
# termostato resterebbe in heat. La valvola la riporta su Pompa
# panasonic_cooling_riaccensione alla prima riaccensione in Cool.
#==================================================================================
- id: clima_commutazione_stagionale
  alias: "Clima – Commutazione Stagionale (temperatura interna)"
  description: >
    Ogni 5 minuti conta da quanto la zona comandante (sala di giorno, camera
    Georgi di notte) e' sotto il minimo invernale o sopra il massimo estivo.
    Dopo 5 ore di fila mette la pompa in Heat only o Cool only.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  variables:
    durata_min: 300
    modo: "{{ states('select.panasonic_heat_pump_main_operating_mode_state') }}"
    in_cool: "{{ modo in ['Cool', 'Cool only'] }}"
    in_heat: "{{ modo in ['Heat', 'Heat only'] }}"
    notte: "{{ is_state('input_select.clima_modalita', 'notte') }}"
    zona: "{{ 'camera Georgi' if notte else 'sala' }}"
    sensore: >
      {{ 'sensor.termometro_georgi_zigbee_temperature' if notte
         else 'sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature' }}
    ent_min: >
      {{ 'input_number.mintemp_notte_inverno_letto' if notte
         else 'input_number.mintemp_giorno_inverno_sala' }}
    ent_max: >
      {{ 'input_number.maxtemp_notte_estate_letto' if notte
         else 'input_number.maxtemp_giorno_estate_sala' }}
    dati_ok: >
      {{ (in_cool or in_heat) and has_value(sensore)
         and has_value(ent_min) and has_value(ent_max) }}
    t_zona: "{{ states(sensore) | float(0) }}"
    minimo: "{{ states(ent_min) | float(0) }}"
    massimo: "{{ states(ent_max) | float(0) }}"
    # v77: anche caldaia_manuale. Il passaggio a Cool spegne il SAT, e una
    # caldaia accesa a mano con la pompa in Cool sarebbe spenta dal controllo
    # di sicurezza fonte_sicurezza.
    bloccato: >
      {{ is_state('input_boolean.pdc_manuale', 'on')
         or is_state('input_boolean.caldaia_manuale', 'on')
         or is_state('input_boolean.vacanza', 'on')
         or is_state('input_select.clima_modalita', 'manuale') }}
    verso_heat: "{{ in_cool and t_zona < minimo }}"
    verso_cool: "{{ in_heat and t_zona > massimo }}"
    min_heat: >
      {{ (states('input_number.clima_minuti_verso_heat') | int(0) + 5)
         if (verso_heat and not bloccato) else 0 }}
    min_cool: >
      {{ (states('input_number.clima_minuti_verso_cool') | int(0) + 5)
         if (verso_cool and not bloccato) else 0 }}
  conditions:
    # Guardia dati: modo pompa sconosciuto o sensore/soglie della zona non
    # disponibili -> contatori congelati.
    - condition: template
      value_template: "{{ dati_ok }}"
  actions:
    - choose:
        # ---------- COOL -> HEAT ----------
        - conditions:
            - condition: template
              value_template: "{{ min_heat >= durata_min }}"
          sequence:
            # Opzione "Heat only" = SetOperationMode 0 (integrazione HeishaMon,
            # custom_components/aquarea/definitions.py). Il cambio da Cool fa
            # scattare clima_reset_pid; il PID heating accende la pompa.
            - action: select.select_option
              target:
                entity_id: select.panasonic_heat_pump_main_operating_mode_state
              data:
                option: "Heat only"
            - action: input_number.set_value
              target:
                entity_id:
                  - input_number.clima_minuti_verso_heat
                  - input_number.clima_minuti_verso_cool
              data:
                value: 0
            - action: notify.mobile_app_cph2653
              data:
                title: "🔥 Pompa passata in Heat"
                message: >
                  {{ zona | capitalize }} a {{ t_zona }}°C, sotto il minimo
                  invernale di {{ minimo }}°C da 5 ore. Riscaldamento attivo.
        # ---------- HEAT -> COOL ----------
        - conditions:
            - condition: template
              value_template: "{{ min_cool >= durata_min }}"
          sequence:
            # SAT spento prima del cambio: con la fonte su caldaia resterebbe
            # in heat (clima_sync_sat_target lavora solo in Heat).
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.smart_autotune_thermostat_living_room
              data:
                hvac_mode: "off"
            # Opzione "Cool only" = SetOperationMode 1. Il cambio da Heat fa
            # scattare clima_reset_pid; la pompa la riaccende
            # panasonic_cooling_riaccensione (valvola compresa).
            - action: select.select_option
              target:
                entity_id: select.panasonic_heat_pump_main_operating_mode_state
              data:
                option: "Cool only"
            - action: input_number.set_value
              target:
                entity_id:
                  - input_number.clima_minuti_verso_heat
                  - input_number.clima_minuti_verso_cool
              data:
                value: 0
            - action: notify.mobile_app_cph2653
              data:
                title: "❄️ Pompa passata in Cool"
                message: >
                  {{ zona | capitalize }} a {{ t_zona }}°C, sopra il massimo
                  estivo di {{ massimo }}°C da 5 ore. Raffrescamento attivo.
      # Nessun cambio: aggiorna i contatori (scrive solo se cambiano).
      default:
        - if:
            - condition: template
              value_template: >
                {{ states('input_number.clima_minuti_verso_heat') | int(-1) != min_heat }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.clima_minuti_verso_heat
              data:
                value: "{{ min_heat }}"
        - if:
            - condition: template
              value_template: >
                {{ states('input_number.clima_minuti_verso_cool') | int(-1) != min_cool }}
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.clima_minuti_verso_cool
              data:
                value: "{{ min_cool }}"

#==================================================================================
# CLIMA – FREE HEATING NATURALE – CONTROLLO PERIODICO (ogni 5 minuti)
# Speculare al free cooling estivo, ma SOLO in temperatura: il vento in
# inverno peggiora la dispersione, quindi non viene considerato.
# Il target usato per il delta segue clima_modalita (notte -> letto, altrimenti
# sala). Controllo periodico (non a fronte): robusto contro riavvii, freeze
# HeishaMon e trigger persi. Isteresi 0.5 C al posto del vecchio for: 10 min.
#==================================================================================
- id: clima_freeheating_controllo
  alias: "Clima – Free Heating Naturale – Controllo Periodico"
  description: >
    Ogni 5 minuti allinea input_boolean.clima_freeheating_attivo alla condizione
    di riscaldamento naturale/passivo. Attiva se (target - T_ext) < base,
    disattiva solo oltre 0.5 C di isteresi. Notifica una volta al giorno.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  actions:
    - variables:
        mode: "{{ states('select.panasonic_heat_pump_main_operating_mode_state') }}"
        t_ext: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') | float(15) }}"
        # Di notte il target di riferimento e' il PIU' ALTO fra le due camere:
        # e' quello piu' difficile da ottenere con il solo apporto passivo,
        # quindi il criterio piu' prudente.
        # v75: fra le 21 e le 23 (in Heat ancora "giorno") contano anche le
        # camere, come nel PID heating.
        target: >
          {% if states('input_select.clima_modalita') == 'notte' %}
            {{ [ states('input_number.mintemp_notte_inverno_letto') | float(22),
                 states('input_number.mintemp_notte_inverno_tania') | float(22) ] | max }}
          {% elif now().hour >= 21 and now().hour < 23 %}
            {{ [ states('input_number.mintemp_giorno_inverno_sala') | float(22),
                 states('input_number.mintemp_notte_inverno_letto') | float(22),
                 states('input_number.mintemp_notte_inverno_tania') | float(22) ] | max }}
          {% else %}
            {{ states('input_number.mintemp_giorno_inverno_sala') | float(22) }}
          {% endif %}
        base: "{{ states('input_number.clima_delta_naturale_base') | float(3) }}"
        delta: "{{ target - t_ext }}"
        flag_on: "{{ is_state('input_boolean.clima_freeheating_attivo', 'on') }}"
        # Vacanza: nessuna attivazione né notifica; flag ripulito se acceso
        vacanza_on: "{{ is_state('input_boolean.vacanza', 'on') }}"
        cond_on: "{{ delta < base }}"
        # Disattivazione: fuori soglia con margine 0.5 C di isteresi
        cond_off: "{{ delta >= (base + 0.5) }}"
        # Guardia dati (v58): stessa logica del free cooling. Senza temperatura
        # esterna t_ext ripiega su 15 e il delta e' inventato: il flag va spento.
        t_ext_ok: "{{ has_value('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') }}"
    - choose:
        # --- ATTIVA: solo in Heat, condizione soddisfatta, flag spento ---
        - conditions:
            - condition: template
              value_template: "{{ t_ext_ok and not vacanza_on and mode in ['Heat', 'Heat only'] and cond_on and not flag_on }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.clima_freeheating_attivo
            - if:
                - condition: state
                  entity_id: input_boolean.clima_freeheating_notifica_oggi
                  state: "off"
              then:
                - action: notify.mobile_app_cph2653
                  data:
                    title: "☀️ Free heating attivo"
                    message: >
                      Temperatura esterna {{ states('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') | float(0) | round(1) }}°C,
                      vicina al target. Pompa ammorbidita: il riscaldamento naturale/passivo basta.
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.clima_freeheating_notifica_oggi
        # --- DISATTIVA: flag acceso e condizione uscita (con isteresi) in Heat,
        #     oppure mode noto diverso da Heat (mai su unavailable/unknown) ---
        - conditions:
            - condition: template
              value_template: >
                {{ flag_on and
                   (not t_ext_ok
                    or vacanza_on
                    or (mode in ['Heat', 'Heat only'] and cond_off)
                    or (mode not in ['Heat', 'Heat only', 'unavailable', 'unknown', 'none'])) }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.clima_freeheating_attivo

#==================================================================================
# CLIMA – RESET NOTIFICHE FREE COOLING/HEATING A MEZZANOTTE
#==================================================================================
- id: clima_freecooling_freeheating_reset_notifica
  alias: "Clima – Reset Notifiche Free Cooling/Heating (mezzanotte)"
  triggers:
    - trigger: time
      at: "00:00:00"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.clima_freecooling_notifica_oggi
          - input_boolean.clima_freeheating_notifica_oggi

#==================================================================================
# CLIMA - Rientro vacanza 
#==================================================================================
- id: clima_ rientro_vacanza
  alias: "Clima - rientro vacanza"
  description: >
    Parte quando input_boolean.vacanza viene spento a mano dalla plancia clima:
    ripristina la casa con qualsiasi temperatura, riattiva acqua sanitaria e
    canto degli uccelli. Con la pompa in Heat riaccende la fonte su cui e' la
    valvola (PdC o SAT); con la pompa in Cool la riaccensione la fa
    panasonic_cooling_riaccensione (v66). Fancoil e pergola NON
    vengono comandati direttamente: ripartono da soli dalle rispettive
    automazioni una volta spento il flag.
    Dalla v55 il trigger orario delle 15:00 con condizione sul calendario e'
    stato eliminato: il rientro puo' avvenire a qualsiasi ora, quindi la
    modalita' clima viene scelta in base all'ora e alla stagione invece di
    essere forzata a "giorno".
  trigger:
    - platform: state
      entity_id: input_boolean.vacanza
      from: "on"
      to: "off"
  action:
    # Modalita' coerente con l'ora del rientro: in raffrescamento la notte
    # inizia alle 21:00, in riscaldamento alle 23:00 (vedi clima_modalita_notte).
    - action: input_select.select_option
      target:
        entity_id: input_select.clima_modalita
      data:
        option: >
          {% set cool = states('select.panasonic_heat_pump_main_operating_mode_state')
                        in ['Cool', 'Cool only'] %}
          {% set h = now().hour %}
          {% set inizio_notte = 21 if cool else 23 %}
          {{ 'notte' if (h >= inizio_notte or h < 7) else 'giorno' }}
    - action: mqtt.publish
      data:
        topic: "OTGW/set/otgw-84CCA8ADE1AD/command"
        payload: "HW=1"
    # Riavvia canto uccelli (volume 20% + play)
    - action: script.riaggancia_yamaha
    # Ramo riscaldamento. v66: deciso dal modo operativo della pompa
    # (sorgente unica della stagione), non piu' da T esterna < 17 C.
    - if:
        - condition: template
          value_template: >
            {{ states('select.panasonic_heat_pump_main_operating_mode_state')
               in ['Heat', 'Heat only'] }}
      then:
        # Una sola fonte alla volta (v63), decisa dalla valvola switch.shelly_box
        # come nella gestione fonte: su Pompa si riaccende la PdC, su Caldaia il
        # SAT. Prima venivano accesi entrambi.
        - if:
            - condition: state
              entity_id: switch.shelly_box
              state: "on"
          then:
            - if:
                - condition: template
                  value_template: >
                    {{ states('select.panasonic_heat_pump_main_operating_mode_state')
                       in ['Heat', 'Heat only'] }}
                # Lucchetto manuale pompa (automations_clima_59)
                - condition: state
                  entity_id: input_boolean.pdc_manuale
                  state: "off"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: switch.panasonic_heat_pump_main_heatpump_state
          else:
            # v76: prima il preset "home" (in vacanza era "away"), poi
            # l'accensione: all'accensione del SAT clima_sync_sat_target
            # (automations_caldaia_2) imposta il target della zona comandante.
            # v77: solo se la caldaia non e' in gestione manuale.
            - if:
                - condition: state
                  entity_id: input_boolean.caldaia_manuale
                  state: "off"
              then:
                - action: climate.set_preset_mode
                  target:
                    entity_id: climate.smart_autotune_thermostat_living_room
                  data:
                    preset_mode: "home"
                - action: climate.set_hvac_mode
                  target:
                    entity_id: climate.smart_autotune_thermostat_living_room
                  data:
                    hvac_mode: "heat"
    # Ramo raffrescamento (v66): la pompa non viene piu' accesa qui.
    # panasonic_cooling_riaccensione riparte da sola appena vacanza e' spento e
    # una zona e' oltre target + 0,5 C, e prima porta la valvola su Pompa se
    # serve. Accenderla qui scavalcava sia l'isteresi sia la valvola.
    - action: notify.mobile_app_cph2653
      data:
        title: "Rientro vacanza"
        message: >
          Casa ripristinata: modalita' clima impostata in base all'ora, acqua sanitaria riattivata,
          canto uccelli riavviato. Clima riattivato in base al modo della pompa.
          Fancoil e pergola ripartono dalle loro automazioni. Benvenuti a casa!

#==================================================================================
# CLIMA - Spegnimento inizio vacanza 
#==================================================================================
- id: spegnimento_inizio_vacanza
  alias: "Clima - inizio vacanza"
  description: >
    Parte quando input_boolean.vacanza viene acceso a mano dalla plancia clima:
    spegne riscaldamento (away), acqua sanitaria, pompa di calore e fancoil;
    chiude tenda giardino e pergola (la pergola solo se non in gestione
    manuale, v78); ferma il canto degli uccelli.
    Dalla v55 il trigger da calendario e' stato eliminato: il riconoscimento
    della parola "vacanza" negli eventi non era affidabile e l'automazione
    scattava a vuoto. Il flag e' ora l'unica sorgente di verita' e si comanda
    solo a mano.
  trigger:
    - platform: state
      entity_id: input_boolean.vacanza
      from: "off"
      to: "on"
  action:
    # v77: SAT spento e "away" solo se la caldaia non e' in gestione manuale.
    - if:
        - condition: state
          entity_id: input_boolean.caldaia_manuale
          state: "off"
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            hvac_mode: "off"
        - action: climate.set_preset_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            preset_mode: "away"
    - action: mqtt.publish
      data:
        topic: "OTGW/set/otgw-84CCA8ADE1AD/command"
        payload: "HW=0"
    # Lucchetto manuale pompa (automations_clima_59)
    - if:
        - condition: state
          entity_id: input_boolean.pdc_manuale
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.panasonic_heat_pump_main_heatpump_state
    # Fancoil: si spengono solo quelli non in gestione manuale. Durante una
    # vacanza puo' essere voluto lasciarne uno acceso (gatti in casa), e in quel
    # caso il flag alzato deve valere anche qui.
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_georgi_manuale
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.camerageorgi_shelly_fancoil_georgi
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_georgi2_manuale
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.camerageorgi_shelly_fancoil_georgi_2
    - if:
        - condition: state
          entity_id: input_boolean.fancoil_sala_manuale
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.sala_fancoil_sala_shelly_1gen4
    # Pulizia del flag di chiusura meteo (automatico). v78: il flag manuale
    # pergola_blocco_manuale NON viene toccato: lo abbassa solo l'utente.
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.pergola_meteo_chiusura
    # Chiusura tenda giardino; pergola solo se non in gestione manuale.
    - action: cover.close_cover
      target:
        entity_id: cover.all_house_tenda_giardino_new
    - if:
        - condition: state
          entity_id: input_boolean.pergola_blocco_manuale
          state: "off"
      then:
        - action: cover.close_cover
          target:
            entity_id: cover.terrazzo_pergola_terrazza
    # Stop canto uccelli (la Yamaha andra' in auto-standby dopo 8h: voluto)
    - action: media_player.media_stop
      target:
        entity_id: media_player.googlehome8851
    - action: notify.mobile_app_cph2653
      data:
        title: "✈️ Vacanza iniziata"
        message: >
          Riscaldamento away, acqua sanitaria spenta, pompa di calore spenta,
          fancoil spenti (esclusi quelli in gestione manuale), tenda giardino
          chiusa, {{ "pergola lasciata com'e' (gestione manuale)" if is_state('input_boolean.pergola_blocco_manuale', 'on') else 'pergola chiusa' }},
          canto uccelli fermato. Buona vacanza!

#==================================================================================
# FANCOIL – SPEGNIMENTO IMMEDIATO ALL'ATTIVAZIONE VACANZA
# L'automazione di partenza vacanza (flag manuale) spegne già i fancoil, ma il
# flag è ora attivabile anche a mano dalla plancia clima: questa garantisce lo
# spegnimento in ogni caso, anche con fancoil in gestione manuale.
#==================================================================================
# (RIMOSSA in automations_clima_57) fancoil_spegnimento_vacanza
# Era scattata su input_boolean.vacanza off->on e spegneva i tre fancoil.
# Dalla v55 spegnimento_inizio_vacanza ha lo stesso identico trigger e spegne
# gli stessi tre fancoil: erano due automazioni sovrapposte. Lo standard dei
# flag prevede una sola automazione di transizione per verso, quindi resta solo
# spegnimento_inizio_vacanza. Tutte le altre automazioni leggono il flag e si
# astengono, senza scriverlo.
#==================================================================================
