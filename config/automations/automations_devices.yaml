# automations_devices_3.yaml

# ACCENSIONE/SPEGNIMENTO PROGRAMMATO – PRESA RESMED TANIA

# Questa automazione gestisce la presa switch.cameratania_resmed_tania_presa_tuya_socket_1
# con un orario fisso giornaliero.

# Ogni giorno la presa viene accesa alle 22:00 di sera e spenta alle 10:00 di mattina.

# STORICO GUASTI
# 06/09/2026 22:00: accensione fallita con
#   tuya_sharing.exceptions.ApiRequestException: network error:(-9999999) Remote api run unknown failed
# 07/09/2026 10:00: spegnimento fallito con
#   Failed to resolve 'apigw.tuyaeu.com' ([Errno -3] Try again)
#   causa: Home Assistant senza uscita a Internet durante la migrazione al router NeXXt
#   (gateway ancora su 192.168.1.1 invece di 192.168.1.254)

# PERCHE' I RITENTATIVI SONO FATTI COSI'
# L'integrazione Tuya lascia uscire eccezioni grezze di urllib3/requests, che
# continue_on_error NON intercetta: la documentazione ufficiale
# (https://www.home-assistant.io/docs/scripts/) precisa che continue_on_error non
# sopprime gli errori che Home Assistant non gestisce. Un repeat interno viene quindi
# abortito al primo tentativo fallito.
# Per questo ogni tentativo e' un trigger orario separato: se l'esecuzione delle 22:00
# muore per eccezione, quella delle 22:01 parte comunque, perche' e' un'esecuzione
# indipendente. La condizione sullo stato fa si' che i tentativi successivi non facciano
# nulla quando la presa e' gia' nello stato voluto.

- id: cameratania_resmed_tania_presa_accensione_programmata
  alias: "Camera Tania – presa ResMed accensione programmata"
  description: >-
    Accende la presa della ResMed in Camera Tania alle 22:00, con quattro ulteriori
    tentativi al minuto fino alle 22:04 se la presa non risulta accesa.
  mode: single
  triggers:
    - trigger: time
      at: "22:00:00"
    - trigger: time
      at: "22:01:00"
    - trigger: time
      at: "22:02:00"
    - trigger: time
      at: "22:03:00"
    - trigger: time
      at: "22:04:00"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: switch.cameratania_resmed_tania_presa_tuya_socket_1
          state: "on"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.cameratania_resmed_tania_presa_tuya_socket_1

- id: cameratania_resmed_tania_presa_accensione_verifica
  alias: "Camera Tania – presa ResMed verifica accensione"
  description: >-
    Alle 22:06 controlla che la presa della ResMed sia accesa. In caso contrario
    avvisa Alex e Tania, perche' la presa va accesa a mano.
  mode: single
  triggers:
    - trigger: time
      at: "22:06:00"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: switch.cameratania_resmed_tania_presa_tuya_socket_1
          state: "on"
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "ResMed Tania NON accesa"
        message: >-
          La presa della ResMed in camera di Tania non si e' accesa dopo cinque tentativi.
          Stato attuale: {{ states('switch.cameratania_resmed_tania_presa_tuya_socket_1') }}.
          Va accesa a mano.
    - action: notify.mobile_app_samsungtania
      data:
        title: "ResMed NON accesa"
        message: >-
          La presa della ResMed non si e' accesa automaticamente.
          Accendila a mano prima di dormire.

- id: cameratania_resmed_tania_presa_spegnimento_programmato
  alias: "Camera Tania – presa ResMed spegnimento programmato"
  description: >-
    Spegne la presa della ResMed in Camera Tania alle 10:00, con quattro ulteriori
    tentativi al minuto fino alle 10:04 se la presa non risulta spenta.
  mode: single
  triggers:
    - trigger: time
      at: "10:00:00"
    - trigger: time
      at: "10:01:00"
    - trigger: time
      at: "10:02:00"
    - trigger: time
      at: "10:03:00"
    - trigger: time
      at: "10:04:00"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: switch.cameratania_resmed_tania_presa_tuya_socket_1
          state: "off"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.cameratania_resmed_tania_presa_tuya_socket_1
