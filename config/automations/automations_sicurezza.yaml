#==================================================================================
# 9. NOTIFICA CAMBIO STATO - PERSIANA GIARDINO (solo fuori casa)
#==================================================================================
- id: notifica_persiana_giardino
  alias: "Notifica - Persiana Giardino"
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.persiana_tania_sensore_zigbee_contact
      # v19: solo aperta/chiusa reali; senza filtri scattava anche su cambi di
      # attributo e su unavailable (notificato come "CHIUSA").
      not_from:
        - unavailable
        - unknown
      to:
        - "on"
        - "off"
  condition:
    # v19: "non a casa" invece di "not_home": in una zona con nome (es. Lavoro)
    # lo stato e' il nome della zona e l'avviso non partiva.
    - condition: not
      conditions:
        - condition: state
          entity_id: person.alex
          state: "home"
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "🪟 Persiana Giardino"
        message: "{{ 'APERTA' if states('binary_sensor.persiana_tania_sensore_zigbee_contact') == 'on' else 'CHIUSA' }}"
        data:
          tag: "notifica_persiana_giardino"
          priority: high
          ttl: 0

