#==================================================================================
# 11. CHIUSURA AUTOMATICA PORTONE BOX SE RIMANE APERTO > 10 MIN
#     Nota: sensore binary_sensor.portone_box_sensore_zigbee_contact ha logica
#     invertita -> stato "off" (chiuso) = portone APERTO, stato "on" (aperto) = portone CHIUSO
#==================================================================================
- id: chiusura_automatica_portone_box
  alias: "Chiusura Automatica Portone Box - Timeout 10 min"
  mode: restart
  triggers:
    - platform: state
      entity_id: binary_sensor.portone_box_sensore_zigbee_contact
      to: "off"
      for: "00:10:00"
  condition:
    - condition: state
      entity_id: binary_sensor.portone_box_sensore_zigbee_contact
      state: "off"
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "🚪 Portone Box"
        message: "Portone rimasto aperto da più di 10 minuti. Chiusura automatica in corso."
        data:
          tag: "notifica_portone_box_timeout"
          priority: high
          ttl: 0
    - action: button.press
      target:
        entity_id: button.portone_telecomando

#==================================================================================
# 12. CHIUSURA AUTOMATICA CANCELLO GRANDE SE RIMANE APERTO > 10 MIN
#     Nota: dal 2026-09-24 il sensore binary_sensor.cancello_grande_zigbee_contact
#     e' stato riposizionato e ha logica INVERTITA (come il portone box):
#     stato "off" (chiuso) = cancello APERTO, stato "on" (aperto) = cancello CHIUSO
#     Singolo impulso di chiusura: rimossa la sequenza di secondo tentativo,
#     l'automazione 12b e il flag input_boolean.cancello_grande_guasto.
#
#     Trigger aggiuntivi "avvio" (avvio HA e ricarica automazioni): il trigger
#     di stato con "for" parte solo su un passaggio a "off"; se il cancello e'
#     gia' aperto quando l'automazione viene caricata non partirebbe mai
#     (successo il 2026-09-24). Con "avvio" si attendono 10 minuti: se nel
#     frattempo il cancello si chiude non si fa nulla, altrimenti un solo impulso.
#==================================================================================
- id: chiusura_automatica_cancello_grande
  alias: "Chiusura Automatica Cancello Grande - Timeout 10 min"
  mode: single
  max_exceeded: silent
  triggers:
    - platform: state
      entity_id: binary_sensor.cancello_grande_zigbee_contact
      to: "off"
      for: "00:10:00"
      id: timeout
    - platform: homeassistant
      event: start
      id: avvio
    - platform: event
      event_type: automation_reloaded
      id: avvio
  condition:
    - condition: state
      entity_id: binary_sensor.cancello_grande_zigbee_contact
      state: "off"
  action:
    - if:
        - condition: trigger
          id: avvio
      then:
        - wait_for_trigger:
            - platform: state
              entity_id: binary_sensor.cancello_grande_zigbee_contact
              to: "on"
          timeout: "00:10:00"
          continue_on_timeout: true
        - condition: state
          entity_id: binary_sensor.cancello_grande_zigbee_contact
          state: "off"
    - action: notify.mobile_app_cph2653
      data:
        title: "Cancello Grande"
        message: "Cancello grande rimasto aperto da più di 10 minuti. Chiusura automatica in corso."
        data:
          tag: "notifica_cancello_grande_timeout"
          priority: high
          ttl: 0
    - action: button.press
      target:
        entity_id: button.10007c3b31_1

#==================================================================================
# 13. NOTIFICA CANCELLO ENTRATA APERTO > 10 MIN (solo avviso, nessuna chiusura)
#     Nota: sensore binary_sensor.cancello_entrata_zigbee_contact ha logica
#     NORMALE -> stato "on" = cancello APERTO, stato "off" = cancello CHIUSO
#     (verificato in Strumenti per sviluppatori -> Modello il 2026-09-08)
#==================================================================================
- id: notifica_cancello_entrata_aperto
  alias: "Notifica Cancello Entrata Aperto - Timeout 10 min"
  mode: restart
  triggers:
    - platform: state
      entity_id: binary_sensor.cancello_entrata_zigbee_contact
      to: "on"
      for: "00:10:00"
  condition:
    - condition: state
      entity_id: binary_sensor.cancello_entrata_zigbee_contact
      state: "on"
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "Cancello Entrata"
        message: "Cancello di entrata aperto da più di 10 minuti."
        data:
          tag: "notifica_cancello_entrata_timeout"
          priority: high
          ttl: 0