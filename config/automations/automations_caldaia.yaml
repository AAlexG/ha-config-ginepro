# automations_caldaia_3.yaml
#
# v3 (08/10/2026): pompa e caldaia con flag manuali e controllo di sicurezza.
#   - fonte_controllo_periodico usa script.fonte_imposta (unico punto che
#     sposta la valvola); rispetta caldaia_manuale; con pdc_manuale alzato e
#     pompa spenta passa subito alla caldaia (audit A4).
#   - nuova fonte_sicurezza: spegne la fonte sbagliata se pompa e caldaia sono
#     accese insieme o con la valvola nella posizione sbagliata.
#   - clima_sync_sat_target non agisce con caldaia_manuale alzato ne' in
#     vacanza (il target lo decide l'antigelo).
#
# v2 (08/10/2026): audit clima A7. clima_sync_sat_target segue la stessa zona
#   del PID heating della pompa: giorno sala, 21-23 la piu' fredda fra sala,
#   Georgi e Tania, notte la piu' fredda fra Georgi e Tania. Il SAT legge solo
#   la sala, quindi riceve un target "spostato" = T sala + errore della zona.
#   Tolto il riferimento a input_number.mintemp_notte_inverno_sala (rimosso in
#   config_clima_15). Commenti su clima_stagione aggiornati.
#
# Caldaia Baxi / OTGW / SAT e gestione della fonte di riscaldamento (caldaia o PdC).
# File creato il 30/09/2026 dalla riorganizzazione "un argomento = automations_X + config_X".
# Automazioni spostate da: automations_clima, automations_fonte, automations.yaml. Id e alias invariati.

#==================================================================================
# CLIMA - SINCRONIZZA SAT CON TARGET SALA INVERNO
#==================================================================================
- id: clima_sync_sat_target
  alias: "Clima – Sincronizza SAT con Target Sala Inverno"
  description: >
    Con la pompa in Heat e il SAT acceso, imposta il target del SAT in modo che
    la caldaia segua la stessa zona del PID heating della pompa. Il SAT misura
    solo la sala: riceve target = T sala + errore della zona comandante, cosi'
    il suo errore interno coincide con quello della zona.
    Giorno: sala vs mintemp_giorno_inverno_sala (target = minimo sala).
    21-23: la zona piu' fredda fra sala, camera Georgi e camera Tania, ognuna
    col proprio minimo. Notte 23-07: la piu' fredda fra Georgi e Tania.
  # v2 (A7): prima di notte il SAT seguiva la sala a mintemp_notte_inverno_sala,
  # mentre la pompa seguiva le camere: il comfort notturno cambiava con la
  # fonte. Ora ricalcolo ogni 5 minuti (la temperatura delle camere cambia
  # senza che cambi nessun target).
  # v66: trigger sull'accensione del SAT, cosi' gestione fonte e rientro
  # vacanza non lo lasciano con il target vecchio.
  # Stagione dal modo operativo della pompa (v66).
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: state
      entity_id:
        - input_number.mintemp_giorno_inverno_sala
        - input_number.mintemp_notte_inverno_letto
        - input_number.mintemp_notte_inverno_tania
        - input_select.clima_modalita
    - trigger: state
      entity_id: select.panasonic_heat_pump_main_operating_mode_state
      to:
        - "Heat"
        - "Heat only"
    - trigger: state
      entity_id: climate.smart_autotune_thermostat_living_room
      to: "heat"
  conditions:
    - condition: template
      value_template: >
        {{ states('select.panasonic_heat_pump_main_operating_mode_state')
           in ['Heat', 'Heat only'] }}
    - condition: state
      entity_id: climate.smart_autotune_thermostat_living_room
      state: "heat"
    # v3: con la caldaia in gestione manuale il target lo decide l'utente.
    - condition: state
      entity_id: input_boolean.caldaia_manuale
      state: "off"
    # v3: in vacanza il target lo decide l'antigelo (soglia + 2).
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
  actions:
    - variables:
        mod: "{{ states('input_select.clima_modalita') }}"
        serale: "{{ now().hour >= 21 and now().hour < 23 }}"
        sala_ok: "{{ has_value('sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature') }}"
        t_sala: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature') | float(20) }}"
        min_sala: "{{ states('input_number.mintemp_giorno_inverno_sala') | float(22) }}"
        # Errori = minimo - temperatura (positivo = zona fredda), come nel PID
        # heating. Camera con termometro non disponibile esclusa (-99).
        delta_sala: "{{ min_sala - t_sala }}"
        delta_georgi: >
          {{ (states('input_number.mintemp_notte_inverno_letto') | float(22)
              - states('sensor.termometro_georgi_zigbee_temperature') | float(20))
             if has_value('sensor.termometro_georgi_zigbee_temperature') else -99 }}
        delta_tania: >
          {{ (states('input_number.mintemp_notte_inverno_tania') | float(22)
              - states('sensor.termometro_tania_zigbee_temperature') | float(20))
             if has_value('sensor.termometro_tania_zigbee_temperature') else -99 }}
        errore: >
          {% if mod == 'notte' %}
            {% set e = [delta_georgi, delta_tania] | max %}
            {{ delta_sala if e < -50 else e }}
          {% elif serale %}
            {{ [delta_sala, delta_georgi, delta_tania] | max }}
          {% else %}
            {{ delta_sala }}
          {% endif %}
        # Senza temperatura sala il SAT non regola comunque: si lascia il
        # minimo della sala, come prima della v2. Passo 0,5 e limiti 7-35 C
        # del SAT (attributi target_temp_step, min_temp, max_temp).
        target: >
          {% set t = (t_sala + errore) if sala_ok else min_sala %}
          {{ [[(t * 2) | round(0) / 2, 7] | max, 35] | min }}
        target_attuale: >
          {{ state_attr('climate.smart_autotune_thermostat_living_room', 'temperature') | float(0) }}
        preset_away: >
          {{ is_state_attr('climate.smart_autotune_thermostat_living_room', 'preset_mode', 'away') }}
    # Preset "away" rimasto dall'ultima vacanza (spegnimento_inizio_vacanza):
    # si torna a "home" prima di impostare il target, come nel rientro.
    - if:
        - condition: template
          value_template: "{{ preset_away }}"
      then:
        - action: climate.set_preset_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            preset_mode: "home"
    # Scrive solo se il target cambia (o se il preset e' appena cambiato).
    - condition: template
      value_template: "{{ preset_away or (target - target_attuale) | abs >= 0.5 }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.smart_autotune_thermostat_living_room
      data:
        temperature: "{{ target }}"

#==================================================================================
# CALDAIA - OTGW – NOTIFICA FAULT CALDAIA
#==================================================================================
- id: notify_otgw_fault_caldaia
  alias: "OTGW - Notifica fault caldaia"
  description: "Notifica una sola volta se fault caldaia persiste per 10 minuti"
  triggers:
    - trigger: state
      entity_id: binary_sensor.opentherm_gateway_otgw_otgw_fault
      to: "on"
      for:
        minutes: 10
  # v64: tolta la condizione "codice OEM diverso da unknown/unavailable".
  # Il 23/09 il codice OEM risultava unknown: se la Baxi non lo invia, la
  # notifica non sarebbe mai partita. Il segnale e' il bit fault per 10 minuti.
  conditions:
    - condition: state
      entity_id: input_boolean.caldaia_fault_notificato
      state: "off"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.caldaia_fault_notificato
    - action: notify.mobile_app_cph2653
      data:
        title: "⚠️ Fault Caldaia"
        message: >
          La caldaia Baxi riporta un fault da oltre 10 minuti.
          {% if has_value('sensor.opentherm_gateway_otgw_otgw_oemfaultcode') %}{{ states('sensor.otgw_baxi_fault_descrizione') }}{% else %}Codice OEM non inviato dalla caldaia: leggere il codice sul display.{% endif %}
          Codice fault: {{ states('sensor.opentherm_gateway_otgw_otgw_application_specific_fault') }}
          Codice OEM: {{ states('sensor.opentherm_gateway_otgw_otgw_oemfaultcode') }}

- id: reset_otgw_fault_notificato
  alias: "OTGW - Reset flag fault notificato"
  description: "Resetta il flag quando il fault sparisce"
  triggers:
    - trigger: state
      entity_id: binary_sensor.opentherm_gateway_otgw_otgw_fault
      to: "off"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.caldaia_fault_notificato

#==================================================================================
# ACLDAIA - OTGW – NOTIFICA CALDAIA DISCONNESSA
#==================================================================================
- id: notify_otgw_offline
  alias: "OTGW - Notifica caldaia disconnessa"
  description: "Notifica se la caldaia risulta disconnessa per 10 minuti"
  triggers:
    - trigger: state
      entity_id: binary_sensor.opentherm_gateway_otgw_otgw_boiler_connected
      to: "off"
      for:
        minutes: 10
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "🔌 OTGW - Caldaia disconnessa"
        message: "La caldaia non risulta connessa all'OTGW da oltre 10 minuti."

#==================================================================================
# ACLDAIA - OTGW – NOTIFICA HEAP BASSO
#==================================================================================
- id: notify_otgw_heap_low
  alias: "OTGW - Notifica heap basso"
  description: "Notifica se heap libero scende sotto 8000 bytes per 10 minuti"
  triggers:
    - trigger: numeric_state
      entity_id: sensor.opentherm_gateway_otgw_stats_free_heap
      below: 8000
      for:
        minutes: 10
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "🧠 OTGW - Memoria bassa"
        message: >
          Heap libero OTGW sotto soglia da oltre 10 minuti.
          Heap libero: {{ states('sensor.opentherm_gateway_otgw_stats_free_heap') }} B
          Frammentazione: {{ states('sensor.opentherm_gateway_otgw_stats_fragmentation') }}%
          Rischio riavvio imminente.

#==================================================================================
# CALDAIA - OTGW – NOTIFICA RIAVVIO IMPREVISTO
#==================================================================================
- id: notify_otgw_reboot
  alias: "OTGW - Notifica riavvio imprevisto"
  description: "Notifica solo se il contatore riavvii aumenta realmente"
  triggers:
    - trigger: state
      entity_id: sensor.opentherm_gateway_otgw_reboot_count
  conditions:
    - condition: template
      value_template: >
        {{ trigger.from_state.state | int(-1) >= 0
           and trigger.to_state.state | int(-1) >= 0
           and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "🔄 OTGW - Riavvio rilevato"
        message: >
          L'OTGW si è riavviato.
          Causa: {{ states('sensor.opentherm_gateway_otgw_reboot_reason') }}
          Totale riavvii: {{ states('sensor.opentherm_gateway_otgw_reboot_count') }}

#==================================================================================
# OTGW - NESSUN DATO RICEVUTO DA 30 MINUTI
#
# Rileva se l'OTGW smette di pubblicare dati (MQTT interrotto, ESP
# bloccato, WiFi caduto). Usa sensor.opentherm_gateway_otgw_stats_free_heap
# come "battito cardiaco": HA lo marca "unavailable" quando il broker MQTT
# rileva la disconnessione del dispositivo (LWT).
# Diverso dall'automazione "OTGW - Notifica caldaia disconnessa" (n.18),
# che rileva la sola disconnessione caldaia-OTGW, non del dispositivo OTGW.
#==================================================================================
- id: otgw_nessun_dato_30min
  alias: "OTGW - Nessun dato ricevuto da 30 min"
  mode: single
  triggers:
    - platform: state
      entity_id: sensor.opentherm_gateway_otgw_stats_free_heap
      to: "unavailable"
      for: "00:30:00"
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "🛑 OTGW - Nessun dato da 30 min"
        message: "L'OTGW risulta irraggiungibile (nessun dato MQTT) da almeno 30 minuti."
        data:
          priority: high
          ttl: 0
          persistent: "true"
          channel: alarm_stream
    - action: persistent_notification.create
      data:
        title: "🛑 OTGW - Nessun dato da 30 min"
        message: "L'OTGW risulta irraggiungibile (nessun dato MQTT) da almeno 30 minuti."
        notification_id: watchdog_otgw

#==================================================================================
# CALDAIA - OTGW - DHW OVERRIDE ON ALL'AVVIO DI HA
#==================================================================================
- id: otgw_dhw_override_on_avvio
  alias: "OTGW - DHW Override ON all'avvio"
  mode: single
  triggers:
    - platform: homeassistant
      event: start
  # v63: in vacanza la sanitaria e' spenta (HW=0 da spegnimento_inizio_vacanza);
  # senza questa condizione un riavvio di HA la riaccendeva.
  conditions:
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
  action:
    - delay: "00:00:30"
    - action: mqtt.publish
      data:
        topic: "OTGW/set/otgw-84CCA8ADE1AD/command"
        payload: "HW=1"

#==================================================================================
# CALDAIA - OTGW - DHW SETPOINT da slider
#==================================================================================
- id: otgw_dhw_setpoint_cambio
  alias: "OTGW - DHW Setpoint da slider"
  mode: single
  triggers:
    - platform: state
      entity_id: input_number.caldaia_dhw_setpoint
      not_to:
        - unknown
        - unavailable
  action:
    - action: mqtt.publish
      data:
        topic: "OTGW/set/otgw-84CCA8ADE1AD/command"
        payload: "SW={{ states('input_number.caldaia_dhw_setpoint') | float(0) }}"

#==================================================================================
# CALDAIA - Accumula minuti DHW acqua sanitaria
#
# Ogni minuto in cui binary_sensor.opentherm_gateway_otgw_otgw_domestic_hot_water
# e la fiamma sono ON viene conteggiato come minuto di produzione acqua
# sanitaria, in input_number.caldaia_dhw_durata_acc.
# v67: conteggio reale tutto l'anno. Prima con il SAT acceso si usava il valore
# fisso input_number.caldaia_dhw_durata_invernale (rimosso in config_caldaia_4):
# con la gestione fonte il SAT si accende e si spegne durante l'inverno e il
# valore del giorno saltava fra i due metodi a ogni commutazione.
# D'inverno la fiamma accesa per il solo riscaldamento NON viene contata:
# conta solo se e' on anche il bit DHW attivo (vedi nota sotto).
#
# NOTA BIT DHW OTGW (verificata il 29/09/2026)
# L'OTGW espone due binary_sensor con lo stesso nome base "hot water":
#   binary_sensor.opentherm_gateway_otgw_otgw_domestic_hot_water
#     = DHW ATTIVO, bit della caldaia (OpenTherm slave DHW active): on SOLO
#       mentre la caldaia produce acqua calda. E' QUESTO da usare.
#   binary_sensor.opentherm_gateway_otgw_otgw_domestic_hot_water_enable
#     = DHW ABILITATO, bit del termostato (master DHW enable): con l'override
#       HW=1 resta on sempre. NON usarlo per contare o per il gas: d'inverno
#       conterebbe come acqua calda anche i minuti di solo riscaldamento.
# Prova del 29/09 17:25: aprendo l'acqua calda il primo e' passato a on,
# il secondo era on da prima e non e' cambiato.
# Fonte: homeassistant/components/opentherm_gw/binary_sensor.py
# (DATA_SLAVE_DHW_ACTIVE e DATA_MASTER_DHW_ENABLED, stesso translation_key).
#==================================================================================
- id: caldaia_dhw_accumula_minuti
  alias: "Caldaia - Accumula minuti DHW"
  mode: single
  triggers:
    - platform: time_pattern
      minutes: "/1"
  condition:
    # Il sensore DHW indica produzione acqua calda sanitaria
    - condition: state
      entity_id: binary_sensor.opentherm_gateway_otgw_otgw_domestic_hot_water
      state: "on"
    # OBBLIGATORIO: fiamma reale accesa.
    # Filtra i falsi positivi del bug firmware OTGW v1.4.1 che fa lampeggiare
    # il bit DHW ON durante i reboot (~30s ogni ciclo) anche con gas spento.
    - condition: state
      entity_id: binary_sensor.opentherm_gateway_otgw_otgw_flame
      state: "on"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.caldaia_dhw_durata_acc
      data:
        value: >
          {{ (states('input_number.caldaia_dhw_durata_acc') | float(0) + 1) | round(0) }}

#==================================================================================
# CALDAIA - OTGW – PRESSIONE CIRCUITO CH FUORI RANGE
#
# Soglie: < 0.8 atm (pressione bassa) o > 1.5 atm (pressione alta)
# Sensore: sensor.opentherm_gateway_otgw_otgw_water_pressure_in_ch_circuit
# Notifica con valore attuale e tipo di anomalia
#==================================================================================
- id: otgw_pressione_ch_fuori_range
  alias: "OTGW – Pressione circuito CH fuori range"
  mode: restart
  triggers:
    - platform: numeric_state
      entity_id: sensor.opentherm_gateway_otgw_otgw_water_pressure_in_ch_circuit
      below: 0.8
      for: "00:05:00"
      id: pressione_bassa
    - platform: numeric_state
      entity_id: sensor.opentherm_gateway_otgw_otgw_water_pressure_in_ch_circuit
      above: 1.5
      for: "00:05:00"
      id: pressione_alta
  action:
    - variables:
        pressione: "{{ states('sensor.opentherm_gateway_otgw_otgw_water_pressure_in_ch_circuit') | float(0) | round(2) }}"
        tipo: >-
          {% if trigger.id == 'pressione_bassa' %}bassa{% else %}alta{% endif %}
        emoji: >-
          {% if trigger.id == 'pressione_bassa' %}🔽{% else %}🔼{% endif %}
    - action: notify.mobile_app_cph2653
      data:
        title: "{{ emoji }} Pressione CH {{ tipo }}"
        message: >-
          Pressione circuito riscaldamento {{ tipo }}: {{ pressione }} atm
          (fuori range da almeno 5 minuti).
          {% if tipo == 'bassa' %}Soglia minima: 0.8 atm.{% else %}Soglia massima: 1.5 atm.{% endif %}
        data:
          priority: high
          ttl: 0
          persistent: "true"

# Gestione automatica della fonte di riscaldamento (caldaia Baxi via
# SAT/OTGW vs PdC Panasonic via HeishaMon) in base al costo €/kWh
# termico (sensor.pdc_costo_kwh_termico / caldaia_costo_kwh_termico).
#
# Valvola pompa-caldaia: switch.shelly_box (on = Pompa, off = Caldaia),
# nessun feedback di posizione -> attesa fissa 120 s dopo la manovra.
# v3: la manovra la fa script.fonte_imposta (scripts_57), unico punto che
# sposta la valvola: spegne la fonte opposta, 30 s, valvola, 120 s, accende.
#
# Filtri anti-usura valvola:
#   - isteresi economica: si commuta solo se l'alternativa costa almeno
#     input_number.fonte_isteresi_pct % in meno della fonte attuale
#   - dwell time: nessuna manovra prima di input_number.fonte_ore_minime
#     ore dall'ultima (input_datetime.fonte_ultima_commutazione)
#   - controllo periodico ogni 5 minuti (stile freecooling), mode single
#
# v3 – flag manuali (li abbassa solo l'utente):
#   - caldaia_manuale alzato: nessuna commutazione (il SAT non si tocca).
#   - pdc_manuale alzato (a mano o dal distacco carichi) con la pompa SPENTA:
#     la PdC non e' disponibile, si passa subito alla caldaia senza attendere
#     ne' costi ne' ore minime, cosi' la casa non resta senza riscaldamento.
#     La pompa non viene toccata. Con pdc_manuale alzato non si torna mai
#     alla pompa.
#   - pdc_manuale alzato con la pompa ACCESA (prova manuale): nessuna azione.
- id: fonte_controllo_periodico
  alias: "Fonte – Controllo periodico caldaia/PdC"
  description: >-
    Ogni 5 minuti valuta i costi €/kWh termico e commuta la fonte di
    riscaldamento se conviene, rispettando isteresi e ore minime. Con la pompa
    bloccata in gestione manuale e spenta passa subito alla caldaia.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.fonte_auto_attiva
      state: "on"
    # v3: la commutazione accende o spegne sempre il SAT
    - condition: state
      entity_id: input_boolean.caldaia_manuale
      state: "off"
    # v4: stagione dal modo operativo della pompa (sorgente unica, vedi
    # automations_clima_66). Con la pompa non in Heat la commutazione e'
    # inutile.
    - condition: template
      value_template: >-
        {{ states('select.panasonic_heat_pump_main_operating_mode_state')
           in ['Heat', 'Heat only'] }}
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    # Valvola e pompa devono essere vive
    - condition: template
      value_template: >-
        {{ has_value('switch.shelly_box')
           and has_value('switch.panasonic_heat_pump_main_heatpump_state') }}
  actions:
    - variables:
        pompa_attiva: "{{ is_state('switch.shelly_box', 'on') }}"
        pdc_bloccata: "{{ is_state('input_boolean.pdc_manuale', 'on') }}"
        pompa_accesa: "{{ is_state('switch.panasonic_heat_pump_main_heatpump_state', 'on') }}"
        costi_ok: >-
          {{ has_value('sensor.pdc_costo_kwh_termico')
             and has_value('sensor.caldaia_costo_kwh_termico') }}
        pdc: "{{ states('sensor.pdc_costo_kwh_termico') | float(0) }}"
        cal: "{{ states('sensor.caldaia_costo_kwh_termico') | float(0) }}"
        ist: "{{ states('input_number.fonte_isteresi_pct') | float(15) / 100 }}"
        dwell_ok: >-
          {% set ultima = states('input_datetime.fonte_ultima_commutazione') %}
          {% set ore = states('input_number.fonte_ore_minime') | float(3) %}
          {{ ultima in ['unknown', 'unavailable', '']
             or (now().timestamp() - as_timestamp(ultima, 0)) > ore * 3600 }}
        # Pompa bloccata e spenta: caldaia subito (niente costi ne' ore minime)
        caldaia_forzata: "{{ pompa_attiva and pdc_bloccata and not pompa_accesa }}"
        conviene_caldaia: >-
          {{ costi_ok and dwell_ok and not pdc_bloccata and pompa_attiva
             and cal > 0 and cal <= pdc * (1 - ist) }}
        conviene_pompa: >-
          {{ costi_ok and dwell_ok and not pdc_bloccata and not pompa_attiva
             and pdc > 0 and pdc <= cal * (1 - ist) }}
    - choose:
        # ---------- POMPA -> CALDAIA ----------
        - conditions:
            - condition: template
              value_template: "{{ caldaia_forzata or conviene_caldaia }}"
          sequence:
            - action: script.fonte_imposta
              data:
                fonte: caldaia
                accendi: true
                chi: automatico
              response_variable: esito
            - condition: template
              value_template: "{{ esito.ok }}"
            - action: notify.mobile_app_cph2653
              data:
                title: "🔥 Fonte → Caldaia"
                message: >-
                  {% if caldaia_forzata %}Pompa di calore in gestione manuale e spenta
                  (anche dopo un distacco carichi): riscaldamento passato alla caldaia.
                  Torna alla pompa quando abbassi "Pompa manuale".
                  {% else %}Caldaia {{ cal }} €/kWht vs PdC {{ pdc }} €/kWht.
                  Valvola commutata, SAT attivo.{% endif %}
        # ---------- CALDAIA -> POMPA ----------
        - conditions:
            - condition: template
              value_template: "{{ conviene_pompa }}"
          sequence:
            - action: script.fonte_imposta
              data:
                fonte: pompa
                accendi: true
                chi: automatico
              response_variable: esito
            - condition: template
              value_template: "{{ esito.ok }}"
            - action: notify.mobile_app_cph2653
              data:
                title: "♨️ Fonte → Pompa di calore"
                message: >-
                  PdC {{ pdc }} €/kWht vs Caldaia {{ cal }} €/kWht.
                  Valvola commutata.

#==================================================================================
# FONTE – CONTROLLO DI SICUREZZA POMPA / CALDAIA / VALVOLA (v3)
#
# Sempre attivo: nessun flag manuale, vacanza o interruttore lo disattiva.
# Stati vietati per il riscaldamento (l'acqua calda sanitaria non e' toccata):
#   1. pompa accesa e SAT acceso insieme -> si spegne quella che non
#      corrisponde alla valvola (valvola sconosciuta: entrambe)
#   2. pompa accesa con valvola su Caldaia -> pompa spenta
#   3. SAT acceso con valvola su Pompa -> SAT spento
#   4. SAT acceso con la pompa in raffrescamento -> SAT spento
# Interviene se lo stato vietato dura 60 s: i comandi via HeishaMon e OTGW
# arrivano con qualche secondo di ritardo e la sequenza di fonte_imposta non
# passa mai da uno stato vietato. I flag manuali non vengono cambiati.
#==================================================================================
- id: fonte_sicurezza
  alias: "Fonte – Controllo di sicurezza pompa/caldaia/valvola"
  description: >
    Spegne la fonte sbagliata e avvisa se pompa e caldaia risultano accese
    insieme, se una fonte e' accesa con la valvola nella posizione sbagliata o
    se la caldaia scalda con la pompa in raffrescamento.
  mode: queued
  triggers:
    - trigger: template
      value_template: >
        {% set pompa = is_state('switch.panasonic_heat_pump_main_heatpump_state', 'on') %}
        {% set sat = is_state('climate.smart_autotune_thermostat_living_room', 'heat') %}
        {% set v_pompa = is_state('switch.shelly_box', 'on') %}
        {% set v_caldaia = is_state('switch.shelly_box', 'off') %}
        {% set cool = states('select.panasonic_heat_pump_main_operating_mode_state') in ['Cool', 'Cool only'] %}
        {{ (pompa and sat) or (pompa and v_caldaia) or (sat and v_pompa) or (sat and cool) }}
      for: "00:01:00"
    # Rete di sicurezza: ricontrollo ogni 5 minuti e all'avvio
    - trigger: time_pattern
      minutes: "/5"
    - trigger: homeassistant
      event: start
  actions:
    - variables:
        pompa: "{{ is_state('switch.panasonic_heat_pump_main_heatpump_state', 'on') }}"
        sat: "{{ is_state('climate.smart_autotune_thermostat_living_room', 'heat') }}"
        v_pompa: "{{ is_state('switch.shelly_box', 'on') }}"
        v_caldaia: "{{ is_state('switch.shelly_box', 'off') }}"
        cool: >
          {{ states('select.panasonic_heat_pump_main_operating_mode_state')
             in ['Cool', 'Cool only'] }}
        spegni_pompa: "{{ pompa and (v_caldaia or (sat and not v_pompa)) }}"
        spegni_sat: "{{ sat and (v_pompa or cool or (pompa and not v_caldaia)) }}"
        valvola: "{{ 'Pompa' if v_pompa else ('Caldaia' if v_caldaia else 'sconosciuta') }}"
    - condition: template
      value_template: "{{ spegni_pompa or spegni_sat }}"
    # Il ricontrollo periodico interviene solo se lo stato vietato dura gia'
    # da almeno 60 s (stessa tolleranza del trigger principale).
    - if:
        - condition: template
          value_template: "{{ trigger.platform != 'template' }}"
      then:
        - delay: "00:01:00"
        - condition: template
          value_template: >
            {% set p = is_state('switch.panasonic_heat_pump_main_heatpump_state', 'on') %}
            {% set s = is_state('climate.smart_autotune_thermostat_living_room', 'heat') %}
            {{ (spegni_pompa and p) or (spegni_sat and s) }}
    - if:
        - condition: template
          value_template: "{{ spegni_pompa }}"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.panasonic_heat_pump_main_heatpump_state
    - if:
        - condition: template
          value_template: "{{ spegni_sat }}"
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            hvac_mode: "off"
    - action: notify.mobile_app_cph2653
      data:
        title: "🛑 Sicurezza fonte: {{ 'pompa' if spegni_pompa else '' }}{{ ' e ' if spegni_pompa and spegni_sat else '' }}{{ 'caldaia' if spegni_sat else '' }} spenta"
        message: >-
          Stato vietato: pompa {{ 'accesa' if pompa else 'spenta' }}, caldaia
          {{ 'accesa' if sat else 'spenta' }}, valvola su {{ valvola }}, modo pompa
          {{ states('select.panasonic_heat_pump_main_operating_mode_state') }}.
          {% if spegni_pompa %}Spenta la pompa. {% endif %}{% if spegni_sat %}Spenta la caldaia (SAT). {% endif %}
          Per cambiare fonte usa i comandi della plancia, che spostano la valvola in sicurezza.
        data:
          priority: high
          ttl: 0
          channel: alarm_stream

# ---------------------------------------------------------------------------
# SENTINELLA PARAMETRI (NUOVO - automations_fonte_2)
# Se al riavvio di HA il ripristino dello stato salvato fallisce, gli
# helper ripartono dal minimo di scala. Il canarino e' il rendimento
# caldaia: 0.5 (minimo) e' un valore implausibile che segnala la perdita
# dello stato. In quel caso esegue script.fonte_ripristina_parametri
# (tutti i parametri della gestione fonte + prezzi/quote da bolletta)
# e notifica cosa ha fatto.
- id: fonte_sentinella_parametri
  alias: "Fonte – Sentinella parametri all'avvio"
  description: >-
    Rileva la perdita dello stato salvato degli helper al riavvio e
    ripristina i parametri della gestione fonte ai valori consigliati.
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    # Attende che il restore_state abbia finito il suo lavoro
    - delay: "00:02:00"
    - if:
        - condition: numeric_state
          entity_id: input_number.caldaia_rendimento
          below: 0.6
      then:
        - action: script.fonte_ripristina_parametri
        - action: notify.mobile_app_cph2653
          data:
            title: "🛠️ Fonte – Parametri ripristinati"
            message: >-
              Rilevata perdita dello stato salvato al riavvio
              (rendimento caldaia al minimo). Ripristinati i valori
              consigliati: rendimento 0.95, COP 3.0, soglia 1000 W,
              GSE 0.10, isteresi 15%, ore minime 3, gas 1.3338 €/m³,
              quote fisse 24.11/19.42 €/mese.
