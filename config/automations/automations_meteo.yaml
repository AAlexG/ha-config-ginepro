#==================================================================================
# NOTIFICA BATTERIA BASSA - WH25 SENSOR INTERNO
#==================================================================================
- id: notifica_batteria_wh25
  alias: "Batteria bassa - Sensor Interno WH25"
  mode: single
  triggers:
    - platform: state
      entity_id: binary_sensor.hp1000se_pro_pro_v1_6_4_wh25_battery
      to: "on"
  condition: []
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "🔋 Batteria bassa - Meteo"
        message: "Sensor Interno (WH25): batteria bassa segnalata."

