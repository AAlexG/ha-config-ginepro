# automations_meteo_1.yaml
#
# Stazione meteo: batterie dei sensori.
# File creato il 30/09/2026 dalla riorganizzazione "un argomento = automations_X + config_X".
# Automazioni spostate da: automations.yaml. Id e alias invariati.

#==================================================================================
# NOTIFICA BATTERIA BASSA - SOIL 1
#==================================================================================
- id: notifica_batteria_soil_1
  alias: "Batteria bassa - Soil 1"
  mode: single
  triggers:
    - platform: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_soil_battery_1
      below: 1.1
  condition: []
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "🔋 Batteria bassa - Meteo"
        message: "Soil 1: batteria al {{ states('sensor.hp1000se_pro_pro_v1_6_4_soil_battery_1') }}V"

