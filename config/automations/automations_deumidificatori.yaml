# automations_deumidificatori_5.yaml
#
# ALLARME SERBATOIO PIENO – DEUMIDIFICATORI
#
# I deumidificatori di Casa Ginepro non hanno igrostato: finche' sono alimentati
# lavorano. Quindi "presa accesa + potenza a zero" non puo' essere uno stand-by:
# significa che la macchina si e' fermata, e la causa tipica e' il serbatoio pieno.
#
# Caso reale che ha originato queste automazioni (13/07/2026): il deumidificatore
# cantina e' rimasto alimentato per 9h55 con corrente e potenza a zero. Il consumo
# di quel giorno e' andato perso e la macchina non ha deumidificato nulla.
#
# Trigger di tipo template con "for": scatta solo se la condizione (presa accesa
# E potenza sotto soglia) resta vera per 30 minuti consecutivi. Copre sia il
# serbatoio che si riempie a macchina in funzione, sia la macchina che non parte.
# La notifica arriva una volta sola per evento: il conteggio riparte solo dopo che
# la condizione e' tornata falsa (serbatoio svuotato, potenza risalita).
#
# La soglia e' 5 W (non 0) per tollerare l'assorbimento residuo dell'elettronica
# e il rumore di misura delle prese.
#
# Il float(999) di guardia rende il template FALSO se il sensore di potenza e'
# unavailable o unknown: un sensore che sparisce non deve generare un falso allarme.

- id: deumidificatore_cantina_serbatoio_pieno
  alias: "Deumidificatore cantina – serbatoio pieno"
  description: >-
    Presa accesa ma potenza a zero da 30 minuti: la macchina non sta lavorando.
    Causa tipica: serbatoio dell'acqua pieno.
  mode: single
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('switch.box_deumidificatore_cantina_sonoff', 'on')
           and states('sensor.box_deumidificatore_cantina_sonoff_power') | float(999) < 5 }}
      for: "00:30:00"
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "Deumidificatore cantina fermo"
        message: >-
          La presa e' accesa da oltre 30 minuti ma la potenza assorbita e' zero.
          Il deumidificatore non sta lavorando: controlla il serbatoio dell'acqua,
          probabilmente e' pieno.
        data:
          tag: deumidificatore_cantina_serbatoio
          channel: Deumidificatori
          importance: high

- id: deumidificatore_armadio_serbatoio_pieno
  alias: "Deumidificatore Armadio – serbatoio pieno"
  description: >-
    Presa accesa ma potenza a zero da 30 minuti: la macchina non sta lavorando.
    Causa tipica: serbatoio dell'acqua pieno.
  mode: single
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('switch.deumidificatore_armadio_zigbee', 'on')
           and states('sensor.deumidificatore_armadio_zigbee_power') | float(999) < 5 }}
      for: "00:30:00"
  actions:
    - action: notify.mobile_app_cph2653
      data:
        title: "Deumidificatore armadio fermo"
        message: >-
          La presa e' accesa da oltre 30 minuti ma la potenza assorbita e' zero.
          Il deumidificatore non sta lavorando: controlla il serbatoio dell'acqua,
          probabilmente e' pieno.
        data:
          tag: deumidificatore_armadio_serbatoio
          channel: Deumidificatori
          importance: high

#==================================================================================
# CONTROLLO PERIODICO DEUMIDIFICATORI
# Spostati da automations_clima per raggruppare tutta la logica deumidificatori
# in un unico file.
#==================================================================================

#==================================================================================
# DEUMIDIFICATORE CANTINA – CONTROLLO PERIODICO SU FV + UMIDITÀ
# Ogni 5 minuti verifica produzione FV e umidità in cantina e decide stato presa.
# Soglia FV: 1000W. Robusto contro riavvii o eventi mancati.
#
# Il deumidificatore non ha igrostato interno (vedi automations_deumidificatori):
# finche' e' alimentato lavora. L'igrostato lo fa quindi questa automazione, con
# il sensore sensor.termometro_cantina_zigbee_humidity.
#
# ACCENDE se: FV >= 1000 W  E  umidità >= 60%
# SPEGNE se:  FV < 1000 W   O  umidità <= 55%
# Isteresi di 5 punti percentuali per evitare cicli continui on/off della presa.
# 60/55% e' la finestra che tiene la cantina fuori dalla zona di rischio muffa
# (>65%) senza asciugare oltre il necessario sprecando energia.
#
# Se il sensore di umidità e' unavailable/unknown l'automazione torna al solo
# criterio fotovoltaico (comportamento precedente): un sensore che sparisce non
# deve bloccare la deumidificazione.
#
# Rispetta input_boolean.deumidificatore_cantina_manuale.
#==================================================================================
- id: deumidificatore_cantina_controllo
  alias: "Deumidificatore Cantina – Controllo Periodico FV"
  description: >
    Ogni 5 minuti accende switch.box_deumidificatore_cantina_sonoff se produzione FV
    supera 1000W e umidità cantina >= 60%, spegne se FV sotto soglia o umidità <= 55%.
    Bloccato se in gestione manuale.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.deumidificatore_cantina_manuale
      state: "off"
  actions:
    - variables:
        fv: "{{ states('sensor.inverter_uflex_pv_power') | float(0) }}"
        presa_on: "{{ is_state('switch.box_deumidificatore_cantina_sonoff', 'on') }}"
        umid_ok: "{{ has_value('sensor.termometro_cantina_zigbee_humidity') }}"
        umid: "{{ states('sensor.termometro_cantina_zigbee_humidity') | float(0) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ fv >= 1000 and not presa_on
                   and (not umid_ok or umid >= 60) }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.box_deumidificatore_cantina_sonoff
        - conditions:
            - condition: template
              value_template: >-
                {{ presa_on
                   and (fv < 1000 or (umid_ok and umid <= 55)) }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.box_deumidificatore_cantina_sonoff

#==================================================================================
# DEUMIDIFICATORE TANIA (ex armadio) – CONTROLLO PERIODICO SU PRODUZIONE FV
# Ogni 5 minuti verifica produzione FV e decide stato presa deumidificatore.
# Soglia: 1000W. Robusto contro riavvii o eventi mancati.
# L'umidità è gestita dall'igrostat interno del deumidificatore.
# Rispetta input_boolean.deumidificatore_armadio_manuale.
#==================================================================================
- id: deumidificatore_armadio_controllo
  alias: "Deumidificatore armadio  – Controllo Periodico FV"
  description: >
    Ogni 5 minuti accende switch.deumidificatore_armadio_zigbee
    se produzione FV supera 1000W, spegne se sotto soglia. Bloccato se in gestione manuale.
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: input_boolean.deumidificatore_armadio_manuale
      state: "off"
  actions:
    - variables:
        fv: "{{ states('sensor.inverter_uflex_pv_power') | float(0) }}"
        presa_on: "{{ is_state('switch.deumidificatore_armadio_zigbee', 'on') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ fv >= 1000 and not presa_on }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.deumidificatore_armadio_zigbee
        - conditions:
            - condition: template
              value_template: "{{ fv < 1000 and presa_on }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.deumidificatore_armadio_zigbee
