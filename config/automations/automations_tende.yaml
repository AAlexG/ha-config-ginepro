# automations_tende_9.yaml
# v9 (29/10/2026): tenda_gestione_sole non apre per il sole con temperatura
#   esterna sotto 23 C (sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature);
#   con sensore non disponibile non apre. Nuovo trigger: temperatura sopra
#   23 C per 15 minuti, cosi' la tenda si apre anche quando il sole c'e' gia'
#   da prima e la temperatura sale dopo. Ramo di chiusura e apertura per
#   pioggia invariati.
# v8 (20/10/2026): apertura per pioggia anche con raffica fra 40 e 50 km/h,
#   ma solo al 65% (tenda_apertura_pioggia). Sotto 40 resta l'85%, sopra 50
#   non parte (la tenda la chiude il vento). Il blocco di 30 minuti dopo
#   l'ultimo intervento del vento resta invariato.
# v7 (20/10/2026): tenda giardino, vento a due soglie (tenda_chiusura_vento,
#   id invariato):
#   - raffica 40-50 km/h: tenda portata al 65% se e' piu' aperta, invece di
#     chiuderla; se e' gia' al 65% o meno resta dov'e';
#   - raffica oltre 50 km/h: chiusura completa.
#   Aggiunto il trigger sopra 50: senza, una raffica che sale da 45 a 55
#   senza scendere sotto 40 non farebbe scattare la chiusura.
#   Notifica del 65%: una al giorno (tenda_notifica_vento_oggi, come prima).
#   Notifica di chiusura: sempre, anche se oggi c'e' gia' stata quella del 65%.
#   Pioggia e sole restano bloccati con raffica >= 40 e per 30 minuti
#   dall'ultimo intervento del vento: non possono riportarla all'85%.
# v6 (19/10/2026): la pergola si riapre 20 minuti dopo l'ultima vaschetta,
#   non piu' circa 80. Il 19/10 si e' visto che hourly_rain e' una somma
#   mobile di 60 minuti, non un accumulo che si azzera ogni ora: resta > 0
#   fino a un'ora dopo l'ultima goccia. Con "hourly_rain > 0" come emergenza,
#   la chiusura rinnovava ultimo_allarme per tutta quell'ora e il rilascio
#   aspettava poi altri 20 minuti.
#   - Chiusura: hourly_rain conta come emergenza solo quando sale (trigger
#     sul passaggio sopra 0, oppure ultima vaschetta da meno di 150 s, cioe'
#     entro il ciclo successivo da 2 minuti). Variabile v_vaschetta.
#   - Rilascio: al posto di "hourly_rain <= 0" chiede almeno 20 minuti
#     dall'ultima vaschetta (sensor.pioggia_ultima_vaschetta, in config_tende).
#     Se quel sensore non e' disponibile vale come vaschetta vecchia: restano
#     rain_rate e ultimo_allarme a proteggere.
#   - pergola_pioggia_oggi (ciclo fitto) usa ancora hourly_rain > 0.
#   - Tenda e irrigazione invariate: li' l'ora in piu' e' solo protettiva.
# v4 (12/10/2026): aggiunto il sensore pioggia Tuya Zigbee
#   (binary_sensor.sensore_pioggia_tuya_rain). L'11/10 la stazione ha
#   visto la pioggia solo alle 12:45:26, 2-3 minuti dopo l'inizio: il
#   pluviometro a vaschetta segnala solo dopo aver raccolto 0,1-0,2 mm e con
#   pioggia leggera (1,2 mm/h) servono minuti. La terrazza si e' allagata.
#   Il Tuya rileva l'acqua sulla piastra alla prima goccia.
#   REGOLA: il Tuya serve SOLO a proteggere (chiudere la pergola, aprire la
#   tenda all'85%, bloccare la ritrazione della tenda), MAI a rilasciare: la
#   piastra resta bagnata a lungo dopo la pioggia. Conta come pioggia solo
#   nei 30 minuti successivi al passaggio a "on" (variabile v_tuya); dopo,
#   decide la stazione. Il rilascio della pergola resta sulla sola stazione.
#   Nota: dopo un riavvio di HA last_changed riparte, quindi un sensore
#   ancora bagnato conta come pioggia per altri 30 minuti (effetto solo
#   protettivo).
# v3 (08/10/2026): pergola_meteo_chiusura con pergola_blocco_manuale alzato non
#   chiude ma avvisa: una notifica per ogni allarme meteo (vento, pioggia o
#   previsione), ripetuta solo dopo che l'allarme e' rientrato. Avvisa anche
#   in vacanza, se la pergola e' rimasta in gestione manuale.
# v2 (08/10/2026): rimossa pergola_blocco_manuale_rilascio (07:00 / 23:00).
#   pergola_blocco_manuale segue la regola dei flag manuali: lo abbassa solo
#   l'utente; promemoria in flag_manuali_promemoria (automations_clima).
#
# Automazioni di pergola terrazza e tenda giardino (plancia Tende).
# Rinominato il 30/09/2026 da automations_pergola.yaml (ultima versione
# automations_pergola_26): contenuto e id invariati.

#==================================================================================
# PERGOLA – INSEGUIMENTO SOLARE + APERTURA AERAZIONE (1 giugno – 1 novembre)
# Versione a 6 movimenti fissi al giorno (eliminato il ciclo dei 10 minuti):
#   08:30 / 10:00 / 11:15 : formula "profile angle" su sun.sun (asse lamelle
#                 145°/325°, corsa 0-100% = 135°, margine ombra = 41°),
#                 +5 punti di scorta perché la posizione deve reggere fino
#                 allo slot successivo mentre il sole sale; arrotondamento
#                 al punto intero. Taratura empirica: 15% alle 12:00 di
#                 luglio (slot 11:15 -> ~17). NOTA: prima mattina ancora
#                 da verificare sul campo.
#                 v19: posizione MINIMA 30% (variabile min_mattino) per
#                 aerare. Da fine agosto il sole e' basso e la formula da'
#                 valori negativi: senza minimo la pergola restava al 5%
#                 fino al passaggio dei 145° di azimut (~11:30 a fine
#                 settembre). Il 30% lascia entrare un po' di sole al
#                 mattino: e' voluto.
#                 v20: il minimo si legge da input_number.pergola_min_mattino
#                 (regolabile in plancia Tende); se l'helper non e' disponibile
#                 vale 30.
#   azimut >= 145° (il sole passa il piano lamelle: luglio ~12:30,
#                 ottobre ~11:10, lo scatto segue la stagione da solo):
#                 posizione fissa 97%, regge tutto il primo pomeriggio.
#                 Taratura empirica: 97% h12:40, 95% h13:22, 91% h13:26,
#                 87% h13:46, 80% h15:00.
#                 Trigger di recupero alle 13:00 e 14:00: ripetono la
#                 posizione dello slot corrente (nessun movimento fisico se
#                 gia' in posa) e coprono ricariche/riavvii avvenuti DOPO
#                 l'attraversamento, quando il trigger sull'azimut non puo'
#                 piu' scattare (valuta solo il passaggio falso -> vero).
#   15:00 : lamelle all'80% per aerare la zona sottostante.
#   23:01 : chiusura per la notte (0%). Alle 23:01 e non 23:00: in origine
#           per evitare la corsa con il rilascio del blocco manuale delle
#           23:00, rimosso in v2 (orario lasciato invariato).
# Trigger extra: al rilascio della sicurezza meteo la pergola si riposiziona
# subito al valore dello slot corrente, altrimenti dopo un temporale
# resterebbe chiusa fino allo slot successivo.
# Le posizioni NON vengono piu' ripristinate ogni 10 minuti: uno spostamento
# manuale resta valido fino allo slot successivo.
# Rispetta il flag vacanza, il blocco manuale e la chiusura di sicurezza meteo.
#==================================================================================
- id: pergola_inseguimento_solare
  alias: "Pergola – Inseguimento Solare"
  mode: single
  triggers:
    - trigger: time
      at: "08:30:00"
    - trigger: time
      at: "10:00:00"
    - trigger: time
      at: "11:15:00"
    - trigger: template
      value_template: "{{ state_attr('sun.sun','azimuth') | float(0) >= 145 }}"
    - trigger: time
      at: "13:00:00"
    - trigger: time
      at: "14:00:00"
    - trigger: time
      at: "15:00:00"
    - trigger: time
      at: "23:01:00"
    - trigger: state
      entity_id: input_boolean.pergola_meteo_chiusura
      from: "on"
      to: "off"
  conditions:
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: state
      entity_id: input_boolean.pergola_blocco_manuale
      state: "off"
    - condition: state
      entity_id: input_boolean.pergola_meteo_chiusura
      state: "off"
    - condition: template
      value_template: "{{ '06-01' <= now().strftime('%m-%d') <= '11-01' }}"
  actions:
    - variables:
        normal: 145
        travel: 135
        margin: 41
        min_mattino: "{{ states('input_number.pergola_min_mattino') | float(30) }}"
        az: "{{ state_attr('sun.sun','azimuth') | float(180) }}"
        el: "{{ state_attr('sun.sun','elevation') | float(0) }}"
        c: "{{ cos((az - normal) * pi / 180) }}"
        pct_grezzo: "{{ (((atan(tan(el * pi / 180) / c) * 180 / pi) - margin) / travel) * 100 if c > 0.01 else 0 }}"
        pct: "{{ [[pct_grezzo, 0] | max, 100] | min }}"
        ora: "{{ now().strftime('%H:%M') }}"
        target: >-
          {% if '08:30' <= ora < '15:00' %}{% if az < 145 %}{{ [[pct + 5, min_mattino] | max, 100] | min | round | int }}{% else %}97{% endif %}{% elif '15:00' <= ora < '23:00' %}80{% else %}0{% endif %}
    - action: cover.set_cover_tilt_position
      target:
        entity_id: cover.terrazzo_pergola_terrazza
      data:
        tilt_position: "{{ target | int }}"

#==================================================================================
# PERGOLA – CHIUSURA SICUREZZA METEO
# Chiude a 0% se: raffica > 40 km/h, intensita' di pioggia > 0 mm/h,
# accumulo orario > 0 mm, oppure previsione pioggia > 0 mm nelle prossime
# 3 ore (weather.casa).
#
# v22 - VENTO: unica soglia raffica > 40 km/h, uguale alla tenda giardino.
# Eliminati la soglia raffica 20 km/h e il vento medio > 10 km/h: con quei
# valori una brezza normale teneva la pergola chiusa per ore (25/09: chiusa
# dalle 13:10, allarme rinnovato da raffiche di 20-21 km/h). Inoltre il
# ciclo ogni 10 minuti controllava il vento medio istantaneo, senza i 3
# minuti del trigger.
# Riferimento: Corradi Alba classe 6 UNI EN 13561:2015 (>= 400 Pa, 88 km/h,
# dato del costruttore). 40 km/h lascia ampio margine. Il manuale Alba
# prescrive lamelle completamente chiuse oltre la velocita' di classe:
# la chiusura a 0% e' la posizione corretta.
#
# v15 - RIMOSSO il controllo sulla radiazione solare (era < 30 W/m2 per 30
# minuti; il commento diceva 150, il codice 30). Motivo: la posizione
# pomeridiana all'80% serve ad AERARE lo spazio sottostante, non solo a fare
# ombra, quindi con luce scarsa e tempo asciutto non c'e' motivo di chiudere.
# Il controllo era inoltre ridondante (la previsione a 3 ore anticipa meglio
# il temporale) e si accendeva ogni sera al calare della luce, lasciando il
# flag alzato tutta la notte e visibile in plancia col tempo sereno.
#
# v15 - AGGIUNTO sensor...rain_rate (intensita' istantanea). hourly_rain e'
# un accumulo dell'ora corrente e si azzera allo scoccare dell'ora: se piove
# alle 10:55, alle 11:00 torna a 0 mentre sta ancora piovendo. rain_rate
# copre quel buco e intercetta la pioggia locale immediatamente; hourly_rain
# resta per dare persistenza all'allarme dopo che ha smesso.
# v6 (tende) - Il 19/10/2026 hourly_rain risulta una somma mobile di 60
# minuti, senza azzeramento orario: vedi intestazione v6.
# NOTA: event_rain volutamente NON usato, resta > 0 per ore dopo la pioggia
# e terrebbe la pergola chiusa per l'intera giornata.
#
# v15 - Scrive input_datetime.pergola_meteo_ultimo_allarme (usato dal
# rilascio) e input_text.pergola_meteo_causa (mostrato in plancia Tende).
# v23 - Formato della causa: "Chiusa dalle HH:MM · ultimo allarme HH:MM:
# <cause con valori> · riapre non prima delle HH:MM". Riscritta ad ogni
# ciclo di emergenza, quindi l'ora di riapertura si sposta in avanti ad
# ogni rinnovo dell'allarme.
# Rispetta solo il blocco manuale: la sicurezza meteo ha sempre priorità
# sull'inseguimento solare.
#==================================================================================
- id: pergola_meteo_chiusura
  alias: "Pergola – Chiusura Sicurezza Meteo"
  # v21: con il ciclo fitto ogni 2 minuti due trigger possono cadere insieme:
  # il secondo viene scartato in silenzio.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      above: 40
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_rain_rate
      above: 0
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_hourly_rain
      above: 0
    # v4: sensore pioggia Tuya, scatta alla prima goccia.
    - trigger: state
      entity_id: binary_sensor.sensore_pioggia_tuya_rain
      to: "on"
      not_from: ["unavailable", "unknown"]
    - trigger: time_pattern
      minutes: "/10"
    # v21: dopo che nella giornata e' stata vista o prevista pioggia
    # (input_boolean.pergola_pioggia_oggi, azzerato alle 23:59:30) il controllo
    # gira ogni 2 minuti per il resto della giornata.
    - trigger: time_pattern
      minutes: "/2"
      id: fitto
  conditions:
    # v3: con il flag manuale alzato la valutazione gira comunque (anche in
    # vacanza), ma solo per avvisare: la pergola non viene toccata.
    - condition: template
      value_template: >-
        {{ is_state('input_boolean.vacanza', 'off')
           or is_state('input_boolean.pergola_blocco_manuale', 'on') }}
    - condition: template
      value_template: >-
        {{ trigger.id != 'fitto'
           or is_state('input_boolean.pergola_pioggia_oggi', 'on') }}
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.casa
      data:
        type: hourly
      response_variable: previsione
    - variables:
        v_raffica: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) }}"
        v_rate: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_rain_rate') | float(0) }}"
        v_oraria: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_hourly_rain') | float(0) }}"
        # v6: vaschetta appena scattata (trigger su hourly_rain o ultimo
        # scatto da meno di 150 s). Sostituisce "v_oraria > 0" come emergenza.
        v_vaschetta: >-
          {{ (trigger is defined and trigger.entity_id is defined
               and trigger.entity_id == 'sensor.hp1000se_pro_pro_v1_6_4_hourly_rain')
             or (now().timestamp()
                 - as_timestamp(states('sensor.pioggia_ultima_vaschetta'), 0) < 150) }}
        # v4: sensore Tuya bagnato da meno di 30 minuti (vedi intestazione).
        v_tuya: >-
          {{ is_state('binary_sensor.sensore_pioggia_tuya_rain', 'on')
             and (now() - states.binary_sensor.sensore_pioggia_tuya_rain.last_changed)
                 .total_seconds() < 1800 }}
        mm_previsti: >-
          {{ (previsione['weather.casa'].forecast[0:3]
             | map(attribute='precipitation')
             | map('float', 0) | list) | max | default(0) }}
    # v21: pioggia vista o prevista -> ciclo fitto per il resto della giornata
    - if:
        - condition: template
          value_template: "{{ v_tuya or v_rate > 0 or v_oraria > 0 or mm_previsti > 0 }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.pergola_pioggia_oggi
    # Secondo blocco separato: usa le variabili del primo.
    # ora_inizio = ora di alzamento del flag (last_changed se gia' alzato,
    # adesso se sta per essere alzato ora), non ora dell'ultimo controllo.
    - variables:
        emergenza: >-
          {{ v_raffica > 40 or v_tuya or v_rate > 0
             or v_vaschetta or mm_previsti > 0 }}
        ora_inizio: >-
          {% if is_state('input_boolean.pergola_meteo_chiusura','on') %}
          {{ states.input_boolean.pergola_meteo_chiusura.last_changed
             | as_local | as_timestamp | timestamp_custom('%H:%M') }}
          {% else %}{{ now().strftime('%H:%M') }}{% endif %}
        # v23: prima riapertura possibile = primo controllo del rilascio
        # (minuti /10, secondi 30) che cade almeno 20 minuti dopo adesso.
        # Il fuso orario ha offset di ore intere, quindi il modulo 600 sul
        # timestamp coincide con i minuti :x0 dell'ora locale.
        ora_riapertura: >-
          {% set t = now().timestamp() + 1200 %}
          {{ (((t - 30) / 600) | round(0, 'ceil') * 600 + 30)
             | timestamp_custom('%H:%M') }}
        # v23: il testo separa i tre momenti. Prima valore e ora d'inizio
        # comparivano insieme ("raffica 20.6 km/h – dalle 13:10") ma il valore
        # era quello dell'ultimo rinnovo, non quello della chiusura.
        causa: >-
          {{ 'Chiusa dalle ' ~ ora_inizio ~ ' · ultimo allarme ' ~ now().strftime('%H:%M') ~ ': '
             ~ ([ ('raffica ' ~ (v_raffica | round(1)) ~ ' km/h') if v_raffica > 40 else none,
                  'gocce sul sensore pioggia' if v_tuya else none,
                  ('pioggia ' ~ (v_rate | round(1)) ~ ' mm/h') if v_rate > 0 else none,
                  ('pioggia ultima ora ' ~ (v_oraria | round(1)) ~ ' mm') if v_vaschetta else none,
                  ('previsione ' ~ (mm_previsti | round(1)) ~ ' mm/3h') if mm_previsti > 0 else none ]
                | reject('none') | list | join(' + '))
             ~ ' · riapre non prima delle ' ~ ora_riapertura }}
    # v3: avviso meteo con pergola in gestione manuale.
    # Allarme rientrato o flag abbassato: l'avviso si riarma.
    - if:
        - condition: template
          value_template: >-
            {{ is_state('input_boolean.pergola_meteo_avviso_manuale', 'on')
               and not (emergenza and is_state('input_boolean.pergola_blocco_manuale', 'on')) }}
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.pergola_meteo_avviso_manuale
    - condition: template
      value_template: "{{ emergenza }}"
    # Flag manuale alzato: nessun comando alla pergola, solo una notifica
    # per ogni allarme.
    - if:
        - condition: state
          entity_id: input_boolean.pergola_blocco_manuale
          state: "on"
      then:
        # v5: avviso solo se le lamelle non sono gia' chiuse (tilt 0).
        # Tilt non leggibile: avvisa comunque.
        - if:
            - condition: state
              entity_id: input_boolean.pergola_meteo_avviso_manuale
              state: "off"
            - condition: template
              value_template: >-
                {{ state_attr('cover.terrazzo_pergola_terrazza',
                              'current_tilt_position') | int(-1) != 0 }}
          then:
            - action: notify.mobile_app_cph2653
              data:
                title: "⚠️ Pergola in gestione manuale: andrebbe chiusa"
                message: >-
                  Allarme meteo: {{ ([ ('raffica ' ~ (v_raffica | round(1)) ~ ' km/h') if v_raffica > 40 else none,
                      'gocce sul sensore pioggia' if v_tuya else none,
                      ('pioggia ' ~ (v_rate | round(1)) ~ ' mm/h') if v_rate > 0 else none,
                      ('pioggia ultima ora ' ~ (v_oraria | round(1)) ~ ' mm') if v_vaschetta else none,
                      ('previsione ' ~ (mm_previsti | round(1)) ~ ' mm/3h') if mm_previsti > 0 else none ]
                    | reject('none') | list | join(' + ')) }}.
                  Con "Pergola manuale" alzato la sicurezza meteo non la chiude:
                  chiudila dalla plancia Tende o abbassa il flag.
                data:
                  tag: pergola_meteo_manuale
                  priority: high
                  ttl: 0
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.pergola_meteo_avviso_manuale
        - stop: "Pergola in gestione manuale: solo avviso"
    - action: cover.set_cover_tilt_position
      target:
        entity_id: cover.terrazzo_pergola_terrazza
      data:
        tilt_position: 0
    - action: input_text.set_value
      target:
        entity_id: input_text.pergola_meteo_causa
      data:
        value: "{{ causa }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.pergola_meteo_chiusura
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.pergola_meteo_ultimo_allarme
      data:
        timestamp: "{{ now().timestamp() }}"

#==================================================================================
# PERGOLA – RILASCIO SICUREZZA METEO
# Rilascia il blocco meteo dopo 20 minuti senza alcuna condizione di allarme.
#
# v15 - Il trigger "template + for: 00:20:00" e' stato sostituito da un
# controllo periodico. Un trigger template scatta SOLO sulla transizione
# falso -> vero: finche' esisteva il controllo radiazione quella transizione
# avveniva una volta al giorno all'alba, ma tolto quello, in una giornata
# serena e calma il template sarebbe vero da ore e non scatterebbe mai piu'.
# Il flag alzato dalla sola previsione pioggia sarebbe rimasto acceso a
# tempo indeterminato.
#
# I 20 minuti di anti-rimbalzo sono ora misurati su
# input_datetime.pergola_meteo_ultimo_allarme, scritto dall'automazione di
# chiusura ogni volta che vede un'emergenza. Cosi' l'attesa copre anche la
# previsione pioggia senza doverla ricontrollare qui (evita che chiusura e
# rilascio si rincorrano ogni 10 minuti).
#
# Sfasato di 30 secondi rispetto al ciclo della chiusura per non correre
# con essa sullo stesso minuto.
#
# v4: il sensore Tuya NON e' usato qui di proposito (resta bagnato dopo la
# pioggia). Agisce lo stesso in modo indiretto: per 30 minuti dal suo
# passaggio a "on" la chiusura rinnova ultimo_allarme, quindi la pergola resta
# chiusa almeno 30 + 20 minuti, tempo in cui la stazione, se piove davvero,
# ha gia' misurato la pioggia.
#
# v6: la condizione su hourly_rain <= 0 e' sostituita da "almeno 20 minuti
# dall'ultima vaschetta" (sensor.pioggia_ultima_vaschetta). hourly_rain e' una
# somma mobile di 60 minuti e teneva chiusa la pergola fino a 80 minuti.
#
# Il controllo istantaneo di vento/raffica/pioggia resta come seconda rete:
# copre il caso in cui la chiusura non giri (flag vacanza o blocco manuale)
# e quindi non aggiorni piu' il timestamp.
#==================================================================================
- id: pergola_meteo_rilascio
  alias: "Pergola – Rilascio Sicurezza Meteo"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: time_pattern
      minutes: "/10"
      seconds: 30
  conditions:
    - condition: state
      entity_id: input_boolean.pergola_meteo_chiusura
      state: "on"
    - condition: template
      value_template: >-
        {{ now().timestamp()
           - (state_attr('input_datetime.pergola_meteo_ultimo_allarme','timestamp')
              | float(0)) >= 1200 }}
    - condition: template
      value_template: >-
        {{ (states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) <= 40)
           and (states('sensor.hp1000se_pro_pro_v1_6_4_rain_rate') | float(0) <= 0)
           and (now().timestamp()
                - as_timestamp(states('sensor.pioggia_ultima_vaschetta'), 0) >= 1200) }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.pergola_meteo_chiusura
    - action: input_text.set_value
      target:
        entity_id: input_text.pergola_meteo_causa
      data:
        value: "Nessun allarme – rientrato alle {{ now().strftime('%H:%M') }}"

#==================================================================================
# TENDA GIARDINO - Vento: 65% fra 40 e 50 km/h, chiusa oltre 50 km/h
#
# v7 (tende) - Due soglie di raffica al posto della chiusura unica a 40:
#   - 40-50 km/h  : posizione 65% (solo se la tenda e' piu' aperta del 65%);
#   - oltre 50    : chiusura completa.
# La soglia 40 e' la stessa della pergola e dei blocchi di pioggia e sole.
# NOTA: la vecchia soglia unica a 40 era scelta come margine rispetto alla
# Classe 3 UNI EN 13561 (49 km/h); con la v7 la tenda resta estesa al 65%
# fino a 50 km/h di raffica, scelta dell'utente.
# Sensore: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
#
# v16 - Nuovo motore Somfy io al posto del vecchio RTS. L'entita' e' ora
# cover.all_house_tenda_giardino_new, che riporta la posizione reale (0 = chiusa,
# 100 = tutta estesa).
#
# NOTIFICHE: quella del 65% al massimo 1 al giorno tramite
# input_boolean.tenda_notifica_vento_oggi (reset a mezzanotte, vedi
# automazione successiva); quella di chiusura sempre.
#
# L'id resta tenda_chiusura_vento: pioggia e sole leggono il suo
# last_triggered per non riaprire la tenda nei 30 minuti successivi.
#==================================================================================
- id: tenda_chiusura_vento
  alias: "Tenda Giardino - Vento: 65% oltre 40 km/h, chiusura oltre 50 km/h"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      above: 40
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      above: 50
  conditions:
    - condition: template
      value_template: >-
        {% set r = states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) %}
        {% set p = state_attr('cover.all_house_tenda_giardino_new', 'current_position') | int(-1) %}
        {{ (r > 50 and p > 0) or (r > 40 and p > 65) }}
  actions:
    - variables:
        raffica: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ raffica > 50 }}"
          sequence:
            - action: cover.close_cover
              target:
                entity_id: cover.all_house_tenda_giardino_new
            - action: notify.mobile_app_cph2653
              data:
                title: "💨 Tenda giardino chiusa - vento"
                message: >-
                  Raffica di {{ raffica | round(1) }} km/h rilevata.
                  Tenda giardino chiusa automaticamente.
                data:
                  priority: high
                  ttl: 0
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.tenda_notifica_vento_oggi
      default:
        - action: cover.set_cover_position
          target:
            entity_id: cover.all_house_tenda_giardino_new
          data:
            position: 65
        - if:
            - condition: state
              entity_id: input_boolean.tenda_notifica_vento_oggi
              state: "off"
          then:
            - action: notify.mobile_app_cph2653
              data:
                title: "💨 Tenda giardino al 65% - vento"
                message: >-
                  Raffica di {{ raffica | round(1) }} km/h rilevata.
                  Tenda giardino portata al 65%; si chiude se supera 50 km/h.
                data:
                  priority: high
                  ttl: 0
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.tenda_notifica_vento_oggi

#==================================================================================
# TENDA GIARDINO - Reset notifiche giornaliere a mezzanotte
# v18: azzera sia il flag del vento sia quello della pioggia.
# (spostata da automations.yaml v114 - era la n.33b, id invariato)
#==================================================================================
- id: tenda_reset_notifica_vento_mezzanotte
  alias: "Tenda Giardino - Reset notifiche vento e pioggia a mezzanotte"
  mode: single
  triggers:
    - trigger: time
      at: "23:59:30"
  conditions: []
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.tenda_notifica_vento_oggi
          - input_boolean.tenda_notifica_pioggia_oggi
          - input_boolean.pergola_pioggia_oggi
        

#==================================================================================
# TENDA GIARDINO - Apertura all'85% per pioggia (nuova in v17)
#
# La tenda si APRE all'85% quando piove o quando la pioggia e' prevista nelle
# prossime 3 ore (regola decisa da Alex).
#
# Sorgenti pioggia (stesse della sicurezza meteo pergola):
#   - rain_rate    : intensita' istantanea, intercetta subito la pioggia locale
#   - hourly_rain  : accumulo dell'ora corrente, da' persistenza dopo che ha
#                    smesso; si azzera allo scoccare dell'ora, per questo
#                    serve anche rain_rate
#   - previsione   : massimo delle precipitazioni nelle prime 3 ore di
#                    weather.casa (hourly)
#   event_rain volutamente NON usato: resta > 0 per ore dopo la pioggia.
#   - sensore Tuya (v4): solo nei 30 minuti dal passaggio a "on" (v_tuya).
#
# PRIORITA' AL VENTO (v8 tende): posizione bersaglio secondo la raffica,
# con le stesse soglie di tenda_chiusura_vento, quindi le due automazioni
# non possono rincorrersi:
#   - raffica < 40 km/h  : 85%
#   - raffica 40-50 km/h : 65%
#   - raffica >= 50 km/h : l'apertura non parte.
# Quando la raffica rientra e sta ancora piovendo, il ciclo dei 10 minuti
# porta la tenda al nuovo bersaglio.
#
# Se la tenda e' gia' al bersaglio o oltre viene lasciata dov'e': la
# condizione current_position < bersaglio blocca l'esecuzione, quindi
# nessun comando parte e la tenda non viene mai richiusa da questa
# automazione.
#
# Il ciclo periodico e' sfasato di 15 secondi rispetto a quello della
# sicurezza meteo pergola (minuti /10, secondi 0 e 30) per non mandare
# comandi simultanei allo stesso gateway.
#==================================================================================
- id: tenda_apertura_pioggia
  alias: "Tenda Giardino - Apertura per pioggia (85%, 65% con vento)"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_rain_rate
      above: 0
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_hourly_rain
      above: 0
    # v4: sensore pioggia Tuya, scatta alla prima goccia.
    - trigger: state
      entity_id: binary_sensor.sensore_pioggia_tuya_rain
      to: "on"
      not_from: ["unavailable", "unknown"]
    - trigger: time_pattern
      minutes: "/10"
      seconds: 15
  conditions:
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    # v8: fino a 50 km/h; fra 40 e 50 il bersaglio scende al 65%.
    - condition: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      below: 50
    # v21: priorita' al vento anche dopo la chiusura. Per 30 minuti dall'ultima
    # chiusura per vento (last_triggered di tenda_chiusura_vento, cercata per id)
    # la tenda non viene riaperta: prima bastava una singola lettura di raffica
    # sotto 40 km/h per riaprirla in mezzo alla burrasca.
    - condition: template
      value_template: >-
        {% set a = states.automation
                   | selectattr('attributes.id', 'eq', 'tenda_chiusura_vento') | list %}
        {% set t = a[0].attributes.last_triggered if a else none %}
        {{ t is none or (now() - t).total_seconds() > 1800 }}
    - condition: template
      value_template: >-
        {% set r = states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) %}
        {% set p = state_attr('cover.all_house_tenda_giardino_new', 'current_position') | int(-1) %}
        {{ p >= 0 and p < (85 if r < 40 else 65) }}
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.casa
      data:
        type: hourly
      response_variable: previsione
    - variables:
        v_rate: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_rain_rate') | float(0) }}"
        v_oraria: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_hourly_rain') | float(0) }}"
        # v4: sensore Tuya bagnato da meno di 30 minuti (vedi intestazione).
        v_tuya: >-
          {{ is_state('binary_sensor.sensore_pioggia_tuya_rain', 'on')
             and (now() - states.binary_sensor.sensore_pioggia_tuya_rain.last_changed)
                 .total_seconds() < 1800 }}
        mm_previsti: >-
          {{ (previsione['weather.casa'].forecast[0:3]
             | map(attribute='precipitation')
             | map('float', 0) | list) | max | default(0) }}
        # v25: posizione prima dell'apertura, riportata nella notifica.
        pos_prima: "{{ state_attr('cover.all_house_tenda_giardino_new', 'current_position') | int(-1) }}"
        # v8: 85% con raffica sotto 40 km/h, 65% fra 40 e 50.
        raffica: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_wind_gust') | float(0) }}"
        bersaglio: "{{ 85 if raffica < 40 else 65 }}"
    - condition: template
      value_template: "{{ v_tuya or v_rate > 0 or v_oraria > 0 or mm_previsti > 0 }}"
    - action: cover.set_cover_position
      target:
        entity_id: cover.all_house_tenda_giardino_new
      data:
        position: "{{ bersaglio | int }}"
    - if:
        - condition: state
          entity_id: input_boolean.tenda_notifica_pioggia_oggi
          state: "off"
      then:
        - action: notify.mobile_app_cph2653
          data:
            # v25: testo in chiaro. Prima era "Aperta all'85%: accumulo 0.1 mm.",
            # senza dire perche' ne da dove venisse il dato.
            title: "🌧️ Pioggia: tenda giardino aperta"
            message: >-
              {{ ([ 'il sensore pioggia ha rilevato gocce' if v_tuya else none,
                    ('sta piovendo (' ~ (v_rate | round(1)) ~ ' mm/h)') if v_rate > 0 else none,
                    ("la stazione meteo ha misurato " ~ (v_oraria | round(1)) ~ " mm di pioggia nell'ora in corso") if v_oraria > 0 else none,
                    ('la previsione indica ' ~ (mm_previsti | round(1)) ~ ' mm di pioggia nelle prossime 3 ore') if mm_previsti > 0 else none ]
                  | reject('none') | list | join(', ')) | capitalize }}.
              La tenda giardino e' stata aperta al {{ bersaglio | int }}%{% if raffica >= 40 %}, non di piu' per il vento (raffica {{ raffica | round(1) }} km/h){% endif %}{% if pos_prima == 0 %} (prima era chiusa){% elif pos_prima > 0 %} (prima era al {{ pos_prima }}%){% endif %}.
            data:
              priority: high
              ttl: 0
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.tenda_notifica_pioggia_oggi

#==================================================================================
# TENDA GIARDINO - Gestione sole (nuova in v18)
#
# Sensore: sensor.hp1000se_pro_pro_v1_6_4_solar_radiation (stazione HP1000SE, W/m2).
# E' lo stesso sensore che la pergola usava fino alla v15.
#
# Due soglie con isteresi 3:1, per non far ballare la tenda a ogni nuvola:
#   sopra 300 W/m2 per 15 minuti  -> apre all'85% (sole pieno, serve ombra)
#                                    solo con T esterna >= 23 C (v9)
#   sotto 100 W/m2 per 30 minuti  -> porta al 40% se asciutto (giorno)
#                                    oppure a 0% se il sole e' sotto l'orizzonte
# Riferimento: cielo sereno estivo a mezzogiorno sta sugli 800-1000 W/m2,
# quindi 300 e' "sole vero" e 100 e' "grigio".
#
# Il ramo di chiusura agisce SOLO verso il basso: se la tenda e' gia' sotto
# la posizione bersaglio (per esempio a 0 dopo una chiusura per vento) non
# viene riaperta. Chiudere non deve mai diventare aprire.
#
# Precedenze:
#   - raffica > 40 km/h  : condizione di ingresso, l'automazione non parte.
#     La chiusura per vento resta l'unica a comandare.
#   - pioggia in corso o prevista a 3 ore: il ramo di chiusura non parte,
#     cosi' non contrasta tenda_apertura_pioggia. Il ramo di apertura non e'
#     in conflitto (porta anche lui all'85%).
#   - flag vacanza: blocca tutto.
#
# Nessuna notifica, come richiesto.
#==================================================================================
- id: tenda_gestione_sole
  alias: "Tenda Giardino - Gestione sole"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_solar_radiation
      above: 300
      for: "00:15:00"
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_solar_radiation
      below: 100
      for: "00:30:00"
    - trigger: state
      entity_id: sun.sun
      to: "below_horizon"
    # v9: il sole c'e' gia' e la temperatura sale sopra 23 C dopo.
    - trigger: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature
      above: 23
      for: "00:15:00"
  conditions:
    - condition: state
      entity_id: input_boolean.vacanza
      state: "off"
    - condition: numeric_state
      entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
      below: 40
    # v21: priorita' al vento anche dopo la chiusura. Per 30 minuti dall'ultima
    # chiusura per vento (last_triggered di tenda_chiusura_vento, cercata per id)
    # la tenda non viene riaperta: prima bastava una singola lettura di raffica
    # sotto 40 km/h per riaprirla in mezzo alla burrasca.
    - condition: template
      value_template: >-
        {% set a = states.automation
                   | selectattr('attributes.id', 'eq', 'tenda_chiusura_vento') | list %}
        {% set t = a[0].attributes.last_triggered if a else none %}
        {{ t is none or (now() - t).total_seconds() > 1800 }}
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.casa
      data:
        type: hourly
      response_variable: previsione
    - variables:
        rad: "{{ states('sensor.hp1000se_pro_pro_v1_6_4_solar_radiation') | float(0) }}"
        pos: "{{ state_attr('cover.all_house_tenda_giardino_new','current_position') | int(-1) }}"
        notte: "{{ is_state('sun.sun','below_horizon') }}"
        # v4: anche il Tuya bagnato da meno di 30 minuti blocca la ritrazione,
        # altrimenti la tenda appena aperta all'85% potrebbe essere riportata
        # al 40% prima che la stazione misuri la pioggia.
        pioggia: >-
          {{ (is_state('binary_sensor.sensore_pioggia_tuya_rain', 'on')
              and (now() - states.binary_sensor.sensore_pioggia_tuya_rain.last_changed)
                  .total_seconds() < 1800)
             or (states('sensor.hp1000se_pro_pro_v1_6_4_rain_rate') | float(0) > 0)
             or (states('sensor.hp1000se_pro_pro_v1_6_4_hourly_rain') | float(0) > 0)
             or ((previsione['weather.casa'].forecast[0:3]
                 | map(attribute='precipitation')
                 | map('float', 0) | list) | max | default(0) > 0) }}
        bersaglio: "{{ 0 if notte else 40 }}"
        # v9: protezione dal sole solo con T esterna >= 23 C; sensore non
        # disponibile = niente apertura.
        caldo: >-
          {{ has_value('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature')
             and states('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') | float(0) >= 23 }}
    - choose:
        # Sole pieno e caldo (v9): apre all'85% se non c'e' gia'
        - conditions:
            - condition: template
              value_template: "{{ rad > 300 and caldo and pos >= 0 and pos < 85 }}"
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.all_house_tenda_giardino_new
              data:
                position: 85
        # Luce bassa e tempo asciutto: scende al bersaglio, mai risale
        - conditions:
            - condition: template
              value_template: >-
                {{ rad < 100 and not pioggia
                   and pos > (bersaglio | int) }}
          sequence:
            - action: cover.set_cover_position
              target:
                entity_id: cover.all_house_tenda_giardino_new
              data:
                position: "{{ bersaglio | int }}"

