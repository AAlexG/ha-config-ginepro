# automations_fotovoltaico_5.yaml
#
# v5 (09/10/2026): F3/F4 rilevano lo stacco del modulo UFSC48-7.6 e il suo
# ricollegamento (input_boolean.condensatore_staccato, config_fotovoltaico).
# F1 usa sensor.condensatore_tensione_collegato: niente allarmi di
# sovratensione per letture a morsetti aperti durante un blocco.
# v4 (30/09/2026): aggiunte da automations.yaml, con id invariati, l'allerta
# pannello Tigo a 0 per 1 ora e il calcolo della tabella mensile FV.
#==================================================================================
# SORVEGLIANZA SOVRATENSIONE CONDENSATORE - Casa Ginepro
#
# Motivazione (incidente 19/08/2026):
#   L'accumulo UFLEX UFSC48-7,6 ha un limite di carica di 58 V da datasheet.
#   Il 19/08 alle 13:37 l'inverter HY-SP-6-IT ha registrato F55 DC_VoltHigh_Fault,
#   alle 14:12 F56 DC_VoltLow_Fault: il BMS ha aperto e il pacco e' rimasto fuori
#   servizio fino al riavvio manuale del modulo del 22/08. Nelle due settimane
#   precedenti la tensione massima giornaliera era salita progressivamente da
#   58,3 a 60,1 V, senza che nulla lo segnalasse.
#
# Principio di progetto:
#   Gli episodi oltre soglia durano da 0 a 25 secondi, quindi nessun "for" nei
#   trigger: lo scatto e' immediato. Il 22/08 tra le 13:01 e le 13:39 si sono
#   contati oltre 30 superamenti di 58,7 V: una notifica per episodio sarebbe
#   inutilizzabile. Da qui la separazione in due automazioni:
#     F1 avvisa subito solo sui picchi gravi (59,5 V), con antispam di 6 ore;
#     F2 manda un riepilogo serale se ci sono stati superamenti della soglia.
#
# Il conteggio proviene da sensor.condensatore_superamenti_oggi, unico contatore
# del sistema, la cui soglia e' letta in tempo reale dal parametro Absorption
# dell'inverter (number.inverter_uflex_battery_absorption): correggendo il
# parametro, conteggio, notifica e grafico si adeguano da soli. La soglia era
# in origine agganciata al Float, ma il Float e' il livello di stazionamento a
# fine carica e la tensione vi oscilla attorno per ore, producendo decine di
# conteggi in giornate del tutto regolari. La soglia fissa di 59,5 V
# dell'automazione F1 resta invece volutamente indipendente: e' un allarme di
# picco grave, non un conteggio, e deve scattare solo quando la tensione si
# avvicina ai 60 V che il 19/08 hanno prodotto il fault F55.
#
# I parametri dell'inverter non vengono toccati da queste automazioni: sono di
# sola sorveglianza.
#==================================================================================

#==================================================================================
# F1. PICCO GRAVE OLTRE 59,5 V (immediato)
#==================================================================================
- id: fotovoltaico_condensatore_picco_grave
  alias: "Fotovoltaico - Condensatore picco tensione grave"
  mode: single
  max_exceeded: silent
  triggers:
    - platform: numeric_state
      entity_id: sensor.condensatore_tensione_collegato
      above: 59.5
  condition:
    # Antispam: non rinotifica se l'ultimo invio e' entro 6 ore. Serve perche' in
    # una fase di deriva i superamenti si ripetono decine di volte per ora.
    - condition: template
      value_template: >
        {{ this.attributes.last_triggered is none
           or (now() - this.attributes.last_triggered).total_seconds() > 21600 }}
  action:
    - action: notify.mobile_app_cph2653
      continue_on_error: true
      data:
        title: "⚡ Condensatore - Sovratensione"
        message: >
          Tensione condensatore a {{ trigger.to_state.state }} V alle
          {{ now().strftime('%H:%M:%S') }}. Il limite di carica da datasheet e'
          58 V. Il 19/08 un episodio simile ha causato l'apertura del BMS.
          Massimo di oggi: {{ states('sensor.condensatore_tensione_max_oggi') }} V
          su {{ states('sensor.condensatore_superamenti_oggi') }} superamenti
          della soglia Absorption
          ({{ state_attr('sensor.condensatore_superamenti_oggi', 'soglia') }} V).
        data:
          priority: high
          ttl: 0
          persistent: "true"
          channel: alarm_stream
    - action: persistent_notification.create
      continue_on_error: true
      data:
        title: "⚡ Condensatore - Sovratensione"
        notification_id: condensatore_sovratensione
        message: >
          Tensione condensatore a {{ trigger.to_state.state }} V alle
          {{ now().strftime('%d/%m/%Y %H:%M:%S') }}, oltre i 58 V di carica
          massima indicati dal datasheet UFSC48-7,6. Verificare i parametri
          Absorption V, Float V ed Equalization V sull'inverter.

#==================================================================================
# F2. RIEPILOGO SERALE DEI SUPERAMENTI (informativo)
#==================================================================================
- id: fotovoltaico_condensatore_riepilogo_serale
  alias: "Fotovoltaico - Condensatore riepilogo tensione"
  mode: single
  max_exceeded: silent
  triggers:
    - platform: time
      at: "21:00:00"
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.condensatore_superamenti_oggi') | int(0) > 0 }}
  action:
    - action: notify.mobile_app_cph2653
      continue_on_error: true
      data:
        title: "📈 Condensatore - Riepilogo tensione"
        message: >
          Oggi la tensione del condensatore ha superato la soglia Absorption
          ({{ state_attr('sensor.condensatore_superamenti_oggi', 'soglia') }} V)
          per {{ states('sensor.condensatore_superamenti_oggi') }} volte,
          con un massimo di
          {{ states('sensor.condensatore_tensione_max_oggi') }} V.
          Limite di carica da datasheet: 58 V.
        data:
          priority: normal
          ttl: 0
          channel: general

#==================================================================================
# ALLERTA PANNELLO A 0 PER 1 ORA (SOLO DI GIORNO)
#==================================================================================
- id: tigo_alert_panel_zero_1h
  alias: "Tigo - Pannello a 0 per 1h (solo giorno)"
  mode: parallel
  triggers:
    - platform: state
      entity_id:
        - sensor.tetto_vs_ovest_panel_a1_power
        - sensor.tetto_vs_ovest_panel_a2_power
        - sensor.tetto_vs_ovest_panel_a3_power
        - sensor.tetto_vs_ovest_panel_a4_power
        - sensor.tetto_vs_ovest_panel_a5_power
        - sensor.tetto_vs_mare_panel_a6_power
        - sensor.tetto_vs_mare_panel_a7_power
        - sensor.tetto_vs_mare_panel_a8_power
        - sensor.tetto_vs_mare_panel_a9_power
        - sensor.tetto_vs_mare_panel_a10_power
        - sensor.sopra_pergola_panel_b1_power
        - sensor.sopra_pergola_panel_b2_power
        - sensor.sopra_pergola_panel_b3_power
        - sensor.sopra_pergola_panel_b4_power
        - sensor.sopra_pergola_panel_b5_power
        - sensor.sopra_tenda_giardino_panel_b6_power
        - sensor.sopra_tenda_giardino_panel_b7_power
        - sensor.sopra_tenda_giardino_panel_b8_power
        - sensor.sopra_tenda_giardino_panel_b9_power
        - sensor.sopra_pergola_panel_b10_power
        - sensor.sopra_tenda_giardino_panel_b11_power
      to: "0"
      for: "01:00:00"
  condition:
    - condition: state
      entity_id: sun.sun
      state: "above_horizon"
    - condition: template
      value_template: "{{ states(trigger.entity_id) | float(0) == 0 }}"
  action:
    - action: notify.mobile_app_cph2653
      data:
        title: "⚠️ Pannello a 0 da 1h"
        message: >-
          Pannello {{ trigger.entity_id.split('panel_')[1].split('_')[0] | upper }} = 0 W da almeno 1 ora.
        data:
          clickAction: "/casa-ginepro/home"
          priority: high
          ttl: 0
          persistent: "true"

#==================================================================================
# CALCOLO TABELLA MENSILE FV – Avvio HA + ogni ora
#==================================================================================
- id: calcola_pv_tabella_mensile
  alias: "PV – Calcola tabella mensile"
  mode: single
  triggers:
    - platform: homeassistant
      event: start
    - platform: time_pattern
      hours: "/1"
  action:
    - action: shell_command.calcola_pv_tabella
    # Il command_line sensor ha scan_interval 3600: senza questo forzamento
    # il JSON appena riscritto resterebbe invisibile fino alla lettura
    # successiva, con le tabelle ferme ai valori precedenti (v124).
    - action: homeassistant.update_entity
      data:
        entity_id: sensor.pv_tabella_mensile

#==================================================================================
# F3. CONDENSATORE STACCATO
#
# Quando il BMS del modulo UFSC48-7.6 apre l'uscita (LED ALM acceso), l'inverter
# misura i propri morsetti a vuoto: la tensione salta di alcuni volt in pochi
# secondi mentre la potenza resta a zero. Un modulo collegato non puo' farlo:
# fermando la corrente la tensione cambia al massimo di circa 0,8 V
# (8 mOhm x 100 A).
#
# Regola: salto di almeno 2 V fra due letture consecutive (entro 30 s) e,
# 10 secondi dopo, potenza del condensatore sotto 50 W in valore assoluto.
# I 10 secondi servono perche' tensione e potenza arrivano in letture separate:
# l'8/10 alle 15:49:20 la tensione e' crollata con la potenza ancora a 1086 W,
# arrivata a 0 W subito dopo.
#
# Verifica sui dati 02-09/10/2026 (stati a 5 s): la regola scatta solo nei due
# giorni di blocco, la prima volta l'8/10 alle 15:49:20, all'inizio esatto del
# blocco. Nessun falso allarme negli altri giorni; a fine scarica mattutina la
# tensione risale al massimo di 1,13 V in 2 minuti, non in un'unica lettura.
#==================================================================================
- id: fotovoltaico_condensatore_staccato
  alias: "Fotovoltaico - Condensatore staccato"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: sensor.inverter_uflex_battery_voltage
      to: ~
  conditions:
    - condition: state
      entity_id: input_boolean.condensatore_staccato
      state: "off"
    - condition: template
      value_template: >-
        {%- set a = trigger.from_state.state | float(none) if trigger.from_state else none -%}
        {%- set b = trigger.to_state.state | float(none) if trigger.to_state else none -%}
        {{ a is not none and b is not none and (b - a) | abs >= 2
           and (trigger.to_state.last_updated - trigger.from_state.last_updated).total_seconds() <= 30 }}
  actions:
    - variables:
        v_da: "{{ trigger.from_state.state }}"
        v_a: "{{ trigger.to_state.state }}"
    - delay: "00:00:10"
    - condition: template
      value_template: >-
        {{ states('sensor.inverter_uflex_battery_power') | float(9999) | abs < 50 }}
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.condensatore_staccato
    - action: notify.mobile_app_cph2653
      continue_on_error: true
      data:
        title: "🔌 Condensatore staccato"
        message: >
          Alle {{ now().strftime('%H:%M:%S') }} la tensione del condensatore e'
          passata da {{ v_da }} a {{ v_a }} V con potenza
          {{ states('sensor.inverter_uflex_battery_power') }} W: il modulo
          UFSC48-7.6 non scambia piu' energia. Controlla il LED ALM sul modulo;
          se e' acceso, spegni e riaccendi il modulo.
          FV {{ states('sensor.inverter_uflex_pv_power') }} W, casa
          {{ states('sensor.inverter_uflex_load_power') }} W.
        data:
          tag: condensatore_staccato
          priority: high
          ttl: 0
          persistent: "true"
          channel: alarm_stream
    - action: persistent_notification.create
      continue_on_error: true
      data:
        title: "🔌 Condensatore staccato"
        notification_id: condensatore_staccato
        message: >
          {{ now().strftime('%d/%m/%Y %H:%M:%S') }}: tensione da {{ v_da }} a
          {{ v_a }} V con potenza zero. Modulo UFSC48-7.6 probabilmente in blocco
          (LED ALM). Ripristino: spegnere e riaccendere il modulo.

#==================================================================================
# F4. CONDENSATORE RICOLLEGATO
#
# Il modulo e' di nuovo in circuito quando scorre corrente: potenza oltre 300 W
# in valore assoluto per 2 minuti. Durante i blocchi dell'8-9/10 la potenza
# letta e' rimasta fra -6 e +16 W.
#==================================================================================
- id: fotovoltaico_condensatore_ricollegato
  alias: "Fotovoltaico - Condensatore ricollegato"
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: template
      value_template: >-
        {{ states('sensor.inverter_uflex_battery_power') | float(0) | abs > 300 }}
      for: "00:02:00"
  conditions:
    - condition: state
      entity_id: input_boolean.condensatore_staccato
      state: "on"
  actions:
    - variables:
        dal: "{{ states.input_boolean.condensatore_staccato.last_changed }}"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.condensatore_staccato
    - action: persistent_notification.dismiss
      continue_on_error: true
      data:
        notification_id: condensatore_staccato
    - action: notify.mobile_app_cph2653
      continue_on_error: true
      data:
        title: "🔋 Condensatore ricollegato"
        message: >
          Il condensatore scambia di nuovo energia
          ({{ states('sensor.inverter_uflex_battery_power') }} W a
          {{ states('sensor.inverter_uflex_battery_voltage') }} V).
          Era staccato dalle {{ as_local(as_datetime(dal)).strftime('%d/%m %H:%M') }}
          ({{ ((now() - as_datetime(dal)).total_seconds() / 3600) | round(1) }} ore).
        data:
          tag: condensatore_staccato
          priority: normal
          ttl: 0
