# config_fotovoltaico_14.yaml
# v14 (09/10/2026): aggiunto Condensatore Corrente Scarica Max Oggi, massimo
#   giornaliero della corrente di scarica con ora, tensione e carica massima.
# v13 (09/10/2026): input_boolean Condensatore Staccato (gestito da
#   automations_fotovoltaico) e sensore Condensatore Tensione Collegato, che vale
#   la tensione solo a modulo collegato. Tensione Max Oggi, Ultimi Picchi,
#   Superamenti Oggi ed Energia al Pieno usano ora questo sensore: le letture a
#   morsetti aperti durante un blocco del modulo non vengono piu' contate.
# v12 (09/10/2026): anche Condensatore Energia al Pieno azzerato alle 23:59:59,
#   stesso motivo della v11 (grafico statistico giornaliero max).
# v11 (09/10/2026): Condensatore Superamenti Oggi azzerato alle 23:59:59 invece
#   che alle 00:00:00, per non far comparire il conteggio anche il giorno dopo
#   nel grafico statistico giornaliero (max).
# v10 (08/10/2026): aggiunto Condensatore Energia al Pieno, energia netta
#   entrata nel condensatore dal minimo del mattino al momento in cui
#   l'inverter smette di caricarlo e manda il surplus in rete.
# v9 (30/09/2026): aggiunti FV CO2 evitata e FV Alberi equivalenti (coefficienti Solarman).
# v8 (30/09/2026): aggiunto shell_command calcola_pv_tabella, spostato da config_sistema.
# Package Casa Ginepro - Fotovoltaico: inverter UFLEX, pannelli Tigo, surplus, GSE
# Estratto da configuration_186.yaml. Nome file = nome del package.

