            {% set v = states(e) | float(0) %}
            {% if v > ns.best_val %}
              {% set ns.best_val = v %}
              {% set ns.best_id = e %}
            {% endif %}
          {% endfor %}
          {% if ns.best_id == '' %}
            unknown
          {% else %}
            {{ ns.best_id.split('panel_')[1].split('_')[0] | upper }} = {{ ns.best_val | round(1) }} W
