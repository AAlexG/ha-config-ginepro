  # --- LEAK DETECTOR: batteria binaria (0=OK, 1=Bassa) ---
  - binary_sensor:
      - name: "PV Surplus"
        unique_id: "pv_surplus"
        device_class: power
        icon: mdi:solar-power-variant
        delay_on: "00:02:00"
        delay_off: "00:05:00"
        availability: >-
          {{ has_value('sensor.inverter_uflex_external_ct1_power')
             and states('input_number.pv_surplus_soglia') | float(0) > 0 }}
        state: >-
          {{ states('sensor.inverter_uflex_external_ct1_power') | float(0)
             < -(states('input_number.pv_surplus_soglia') | float(0)) }}

  #--------------------------------------------------------------------------
  # TENSIONE CONDENSATORE A MODULO COLLEGATO (v13)
  #
  # Quando il BMS del modulo UFSC48-7.6 apre l'uscita (blocchi del 18/08,
  # 25/08, 08/10/2026) l'inverter misura i propri morsetti a vuoto: tensioni
  # che saltano fra 44 e 60 V in pochi secondi con potenza zero, e SoC che
  # salta fra 0 e 100%. Questi valori finivano nei superamenti, nella tensione
  # massima e nell'energia al pieno.
  # Questo sensore riporta la tensione solo se input_boolean.condensatore_staccato
  # e' spento; durante un blocco e' non disponibile. Il rilevamento del blocco
  # e' in automations_fotovoltaico (F3/F4).
  #--------------------------------------------------------------------------
  - sensor:
      - name: "Condensatore Tensione Collegato"
        unique_id: condensatore_tensione_collegato
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:battery-check
        availability: >-
          {{ is_state('input_boolean.condensatore_staccato', 'off')
             and has_value('sensor.inverter_uflex_battery_voltage') }}
        state: "{{ states('sensor.inverter_uflex_battery_voltage') }}"

  #--------------------------------------------------------------------------
  # SORVEGLIANZA SOVRATENSIONE CONDENSATORE UFSC48-7,6
  #
  # Il datasheet UFLEX indica 58 V di tensione di carica massima e 57 V di
  # float consigliato. Il 19/08/2026 alle 13:37 l'inverter ha registrato
  # F55 DC_VoltHigh_Fault e alle 14:12 F56 DC_VoltLow_Fault: il BMS del
  # condensatore ha aperto e il pacco e' rimasto fuori servizio fino al
  # riavvio manuale del 22/08. Nelle due settimane precedenti la tensione
  # massima giornaliera era salita da 58,3 a 60,1 V.
  #
  # Gli episodi oltre soglia durano da 0 a 25 secondi: un "for" nei trigger
  # li perderebbe tutti. Questo sensore trattiene il massimo giornaliero e
  # conta i superamenti di 58,7 V, cosi' l'automazione di riepilogo serale
  # puo' segnalare la deriva senza inviare una notifica per ogni picco.
  #--------------------------------------------------------------------------
  - trigger:
      - platform: state
        entity_id: sensor.condensatore_tensione_collegato
        id: misura
      - platform: time
        at: "00:00:00"
        id: azzera
    sensor:
      - name: "Condensatore Tensione Max Oggi"
        unique_id: condensatore_tensione_max_oggi
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        icon: mdi:flash-alert
        state: >-
          {% if trigger.id == 'azzera' %}
            0
          {% else %}
            {% set v = states('sensor.condensatore_tensione_collegato') | float(0) %}
            {{ [v, this.state | float(0)] | max | round(2) }}
          {% endif %}

  #--------------------------------------------------------------------------
  # CORRENTE MASSIMA GIORNALIERA DEL CONDENSATORE (v14)
  #
  # Datasheet UFSC48-7.6: corrente massima continua 100 A in carica e in
  # scarica. L'8/10/2026 alle 15:46-15:47 il modulo ha erogato 100,0 A per
  # circa un minuto (limite di scarica dell'inverter allora a 100 A) ed e'
  # andato in blocco alle 15:49. Dal 9/10 il limite di scarica e' 90 A, quello
  # di carica 80 A: questo sensore permette di verificare ogni giorno che
  # vengano rispettati.
  #
  # Stato = massima corrente di SCARICA del giorno (A, positiva).
  # Segno di sensor.inverter_uflex_battery_current verificato il 9/10:
  # -79,96 A durante la carica al limite di 80 A, quindi positivo = scarica.
  # Attributi: ora e tensione del massimo, massima corrente di carica (A,
  # positiva) con la sua ora.
  # Azzeramento alle 23:59:59, come gli altri contatori giornalieri, per non
  # trascinare il valore nel giorno dopo nelle statistiche giornaliere.
  # Durante un blocco del modulo la corrente letta e' circa 0 A: non altera
  # il massimo.
  #--------------------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: sensor.inverter_uflex_battery_current
        id: misura
      - trigger: time
        at: "23:59:59"
        id: azzera
    sensor:
      - name: "Condensatore Corrente Scarica Max Oggi"
        unique_id: condensatore_corrente_scarica_max_oggi
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        icon: mdi:current-dc
        state: >-
          {%- set i = states('sensor.inverter_uflex_battery_current') | float(0) -%}
          {%- if trigger.id == 'azzera' -%}0
          {%- else -%}{{ [i, this.state | float(0)] | max | round(1) }}{%- endif -%}
        attributes:
          ora: >-
            {%- set i = states('sensor.inverter_uflex_battery_current') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif i > this.state | float(0) -%}{{ now().strftime('%H:%M:%S') }}
            {%- else -%}{{ this.attributes.get('ora') }}{%- endif -%}
          tensione: >-
            {%- set i = states('sensor.inverter_uflex_battery_current') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif i > this.state | float(0) -%}{{ states('sensor.inverter_uflex_battery_voltage') | float(0) }}
            {%- else -%}{{ this.attributes.get('tensione') }}{%- endif -%}
          carica_max: >-
            {%- set i = states('sensor.inverter_uflex_battery_current') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}0
            {%- else -%}{{ [-i, this.attributes.get('carica_max', 0) | float(0)] | max | round(1) }}{%- endif -%}
          carica_ora: >-
            {%- set i = states('sensor.inverter_uflex_battery_current') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif -i > this.attributes.get('carica_max', 0) | float(0) -%}{{ now().strftime('%H:%M:%S') }}
            {%- else -%}{{ this.attributes.get('carica_ora') }}{%- endif -%}

  #--------------------------------------------------------------------------
  # FOTOGRAFIA DEL SISTEMA AL MOMENTO DEL PICCO DI TENSIONE
  #
  # Analisi 22/08/2026: gli episodi oltre 58,7 V avvengono con potenza di
  # batteria quasi nulla (pochi watt), quindi senza carica in corso. Solo il
  # 19/08, giorno del fault F55, si sono registrati fino a -3394 W. Restano
  # aperte due ipotesi opposte: errore di misura della tensione DC da parte
  # dell'inverter, oppure sovratensione reale di origine ignota.
  #
  # Gli episodi durano da 0 a 25 secondi, non verificabili con un multimetro
  # a mano. Questo sensore registra lo stato di tutto l'impianto nell'istante
  # in cui la tensione attraversa la soglia, conservando gli ultimi 30 eventi.
  # Se i picchi risultano correlati a un evento preciso (distacco di un carico,
  # variazione brusca del fotovoltaico, cambio di stato dell'inverter) si ha
  # una causa; se sono scorrelati, l'ipotesi dell'errore di misura si rafforza.
  #
  # Nota: la fotografia e' scattata all'attraversamento della soglia, che puo'
  # precedere di qualche secondo il valore di picco effettivo.
  #--------------------------------------------------------------------------
  - trigger:
      - platform: numeric_state
        entity_id: sensor.condensatore_tensione_collegato
        above: 58.7
    sensor:
      - name: "Condensatore Ultimi Picchi"
        unique_id: condensatore_ultimi_picchi
        icon: mdi:camera-burst
        state: "{{ now().strftime('%d/%m %H:%M:%S') }}"
        attributes:
          picchi: >-
            {% set nuovo = {
                 'ora': now().strftime('%d/%m %H:%M:%S'),
                 'v': states('sensor.condensatore_tensione_collegato') | float(0),
                 'w_batt': states('sensor.inverter_uflex_battery_power') | float(0),
                 'w_pv': states('sensor.inverter_uflex_pv_power') | float(0),
                 'w_carico': states('sensor.inverter_uflex_load_power') | float(0),
                 'w_rete': states('sensor.inverter_uflex_grid_power') | float(0),
                 't_batt': states('sensor.inverter_uflex_battery_temperature') | float(0),
                 't_inv': states('sensor.inverter_uflex_temperature') | float(0),
                 'stato': states('sensor.inverter_uflex_device_state')
               } %}
            {{ ([nuovo] + (this.attributes.get('picchi', []) | list))[:30] }}

  #--------------------------------------------------------------------------
  # CONTEGGIO GIORNALIERO DEI SUPERAMENTI DI SOGLIA
  #
  # Il numero di superamenti al giorno e' l'indicatore piu' chiaro dello stato
  # di salute del sistema: nei giorni normali resta su 3-4, sale a 14 il 18/08,
  # a 65 il 19/08 giorno del primo blocco, a 46 il 25/08 giorno del secondo.
  #
  # A differenza dell'attributo "episodi" del sensore Condensatore Tensione Max
  # Oggi, che vive come attributo e non viene storicizzato, questo e' un sensore
  # vero e proprio con state_class measurement: il recorder ne conserva le
  # statistiche a lungo termine e il valore massimo giornaliero corrisponde al
  # conteggio di fine giornata, utilizzabile per un grafico su 30 giorni.
  #
  # La soglia non e' scritta qui: viene letta dall'entita'
  # number.inverter_uflex_battery_absorption, cioe' dal parametro Absorption
  # effettivamente impostato sull'inverter. Questo contatore e' l'unico del
  # sistema: alimenta sia il grafico dei 30 giorni sia la notifica serale.
  #
  # Perche' Absorption e non Float: il Float e' il livello a cui l'inverter
  # deve stazionare a fine carica, quindi la tensione vi oscilla attorno per
  # ore e ogni oscillazione verrebbe contata come un episodio. Il 29/08, con
  # Float a 57,0 V e un plateau pomeridiano fra 57,0 e 57,7 V, il contatore
  # ha registrato 59 attraversamenti in una giornata del tutto regolare.
  # L'Absorption e' invece il limite superiore di carica, coincidente con i
  # 58 V di tensione massima del datasheet: al di sopra c'e' effettivamente
  # un'anomalia da segnalare.
  #--------------------------------------------------------------------------
  - trigger:
      - platform: numeric_state
        entity_id: sensor.condensatore_tensione_collegato
        above: number.inverter_uflex_battery_absorption
        id: superamento
      # Azzeramento alle 23:59:59 e non a mezzanotte: le statistiche orarie
      # includono il valore in vigore all'inizio dell'ora, quindi un azzeramento
      # alle 00:00:00 faceva entrare il conteggio del giorno prima nel massimo
      # dell'ora 00-01 del giorno dopo, raddoppiando le colonne nel grafico.
      - platform: time
        at: "23:59:59"
        id: azzera
    sensor:
      - name: "Condensatore Superamenti Oggi"
        unique_id: condensatore_superamenti_oggi
        state_class: measurement
        icon: mdi:counter
        state: >-
          {% if trigger.id == 'azzera' %}
            0
          {% else %}
            {{ this.state | int(0) + 1 }}
          {% endif %}
        attributes:
          # Soglia effettiva, letta in tempo reale dall'inverter: se il
          # parametro Float viene corretto, conteggio e grafico si adeguano
          # da soli senza alcuna modifica alla configurazione.
          soglia: >-
            {{ states('number.inverter_uflex_battery_absorption') }}

  #--------------------------------------------------------------------------
  # ENERGIA ACCUMULATA AL PIENO (v10)
  #
  # Misura giornaliera della capacita' utile reale del condensatore: energia
  # NETTA entrata dal minimo di tensione del mattino fino al momento in cui
  # l'inverter considera il condensatore pieno.
  #
  # "Pieno" = per 5 minuti il condensatore assorbe meno di 300 W MENTRE si
  # immettono in rete piu' di 300 W. Non basta l'inizio dell'immissione: con
  # surplus superiore al limite di carica (80 A x tensione, 3,5-4,6 kW) si
  # immette anche a condensatore ancora in carica.
  # Segni verificati sui dati 01-08/10/2026: battery_power NEGATIVO = carica;
  # external_ct1_power NEGATIVO = immissione.
  #
  # Energia netta = (carica - scarica) fra il minimo e il pieno, dai contatori
  # giornalieri dell'inverter (risoluzione 0,1 kWh). Se la tensione scende
  # sotto il minimo gia' registrato prima del pieno (mattino nuvoloso), la
  # base riparte da li'. Dopo il pieno il valore resta fermo fino alle 23:59:59.
  # Nei giorni senza pieno il valore e' l'energia accumulata fino a sera e
  # l'attributo ora_pieno resta vuoto: nel grafico appaiono come colonne basse,
  # da leggere insieme alla tensione massima del giorno.
  #
  # Riferimento misurato a posteriori: 01-08/10/2026 fra 5,04 e 5,84 kWh,
  # contro 7,6 kWh di targa.
  #--------------------------------------------------------------------------
  - triggers:
      # Azzeramento alle 23:59:59 e non a mezzanotte: vedere il commento sul
      # contatore Condensatore Superamenti Oggi (statistiche orarie che partono
      # dal valore in vigore all'inizio dell'ora).
      - trigger: time
        at: "23:59:59"
        id: azzera
      - trigger: state
        entity_id:
          - sensor.condensatore_tensione_collegato
          - sensor.inverter_uflex_today_battery_charge
          - sensor.inverter_uflex_today_battery_discharge
        id: misura
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.condensatore_staccato', 'off')
             and states('sensor.inverter_uflex_battery_power') | float(-9999) > -300
             and states('sensor.inverter_uflex_external_ct1_power') | float(0) < -300 }}
        for: "00:05:00"
        id: pieno
    sensor:
      - name: "Condensatore Energia al Pieno"
        unique_id: condensatore_energia_al_pieno
        unit_of_measurement: "kWh"
        state_class: measurement
        icon: mdi:battery-arrow-up
        state: >-
          {%- set a = this.attributes -%}
          {%- set v = states('sensor.condensatore_tensione_collegato') | float(0) -%}
          {%- set c = states('sensor.inverter_uflex_today_battery_charge') | float(0) -%}
          {%- set d = states('sensor.inverter_uflex_today_battery_discharge') | float(0) -%}
          {%- if trigger.id == 'azzera' -%}
            0
          {%- elif a.get('ora_pieno') -%}
            {{ this.state }}
          {%- elif a.get('v_min') is none or (v > 0 and v < a.get('v_min') | float(999)) -%}
            0
          {%- else -%}
            {{ [(c - a.get('c0') | float(c)) - (d - a.get('d0') | float(d)), 0] | max | round(2) }}
          {%- endif -%}
        attributes:
          # Minimo di tensione del giorno prima del pieno e contatori in quel momento.
          v_min: >-
            {%- set a = this.attributes -%}
            {%- set v = states('sensor.condensatore_tensione_collegato') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif not a.get('ora_pieno') and v > 0 and v < a.get('v_min') | float(999) -%}{{ v }}
            {%- else -%}{{ a.get('v_min') }}{%- endif -%}
          ora_min: >-
            {%- set a = this.attributes -%}
            {%- set v = states('sensor.condensatore_tensione_collegato') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif not a.get('ora_pieno') and v > 0 and v < a.get('v_min') | float(999) -%}{{ now().strftime('%H:%M') }}
            {%- else -%}{{ a.get('ora_min') }}{%- endif -%}
          c0: >-
            {%- set a = this.attributes -%}
            {%- set v = states('sensor.condensatore_tensione_collegato') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif not a.get('ora_pieno') and v > 0 and v < a.get('v_min') | float(999) -%}{{ states('sensor.inverter_uflex_today_battery_charge') | float(0) }}
            {%- else -%}{{ a.get('c0') }}{%- endif -%}
          d0: >-
            {%- set a = this.attributes -%}
            {%- set v = states('sensor.condensatore_tensione_collegato') | float(0) -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif not a.get('ora_pieno') and v > 0 and v < a.get('v_min') | float(999) -%}{{ states('sensor.inverter_uflex_today_battery_discharge') | float(0) }}
            {%- else -%}{{ a.get('d0') }}{%- endif -%}
          # Istante del pieno: solo il primo della giornata.
          ora_pieno: >-
            {%- set a = this.attributes -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif trigger.id == 'pieno' and not a.get('ora_pieno') and a.get('v_min') is not none -%}{{ now().strftime('%H:%M') }}
            {%- else -%}{{ a.get('ora_pieno') }}{%- endif -%}
          v_pieno: >-
            {%- set a = this.attributes -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif trigger.id == 'pieno' and not a.get('ora_pieno') and a.get('v_min') is not none -%}{{ states('sensor.condensatore_tensione_collegato') | float(0) }}
            {%- else -%}{{ a.get('v_pieno') }}{%- endif -%}
          soc_pieno: >-
            {%- set a = this.attributes -%}
            {%- if trigger.id == 'azzera' -%}{{ none }}
            {%- elif trigger.id == 'pieno' and not a.get('ora_pieno') and a.get('v_min') is not none -%}{{ states('sensor.inverter_uflex_battery') | float(0) }}
            {%- else -%}{{ a.get('soc_pieno') }}{%- endif -%}

input_boolean:
  # Acceso dall'automazione F3 quando il modulo UFSC48-7.6 si stacca (salto di
  # tensione di almeno 2 V seguito da potenza zero), spento da F4 quando torna a
  # scorrere corrente. Senza initial: lo stato sopravvive ai riavvii. Si puo'
  # spegnere a mano in caso di falso allarme.
  condensatore_staccato:
    name: "Condensatore Staccato"
    icon: mdi:battery-off

command_line:

  - sensor:
      name: PV Tabella Mensile
      unique_id: pv_tabella_mensile
      command: "cat /config/pv_tabella_mensile.json 2>/dev/null"
      scan_interval: 3600
      value_template: "{{ value_json.mesi | length }}"
      json_attributes:
        - mesi

  # ============================================================
  # GIORNI SENZA SOLE (nuovo in config_fotovoltaico_7)
  # Conteggio mensile dei giorni in cui il sole non si e' visto
  # nemmeno per un istante. Il dato viene dall'irraggiamento della
  # stazione meteo, non dalla produzione FV: la produzione dipende
  # anche da guasti, batteria e ombreggiamenti, l'irraggiamento no.
  # Criterio e motivazioni: vedere i commenti nello script.
  # Lo stato e' il numero di mesi presenti; i dati stanno
  # nell'attributo "mesi", come per PV Tabella Mensile.
  # ============================================================
  - sensor:
      name: PV Giorni Senza Sole
      unique_id: pv_giorni_senza_sole
      command: "python3 /config/pv_giorni_senza_sole.py"
      scan_interval: 3600
      command_timeout: 120
      value_template: "{{ value_json.mesi | length }}"
      json_attributes:
        - mesi

input_number:

  # NUOVO (configuration_161): soglia di immissione in rete oltre la
  # quale si considera surplus FV disponibile per la PdC.
  pv_surplus_soglia:
    name: "FV – Soglia surplus"
    min: 0
    max: 6000
    step: 50
    unit_of_measurement: "W"
    mode: box
    icon: mdi:solar-power

  # NUOVO (configuration_161): prezzo €/kWh pagato dal GSE (stima
  # manuale dal grafico "Prezzo GSE €/kWh" in plancia Consumi).
  # Con surplus FV, usare la PdC costa solo il mancato incasso GSE.
  gse_prezzo_kwh_stima:
    name: "GSE – Prezzo €/kWh stimato"
    min: 0
    max: 1
    step: 0.001
    unit_of_measurement: "€/kWh"
    mode: box
    icon: mdi:currency-eur

  # Importo mensile pagato dal GSE per l'energia ceduta alla rete.
  # Da inserire manualmente quando arriva il bonifico GSE.
  # Storicizzato da salva_bolletta.py, che ricalcola anche il prezzo
  # €/kWh GSE per ogni mese (statistiche sensor.gse_prezzo_kwh).
  bolletta_gse_euro:
    name: "GSE – Pagato mese (€)"
    min: 0
    max: 9999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:solar-power-variant

  # ============================================================
  # FOTOVOLTAICO – risparmio storico (aggiornati da totali_consumi.py)
  # ============================================================
  pv_risparmio_euro:
    name: "FV – Risparmio autoconsumo (€)"
    min: 0
    max: 99999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:solar-power

  pv_gse_euro:
    name: "FV – Pagamenti GSE (€)"
    min: 0
    max: 99999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:cash-multiple

  pv_totale_euro:
    name: "FV – Risparmio totale (€)"
    min: 0
    max: 99999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:piggy-bank

  pv_recupero_pct:
    name: "FV – Recupero investimento (%)"
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: "%"
    mode: box
    icon: mdi:percent

utility_meter:

  rete_export_mese:
    name: A Rete Mese
    unique_id: rete_export_mese
    source: sensor.inverter_uflex_total_energy_export
    cycle: monthly

  produzione_mese:
    name: Produzione Mese
    unique_id: produzione_mese
    source: sensor.inverter_uflex_total_production
    cycle: monthly

  produzione_anno:
    name: Produzione Anno
    source: sensor.inverter_uflex_total_production
    cycle: yearly

shell_command:
  # Genera /config/pv_tabella_mensile.json (automazione calcola_pv_tabella_mensile).
  calcola_pv_tabella: "python3 /config/pv_tabella_mensile.py > /config/pv_tabella_mensile.json 2>/config/pv_tabella_mensile.log"
