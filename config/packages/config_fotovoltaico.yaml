          {% set entities = ['sensor.tetto_vs_ovest_panel_a1_power', 'sensor.tetto_vs_ovest_panel_a2_power', 'sensor.tetto_vs_ovest_panel_a3_power', 'sensor.tetto_vs_ovest_panel_a4_power', 'sensor.tetto_vs_ovest_panel_a5_power', 'sensor.tetto_vs_mare_panel_a6_power', 'sensor.tetto_vs_mare_panel_a7_power', 'sensor.tetto_vs_mare_panel_a8_power', 'sensor.tetto_vs_mare_panel_a9_power', 'sensor.tetto_vs_mare_panel_a10_power', 'sensor.sopra_pergola_panel_b1_power', 'sensor.sopra_pergola_panel_b2_power', 'sensor.sopra_pergola_panel_b3_power', 'sensor.sopra_pergola_panel_b4_power', 'sensor.sopra_pergola_panel_b5_power', 'sensor.sopra_tenda_giardino_panel_b6_power', 'sensor.sopra_tenda_giardino_panel_b7_power', 'sensor.sopra_tenda_giardino_panel_b8_power', 'sensor.sopra_tenda_giardino_panel_b9_power', 'sensor.sopra_pergola_panel_b10_power', 'sensor.sopra_tenda_giardino_panel_b11_power'] %}
