      # --- BENEFICI AMBIENTALI (come app Solarman) ---
      # Coefficienti ricavati dai valori Solarman del 30/09/2026:
      # 9709,9 kWh -> 7,69 t CO2 e 529 alberi.
      # 7,69 / 9709,9 = 0,000792 t/kWh ; 529 / 9709,9 = 0,05448 alberi/kWh
      - name: "FV CO2 evitata"
        unique_id: "fv_co2_evitata"
        icon: mdi:molecule-co2
        unit_of_measurement: "t"
        availability: "{{ has_value('sensor.inverter_uflex_total_production') }}"
        state: >-
          {{ (states('sensor.inverter_uflex_total_production') | float(0) * 0.000792) | round(2) }}

      - name: "FV Alberi equivalenti"
        unique_id: "fv_alberi_equivalenti"
