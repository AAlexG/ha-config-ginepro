# config_gas_3.yaml
# v3 (24/10/2026): prezzo gas a consumo che segue il mercato.
#   sensor.gas_prezzo_smc_variabile = prezzo dell'ultima bolletta Plenitude
#   + variazione del Corrispettivo Gas Index stimata dal PSV mensile ARERA
#   (Gas Index x (PSV ultimo / PSV del mese della bolletta - 1)), IVA 22%.
#   Verificato sulle bollette: Gas Index Plenitude / PSV ARERA = 1,0288 a
#   giugno e a luglio 2026. Il PSV del mese in corso si conosce solo a mese
#   finito: nel mese si usa l'ultimo pubblicato.
#   automations_gas copia il sensore in input_number.gas_prezzo_mc (come la
#   luce); i quattro valori di partenza li scrive script.prezzi_mensili_aggiorna
#   da prezzi_mensili.py (ARERA + bollette in SORGENTI/BOLLETTE), che crea
#   anche le statistiche mensili prezzi:pun_mese e prezzi:psv_mese.
# v2 (23/10/2026): gas_prezzo_mc e gas_quota_fissa_mese aggiornati in
#   automatico dall'importazione delle bollette PDF (installa.py +
#   bollette.py). Solo commenti.
# Package Casa Ginepro - Gas: consumi, costi e bolletta
# Estratto da configuration_186.yaml. Nome file = nome del package.

template:
  - sensor:
      # ============================================================
      # SENSORI MENSILI – acc_corrente - inizio_mese
      # Robusti ai riavvii: input_number persiste, calcolo immediato
      # ============================================================
      - name: "Gas Mese MC"
        unique_id: "gas_mese_mc"
        # configuration_170: nei grafici mensili (stat_types: max) la prima ora
        # del mese ereditava il valore finale del mese precedente, perche'
        # l'azzeramento (utility_meter a 00:00:00, reset_inizio_mese a 00:00:30)
        # cade DENTRO la fascia oraria 00:00-01:00 del giorno 1. Risultato: ogni
        # mese mostrava il maggiore fra il proprio totale e quello del mese prima
        # (invisibile finche' i consumi crescevano, evidente a luglio 2026).
        # Forzando 0 nella prima ora del mese il picco spurio sparisce: il massimo
        # mensile si raggiunge comunque a fine mese, quindi il dato non ne risente.
        # Accumulatori e utility_meter NON sono toccati: cambia solo la vetrina.
        state: >-
          {% if now().day == 1 and now().hour == 0 %}
            0
          {% else %}
            {{ ([states('input_number.caldaia_gas_totale_acc') | float(0) -
                 states('input_number.gas_inizio_mese') | float(0), 0] | max) | round(4) }}
          {% endif %}
        unit_of_measurement: "m³"
        state_class: measurement
        icon: mdi:meter-gas
  - sensor:
      - name: "Gas Oggi MC"
        unique_id: "gas_oggi_mc"
        state: >-
          {{ states('sensor.gas_caldaia_giornaliero') | float(0) | round(4) }}
        unit_of_measurement: "m³"
        state_class: measurement
        icon: mdi:meter-gas


      # v3: prezzo a consumo che segue il PSV (vedi intestazione).
      - name: "Gas Prezzo Smc Variabile"
        unique_id: "gas_prezzo_smc_variabile"
        unit_of_measurement: "€/m³"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >-
          {{ states('input_number.gas_prezzo_mc_bolletta') | float(0) > 0
             and states('input_number.gas_indice_smc') | float(0) > 0
             and states('input_number.gas_psv_smc') | float(0) > 0
             and states('input_number.gas_psv_rif_smc') | float(0) > 0 }}
        state: >-
          {% set base = states('input_number.gas_prezzo_mc_bolletta') | float(0) %}
          {% set indice = states('input_number.gas_indice_smc') | float(0) %}
          {% set psv = states('input_number.gas_psv_smc') | float(0) %}
          {% set rif = states('input_number.gas_psv_rif_smc') | float(0) %}
          {{ (base + indice * (psv / rif - 1) * 1.22) | round(4) }}

      - name: "Gas Oggi Euro"
        unique_id: "gas_oggi_euro"
        state: >-
          {{ (states('sensor.gas_caldaia_giornaliero') | float(0) *
              states('input_number.gas_prezzo_mc') | float(0)) | round(2) }}
        unit_of_measurement: "€"
        state_class: measurement
        icon: mdi:currency-eur

      - name: "Gas Mese Euro"
        unique_id: "gas_mese_euro"
        # configuration_159: aggiunta quota fissa mensile (€/mese Eni,
        # indipendente dai giorni) per allineare il rilevato alla bolletta.
        state: >-
          {% if now().day == 1 and now().hour == 0 %}
            0
          {% else %}
            {{ (states('sensor.gas_caldaia_mensile') | float(0) *
                states('input_number.gas_prezzo_mc') | float(0) +
                states('input_number.gas_quota_fissa_mese') | float(0)) | round(2) }}
          {% endif %}
        unit_of_measurement: "€"
        state_class: measurement
        icon: mdi:currency-eur

input_number:

  # --- v3: prezzo gas da PSV (scritti da script.prezzi_mensili_aggiorna) ---
  gas_prezzo_mc_bolletta:
    name: "Gas – Prezzo a consumo ultima bolletta €/m³"
    min: 0
    max: 5
    step: 0.0001
    unit_of_measurement: "€/m³"
    mode: box
    icon: mdi:receipt-text-outline

  gas_indice_smc:
    name: "Gas – Gas Index ultima bolletta €/Smc"
    min: 0
    max: 5
    step: 0.00000001
    unit_of_measurement: "€/Smc"
    mode: box
    icon: mdi:chart-line

  gas_psv_smc:
    name: "Gas – PSV ARERA ultimo mese €/Smc"
    min: 0
    max: 5
    step: 0.000001
    unit_of_measurement: "€/Smc"
    mode: box
    icon: mdi:chart-line

  gas_psv_rif_smc:
    name: "Gas – PSV ARERA mese ultima bolletta €/Smc"
    min: 0
    max: 5
    step: 0.000001
    unit_of_measurement: "€/Smc"
    mode: box
    icon: mdi:chart-line

  # ============================================================
  # TOTALI STORICI – aggiornati dallo script totali_consumi.py
  # chiamato dall'automazione calcola_totali_consumi (avvio + ogni ora)
  # ============================================================
  gas_totale_rilevato_mc:
    name: "Gas Totale Rilevato (m³)"
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: "m³"
    mode: box
    icon: mdi:sigma

  gas_totale_bollette_mc:
    name: "Gas Totale Bollette (m³)"
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: "m³"
    mode: box
    icon: mdi:receipt-text-outline

  caldaia_gas_totale_acc:
    name: "Gas Caldaia Totale Accumulato"
    min: 0
    max: 999999
    step: 0.0001
    unit_of_measurement: "m³"
    mode: box
    icon: mdi:meter-gas

  # v3: scritto da automations_gas (gas_prezzo_aggiorna_da_psv) con il valore
  # di sensor.gas_prezzo_smc_variabile; la bolletta scrive gas_prezzo_mc_bolletta.
  # Prezzo marginale a consumo (Corrispettivo Gas Index + contributo +
  # rete + oneri + accisa + addizionale allo scaglione piu' alto raggiunto,
  # IVA 22% inclusa; C = 1, Smc = m³). Aggiornata in automatico dall'importazione delle bollette PDF
  # (installa.py + bollette.py, ultimo mese della bolletta piu' recente).
  # Nota: la bolletta arriva circa due mesi dopo il mese di riferimento.
  gas_prezzo_mc:
    name: "Gas – Prezzo a consumo €/m³"
    min: 0
    max: 5
    step: 0.0001
    unit_of_measurement: "€/m³"
    mode: box
    icon: mdi:currency-eur

  # Quota fissa mensile gas da bolletta (vendita − sconto + rete − oneri,
  # IVA 22% inclusa). Fatturata da Eni in €/mese, indipendente dai giorni.
  # Aggiornata in automatico dall'importazione delle bollette PDF
  # (installa.py + bollette.py, ultimo mese della bolletta piu' recente).
  gas_quota_fissa_mese:
    name: "Gas – Quota fissa €/mese"
    min: 0
    max: 99
    step: 0.01
    unit_of_measurement: "€/mese"
    mode: box
    icon: mdi:currency-eur

  # ============================================================
  # INIZIO MESE – valori accumulatori al 1° del mese
  # Aggiornati dall'automation reset_inizio_mese ogni 1° del mese
  # ============================================================
  gas_inizio_mese:
    name: "Gas – Acc inizio mese (m³)"
    min: 0
    max: 999999
    step: 0.0001
    mode: box
    icon: mdi:meter-gas

  # ============================================================
  # BOLLETTE: valori manuali da inserire a ogni nuova bolletta
  # Usati nei grafici mensili "bollette" (statistics-graph period:month stat_types:max).
  # Logica: si aggiorna il campo quando arriva la bolletta; il grafico
  # cattura il valore massimo del mese = il valore della bolletta.
  # ============================================================
  bolletta_gas_mc:
    name: "Gas – Bolletta mese (m³)"
    min: 0
    max: 9999
    step: 0.001
    unit_of_measurement: "m³"
    mode: box
    icon: mdi:meter-gas

  bolletta_gas_euro:
    name: "Gas – Bolletta mese (€)"
    min: 0
    max: 9999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:currency-eur

utility_meter:
  gas_caldaia_giornaliero:
    name: Gas Caldaia Giornaliero
    source: input_number.caldaia_gas_totale_acc
    cycle: daily

  gas_caldaia_mensile:
    name: Gas Caldaia Mensile
    source: input_number.caldaia_gas_totale_acc
    cycle: monthly

# --- v3: prezzi mensili (ARERA PSV, PUN) ---
shell_command:
  prezzi_mensili: "python3 /config/prezzi_mensili.py"

script:
  # Legge prezzi_mensili.py e scrive i quattro valori di partenza del prezzo
  # gas. Chiamato da automations_gas (ogni mattina e all'avvio) e da
  # installa_e_riavvia dopo l'importazione di bollette.
  prezzi_mensili_aggiorna:
    alias: "Prezzi mensili – aggiorna PSV e PUN"
    icon: mdi:chart-line
    mode: single
    max_exceeded: silent
    sequence:
      - action: shell_command.prezzi_mensili
        response_variable: r
      - variables:
          p: >-
            {%- if r.returncode == 0 -%}{{ r.stdout | from_json }}
            {%- else -%}{{ {'errori': [(r.stderr or r.stdout or 'nessun output')[-200:]]} }}
            {%- endif -%}
          valori:
            input_number.gas_prezzo_mc_bolletta: "{{ p.gas_prezzo_bolletta | default(0) }}"
            input_number.gas_indice_smc: "{{ p.gas_indice_bolletta | default(0) }}"
            input_number.gas_psv_smc: "{{ p.psv_smc | default(0) }}"
            input_number.gas_psv_rif_smc: "{{ p.psv_rif_smc | default(0) }}"
      - repeat:
          for_each: "{{ valori | dictsort | list }}"
          sequence:
            - if:
                - "{{ repeat.item[1] | float(0) > 0 }}"
              then:
                - action: input_number.set_value
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    value: "{{ repeat.item[1] | float(0) }}"
      - if:
          - "{{ p.errori | default([]) | count > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Prezzi mensili"
              notification_id: prezzi_mensili
              message: "{{ p.errori | join('; ') }}"
