  #--- WIFI: FONTE UNICA WHITELIST DISPOSITIVI ---
  - sensor:
      - name: "WiFi Dispositivi"
        unique_id: wifi_dispositivi
        icon: mdi:wifi
        state: "{{ (this.attributes.get('mac_nomi', {}) or {}) | length }}"
        attributes:
