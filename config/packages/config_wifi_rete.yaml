              '50:8a:06:5c:04:72': '069 luce sopra Tuya',
              'd8:eb:46:84:3d:bd': '070 Chromecast sotto',
              '18:69:d4:c5:59:a9': '071 S22 Ultra di Tania',
              '6c:3c:7c:c5:88:51': '072 Stampante Canon sopra',
              'd8:1f:12:93:61:65': '073 contattore sauna',
              'f8:6d:cc:3d:26:d4': '074 Fiat 500e',
              '48:9d:ff:04:a3:ed': '075 Oneplus 8 vecchio x Russia',
              '84:f3:eb:ef:13:5e': '076 Luce terrazza',
