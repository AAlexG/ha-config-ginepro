# config_wifi_rete_12.yaml
# Package Casa Ginepro - Rete WiFi: whitelist MAC e tabella dispositivi
# Nome file = nome del package.

#==================================================================================
# WHITELIST DISPOSITIVI WIFI - FONTE UNICA E UNICA LISTA DEL FILE
# Per aggiungere/togliere un dispositivo modificare SOLO la mappa mac_nomi qui
# sotto, poi Strumenti per sviluppatori -> YAML -> Ricarica entita' modello.
# Usata da: automations_presenza (whitelist notifiche) + plancia WiFi (tabella).
#
# CONVENZIONE DI NOMENCLATURA: le 3 cifre iniziali del nome sono l'ultimo
# ottetto dell'IP. Da li' si ricavano, senza altre liste:
#   IP di convenzione  ->  192.168.1.<ottetto>
#   entita' Ping       ->  binary_sensor.192_168_1_<ottetto>
# La mappa mac_ping della v11 e' stata eliminata: era derivabile al 100%.
# Se l'entita' Ping non esiste, states() torna 'unknown' e la fonte viene
# semplicemente ignorata.
#==================================================================================
