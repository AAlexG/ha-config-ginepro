              '94:b3:f7:dc:30:13': '182 camera box ReolinkE1Pro',
              'bc:fd:0c:dc:56:04': '183 camera portone Reolink Lumus',
              '68:39:43:85:23:02': '184 camera Tania ReolinkE1 Zoom',
              'ec:71:db:a5:f9:05': '186 camera sopra 8K Reolink',
              '2c:c3:e6:3b:9f:bb': '191 camera sopra gambe Ctronics',
              'd0:12:55:ee:e9:95': '192 camera barbecue',
              '5c:c3:36:4d:19:67': '193 camera cucina Reolink'
            } }}


  #--- WIFI: TABELLA DINAMICA PER PLANCIA (righe da tracker Netgear + Ping) ---
  # Sensore TRIGGER-BASED: il template usa integration_entities()/device_id()/
  # device_entities(), che NON registrano listener sui cambi di stato: senza
  # trigger resterebbe congelato alla prima valutazione.
  # Trigger (v12): il pulsante sulla plancia, un ricalcolo periodico ogni 2
  # minuti e l'avvio di HA. Sostituiscono l'elenco statico dei 29 binary_sensor
  # della v11, che era la seconda lista da mantenere a mano.
  - trigger:
      - platform: state
        entity_id: input_button.aggiorna_wifi_tabella
      - platform: time_pattern
        minutes: "/2"
      - platform: homeassistant
        event: start
    sensor:
      - name: "WiFi Tabella"
        unique_id: wifi_tabella
        icon: mdi:table-network
        state: >-
          {% set nomi = state_attr('sensor.wifi_dispositivi', 'mac_nomi') or {} %}
          {# Le chiavi della whitelist possono essere in maiuscolo: normalizzarle,   #}
          {# altrimenti il confronto con il MAC del tracker (minuscolo) fallisce.    #}
          {% set maclist = nomi.keys() | map('lower') | list %}
          {% set ns = namespace(n=0) %}
          {% for e in integration_entities('netgear') if e.startswith('device_tracker.')
             and states(e) == 'home' and (state_attr(e, 'mac') or '') | lower in maclist %}
          {% set ns.n = ns.n + 1 %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          aggiornato: "{{ now().strftime('%d/%m/%Y %H:%M:%S') }}"

          #--- RIGHE WHITELIST -------------------------------------------------
          # Ogni MAC della whitelist produce sempre una riga. Lo stato non e'
          # mai dedotto: viene dalla fonte piu' affidabile disponibile, in
          # quest'ordine (v12: prima Netgear, poi Ping).
          #   1. Netgear 'home'      -> il dispositivo e' associato all'Orbi.
          #   2. Netgear non 'home'  -> ma con attributo 'ip' valorizzato:
          #                             l'Orbi ha una voce attiva per quel MAC e
          #                             lo dichiara scollegato. 'Fuori' attendibile.
          #   3. Ping on/off         -> misura diretta sull'IP di convenzione.
          #                             Copre i dispositivi che l'Orbi non vede:
          #                             dietro RE650, sul Wi-Fi del NeXXt, cablati.
          #   4. Nessuna fonte       -> 'ignoto'. Rientra qui il tracker Netgear
          #      che dice 'not_home' e NON ha l'attributo 'ip' (l'Orbi conosce il
          #      MAC ma non ha alcuna voce attiva: non sa, non nega) quando per
          #      quell'IP non esiste nemmeno un'entita' Ping.
          # L'attributo 'fonte' di ogni riga dice da dove viene lo stato.
          righe: >-
            {% set nomi = state_attr('sensor.wifi_dispositivi', 'mac_nomi') or {} %}
            {% set ng = integration_entities('netgear') %}
            {% set pairs = namespace(l=[]) %}
            {% for e in ng if e.startswith('device_tracker.') %}
            {% set m = (state_attr(e, 'mac') or '') | lower %}
            {% if m %}{% set pairs.l = pairs.l + [(m, e)] %}{% endif %}
            {% endfor %}
            {% set tmap = dict(pairs.l) %}
            {% set righe = namespace(list=[]) %}
            {% for mac, nome in nomi.items() %}
            {% set e = tmap.get(mac | lower) %}
            {% set pref = nome[:3] %}
            {% set num = pref | int if pref.isdigit() else none %}
            {% set ip_conv = '192.168.1.' ~ num if num is not none else 'n/d' %}
            {% set ps = states('binary_sensor.192_168_1_' ~ num) if num is not none else 'unknown' %}
            {% set ng_ip = state_attr(e, 'ip') if e is not none else none %}
            {% set ip_ok = ng_ip not in [none, '', 'unknown', 'unavailable'] %}
            {% if e is not none and states(e) == 'home' %}
            {% set stato = 'in_casa' %}{% set fonte = 'netgear' %}
            {% elif e is not none and ip_ok %}
            {% set stato = 'fuori' %}{% set fonte = 'netgear' %}
            {% elif ps in ['on', 'off'] %}
            {% set stato = 'in_casa' if ps == 'on' else 'fuori' %}{% set fonte = 'ping' %}
            {% else %}
            {% set stato = 'ignoto' %}{% set fonte = 'nessuna' %}
            {% endif %}
            {% set ssid = namespace(v='n/d') %}
            {% set sig = namespace(v=none) %}
            {% set did = device_id(e) if e is not none else none %}
            {% if did %}
            {% for x in device_entities(did) if x in ng and x.startswith('sensor.') %}
            {% if x.endswith('_ssid') and states(x) not in ['unknown', 'unavailable'] %}
            {% set ssid.v = states(x) %}
            {% endif %}
            {% if ('segnale' in x or 'signal_strength' in x) and states(x) not in ['unknown', 'unavailable'] %}
            {% set sig.v = states(x) | float(none) %}
            {% endif %}
            {% endfor %}
            {% endif %}
            {% set righe.list = righe.list + [{'nome': nome, 'mac': mac | lower, 'ip': ng_ip if ip_ok else ip_conv, 'ssid': ssid.v, 'segnale': sig.v, 'stato': stato, 'fonte': fonte}] %}
            {% endfor %}
            {% set a = righe.list | selectattr('stato', 'eq', 'in_casa') | sort(attribute='nome') | list %}
            {% set b = righe.list | selectattr('stato', 'eq', 'ignoto') | sort(attribute='nome') | list %}
            {% set c = righe.list | selectattr('stato', 'eq', 'fuori') | sort(attribute='nome') | list %}
            {{ a + b + c }}

          #--- DISPOSITIVI NON IN WHITELIST ------------------------------------
          # Solo quelli attualmente 'home': i not_home sono in gran parte MAC
          # randomizzati di passaggio e genererebbero solo rumore.
          # Il bit 1 del primo ottetto (locally administered) distingue un MAC
          # casuale generato dal telefono da un MAC fisico di fabbrica.
          sconosciuti: >-
            {% set nomi = state_attr('sensor.wifi_dispositivi', 'mac_nomi') or {} %}
            {% set maclist = nomi.keys() | map('lower') | list %}
            {% set ng = integration_entities('netgear') %}
            {% set out = namespace(l=[]) %}
            {% for e in ng if e.startswith('device_tracker.') %}
            {% set m = (state_attr(e, 'mac') or '') | lower %}
            {% if m and m not in maclist and states(e) == 'home' %}
            {% set o = m[0:2] | int(0, 16) %}
            {% set ip = state_attr(e, 'ip') %}
            {% set out.l = out.l + [{'mac': m, 'ip': ip if ip not in [none, '', 'unknown', 'unavailable'] else 'n/d', 'tipo': 'casuale' if (o // 2) % 2 == 1 else 'fisso', 'entita': e}] %}
            {% endif %}
            {% endfor %}
            {{ out.l | sort(attribute='mac') | list }}

          #--- CONTATORI PER LA TESTATA DELLA PLANCIA --------------------------
          in_casa: >-
            {{ (this.attributes.get('righe', []) or []) | selectattr('stato', 'eq', 'in_casa') | list | count }}
          fuori_casa: >-
            {{ (this.attributes.get('righe', []) or []) | selectattr('stato', 'eq', 'fuori') | list | count }}
          ignoti: >-
            {{ (this.attributes.get('righe', []) or []) | selectattr('stato', 'eq', 'ignoto') | list | count }}
          non_in_elenco: >-
            {{ (this.attributes.get('sconosciuti', []) or []) | count }}

  #--- TIGO / PANNELLI (TEMPLATE SENSOR) ---

#==================================================================================
# PULSANTE DI AGGIORNAMENTO TABELLA WIFI
# Forza il ricalcolo immediato di sensor.wifi_tabella. Esposto sulla plancia Wi-Fi.
#==================================================================================
input_button:
  aggiorna_wifi_tabella:
    name: Aggiorna elenco WiFi
    icon: mdi:refresh
