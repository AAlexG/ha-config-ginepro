              '38:18:4c:1a:d0:c3': '005 TV sala Sony',
              'd8:f1:5b:15:26:40': '011 stazione meteo sala',
              '22:7a:a4:df:b7:d7': '014 fritz repeater 2400',
              '44:a5:6e:48:69:d8': '015 RBS20 di riserva',
              '38:94:ed:0c:78:df': '016 RBS50 box',
              'a0:40:a0:5e:40:d2': '017 RBS50 sopra',
              '9a:da:c4:71:89:d4': '018 repeater TP-Link RE650',
              'd4:27:87:51:9f:4c': '019 inverter fotovoltaico UFLEX',
              '7c:f0:e5:ef:0f:73': '026 OnePlus 13 Sasha',
              'a0:85:e3:b4:be:e4': '031 Shelly fancoil Georgi',
              'a0:85:e3:b3:f8:1c': '032 Shelly fancoil Tania',
              '1c:69:20:26:3f:b8': '033 Shelly valvola pompa-caldaia',
              'a0:85:e3:ba:36:e0': '034 Shelly fancoil sala',
              '9a:da:c4:f4:54:40': '036 OTGW via RE650',
              '9a:da:c4:85:b8:7c': '037 HeishaMon via RE650',
              '9a:da:c4:b3:47:56': '038 irrigaz.Sonof4CH via RE650',
              '38:44:be:46:1f:08': '039 RPI fan controller ESP32',
              'a0:92:08:86:9c:b7': '040 Aspirapolvere Lina Sopra',
              '00:25:ca:74:c0:47': '041 Tigo CCA logger in armadio',
              'ec:64:c9:c9:b7:5c': '042 Contaore cucina shellyEM',
              '00:1d:63:36:65:92': '046 lavatrice Miele',
              '84:0d:8e:66:14:ff': '047 Sonoff RF Bridge 433',
              '70:a8:d3:db:50:f6': '048 SASHA-MSI-PC',
              'f4:2d:c9:98:1d:fc': '050 Somfy Connectivity Kit',
              'f4:f5:d8:9e:f7:ff': '051 Google Home camera Georgi',
              '74:ee:2a:e7:76:6d': '052 Citofono Philips forse?',
              '1c:d6:be:be:3a:05': '053 Sony TV Bravia sopra',
              '70:89:76:fd:4c:18': '054 contattore auto',
              'a0:43:b0:53:f0:46': '055 Broadlink salotto RM4Pro',
              '38:1f:8d:90:0d:89': '056 pet feeder',
              '8c:3b:4a:9f:e3:69': '057 Chromecast (soundbar Sony sopra)',
              '44:07:0b:f2:e0:8f': '058 Google Home Mini Yamaha',
              '38:8b:59:82:fb:03': '059 Google Nest sopra',
