# config_pompa_calore_6.yaml
# v6 (21/10/2026): base del PID heating dalla temperatura esterna.
#   Nuovi input_number panasonic_heat_base_text_fredda/_mite e
#   panasonic_heat_base_mandata_fredda/_mite (retta mandata base vs T esterna,
#   default 35 C a 0 C fuori, 30 C a 15 C fuori) e sensor.panasonic_pid_heat_base.
#   Prima la base era 35 C fissa: con aria mite e pochi emettitori aperti la
#   pompa produceva piu' di quanto l'impianto assorbisse e il compressore
#   ciclava (arresto con mandata sotto setpoint e ritorno = mandata, 21/10).
#   Diagnostica cicli: binary_sensor.panasonic_compressore_in_moto,
#   sensor.panasonic_avvii_compressore_1h e _oggi.
# v5 (21/10/2026): COP su energia invece che su potenza istantanea.
#   Nuovi sensor.panasonic_prodotta_6h / panasonic_consumata_6h (statistics,
#   variazione degli accumulatori nelle ultime 6 ore), sensor.panasonic_cop_6h
#   e sensor.panasonic_cop_oggi. Il COP istantaneo resta solo come
#   diagnostica: con DT mandata/ritorno di 0,5-1 C e sensori a passi di
#   0,25 C un solo scatto cambia il valore del 25-50%, e all'avvio e
#   all'arresto del compressore DT e corrente sono sfasati (picchi 1-13).
# v4 (14/10/2026): bilancio economico della pompa di calore (plancia Casa
#   Ginepro, sezione "Risparmio pompa"). Nuovi helper pdc_costo_impianto,
#   pdc_incentivi_euro, pdc_risparmio_estate/inverno/storico_euro; nuovi
#   sensori PdC EER Vecchio Refrigeratore, PdC Risparmio Totale, PdC
#   Recupero Investimento. Gli accumulatori li aggiorna
#   pdc_risparmio_accumulo (automations_pompa_calore).
# v3 (08/10/2026): tolto input_boolean.clima_pid_attivo (PID sempre attivo,
#   lucchetto manuale = pdc_manuale). panasonic_pid_setpoint_heat con minimo
#   10 invece di 25: con il free heating il PID puo' scendere fino a
#   clima_freeheating_setpoint_min (slider 10-55) e un valore sotto il minimo
#   dell'helper fermava l'automazione prima dell'invio alla pompa.
# Package Casa Ginepro - Pompa di calore Panasonic Aquarea: PID, COP, energia
# Estratto da configuration_186.yaml. Nome file = nome del package.

template:
  - sensor:


      - name: "Panasonic Energia Prodotta Acc Sensor"
        unique_id: "panasonic_energia_prodotta_acc_sensor"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:heat-pump
        availability: "{{ has_value('input_number.panasonic_energia_prodotta_acc') }}"
        state: "{{ states('input_number.panasonic_energia_prodotta_acc') | float(0) | round(4) }}"

      - name: "Panasonic Energia Consumata Acc Sensor"
        unique_id: "panasonic_energia_consumata_acc_sensor"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:lightning-bolt
        availability: "{{ has_value('input_number.panasonic_energia_consumata_acc') }}"
        state: "{{ states('input_number.panasonic_energia_consumata_acc') | float(0) | round(4) }}"
      # v6: mandata base del PID heating, retta fra due punti (T esterna,
      # mandata) limitata agli estremi. Temperatura esterna dalla stazione
      # HP1000SE, come free heating e free cooling. Senza stazione il sensore
      # non e' disponibile e il PID torna alla base fissa 35 C.
      - name: "Panasonic PID Heat Base"
        unique_id: "panasonic_pid_heat_base"
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:chart-bell-curve-cumulative
        availability: >-
          {{ has_value('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature')
             and has_value('input_number.panasonic_heat_base_text_fredda')
             and has_value('input_number.panasonic_heat_base_text_mite')
             and states('input_number.panasonic_heat_base_text_mite') | float(0)
                 > states('input_number.panasonic_heat_base_text_fredda') | float(0) }}
        state: >-
          {% set t = states('sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature') | float(0) %}
          {% set t1 = states('input_number.panasonic_heat_base_text_fredda') | float(0) %}
          {% set m1 = states('input_number.panasonic_heat_base_mandata_fredda') | float(35) %}
          {% set t2 = states('input_number.panasonic_heat_base_text_mite') | float(15) %}
          {% set m2 = states('input_number.panasonic_heat_base_mandata_mite') | float(30) %}
          {% set tc = [[t, t1] | max, t2] | min %}
          {{ (m1 + (tc - t1) * (m2 - m1) / (t2 - t1)) | round(1) }}

      # v5: COP mobile 6 ore = energia prodotta / energia consumata nelle
      # ultime 6 ore (variazione degli accumulatori, sensor statistics sotto).
      # Assorbe cicli on/off, avvii e risoluzione del DT. Disponibile solo con
      # almeno 0,3 kWh elettrici nella finestra (circa 20 minuti di lavoro):
      # sotto quella soglia il rapporto non e' significativo.
      # E' il COP usato da sensor.pdc_costo_kwh_termico (config_caldaia).
      - name: "Panasonic COP 6h"
        unique_id: "panasonic_cop_6h"
        state_class: measurement
        icon: mdi:chart-line
        availability: >-
          {{ has_value('sensor.panasonic_prodotta_6h')
             and states('sensor.panasonic_consumata_6h') | float(0) >= 0.3 }}
        state: >-
          {{ (states('sensor.panasonic_prodotta_6h') | float(0)
              / states('sensor.panasonic_consumata_6h') | float(1)) | round(2) }}

      # v5: COP del giorno dagli utility meter giornalieri.
      - name: "Panasonic COP Oggi"
        unique_id: "panasonic_cop_oggi"
        state_class: measurement
        icon: mdi:calendar-today
        availability: >-
          {{ has_value('sensor.panasonic_prodotta_oggi')
             and states('sensor.panasonic_consumata_oggi') | float(0) >= 0.3 }}
        state: >-
          {{ (states('sensor.panasonic_prodotta_oggi') | float(0)
              / states('sensor.panasonic_consumata_oggi') | float(1)) | round(2) }}

  # v6: compressore in moto (frequenza > 0). delay_off 60 s: un campione a 0
  # isolato non conta come arresto e riavvio.
  - binary_sensor:
      - name: "Panasonic Compressore In Moto"
        unique_id: "panasonic_compressore_in_moto"
        icon: mdi:engine
        availability: "{{ has_value('sensor.panasonic_heat_pump_main_compressor_freq') }}"
        delay_off: "00:01:00"
        state: "{{ states('sensor.panasonic_heat_pump_main_compressor_freq') | float(0) > 0 }}"

  - sensor:
      # Potenza termica prodotta: calcolata da flow e delta T
      # Usa Main_Outlet_Temp (mandata) e Main_Inlet_Temp (ritorno)
      # Formula: flow (l/min) * delta_T (K) * 69.77 (W per l/min per K per acqua)
      - name: "Panasonic Potenza Prodotta Calcolata"
        unique_id: "panasonic_potenza_prodotta_calcolata"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:heat-pump
        state: >-
          {% set flow = states('sensor.panasonic_heat_pump_main_pump_flow') | float(0) %}
          {% set t_out = states('sensor.panasonic_heat_pump_main_main_outlet_temp') | float(0) %}
          {% set t_in = states('sensor.panasonic_heat_pump_main_main_inlet_temp') | float(0) %}
          {% set delta = (t_in - t_out) | abs %}
          {% if flow > 0 and delta > 0.2 %}
            {{ (flow * delta * 69.77) | round(0) }}
          {% else %}
            0
          {% endif %}

      # Potenza elettrica consumata: stimata da corrente compressore
      # Formula: corrente * tensione (220V) * power factor (0.85)
      - name: "Panasonic Potenza Consumata Calcolata"
        unique_id: "panasonic_potenza_consumata_calcolata"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt
        state: >-
          {% set current = states('sensor.panasonic_heat_pump_main_compressor_current') | float(0) %}
          {% if current > 0 %}
            {{ (current * 220 * 0.85) | round(0) }}
          {% else %}
            0
          {% endif %}

      # COP istantaneo: potenza prodotta / potenza consumata.
      # v5: solo diagnostica (plancia Panasonic, grafico). Non usarlo per
      # decisioni: e' molto rumoroso e non disponibile a compressore fermo.
      # Per i confronti c'e' sensor.panasonic_cop_6h.
      - name: "Panasonic COP Calcolato"
        unique_id: "panasonic_cop_calcolato"
        state_class: measurement
        icon: mdi:chart-line
        availability: >-
          {% set flow = states('sensor.panasonic_heat_pump_main_pump_flow') | float(-1) %}
          {% set t_out = states('sensor.panasonic_heat_pump_main_main_outlet_temp') | float(-1) %}
          {% set t_in = states('sensor.panasonic_heat_pump_main_main_inlet_temp') | float(-1) %}
          {% set current = states('sensor.panasonic_heat_pump_main_compressor_current') | float(-1) %}
          {% set delta = (t_in - t_out) | abs %}
          {{ flow > 0 and delta > 0.2 and current > 0 and t_out >= 0 and t_in >= 0 }}
        state: >-
          {% set flow = states('sensor.panasonic_heat_pump_main_pump_flow') | float(0) %}
          {% set t_out = states('sensor.panasonic_heat_pump_main_main_outlet_temp') | float(0) %}
          {% set t_in = states('sensor.panasonic_heat_pump_main_main_inlet_temp') | float(0) %}
          {% set delta = (t_in - t_out) | abs %}
          {% set current = states('sensor.panasonic_heat_pump_main_compressor_current') | float(0) %}
          {% set prod = flow * delta * 69.77 %}
          {% set cons = current * 220 * 0.85 %}
          {{ (prod / cons) | round(2) }}

  - sensor:
      # ============================================================
      # BILANCIO ECONOMICO POMPA DI CALORE
      # ============================================================
      # EER del vecchio refrigeratore Cosmogas Mini Fryo 7 (solo freddo,
      # compressore rotativo on/off), dalla scheda tecnica a aria esterna
      # 35 C: 2,95 con acqua 7/12 C, 3,83 con acqua 18/23 C. Interpolato
      # linearmente sulla mandata reale della PdC, limitato ai due estremi.
      # Limiti noti: con aria esterna sotto 35 C il vecchio avrebbe reso di
      # piu' (risparmio sovrastimato); gli on/off del compressore non
      # inverter non sono nella scheda (risparmio sottostimato).
      - name: "PdC EER Vecchio Refrigeratore"
        unique_id: "pdc_eer_vecchio_refrigeratore"
        state_class: measurement
        icon: mdi:snowflake-thermometer
        availability: "{{ has_value('sensor.panasonic_heat_pump_main_main_outlet_temp') }}"
        state: >-
          {% set t = states('sensor.panasonic_heat_pump_main_main_outlet_temp') | float(0) %}
          {% set t = [[t, 7] | max, 18] | min %}
          {{ (2.95 + (t - 7) * (3.83 - 2.95) / 11) | round(3) }}

      - name: "PdC Risparmio Totale"
        unique_id: "pdc_risparmio_totale"
        unit_of_measurement: "€"
        icon: mdi:piggy-bank
        state: >-
          {{ (states('input_number.pdc_risparmio_estate_euro') | float(0)
              + states('input_number.pdc_risparmio_inverno_euro') | float(0)
              + states('input_number.pdc_risparmio_storico_euro') | float(0))
             | round(2) }}

      # (risparmio + incentivi incassati) / costo impianto
      - name: "PdC Recupero Investimento"
        unique_id: "pdc_recupero_investimento"
        unit_of_measurement: "%"
        icon: mdi:percent
        availability: "{{ states('input_number.pdc_costo_impianto') | float(0) > 0 }}"
        state: >-
          {% set r = states('sensor.pdc_risparmio_totale') | float(0) %}
          {% set i = states('input_number.pdc_incentivi_euro') | float(0) %}
          {% set c = states('input_number.pdc_costo_impianto') | float(0) %}
          {{ ((r + i) / c * 100) | round(2) }}

input_number:

  # PID HEAT - stato interno separato da cooling
  panasonic_pid_heat_integrale:
    name: "Panasonic PID Heat Integrale"
    min: -50
    max: 50
    step: 0.001
    mode: box
    icon: mdi:sigma

  panasonic_pid_heat_errore_prec:
    name: "Panasonic PID Heat Errore Precedente"
    min: -20
    max: 20
    step: 0.001
    mode: box
    icon: mdi:delta

  panasonic_pid_setpoint_heat:
    name: "Panasonic Setpoint Mandata Riscaldamento"
    min: 10
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-water

  # v6: retta della mandata base del PID heating (sensor.panasonic_pid_heat_base).
  # Default (lotto 3 di clima_inizializzazione): 35 C con 0 C fuori, 30 C con
  # 15 C fuori. Oltre gli estremi la base resta al valore dell'estremo.
  panasonic_heat_base_text_fredda:
    name: "PID Heat – T esterna fredda"
    min: -20
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:snowflake-thermometer

  panasonic_heat_base_mandata_fredda:
    name: "PID Heat – Mandata base al freddo"
    min: 20
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-water

  panasonic_heat_base_text_mite:
    name: "PID Heat – T esterna mite"
    min: -10
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:sun-thermometer

  panasonic_heat_base_mandata_mite:
    name: "PID Heat – Mandata base col mite"
    min: 20
    max: 55
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-water

  # --- PID COOLING – stato interno ---
  panasonic_pid_kp:
    name: "Panasonic PID Kp"
    min: 0
    max: 200
    step: 0.001
    mode: box
    icon: mdi:tune

  panasonic_pid_ki:
    name: "Panasonic PID Ki"
    min: 0
    max: 50
    step: 0.0001
    mode: box
    icon: mdi:tune

  panasonic_pid_kd:
    name: "Panasonic PID Kd"
    min: 0
    max: 500
    step: 0.001
    mode: box
    icon: mdi:tune

  panasonic_pid_integrale:
    name: "Panasonic PID Integrale"
    min: -50
    max: 50
    step: 0.001
    mode: box
    icon: mdi:sigma

  panasonic_pid_errore_prec:
    name: "Panasonic PID Errore Precedente"
    min: -20
    max: 20
    step: 0.001
    mode: box
    icon: mdi:delta

  # --- LIMITI DI MANDATA IN RAFFRESCAMENTO ---
  # Sostituiscono i valori 10 e 18 che erano cablati dentro il PID cooling.
  # Il minimo e' il vincolo di sicurezza contro la condensa: sotto ai 12-13 C
  # tubazioni e collettori non coibentati del circuito fancoil grondano, e
  # quando il target ambiente non e' raggiungibile con gli emettitori attivi
  # il PID satura e ci resterebbe per ore senza guadagnare capacita' utile.
  # Il massimo e' anche la mandata a errore nullo, da cui il PID sottrae.
  panasonic_mandata_cool_min:
    name: "Panasonic Mandata Minima Raffrescamento"
    min: 10
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer-chevron-down

  panasonic_mandata_cool_max:
    name: "Panasonic Mandata Massima Raffrescamento"
    min: 12
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer-chevron-up

  panasonic_target_mandata_manuale:
    name: "Panasonic Target Mandata Manuale"
    min: 10
    max: 55
    step: 1
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:thermometer-water

  panasonic_pid_setpoint_mandata:
    name: "Panasonic Setpoint Mandata Calcolato"
    min: 5
    max: 25
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-water

  # ============================================================
  # PANASONIC – accumulatori energia (aggiornati ogni minuto)
  # ============================================================
  panasonic_energia_prodotta_acc:
    name: "Panasonic Energia Prodotta Acc"
    min: 0
    max: 999999
    step: 0.0001
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:heat-pump

  panasonic_energia_consumata_acc:
    name: "Panasonic Energia Consumata Acc"
    min: 0
    max: 999999
    step: 0.0001
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:lightning-bolt

  # ============================================================
  # POMPA DI CALORE – bilancio economico
  # ============================================================
  # Costo totale della sostituzione, IVA compresa (5.500 €, indicato da
  # Alex). Solo la macchina esterna: fancoil e impianto erano gia' presenti.
  pdc_costo_impianto:
    name: "PdC – Costo impianto (€)"
    min: 0
    max: 99999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:cash

  # Detrazioni/incentivi gia' incassati (rate ricevute), da aggiornare a mano.
  pdc_incentivi_euro:
    name: "PdC – Incentivi incassati (€)"
    min: 0
    max: 99999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:cash-refund

  # Accumulatori aggiornati ogni minuto da pdc_risparmio_accumulo.
  # Possono diventare negativi: in Heat con COP basso la pompa puo' costare
  # piu' della caldaia.
  pdc_risparmio_estate_euro:
    name: "PdC – Risparmio raffrescamento (€)"
    min: -99999
    max: 99999
    step: 0.0001
    unit_of_measurement: "€"
    mode: box
    icon: mdi:snowflake

  pdc_risparmio_inverno_euro:
    name: "PdC – Risparmio riscaldamento (€)"
    min: -99999
    max: 99999
    step: 0.0001
    unit_of_measurement: "€"
    mode: box
    icon: mdi:fire

  # Risparmio del periodo prima di questi accumulatori (installazione PdC →
  # creazione degli accumulatori qui sopra), ricalcolato una tantum dalle
  # statistiche orarie.
  pdc_risparmio_storico_euro:
    name: "PdC – Risparmio storico (€)"
    min: -99999
    max: 99999
    step: 0.01
    unit_of_measurement: "€"
    mode: box
    icon: mdi:history

sensor:
  # v5: energia prodotta e consumata nelle ultime 6 ore (variazione degli
  # accumulatori). Gli accumulatori cambiano al massimo una volta al minuto:
  # 500 campioni coprono le 6 ore con margine. Con la pompa ferma da oltre
  # 6 ore la variazione e' 0 e sensor.panasonic_cop_6h non e' disponibile.
  - platform: statistics
    name: "Panasonic Prodotta 6h"
    unique_id: panasonic_prodotta_6h
    entity_id: sensor.panasonic_energia_prodotta_acc_sensor
    state_characteristic: change
    max_age:
      hours: 6
    sampling_size: 500
    keep_last_sample: true

  - platform: statistics
    name: "Panasonic Consumata 6h"
    unique_id: panasonic_consumata_6h
    entity_id: sensor.panasonic_energia_consumata_acc_sensor
    state_characteristic: change
    max_age:
      hours: 6
    sampling_size: 500
    keep_last_sample: true

  # v6: avvii del compressore (passaggi a on) nell'ultima ora e da mezzanotte.
  # Servono a misurare i cicli on/off prima e dopo la base da T esterna.
  - platform: history_stats
    name: "Panasonic Avvii Compressore 1h"
    unique_id: panasonic_avvii_compressore_1h
    entity_id: binary_sensor.panasonic_compressore_in_moto
    state: "on"
    type: count
    start: "{{ now() - timedelta(hours=1) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Panasonic Avvii Compressore Oggi"
    unique_id: panasonic_avvii_compressore_oggi
    entity_id: binary_sensor.panasonic_compressore_in_moto
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

utility_meter:

  panasonic_prodotta_oggi:
    name: "Panasonic Prodotta Oggi"
    source: sensor.panasonic_energia_prodotta_acc_sensor
    cycle: daily

  panasonic_prodotta_mese:
    name: "Panasonic Prodotta Mese"
    source: sensor.panasonic_energia_prodotta_acc_sensor
    cycle: monthly

  panasonic_consumata_oggi:
    name: "Panasonic Consumata Oggi"
    source: sensor.panasonic_energia_consumata_acc_sensor
    cycle: daily

  panasonic_consumata_mese:
    name: "Panasonic Consumata Mese"
    unique_id: panasonic_consumata_mese
    source: sensor.panasonic_energia_consumata_acc_sensor
    cycle: monthly

# input_boolean.clima_pid_attivo rimosso in v3: il PID e' sempre attivo.
