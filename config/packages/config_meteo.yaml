# config_meteo_3.yaml
# Package Casa Ginepro - Meteo: sensori statistici vento (HP1000SE Pro)
#                        + alba e tramonto di oggi
# Estratto da configuration_186.yaml. Nome file = nome del package.

#--- SENSORI STATISTICI ---
sensor:
  - platform: statistics
    name: "Wind Speed Media 1h"
    unique_id: "wind_speed_media_1h"
    entity_id: sensor.hp1000se_pro_pro_v1_6_4_wind_speed
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 120
    precision: 1

#==================================================================================
# RAFFICA MASSIMA ULTIMI 365 GIORNI
# Il sensore statistics non puo' fare questo lavoro: costruisce il proprio buffer
# dalla tabella states, che il recorder pulisce dopo purge_keep_days (7 giorni).
# Il max_age: 365 days risultava quindi inefficace e il valore mostrato era il
# massimo dell'ultima settimana.
# Questo sensore SQL legge invece la colonna max delle statistiche a lungo termine
# (tabella statistics), che non vengono mai eliminate dal purge.
# metadata_id risolto dinamicamente via JOIN su statistics_meta: mai valori fissi.
# Polling: 30 secondi (default integrazione SQL, non configurabile da YAML).
#==================================================================================
sql:
  - name: "Raffica Max 365 Giorni"
    unique_id: raffica_max_365_giorni
    query: >
      SELECT
        ROUND(MAX(s.max), 1) AS raffica_max
      FROM
        statistics s
        JOIN statistics_meta sm ON sm.id = s.metadata_id
      WHERE
        sm.statistic_id = 'sensor.hp1000se_pro_pro_v1_6_4_max_daily_gust'
        AND s.start_ts >= strftime('%s', 'now', '-365 days')
    column: raffica_max
    unit_of_measurement: "km/h"
    device_class: wind_speed
    state_class: measurement
    icon: mdi:weather-windy

#==================================================================================
# ALBA E TRAMONTO DI OGGI
# sun.sun espone solo il PROSSIMO evento: dopo l'alba next_rising punta a domani.
# Questi sensori catturano i valori alle 00:00:30, quando entrambi sono ancora
# riferiti a oggi, e li mantengono per tutta la giornata.
# Lo stato dei sensori trigger-based viene ripristinato al riavvio di HA.
# Fallback: se HA e' rimasto spento a cavallo della mezzanotte si usa
# l'evento di domani meno 24h (errore massimo circa 2 minuti), autocorretto
# alla mezzanotte successiva.
#==================================================================================
template:
  - trigger:
      - trigger: time
        at: "00:00:30"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Alba Oggi"
        unique_id: alba_oggi
        icon: mdi:weather-sunset-up
        state: >
          {% set r = state_attr('sun.sun', 'next_rising') %}
          {% if r is none %}
            {{ this.state }}
          {% else %}
            {% set a = r | as_datetime | as_local %}
            {% if a.date() == now().date() %}
              {{ a.strftime('%H:%M') }}
            {% elif this.attributes.get('data_calcolo', '') == now().date().isoformat() %}
              {{ this.state }}
            {% else %}
              {{ (a - timedelta(days=1)).strftime('%H:%M') }}
            {% endif %}
          {% endif %}
        attributes:
          data_calcolo: >
            {% if state_attr('sun.sun', 'next_rising') is none %}
              {{ this.attributes.get('data_calcolo', '') }}
            {% else %}
              {{ now().date().isoformat() }}
            {% endif %}

      - name: "Tramonto Oggi"
        unique_id: tramonto_oggi
        icon: mdi:weather-sunset-down
        state: >
          {% set r = state_attr('sun.sun', 'next_setting') %}
          {% if r is none %}
            {{ this.state }}
          {% else %}
            {% set t = r | as_datetime | as_local %}
            {% if t.date() == now().date() %}
              {{ t.strftime('%H:%M') }}
            {% elif this.attributes.get('data_calcolo', '') == now().date().isoformat() %}
              {{ this.state }}
            {% else %}
              {{ (t - timedelta(days=1)).strftime('%H:%M') }}
            {% endif %}
          {% endif %}
        attributes:
          data_calcolo: >
            {% if state_attr('sun.sun', 'next_setting') is none %}
              {{ this.attributes.get('data_calcolo', '') }}
            {% else %}
              {{ now().date().isoformat() }}
            {% endif %}
