# config_tende_3.yaml
# v3 (08/10/2026): nuovo input_boolean.pergola_meteo_avviso_manuale (stato
#   interno dell'avviso meteo con pergola in gestione manuale).
# v2 (08/10/2026): pergola_blocco_manuale segue la regola di tutti i flag
#   manuali: lo alza e lo abbassa solo l'utente, nessun rilascio automatico.
#   Tolto initial: false (lo spegneva a ogni riavvio di HA).
# Package Casa Ginepro - Tende: pergola terrazza e tenda giardino (helper delle
# automazioni in automations_tende).
# Creato il 30/09/2026 dalla riorganizzazione per argomento: parte "tende"
# di config_aperture (eliminato). Entity_id invariati.

input_boolean:

  # --- GESTIONE MANUALE PERGOLA ---
  # Stessa regola di tutti i flag manuali: lo alza e lo abbassa SOLO l'utente
  # dal suo tile in plancia Tende. Con il flag alzato nessuna automazione tocca
  # la pergola: inseguimento solare, sicurezza meteo (vento/pioggia) e
  # chiusura alla partenza per vacanza restano fermi. Promemoria alle 10:00 e
  # alle 22:00 se resta alzato da oltre un'ora (flag_manuali_promemoria).
  # Nessuna chiave initial: al riavvio HA ripristina lo stato salvato.
  pergola_blocco_manuale:
    name: "Pergola - Gestione Manuale"
    icon: mdi:hand-back-left

  # Si attiva quando l'automazione pergola_meteo_chiusura chiude per vento/pioggia/scarsa radiazione.
  # Si disattiva da sola dopo 20 minuti con tutte le condizioni meteo rientrate.
  pergola_meteo_chiusura:
    name: "Pergola - Chiusura Sicurezza Meteo"
    initial: false
    icon: mdi:weather-windy

  # Stato interno di pergola_meteo_chiusura (non e' un flag manuale): acceso
  # quando, con pergola_blocco_manuale alzato, la sicurezza meteo avrebbe
  # chiuso la pergola ed e' partita la notifica. Evita di ripeterla a ogni
  # controllo (10 o 2 minuti); si spegne da solo appena l'allarme meteo
  # rientra o il flag manuale viene abbassato.
  pergola_meteo_avviso_manuale:
    name: "Pergola - Avviso Meteo in Gestione Manuale"
    initial: false
    icon: mdi:bell-alert

  tenda_notifica_vento_oggi:
    name: "Tenda – Notifica Vento Oggi"
    initial: false
    icon: mdi:bell-check

  # Limita a una sola notifica al giorno l'apertura per pioggia
  # (automations_pergola_18, ora automations_tende). Azzerato alle 23:59:30 dalla stessa
  # automazione che azzera il flag del vento.
  tenda_notifica_pioggia_oggi:
    name: "Tenda – Notifica Pioggia Oggi"
    initial: false
    icon: mdi:bell-ring-outline

  # Pioggia vista o prevista oggi (config_aperture_9). Acceso dalla chiusura
  # sicurezza meteo della pergola quando rileva pioggia in corso, accumulo
  # orario o previsione a 3 ore; da quel momento il controllo pergola gira ogni
  # 2 minuti fino a sera. Azzerato alle 23:59:30 insieme ai flag notifica tenda.
  # NIENTE "initial": un riavvio in giornata non deve perdere l'informazione.
  pergola_pioggia_oggi:
    name: "Pergola – Pioggia Oggi"
    icon: mdi:weather-pouring

#==================================================================================
# PERGOLA - SICUREZZA METEO: HELPER DI SUPPORTO (nuovi in config_aperture_2)
#
# input_datetime.pergola_meteo_ultimo_allarme
#   Ora dell'ultima condizione di emergenza rilevata da automations_tende (ex automations_pergola).
#   Il rilascio del flag avviene solo dopo 20 minuti da questo istante.
#   Sostituisce il precedente "for: 00:20:00" sul trigger template del rilascio:
#   quel trigger scattava solo sulla transizione falso -> vero e, tolto il
#   controllo radiazione, non avrebbe mai piu' avuto una transizione in una
#   giornata serena e calma, lasciando il flag alzato a tempo indeterminato.
#   NIENTE "initial": se mai impostato vale 1970-01-01 e il rilascio risulta
#   permesso, che e' il default corretto (nessun allarme mai registrato).
#
# input_text.pergola_meteo_causa
#   Descrizione leggibile di TUTTE le condizioni che tengono alzato il flag,
#   con l'ora di alzamento. Mostrata in plancia Tende. Scritta dall'automazione
#   di chiusura ad ogni ciclo di emergenza, azzerata dal rilascio.
#   NIENTE "initial": deve sopravvivere ai riavvii.
#==================================================================================
input_datetime:

  pergola_meteo_ultimo_allarme:
    name: "Pergola - Ultimo Allarme Meteo"
    has_date: true
    has_time: true
    icon: mdi:clock-alert-outline

input_text:

  pergola_meteo_causa:
    name: "Pergola - Causa Chiusura Meteo"
    max: 255
    icon: mdi:text-box-outline

#==================================================================================
# PERGOLA - POSIZIONE MINIMA DEL MATTINO
# Letta da pergola_inseguimento_solare negli slot 08:30 / 10:00 / 11:15:
# bersaglio = max(formula + 5, questo valore). Serve ad aerare quando il sole
# e' basso e la formula da' valori negativi. Regolabile dalla plancia Tende.
# Il nuovo valore si applica al primo slot successivo, non subito.
# NIENTE "initial": il valore scelto in plancia deve sopravvivere ai riavvii.
# Al primo avvio vale il minimo (0): impostarlo a 30 dalla plancia.
#==================================================================================
input_number:

  pergola_min_mattino:
    name: "Pergola - Minimo Mattino"
    min: 0
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:weather-sunset-up
