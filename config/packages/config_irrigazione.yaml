# config_irrigazione_3.yaml
# Package Casa Ginepro - Irrigazione: Sonoff 4CHPRoR3, tre circuiti, orari e blocchi
# Estratto da configuration_186.yaml. Nome file = nome del package.

template:
  - sensor:
      - name: "Irrigazione Attiva"
        unique_id: "irrigazione_attiva"
        state: >-
          {{ 'Saltata oggi' if is_state('input_boolean.irrigazione_salta_oggi', 'on') else 'Programmata' }}
        icon: >-
          {{ 'mdi:water-pump-off' if is_state('input_boolean.irrigazione_salta_oggi', 'on') else 'mdi:water-pump' }}

  - sensor:
      - name: "Acqua Irrigazione Oggi"
        unique_id: "acqua_irrigazione_oggi"
        # Consumo = minuti-canale erogati oggi × m³/min per canale.
        state: >-
          {% set minuti = states('counter.irrigazione_minuti_oggi') | int(0) %}
          {% set flusso = states('input_number.acqua_consumo_per_minuto') | float(0) %}
          {{ (minuti * flusso) | round(4) }}
        unit_of_measurement: "m³"
        state_class: measurement
        icon: mdi:sprinkler

counter:
  # Minuti-canale di irrigazione erogati oggi (reset a mezzanotte).
  # +1 ogni minuto con un canale ON.
  # Copre cicli programmati e accensioni manuali (anche di singolo canale).
  #
  # ATTENZIONE (22/08/2026): l'interblocco HW del Sonoff 4CHPROR3 e' stato DISATTIVATO
  # (lock=0) per poter abilitare l'inching, con cui era incompatibile. Il conteggio
  # "1 tick = 1 minuto-canale" non e' piu' garantito dall'hardware ma dallo script
  # irrigazione_esegui_sequenza, che spegne sempre il canale precedente prima di
  # accendere il successivo. Se in futuro un'automazione accendesse due canali insieme,
  # il conteggio risulterebbe sottostimato: 1 tick al minuto invece di 2.
  irrigazione_minuti_oggi:
    name: "Minuti irrigazione oggi"
    initial: 0
    step: 1
    restore: true

input_number:

  irrigazione_soglia_umidita:
    name: "Irrigazione - Soglia umidità massima"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:water-percent

  # ============================================================
  # ACQUA: input manuali (NUOVO – configuration_53)
  # ============================================================
  # Durate per singolo canale (T1/T2/T3). Usate dal ciclo programmato e da "Cicla ora".
  #
  # VINCOLO HARDWARE (22/08/2026) - NON DIMENTICARE:
  # Sul Sonoff 4CHPROR3 e' attivo l'INCHING a 300 secondi (5 minuti) su C1, C2 e C3
  # (params pulses: pulse='on', width=300000 ms sugli outlet 0/1/2).
  # Il firmware spegne il canale allo scadere dei 300 s comunque sia stato acceso:
  # da HA, da app, da telecomando RF o a mano. E' la protezione contro l'allagamento
  # dopo l'incidente del 07/08/2026 (C1 rimasto aperto 6h30 per perdita WiFi del Sonoff).
  #
  # => NON impostare durate superiori a 4 minuti: oltre i 5 il canale verrebbe chiuso
  #    dal firmware senza alcun errore visibile in HA, e l'irrigazione risulterebbe
  #    piu' corta del previsto. Per irrigare piu' a lungo occorre PRIMA alzare la
  #    durata dell'inching in eWeLink (max 3600 s), poi il valore qui sotto.
  # Il max: 4 sottostante rende l'errore impossibile, non solo documentato: HA rifiuta
  # valori superiori. Per alzarlo occorre PRIMA aumentare l'inching in eWeLink e poi
  # modificare qui il max, tenendolo sempre almeno 1 minuto sotto la durata dell'inching.
  #
  # NB: la cache /config/.storage/sonoff/ riflette i parametri del dispositivo solo
  # dopo un reload dell'integrazione SonoffLAN, non in tempo reale.
  irrigazione_durata_c1:
    name: "Irrigazione – Durata C1 (T1)"
    min: 0
    max: 4
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:numeric-1-box
  irrigazione_durata_c2:
    name: "Irrigazione – Durata C2 (T2)"
    min: 0
    max: 4
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:numeric-2-box
  irrigazione_durata_c3:
    name: "Irrigazione – Durata C3 (T3)"
    min: 0
    max: 4
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:numeric-3-box

  # m³ al minuto PER SINGOLO CANALE (impostare 0.0333).
  # Consumo irrigazione = minuti-canale erogati oggi × questo valore.
  acqua_consumo_per_minuto:
    name: "Irrigazione – m³/min per canale"
    min: 0
    max: 1
    step: 0.0001
    unit_of_measurement: "m³/min"
    mode: box
    icon: mdi:water-pump

input_datetime:

  # Orari del programma irrigazione (modificabili da plancia). Solo ora, niente data.
  # NIENTE "initial": con initial il valore torna al default a ogni riavvio/reload
  # (initial sovrascrive restore_state). Senza, lo stato scelto da plancia persiste.
  irrigazione_ora_mattino:
    name: "Irrigazione - Ora mattino (O1)"
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-up
  irrigazione_ora_sera:
    name: "Irrigazione - Ora sera (O2)"
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-down

input_text:
  # Messaggio mostrato in plancia (Casa Ginepro) con l'esito dell'ultima
  # valutazione irrigazione: motivi di blocco (pioggia, umidità, vento,
  # previsioni) oppure conferma di irrigazione permessa. Scritto dalle
  # ciclo programmato e dagli script irrigazione (cicla_ora, stop, salta_toggle).
  irrigazione_motivo_blocco:
    name: "Irrigazione – Motivo blocco"
    max: 255
    icon: mdi:sprinkler-variant

input_boolean:

  # Salta il programma automatico SOLO per oggi. Auto-reset a mezzanotte (auto-ripristino).
  # I canali restano comandabili a mano e "Cicla ora" funziona comunque.
  irrigazione_salta_oggi:
    name: "Irrigazione – Salta programma oggi"
    initial: false
    icon: mdi:hand-back-right
