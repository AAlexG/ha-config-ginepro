# config_sistema_10.yaml
# v10 (23/10/2026): installa_e_riavvia applica i parametri delle bollette PDF
# importate (quote fisse, componenti luce, prezzi gas e acqua) restituiti da
# installa.py conferma, aggiorna i totali dei consumi e riporta nella
# notifica le bollette salvate o rifiutate.
# v9 (16/10/2026): installa_e_riavvia sceglie il riavvio dai file installati
# (installa.py, campo riavvio): RAPIDO = Riavvio rapido
# (homeassistant.reload_all), COMPLETO = Riavvia Home Assistant
# (homeassistant.restart), oppure nessuno. Con la cartella vuota: RAPIDO.
# v8 (16/10/2026): pulsante "Installa e riavvia". shell_command installa_*
# (fasi di /config/installa.py) e script.installa_e_riavvia.
# v7 (16/10/2026): tolto controllo_file_aggiorna. L'elenco dei file attesi
# e' /config/file_attesi.yaml, versionato come gli altri file.
# v6 (16/10/2026): shell_command controllo_file e controllo_file_aggiorna
# (sorveglianza file di configurazione, controllo_file.py).
# Package Casa Ginepro - Sistema: monitoraggio Raspberry, ultima modifica configurazione, Vivino proxy, vacanza
# v5 (30/09/2026): bollette e totali consumi spostati in config_consumi,
# shell_command calcola_pv_tabella spostato in config_fotovoltaico.
# Estratto da configuration_186.yaml. Nome file = nome del package.

#--- MONITORAGGIO HARDWARE ---
command_line:
  - sensor:
      name: RPi CPU Temperature
      command: "cat /sys/class/thermal/thermal_zone0/temp"
      unit_of_measurement: "°C"
      icon: mdi:thermometer
      scan_interval: 30
      value_template: "{{ (value | int / 1000) | round(1) }}"

  - sensor:
      name: RPi Fan Speed
      command: "cat /sys/class/hwmon/hwmon*/fan1_input 2>/dev/null | head -1 || echo '0'"
      unit_of_measurement: "RPM"
      icon: mdi:fan
      scan_interval: 15
      value_template: "{{ value | int(0) }}"
  - sensor:
      name: "Ultima Modifica Configurazione"
      command: "find . -maxdepth 2 -name '*.yaml' -exec stat -c '%Y' {} + | sort -n | tail -1"
      scan_interval: 120
      value_template: "{{ value | int(none) }}"

shell_command:
  avvia_vivino_proxy: "python3 /config/vivino_proxy.py &"
  # Sorveglianza file di configurazione (automazione
  # sistema_controllo_file_config): confronta /config con
  # /config/file_attesi.yaml e restituisce il JSON dei file mancanti o ridotti.
  controllo_file: "python3 /config/controllo_file.py"

  # Installazione dei file copiati in /config/da_installare (installa.py,
  # script.installa_e_riavvia). Ogni fase dura pochi secondi; il controllo
  # configurazione gira in background e si interroga con verifica_stato.
  installa_prepara: "python3 /config/installa.py prepara"
  installa_verifica_avvia: "python3 /config/installa.py verifica_avvia"
  installa_verifica_stato: "python3 /config/installa.py verifica_stato"
  installa_conferma: "python3 /config/installa.py conferma"
  installa_annulla: "python3 /config/installa.py annulla"

input_boolean:

  # --- FLAG VACANZA ---
  # Comandato SOLO A MANO dalla plancia clima: dalla v55 delle automazioni
  # clima il calendario non c'entra piu' nulla. Accendendolo parte
  # spegnimento_inizio_vacanza, spegnendolo parte clima_ rientro_vacanza.
  # Il riconoscimento della parola "vacanza" negli eventi del calendario non
  # era affidabile ed e' stato eliminato.
  # Con flag acceso restano ferme: pergola, tenda giardino, canto uccelli
  # (i fancoil vengono spenti da spegnimento_inizio_vacanza e restano fermi
  # perche' tutte le automazioni fancoil hanno il flag fra le condizioni).
  # Girano comunque: sicurezza, deumidificatori, irrigazione, antigelo, notifiche, sistema.
  # NOTA: niente "initial" di proposito - lo stato deve sopravvivere a un riavvio di HA in vacanza.
  vacanza:
    name: "Vacanza"
    icon: mdi:beach

script:

  # ============================================================
  # INSTALLA E RIAVVIA (pulsante in plancia Casa Ginepro)
  # 1. installa.py prepara: smista i file di /config/da_installare al loro
  #    posto, salvando gli originali.
  # 2. Se ha toccato file di configurazione: controllo configurazione in
  #    background, interrogato ogni 10 s per al massimo 6 minuti.
  # 3. Controllo OK: archivia in SORGENTI (ultime 5 versioni), notifica e
  #    riavvia come indicato da installa.py: RAPIDO (Riavvio rapido,
  #    homeassistant.reload_all) o COMPLETO (Riavvia Home Assistant,
  #    homeassistant.restart) o nessuno. Controllo fallito o troppo lento:
  #    rimette gli originali, notifica l'errore, nessun riavvio.
  # Con la cartella vuota fa solo il Riavvio rapido.
  # ============================================================
  installa_e_riavvia:
    alias: "Installa e riavvia"
    icon: mdi:package-down
    mode: single
    max_exceeded: silent
    sequence:
      - action: shell_command.installa_prepara
        response_variable: p
      - variables:
          r: >-
            {%- if p.returncode == 0 -%}{{ p.stdout | from_json }}
            {%- else -%}{{ {'errore': (p.stderr or p.stdout or 'nessun output')[-300:]} }}
            {%- endif -%}
      - if:
          - condition: template
            value_template: "{{ r.errore is defined }}"
        then:
          - action: notify.mobile_app_cph2653
            continue_on_error: true
            data:
              title: "📦 Installazione non partita"
              message: "{{ r.errore }}"
          - stop: "installa.py prepara non ha funzionato"
      - if:
          - condition: template
            value_template: "{{ r.totale == 0 }}"
        then:
          - action: homeassistant.reload_all
          - stop: "nessun file da installare"
      - if:
          - condition: template
            value_template: "{{ r.installati | count == 0 and r.esphome | count == 0 }}"
        then:
          - action: notify.mobile_app_cph2653
            continue_on_error: true
            data:
              title: "📦 Nessun file installato"
              message: >-
                Scartati (restano in da_installare): {{ r.scartati | join('; ') }}.
                {{ r.avvisi | join(' ') }}
          - stop: "tutti i file scartati"
      - variables:
          ver:
            stato: "ok"
            dettaglio: ""
      - if:
          - condition: template
            value_template: "{{ r.file_config > 0 }}"
        then:
          - variables:
              ver:
                stato: "in_corso"
                dettaglio: ""
          - action: shell_command.installa_verifica_avvia
          - repeat:
              sequence:
                - delay: "00:00:10"
                - action: shell_command.installa_verifica_stato
                  response_variable: v
                - variables:
                    ver: "{{ v.stdout | from_json }}"
              until:
                - condition: template
                  value_template: "{{ ver.stato != 'in_corso' or repeat.index >= 36 }}"
      - if:
          - condition: template
            value_template: "{{ ver.stato == 'ok' }}"
        then:
          - action: shell_command.installa_conferma
            response_variable: c
          - variables:
              cr: >-
                {%- if c.returncode == 0 -%}{{ c.stdout | from_json }}
                {%- else -%}{{ {'errori_bollette': ['conferma: ' ~ (c.stderr or c.stdout or 'nessun output')[-200:]]} }}
                {%- endif -%}
          # v10: parametri dalle bollette PDF importate
          - repeat:
              for_each: "{{ (cr.parametri | default({})).items() | list }}"
              sequence:
                - action: input_number.set_value
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    value: "{{ repeat.item[1] }}"
          - if:
              - condition: template
                value_template: "{{ cr.bollette | default([]) | count > 0 }}"
            then:
              - action: script.aggiorna_totali_consumi
                continue_on_error: true
          - variables:
              testo: >-
                Installati: {{ r.installati | join(', ') or 'nessuno' }}.
                {% if cr.errori_bollette | default([]) %}Bollette NON salvate (restano in da_installare): {{ cr.errori_bollette | join('; ') }}.
                {% endif %}{% if cr.parametri | default({}) %}Parametri aggiornati dalle bollette: {{ cr.parametri | count }}.
                {% endif %}
                {% if r.esphome %}Archiviati, da caricare dall'ESPHome: {{ r.esphome | join(', ') }}.
                {% endif %}{% if r.scartati %}Scartati (restano in da_installare): {{ r.scartati | join('; ') }}.
                {% endif %}{{ r.avvisi | join(' ') }}
                {% if r.riavvio == 'completo' %}Riavvio COMPLETO ({{ r.motivi | join('; ') }}).
                {% elif r.riavvio == 'rapido' %}Riavvio RAPIDO.
                {% else %}Nessun riavvio necessario.{% endif %}
          - action: notify.mobile_app_cph2653
            continue_on_error: true
            data:
              title: "📦 Installazione completata"
              message: "{{ testo }}"
          - action: persistent_notification.create
            continue_on_error: true
            data:
              title: "📦 Installazione completata"
              notification_id: installa_e_riavvia
              message: "{{ testo }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ r.riavvio == 'completo' }}"
                sequence:
                  - action: homeassistant.restart
              - conditions:
                  - condition: template
                    value_template: "{{ r.riavvio == 'rapido' }}"
                sequence:
                  - action: homeassistant.reload_all
        else:
          - action: shell_command.installa_annulla
          - variables:
              testo: >-
                {% if ver.stato == 'in_corso' %}Il controllo configurazione non ha finito entro 6 minuti.
                {% else %}Controllo configurazione fallito: {{ ver.dettaglio }}
                {% endif %}Rimesse le versioni precedenti, nessun riavvio. I file nuovi restano in da_installare.
          - action: notify.mobile_app_cph2653
            continue_on_error: true
            data:
              title: "📦 Installazione annullata"
              message: "{{ testo }}"
              data:
                priority: high
                ttl: 0
          - action: persistent_notification.create
            continue_on_error: true
            data:
              title: "📦 Installazione annullata"
              notification_id: installa_e_riavvia
              message: "{{ testo }}"
