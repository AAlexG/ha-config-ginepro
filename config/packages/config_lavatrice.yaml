# config_lavatrice_2.yaml
# Package Casa Ginepro - Lavatrice Miele: energia, acqua e conteggio programmi
# Estratto da configuration_186.yaml. Nome file = nome del package.
# v2: aggiunti lo shell_command e il sensore command_line che alimentano la
#     tabella "lavaggi per programma" della plancia fancoil.

template:
  - triggers:
      - trigger: state
        entity_id:
          - sensor.lavatricemielewci870_consumo_energia
          - sensor.lavatricemielewci870_consumo_acqua
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Lavatrice Acqua"
        unique_id: "lavatrice_acqua"
        unit_of_measurement: "L"
        device_class: water
        state_class: total_increasing
        icon: mdi:washing-machine
        state: >-
          {% if has_value('sensor.lavatricemielewci870_consumo_acqua') %}
            {{ states('sensor.lavatricemielewci870_consumo_acqua') | float(0) | round(2) }}
          {% else %}
            {{ this.state | float(0) | round(2) }}
          {% endif %}

      - name: "Lavatrice Energia"
        unique_id: "lavatrice_energia"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:washing-machine
        state: >-
          {% if has_value('sensor.lavatricemielewci870_consumo_energia') %}
            {{ states('sensor.lavatricemielewci870_consumo_energia') | float(0) | round(3) }}
          {% else %}
            {{ this.state | float(0) | round(3) }}
          {% endif %}

utility_meter:

  # --- LAVATRICE MIELE ---
  lavatrice_mese:
    name: "Lavatrice Mese"
    unique_id: lavatrice_mese
    source: sensor.lavatrice_energia
    cycle: monthly

  lavatrice_totale:
    name: "Lavatrice Totale"
    unique_id: lavatrice_totale
    source: sensor.lavatrice_energia

  # --- LAVATRICE: acqua giornaliera (litri) ---
  # Si azzera a mezzanotte, mentre acqua_reset_mezzanotte accumula alle 23:59:
  # l'acqua eventualmente erogata in quel minuto non viene conteggiata.
  lavatrice_acqua_oggi:
    name: "Lavatrice Acqua Oggi"
    source: sensor.lavatrice_acqua
    cycle: daily

shell_command:

  # Rilegge lo storico dal DB, aggiorna l'archivio cumulativo
  # /config/lavatrice_programmi.json e rigenera la tabella per la plancia.
  # Lo script e' incrementale: rilanciarlo non produce doppi conteggi.
  calcola_lavatrice_programmi: "python3 /config/lavatrice_programmi.py > /config/lavatrice_tabella.json 2>/config/lavatrice_programmi.log"

command_line:

  # Stato = numero totale di lavaggi contati da sempre.
  # scan_interval alto di proposito: il file cambia una volta al giorno e
  # l'automazione forza comunque l'aggiornamento subito dopo il calcolo.
  - sensor:
      name: Lavatrice Tabella Programmi
      unique_id: lavatrice_tabella_programmi
      command: "cat /config/lavatrice_tabella.json 2>/dev/null"
      scan_interval: 3600
      value_template: "{{ value_json.totali.totale }}"
      json_attributes:
        - mesi
        - righe
        - totali
