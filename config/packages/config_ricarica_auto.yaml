# config_ricarica_auto_3.yaml
# v3 (08/10/2026): energia gia' presente nel SC non piu' dal SoC dell'inverter
#   ma dal conteggio reale di sensor.condensatore_energia_al_pieno
#   (config_fotovoltaico). Curva tensione/energia corretta con la coda finale
#   di carica a tensione quasi costante (circa 0,85 kWh) che la v1-v2 non
#   contava. Energia utile da impostare a 6,5 kWh invece di 5,65.
# v2 (08/10/2026): limite di carica del SC calcolato con la tensione che il SC
#   raggiunge passo per passo nella simulazione.
# v1 (08/10/2026): prima versione. Previsione del pieno del condensatore con
#   l'auto in carica, base per lo stacco automatico della ricarica.
# Package Casa Ginepro - Ricarica auto: previsione pieno condensatore SC.
# Nome file = nome del package. Richiede config_fotovoltaico v10 o successiva.
#
#==================================================================================
# IDEA
# Con l'auto in carica il fotovoltaico deve bastare sia all'auto sia al
# condensatore (SC). Ogni 5 minuti si simula il resto della giornata e si
# calcola T1, il tempo che serve al SC per arrivare al pieno. Se il pieno non
# viene raggiunto prima che il surplus FV finisca, la ricarica dell'auto va
# staccata (automations_ricarica_auto).
#
# MODELLO DI PRODUZIONE
#   forma  = profilo orario di una giornata serena di questo periodo dell'anno
#            (sensor.pv_profilo_sereno, calcolato ogni notte dalle statistiche)
#   scala  = prodotto oggi finora / prodotto dal profilo sereno fino ad adesso
#   produzione prevista nell'ora h = scala x profilo[h]
# La scala misura il tempo di OGGI. Non prevede nuvole in arrivo. Sotto la
# soglia di produzione serena attesa (input_number) lo stato resta
# "non valutabile".
#
# ENERGIA GIA' NEL SC (v3)
# Perche' non il SoC: dai dati 01-08/10/2026 il SoC dell'inverter arriva a
# 100% gia' fra 55 e 56 V, quando mancano ancora circa 0,85 kWh di coda finale.
# Si usa invece:
#   livello = energia gia' presente al minimo del mattino
#             + energia netta entrata da quel minimo (contatori inverter)
# Il secondo termine e' lo stato di sensor.condensatore_energia_al_pieno;
# il primo si ricava dalla tensione minima (attributo v_min) con la curva
# sotto. Quasi tutti i giorni il minimo e' 43,98 V, cioe' SC vuoto, e il
# primo termine vale zero. Se il sensore indica gia' l'ora del pieno, lo stato
# e' "pieno".
#
# CURVA TENSIONE / ENERGIA (v3)
# Misurata il 01-08/10/2026 (6 cariche complete, tensione sotto carica):
# energia presente nel SC in funzione della tensione, in kWh:
#   V    43,5 44,5 45,5 46,5 47,5 48,5 49,5 50,5 51,5 52,5 53,5 54,5 55,5 56,5 56,7 57,5
#   kWh  0    0,01 0,05 0,09 0,17 0,33 0,74 1,29 2,09 3,16 4,06 4,67 5,13 5,48 5,66 6,50
# Fino a 56,7 V sono i valori misurati; il tratto 56,7-57,5 V e' la coda
# finale (6,50 - 5,66 = circa 0,85 kWh, differenza fra la carica netta oraria
# di ottobre e la misura fino al primo tocco di 56,7 V). In tabella l'energia
# e' espressa come frazione di 6,50: resta valida se si corregge l'energia utile.
#
# LIMITE DI CARICA DEL SC
# max_charging_current x tensione ricavata dalla curva al livello simulato.
# LIMITE NOTO: nella coda finale l'inverter riduce la corrente, ma di quanto
# NON e' stato misurato. La simulazione usa la corrente piena anche li', quindi
# per l'ultimo 0,85 kWh T1 e' ottimista. Il margine (input_number) compensa
# in parte.
#
# CARICO DELLA CASA
# Media degli ultimi 15 minuti di sensor.inverter_uflex_load_power, auto
# compresa, tenuta costante per il resto della giornata.
#==================================================================================

sensor:
  # Media mobile 15 minuti del carico casa (W). Integrazione statistics,
  # caratteristica "mean". Il load_power si aggiorna ogni pochi secondi:
  # 1000 campioni bastano per 15 minuti con margine.
  - platform: statistics
    name: "Carico Casa Media 15 min"
    unique_id: carico_casa_media_15_min
    entity_id: sensor.inverter_uflex_load_power
    state_characteristic: mean
    max_age:
      minutes: 15
    sampling_size: 1000

command_line:
  # Profilo orario sereno (kWh per ora, 24 valori, ora locale). Il JSON e'
  # scritto dallo shell_command calcola_pv_profilo_sereno.
  - sensor:
      name: PV Profilo Sereno
      unique_id: pv_profilo_sereno
      command: "cat /config/pv_profilo_sereno.json 2>/dev/null"
      scan_interval: 3600
      value_template: "{{ value_json.totale_sereno | default(0) }}"
      unit_of_measurement: "kWh"
      json_attributes:
        - profilo
        - giorni_finestra
        - giorni_sereni
        - calcolato
        - errore

shell_command:
  calcola_pv_profilo_sereno: "python3 /config/pv_profilo_sereno.py > /config/pv_profilo_sereno.json 2>/config/pv_profilo_sereno.log"

input_number:
  # v3: energia che entra nel SC dal vuoto (circa 44 V) al pieno deciso
  # dall'inverter, coda finale a tensione costante compresa. Da impostare a
  # 6,5 kWh (carica netta settembre-ottobre 2026) e da ritoccare guardando il
  # grafico "Energia condensatore al pieno" della plancia fotovoltaico.
  condensatore_energia_utile:
    name: "Condensatore - Energia utile"
    min: 1
    max: 10
    step: 0.05
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:battery-high

  ricarica_auto_margine:
    name: "Ricarica auto - Margine previsione"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    mode: box
    icon: mdi:shield-half-full

  ricarica_auto_soglia_sereno:
    name: "Ricarica auto - Soglia valutabilita'"
    min: 0.5
    max: 10
    step: 0.5
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:weather-sunset-up

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - switch.solo_auto_contattore_interruttore
          - sensor.condensatore_energia_al_pieno
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Condensatore Previsione Pieno"
        unique_id: condensatore_previsione_pieno
        icon: mdi:battery-clock
        # Stati possibili:
        #   pieno             il SC ha gia' raggiunto il pieno oggi
        #   raggiungibile     T1 entro la fine del surplus
        #   non raggiungibile il surplus finisce prima del pieno
        #   non valutabile    notte, mattino presto, dati mancanti
        # Stato e attributo eseguono lo stesso calcolo (testo identico).
        state: >-
          {%- set p = state_attr('sensor.pv_profilo_sereno', 'profilo') -%}
          {%- set cap = states('sensor.condensatore_energia_al_pieno') | float(-1) -%}
          {%- set vmin = state_attr('sensor.condensatore_energia_al_pieno', 'v_min') -%}
          {%- set gia_pieno = state_attr('sensor.condensatore_energia_al_pieno', 'ora_pieno') -%}
          {%- set curva = [[43.5,0.0],[44.5,0.002],[45.5,0.008],[46.5,0.014],[47.5,0.026],[48.5,0.051],[49.5,0.114],[50.5,0.198],[51.5,0.322],[52.5,0.486],[53.5,0.625],[54.5,0.718],[55.5,0.789],[56.5,0.843],[56.7,0.871],[57.5,1.0]] -%}
          {%- set eu = states('input_number.condensatore_energia_utile') | float(6.5) -%}
          {%- set adesso = now() -%}
          {%- set hf = adesso.hour + adesso.minute / 60 -%}
          {%- set h = adesso.hour -%}
          {%- set r = namespace(stato='non valutabile', d={}) -%}
          {%- if p is iterable and p is not string and p | count == 24 and cap >= 0 and vmin is not none -%}
            {%- set nv = namespace(f0=0) -%}
            {%- for k in range(curva | count - 1) -%}
              {%- if vmin | float >= curva[k][0] and vmin | float <= curva[k + 1][0] -%}
                {%- set nv.f0 = curva[k][1] + (vmin | float - curva[k][0]) / (curva[k + 1][0] - curva[k][0]) * (curva[k + 1][1] - curva[k][1]) -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set f0 = 1.0 if vmin | float > curva[-1][0] else nv.f0 -%}
            {%- set livello = [f0 * eu + cap, eu] | min -%}
            {%- set mancante = eu - livello -%}
            {%- set serve = mancante * (1 + states('input_number.ricarica_auto_margine') | float(10) / 100) -%}
            {%- set sereno_fatto = (p[:h] | sum) + p[h] * (hf - h) -%}
            {%- set prodotto = states('sensor.inverter_uflex_today_production') | float(0) -%}
            {%- set scala = prodotto / sereno_fatto if sereno_fatto > 0 else 0 -%}
            {%- set carico = states('sensor.carico_casa_media_15_min') | float(states('sensor.inverter_uflex_load_power') | float(0)) / 1000 -%}
            {%- set imax = states('number.inverter_uflex_battery_max_charging_current') | float(80) -%}
            {%- set ns = namespace(e=0, t1=none, ultimo=0, pv=0) -%}
            {%- for i in range(1, ((24 - hf) * 12) | int + 1) -%}
              {%- set t = hf + i / 12 -%}
              {%- set pv = scala * p[[(t - 1 / 24) | int, 23] | min] -%}
              {%- set ns.pv = ns.pv + pv / 12 -%}
              {%- set surplus = pv - carico -%}
              {%- if surplus > 0 -%}
                {%- set fl = [(livello + ns.e) / eu, 1.0] | min -%}
                {%- set vv = namespace(v=curva[-1][0]) -%}
                {%- for k in range(curva | count - 1) -%}
                  {%- if fl >= curva[k][1] and fl <= curva[k + 1][1] and vv.v == curva[-1][0] -%}
                    {%- set vv.v = curva[k][0] + (fl - curva[k][1]) / (curva[k + 1][1] - curva[k][1]) * (curva[k + 1][0] - curva[k][0]) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set ns.e = ns.e + [surplus, imax * vv.v / 1000] | min / 12 -%}
                {%- set ns.ultimo = i * 5 -%}
              {%- endif -%}
              {%- if ns.t1 is none and ns.e >= serve -%}
                {%- set ns.t1 = i * 5 -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if gia_pieno or mancante <= 0 -%}
              {%- set r.stato = 'pieno' -%}
            {%- elif sereno_fatto < states('input_number.ricarica_auto_soglia_sereno') | float(1) -%}
              {%- set r.stato = 'non valutabile' -%}
            {%- elif ns.t1 is not none -%}
              {%- set r.stato = 'raggiungibile' -%}
            {%- else -%}
              {%- set r.stato = 'non raggiungibile' -%}
            {%- endif -%}
            {%- set r.d = {
                 'v_min': vmin | float,
                 'energia_al_minimo_kwh': (f0 * eu) | round(2),
                 'entrata_dal_minimo_kwh': cap | round(2),
                 'livello_kwh': livello | round(2),
                 'energia_mancante_kwh': serve | round(2),
                 'prodotto_oggi_kwh': prodotto | round(2),
                 'sereno_fatto_kwh': sereno_fatto | round(2),
                 'scala': scala | round(2),
                 'produzione_residua_kwh': ns.pv | round(2),
                 'carico_kw': carico | round(2),
                 'energia_sc_prevista_kwh': ns.e | round(2),
                 't1_min': ns.t1,
                 'disponibile_min': ns.ultimo,
                 'ora_pieno': (adesso + timedelta(minutes=ns.t1)).strftime('%H:%M') if ns.t1 is not none else none,
                 'fine_surplus': (adesso + timedelta(minutes=ns.ultimo)).strftime('%H:%M') if ns.ultimo > 0 else none
               } -%}
          {%- endif -%}
          {{- r.stato -}}
        attributes:
          calcolo: >-
            {%- set p = state_attr('sensor.pv_profilo_sereno', 'profilo') -%}
            {%- set cap = states('sensor.condensatore_energia_al_pieno') | float(-1) -%}
            {%- set vmin = state_attr('sensor.condensatore_energia_al_pieno', 'v_min') -%}
            {%- set gia_pieno = state_attr('sensor.condensatore_energia_al_pieno', 'ora_pieno') -%}
            {%- set curva = [[43.5,0.0],[44.5,0.002],[45.5,0.008],[46.5,0.014],[47.5,0.026],[48.5,0.051],[49.5,0.114],[50.5,0.198],[51.5,0.322],[52.5,0.486],[53.5,0.625],[54.5,0.718],[55.5,0.789],[56.5,0.843],[56.7,0.871],[57.5,1.0]] -%}
            {%- set eu = states('input_number.condensatore_energia_utile') | float(6.5) -%}
            {%- set adesso = now() -%}
            {%- set hf = adesso.hour + adesso.minute / 60 -%}
            {%- set h = adesso.hour -%}
            {%- set r = namespace(stato='non valutabile', d={}) -%}
            {%- if p is iterable and p is not string and p | count == 24 and cap >= 0 and vmin is not none -%}
              {%- set nv = namespace(f0=0) -%}
              {%- for k in range(curva | count - 1) -%}
                {%- if vmin | float >= curva[k][0] and vmin | float <= curva[k + 1][0] -%}
                  {%- set nv.f0 = curva[k][1] + (vmin | float - curva[k][0]) / (curva[k + 1][0] - curva[k][0]) * (curva[k + 1][1] - curva[k][1]) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set f0 = 1.0 if vmin | float > curva[-1][0] else nv.f0 -%}
              {%- set livello = [f0 * eu + cap, eu] | min -%}
              {%- set mancante = eu - livello -%}
              {%- set serve = mancante * (1 + states('input_number.ricarica_auto_margine') | float(10) / 100) -%}
              {%- set sereno_fatto = (p[:h] | sum) + p[h] * (hf - h) -%}
              {%- set prodotto = states('sensor.inverter_uflex_today_production') | float(0) -%}
              {%- set scala = prodotto / sereno_fatto if sereno_fatto > 0 else 0 -%}
              {%- set carico = states('sensor.carico_casa_media_15_min') | float(states('sensor.inverter_uflex_load_power') | float(0)) / 1000 -%}
              {%- set imax = states('number.inverter_uflex_battery_max_charging_current') | float(80) -%}
              {%- set ns = namespace(e=0, t1=none, ultimo=0, pv=0) -%}
              {%- for i in range(1, ((24 - hf) * 12) | int + 1) -%}
                {%- set t = hf + i / 12 -%}
                {%- set pv = scala * p[[(t - 1 / 24) | int, 23] | min] -%}
                {%- set ns.pv = ns.pv + pv / 12 -%}
                {%- set surplus = pv - carico -%}
                {%- if surplus > 0 -%}
                  {%- set fl = [(livello + ns.e) / eu, 1.0] | min -%}
                  {%- set vv = namespace(v=curva[-1][0]) -%}
                  {%- for k in range(curva | count - 1) -%}
                    {%- if fl >= curva[k][1] and fl <= curva[k + 1][1] and vv.v == curva[-1][0] -%}
                      {%- set vv.v = curva[k][0] + (fl - curva[k][1]) / (curva[k + 1][1] - curva[k][1]) * (curva[k + 1][0] - curva[k][0]) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.e = ns.e + [surplus, imax * vv.v / 1000] | min / 12 -%}
                  {%- set ns.ultimo = i * 5 -%}
                {%- endif -%}
                {%- if ns.t1 is none and ns.e >= serve -%}
                  {%- set ns.t1 = i * 5 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if gia_pieno or mancante <= 0 -%}
                {%- set r.stato = 'pieno' -%}
              {%- elif sereno_fatto < states('input_number.ricarica_auto_soglia_sereno') | float(1) -%}
                {%- set r.stato = 'non valutabile' -%}
              {%- elif ns.t1 is not none -%}
                {%- set r.stato = 'raggiungibile' -%}
              {%- else -%}
                {%- set r.stato = 'non raggiungibile' -%}
              {%- endif -%}
              {%- set r.d = {
                   'v_min': vmin | float,
                   'energia_al_minimo_kwh': (f0 * eu) | round(2),
                   'entrata_dal_minimo_kwh': cap | round(2),
                   'livello_kwh': livello | round(2),
                   'energia_mancante_kwh': serve | round(2),
                   'prodotto_oggi_kwh': prodotto | round(2),
                   'sereno_fatto_kwh': sereno_fatto | round(2),
                   'scala': scala | round(2),
                   'produzione_residua_kwh': ns.pv | round(2),
                   'carico_kw': carico | round(2),
                   'energia_sc_prevista_kwh': ns.e | round(2),
                   't1_min': ns.t1,
                   'disponibile_min': ns.ultimo,
                   'ora_pieno': (adesso + timedelta(minutes=ns.t1)).strftime('%H:%M') if ns.t1 is not none else none,
                   'fine_surplus': (adesso + timedelta(minutes=ns.ultimo)).strftime('%H:%M') if ns.ultimo > 0 else none
                 } -%}
            {%- endif -%}
            {{- r.d -}}
