# config_deumidificatori_3.yaml
# Package Casa Ginepro - Deumidificatori cantina e armadio
# Estratto da configuration_186.yaml. Nome file = nome del package.

template:
  - triggers:
      - trigger: state
        entity_id:
          - sensor.deumidificatore_armadio_oggi
          - sensor.box_deumidificatore_cantina_sonoff_energy_day
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      # Il contatore Sonoff _energy_day resta congelato sul valore finale del
      # giorno precedente dalla mezzanotte fino alle 07:00-09:00, poi riprende
      # ad aggiornarsi gia' azzerato. HA legge quel residuo come nuova crescita
      # e gonfia la statistica 'change' (27/08: 4,81 kWh invece di 0,83).
      # Soluzione: azzerare fino alle 10:00. Poiche' il contatore e' cumulativo
      # sulla giornata, il valore letto dopo le 10:00 comprende gia' le ore
      # notturne: azzerare in mattinata non perde nulla sul totale del giorno.
      - name: "Consumo Deumidificatore Cantina Oggi"
        unique_id: "consumo_deumidificatore_cantina_oggi"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:water-percent
        availability: >-
          {{ has_value('sensor.box_deumidificatore_cantina_sonoff_energy_day') }}
        state: >-
          {% if now().hour < 10 %}
            0
          {% else %}
            {{ states('sensor.box_deumidificatore_cantina_sonoff_energy_day')
               | float(0) | round(3) }}
          {% endif %}

      # Nessun blocco monotono sulla somma: quello precedente congelava il
      # totale finche' non veniva superato, inghiottendo anche gli incrementi
      # dell'armadio (322 campioni non monotoni su 927). La regola della
      # cantina e' ripetuta qui inline per non dipendere dall'ordine di
      # valutazione dei sensori dentro lo stesso blocco template.
      - name: "Consumo Deumidificatori Oggi"
        unique_id: "consumo_deumidificatori_oggi"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:water-percent
        availability: >-
          {{ has_value('sensor.deumidificatore_armadio_oggi')
             and has_value('sensor.box_deumidificatore_cantina_sonoff_energy_day') }}
        state: >-
          {% set cantina = 0 if now().hour < 10 else
                 states('sensor.box_deumidificatore_cantina_sonoff_energy_day') | float(0) %}
          {{ (states('sensor.deumidificatore_armadio_oggi') | float(0) + cantina) | round(3) }}

utility_meter:

  deumidificatore_armadio_oggi:
    name: "Deumidificatore Armadio Oggi"
    source: sensor.deumidificatore_armadio_zigbee_energy
    cycle: daily

  # --- DEUMIDIFICATORI (cantina + armadio) ---
  deumidificatori_mese:
    name: "Deumidificatori Mese"
    unique_id: deumidificatori_mese
    source: sensor.consumo_deumidificatori_oggi
    cycle: monthly

  deumidificatori_totale:
    name: "Deumidificatori Totale"
    unique_id: deumidificatori_totale
    source: sensor.consumo_deumidificatori_oggi

input_boolean:

  deumidificatore_cantina_manuale:
    name: "Deumidificatore Cantina - Gestione Manuale"
    initial: false
    icon: mdi:hand-back-right

  deumidificatore_armadio_manuale:
    name: "Deumidificatore Armadio - Gestione Manuale"
    initial: false
    icon: mdi:hand-back-right
