# config_deumidificatori_5.yaml
# Package Casa Ginepro - Deumidificatori cantina e armadio
# Estratto da configuration_186.yaml. Nome file = nome del package.

template:
  - triggers:
      - trigger: state
        entity_id:
          - sensor.deumidificatore_armadio_oggi
          - sensor.box_deumidificatore_cantina_sonoff_energy_day
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      # CAUSA MISURATA DEL GONFIAGGIO DELLE STATISTICHE
      # Il contatore Sonoff _energy_day non e' monotono: scende piu' volte al
      # giorno e risale al valore pieno. Ogni discesa viene letta da HA come
      # reset di un total_increasing e il valore successivo viene riaddizionato
      # per intero al 'sum'. Misura sul DB, 01-12/09/2026:
      #   consumo_deumidificatore_cantina_oggi     change 75,74 kWh
      #   somma dei massimi giornalieri (reale)            15,74 kWh
      #   box_deumidificatore_cantina_sonoff_energy_day
      #                                            change 84,73 kWh
      #   somma dei massimi giornalieri (reale)            18,32 kWh
      # Firma tipica: 02/09 ore 17:00 delta sum 8,19 kWh con state max 2,03;
      # alle 18:00 delta 2,07 esattamente pari al massimo del giorno.
      # L'azzeramento fino alle 10:00 della versione precedente correggeva
      # solo il residuo notturno del 27/08: non bastava, il gonfiaggio grosso
      # avviene nel pomeriggio.
      #
      # Soluzione: massimo progressivo. Il contatore e' cumulativo sulla
      # giornata, quindi il massimo visto durante la giornata E' il consumo
      # del giorno, e il massimo e' immune alle discese spurie.
      # 'this' e' la variabile di autoriferimento documentata in
      # https://www.home-assistant.io/integrations/template/#self-referencing
      # Lo stato dei sensori template con trigger viene ripristinato al
      # riavvio, quindi il massimo progressivo sopravvive ai restart.
      # L'azzeramento fino alle 10:00 resta necessario: dalla mezzanotte fino
      # alle 07:00-09:00 il contatore Sonoff e' congelato sul valore finale
      # del giorno prima, e il massimo progressivo lo ricatturerebbe subito.
      - name: "Consumo Deumidificatore Cantina Oggi"
        unique_id: "consumo_deumidificatore_cantina_oggi"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:water-percent
        availability: >-
          {{ has_value('sensor.box_deumidificatore_cantina_sonoff_energy_day') }}
        state: >-
          {% if now().hour < 10 %}
            0
          {% else %}
            {% set src = states('sensor.box_deumidificatore_cantina_sonoff_energy_day')
                         | float(0) %}
            {% set prec = this.state | float(0) %}
            {{ [src, prec] | max | round(3) }}
          {% endif %}

      # Stessa protezione sull'aggregato. Prima delle 10:00 il valore e' il
      # solo armadio e NON passa dal massimo progressivo: l'utility_meter
      # dell'armadio si azzera a mezzanotte e quello e' un reset legittimo,
      # uno solo al giorno. Dalle 10:00 in poi armadio + cantina con massimo
      # progressivo. La regola della cantina e' ripetuta inline per non
      # dipendere dall'ordine di valutazione dentro lo stesso blocco.
      - name: "Consumo Deumidificatori Oggi"
        unique_id: "consumo_deumidificatori_oggi"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:water-percent
        availability: >-
          {{ has_value('sensor.deumidificatore_armadio_oggi')
             and has_value('sensor.box_deumidificatore_cantina_sonoff_energy_day') }}
        state: >-
          {% set armadio = states('sensor.deumidificatore_armadio_oggi') | float(0) %}
          {% if now().hour < 10 %}
            {{ armadio | round(3) }}
          {% else %}
            {% set cantina = states('sensor.box_deumidificatore_cantina_sonoff_energy_day')
                             | float(0) %}
            {% set prec = this.state | float(0) %}
            {{ [armadio + cantina, prec] | max | round(3) }}
          {% endif %}

utility_meter:

  deumidificatore_armadio_oggi:
    name: "Deumidificatore Armadio Oggi"
    source: sensor.deumidificatore_armadio_zigbee_energy
    cycle: daily

  # --- DEUMIDIFICATORI (cantina + armadio) ---
  deumidificatori_mese:
    name: "Deumidificatori Mese"
    unique_id: deumidificatori_mese
    source: sensor.consumo_deumidificatori_oggi
    cycle: monthly

  deumidificatori_totale:
    name: "Deumidificatori Totale"
    unique_id: deumidificatori_totale
    source: sensor.consumo_deumidificatori_oggi

# I due flag non hanno la chiave di valore iniziale: senza di essa Home Assistant
# ripristina allo start lo stato che avevano prima dello stop, invece di forzarli
# a spento. Fonte: https://www.home-assistant.io/integrations/input_boolean/
# (sezione Restore state). Con il valore iniziale forzato a false, ogni riavvio
# azzerava la gestione manuale e il controllo periodico rispegneva la presa
# entro 5 minuti.
input_boolean:

  deumidificatore_cantina_manuale:
    name: "Deumidificatore Cantina - Gestione Manuale"
    icon: mdi:hand-back-right

  deumidificatore_armadio_manuale:
    name: "Deumidificatore Armadio - Gestione Manuale"
    icon: mdi:hand-back-right