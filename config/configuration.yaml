# configuration_188.yaml
#==================================================================================
# INDICE. Tutta la configurazione dei sottosistemi vive in /config/packages/.
# Un file per sottosistema, il nome del file e' il nome del package.
# Qui restano solo le integrazioni che NON si possono spezzare tra package
# (recorder, frontend, logger) e i riferimenti a automazioni/script/scene.
#==================================================================================
default_config:

homeassistant:
  allowlist_external_dirs:
    - /sys
    - /config
  # Carica come package ogni .yaml dentro /config/packages/ e sottocartelle.
  # ATTENZIONE: il nome del file e' il nome del package e deve essere unico.
  # Aggiungere un file nuovo richiede riavvio RAPIDO (solo HA).
  packages: !include_dir_named packages

#==================================================================================
# RECORDER - Esclusioni entità ad alta frequenza per contenere il database
# Escluse solo dallo storico dettagliato: automazioni, statistiche a lungo
# termine, dashboard Energia e tabella FV mensile NON sono influenzate.
#==================================================================================
recorder:
  purge_keep_days: 7
  exclude:
    entities:
      - binary_sensor.inverter_uflex_connection
      - sensor.inverter_uflex_update_interval
      - sensor.wifi_tabella
    entity_globs:
      - sensor.panasonic_heat_pump_stats_*
      - sensor.inverter_uflex_*_l1_*
      - sensor.inverter_uflex_*_current
      - sensor.inverter_uflex_external_ct1_*

frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: warning

#--- GRUPPO SPEAKER GOOGLE HOME ---
media_player:
  - platform: group
    name: Tutti gli Speaker
    unique_id: tutti_gli_speaker
    entities:
      - media_player.cromecast_sotto
      - media_player.google_home_georgi
      - media_player.google_home_sopra
      - media_player.salotto
      - media_player.googlehome8851
