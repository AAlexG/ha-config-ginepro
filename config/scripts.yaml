#==================================================================================
# SCRIPT: AVVISO VOCALE SOVRACCARICO (scripts_52)
# Richiamato da automations_elettricita (distacco carichi) quando il prelievo da rete resta sopra
# soglia e non c'e' piu' nessun carico gestibile da staccare: auto, pompa e
# deumidificatori sono gia' fermi, quindi i kW arrivano da elettrodomestici
# che HA non comanda.
# Stesso schema di speaker_allarme: salva i volumi, alza, parla, ripristina.
# Volume 0.8 invece di 1.0: e' un avviso, non l'allarme intrusione.
# Il messaggio viene ripetuto 2 volte a 12 secondi di distanza.
#==================================================================================
avviso_vocale_sovraccarico:
  alias: "Avviso vocale - Sovraccarico rete"
  mode: single
  sequence:
    - variables:
        vol_salotto: "{{ state_attr('media_player.salotto', 'volume_level') | float(0.5) }}"
        vol_cromecast_sotto: "{{ state_attr('media_player.cromecast_sotto', 'volume_level') | float(0.5) }}"
        vol_google_home_georgi: "{{ state_attr('media_player.google_home_georgi', 'volume_level') | float(0.5) }}"
        vol_google_home_sopra: "{{ state_attr('media_player.google_home_sopra', 'volume_level') | float(0.5) }}"
        vol_googlehome8851: "{{ state_attr('media_player.googlehome8851', 'volume_level') | float(0.5) }}"
    - action: media_player.turn_on
      continue_on_error: true
      target:
        entity_id: media_player.tutti_gli_speaker
    - delay: "00:00:01"
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id:
          - media_player.salotto
          - media_player.cromecast_sotto
          - media_player.google_home_georgi
          - media_player.google_home_sopra
          - media_player.googlehome8851
      data:
        volume_level: 0.8
    - repeat:
        count: 2
        sequence:
          - action: tts.speak
            continue_on_error: true
            target:
              entity_id: tts.google_translate_en_com
            data:
              media_player_entity_id: media_player.tutti_gli_speaker
              message: >-
                Attenzione. Consumo elettrico oltre il limite del contatore.
                Spegnere subito gli apparecchi in cucina, la lavatrice e il
                ferro da stiro.
              language: it
              cache: true
              options:
                preferred_format: mp3
                preferred_sample_rate: "44100"
          - delay: "00:00:12"
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.salotto
      data:
        volume_level: "{{ vol_salotto }}"
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.cromecast_sotto
      data:
        volume_level: "{{ vol_cromecast_sotto }}"
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.google_home_georgi
      data:
        volume_level: "{{ vol_google_home_georgi }}"
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.google_home_sopra
      data:
        volume_level: "{{ vol_google_home_sopra }}"
    - action: media_player.volume_set
      continue_on_error: true
      target:
        entity_id: media_player.googlehome8851
      data:
        volume_level: "{{ vol_googlehome8851 }}"

#==================================================================================
# SCRIPT: SALVA BOLLETTA
# Chiama shell_command.salva_bolletta (Python -> SQLite) e restituisce
# il risultato come JSON su stdout. Nessun prezzo viene più scritto qui
# (scripts_40): i prezzi medi restano solo nel log Python come dato di
# controllo. I prezzi A CONSUMO sono gestiti altrove:
#   input_number.elettricita_prezzo_kwh -> automatico dal PUN
#     (automations_elettricita, sensor.elettricita_prezzo_kwh_variabile)
#   input_number.gas_prezzo_mc          -> manuale da bolletta
#     (Corrispettivo Gas Index + contributo + rete + accise, IVA inclusa)
# Le quote fisse mensili sono in input_number.*_quota_fissa_mese (manuali).
#==================================================================================
salva_bolletta:
  alias: "Bollette – Salva nel DB"
  mode: single
  sequence:
    # I valori sono presi QUI dallo stato vivo di HA e passati come argomenti
    # a salva_bolletta.py (v10). In precedenza lo script li rileggeva dalla
    # tabella states del recorder: se il salvataggio avveniva pochi secondi
    # dopo aver digitato un importo, il recorder non aveva ancora scritto la
    # riga su disco e lo script leggeva il valore precedente (di norma 0),
    # saltando la scrittura senza segnalare alcun errore.
    - action: shell_command.salva_bolletta
      data:
        mese: "{{ states('input_select.bolletta_mese_sel') }}"
        elec_kwh: "{{ states('input_number.bolletta_elec_kwh') | float(0) }}"
        elec_euro: "{{ states('input_number.bolletta_elec_euro') | float(0) }}"
        gas_mc: "{{ states('input_number.bolletta_gas_mc') | float(0) }}"
        gas_euro: "{{ states('input_number.bolletta_gas_euro') | float(0) }}"
        acqua_mc: "{{ states('input_number.bolletta_acqua_mc') | float(0) }}"
        acqua_euro: "{{ states('input_number.bolletta_acqua_euro') | float(0) }}"
        gse_euro: "{{ states('input_number.bolletta_gse_euro') | float(0) }}"
      response_variable: risultato
    - variables:
        dati: "{{ risultato.stdout | from_json }}"
    - if:
        - condition: template
          value_template: "{{ dati.ok }}"
      then:
        # Aggiorna il prezzo GSE stimato con l'ultimo mese calcolato.
        - if:
            - condition: template
              value_template: "{{ (dati.gse_prezzo_ultimo | default(0) | float(0)) > 0 }}"
          then:
            - action: input_number.set_value
              target:
                entity_id: input_number.gse_prezzo_kwh_stima
              data:
                value: "{{ dati.gse_prezzo_ultimo | float(0) | round(4) }}"
        # Ricalcola subito i totali storici (Da GSE, risparmio FV, totali
        # rilevato/bollette). Senza questa chiamata la plancia restava ferma
        # fino alla successiva esecuzione oraria dell'automazione 30.
        - action: script.aggiorna_totali_consumi
        - action: notify.mobile_app_cph2653
          data:
            title: "💾 Bolletta salvata"
            message: >
              {{ dati.saved }} valori salvati per {{ dati.mese }}.
              Totali aggiornati.
              Dettagli in /config/bolletta_log.txt
      else:
        - action: notify.mobile_app_cph2653
          data:
            title: "⚠️ Errore salvataggio bolletta"
            message: >-
              {{ dati.errore | default('errore sconosciuto') }} – vedi /config/bolletta_log.txt

#==================================================================================
# SCRIPT: AGGIORNA TOTALI CONSUMI
# Chiama totali_consumi.py e riversa il JSON di ritorno nei 10 input_number
# dei totali storici. Estratto dall'automazione 30 (automations_123) per
# poter essere richiamato anche subito dopo un salvataggio bolletta.
#==================================================================================
aggiorna_totali_consumi:
  alias: "Consumi – Aggiorna totali storici"
  mode: single
  sequence:
    - action: shell_command.calcola_totali_consumi
      response_variable: totali
    - variables:
        t: "{{ totali.stdout | from_json }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gas_totale_rilevato_mc
      data:
        value: "{{ t.gas_rilevato }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.gas_totale_bollette_mc
      data:
        value: "{{ t.gas_bollette }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.elettricita_totale_rilevato_kwh
      data:
        value: "{{ t.elec_rilevato }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.elettricita_totale_bollette_kwh
      data:
        value: "{{ t.elec_bollette }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.acqua_totale_rilevato_mc
      data:
        value: "{{ t.acqua_rilevato }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.acqua_totale_bollette_mc
      data:
        value: "{{ t.acqua_bollette }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.pv_risparmio_euro
      data:
        value: "{{ t.pv_risparmio }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.pv_gse_euro
      data:
        value: "{{ t.pv_gse }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.pv_totale_euro
      data:
        value: "{{ t.pv_totale }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.pv_recupero_pct
      data:
        value: "{{ t.pv_recupero_pct }}"
#==================================================================================
# SCRIPT: IRRIGAZIONE – ESEGUI SEQUENZA C1 -> C2 -> C3
# Accende in sequenza i tre canali per le durate T1/T2/T3 (turn_off esplicito tra
# un canale e l'altro). Chiamato dal ciclo programmato (dopo il gate meteo) e da "Cicla ora".
#==================================================================================
irrigazione_esegui_sequenza:
  alias: "Irrigazione – Esegui sequenza C1→C2→C3"
  mode: single
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_1
    - delay:
        minutes: "{{ states('input_number.irrigazione_durata_c1') | int(0) }}"
    - action: switch.turn_off
      target:
        entity_id: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_1
    - action: switch.turn_on
      target:
        entity_id: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_2
    - delay:
        minutes: "{{ states('input_number.irrigazione_durata_c2') | int(0) }}"
    - action: switch.turn_off
      target:
        entity_id: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_2
    - action: switch.turn_on
      target:
        entity_id: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_3
    - delay:
        minutes: "{{ states('input_number.irrigazione_durata_c3') | int(0) }}"
    - action: switch.turn_off
      target:
        entity_id: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_3

#==================================================================================
# SCRIPT: IRRIGAZIONE – CICLA ORA (manuale) — ignora meteo e "salta oggi"
#==================================================================================
irrigazione_cicla_ora:
  alias: "Irrigazione – Cicla ora"
  mode: single
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigazione_motivo_blocco
      data:
        value: "🖐️ Ciclo manuale avviato {{ now().strftime('%d/%m/%Y %H:%M') }}"
    - action: script.irrigazione_esegui_sequenza

#==================================================================================
# SCRIPT: IRRIGAZIONE – STOP (interrompe la sequenza e spegne tutti i canali)
#==================================================================================
irrigazione_stop:
  alias: "Irrigazione – Stop tutti i canali"
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id:
          - script.irrigazione_esegui_sequenza
          - script.irrigazione_cicla_ora
    - action: switch.turn_off
      target:
        entity_id:
          - switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_1
          - switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_2
          - switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_3
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigazione_motivo_blocco
      data:
        value: "⏹️ Irrigazione fermata {{ now().strftime('%d/%m/%Y %H:%M') }}"

#==================================================================================
# SCRIPT: IRRIGAZIONE – SALTA OGGI (toggle) — auto-ripristino a mezzanotte
# Usato dal tap_action del tile Irrigazione in plancia ginepro e irrigazione.
#==================================================================================
irrigazione_salta_toggle:
  alias: "Irrigazione – Salta oggi (toggle)"
  mode: single
  sequence:
    - action: input_boolean.toggle
      target:
        entity_id: input_boolean.irrigazione_salta_oggi
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigazione_motivo_blocco
      data:
        value: >-
          {{ '🖐️ Programma saltato per oggi'
             if is_state('input_boolean.irrigazione_salta_oggi','on')
             else '✅ Programma riattivato' }}

#==================================================================================
# SCRIPT: RIAGGANCIA YAMAHA
# - Forza il Google Home Mini a riprendere lo stream verso la cassa Yamaha BT
# - stop -> attesa -> ripristino volume (notte 1% / giorno 20% solo se era 1%) -> play file uccelli
# - Non interferisce se è in corso musica vera (media_title valorizzato)
#==================================================================================
riaggancia_yamaha:
  alias: "Uccelli"
  mode: single
  sequence:
    - action: media_player.volume_set
      target:
        entity_id: media_player.googlehome8851
      data:
        volume_level: 0.20
    - action: media_player.play_media
      target:
        entity_id: media_player.googlehome8851
      data:
        media_content_id: "http://192.168.1.77:8123/local/birdssongs.mp3"
        media_content_type: "music"

#==================================================================================
# SCRIPT: FONTE – IMPOSTA LA FONTE DI CALORE IN SICUREZZA (scripts_57)
#
# Unico punto che sposta la valvola pompa/caldaia (switch.shelly_box:
# on = Pompa, off = Caldaia). Lo usano gestione fonte, riaccensione in
# raffrescamento, antigelo e i comandi manuali delle plance.
# Sequenza: spegne la fonte opposta -> 30 s -> valvola -> 120 s -> accende
# la fonte scelta (se richiesto). Due fonti non sono mai accese insieme e
# nessuna fonte si accende con la valvola nella posizione sbagliata.
#
# Flag manuali (li abbassa solo l'utente, lo script non li cambia mai):
#   pdc_manuale     -> la pompa non viene toccata, salvo chi = manuale
#   caldaia_manuale -> il SAT non viene toccato, salvo chi = manuale
# (chi = manuale: comando dell'utente dalle plance. L'antigelo usa
# chi = antigelo e sceglie gia' una fonte libera.)
# Se per completare la sequenza servirebbe toccare un apparecchio bloccato, o
# se la caldaia viene chiesta con la pompa non in Heat, non fa nulla, notifica
# e restituisce ok = false.
# Risposta (response_variable): {ok: true/false, motivo: testo}.
# Il controllo fonte_sicurezza (automations_caldaia) resta attivo comunque.
#==================================================================================
fonte_imposta:
  alias: "Fonte – Imposta fonte in sicurezza"
  icon: mdi:swap-horizontal-circle
  mode: queued
  fields:
    fonte:
      name: Fonte
      description: "pompa oppure caldaia"
      required: true
      selector:
        select:
          options:
            - pompa
            - caldaia
    accendi:
      name: Accendi
      description: "Accende la fonte scelta a fine sequenza"
      default: true
      selector:
        boolean:
    chi:
      name: Chi comanda
      description: "automatico, manuale (plance) o antigelo"
      default: automatico
      selector:
        select:
          options:
            - automatico
            - manuale
            - antigelo
  sequence:
    - variables:
        f: "{{ fonte | default('') }}"
        acc: "{{ accendi | default(true) }}"
        da: "{{ chi | default('automatico') }}"
        valvola_ok: "{{ has_value('switch.shelly_box') }}"
        valvola_su_pompa: "{{ is_state('switch.shelly_box', 'on') }}"
        pompa_accesa: "{{ is_state('switch.panasonic_heat_pump_main_heatpump_state', 'on') }}"
        sat_acceso: "{{ is_state('climate.smart_autotune_thermostat_living_room', 'heat') }}"
        pompa_libera: "{{ is_state('input_boolean.pdc_manuale', 'off') or da == 'manuale' }}"
        caldaia_libera: "{{ is_state('input_boolean.caldaia_manuale', 'off') or da == 'manuale' }}"
        in_heat: >
          {{ states('select.panasonic_heat_pump_main_operating_mode_state')
             in ['Heat', 'Heat only'] }}
        sposta: "{{ valvola_ok and (valvola_su_pompa != (f == 'pompa')) }}"
        motivo: >-
          {% if f not in ['pompa', 'caldaia'] %}fonte non valida ({{ f }})
          {%- elif not valvola_ok %}valvola pompa/caldaia non disponibile
          {%- elif f == 'caldaia' and pompa_accesa and not pompa_libera %}la pompa e' accesa in gestione manuale
          {%- elif f == 'pompa' and sat_acceso and not caldaia_libera %}la caldaia e' accesa in gestione manuale
          {%- elif acc and f == 'pompa' and not pompa_libera %}la pompa e' in gestione manuale
          {%- elif acc and f == 'caldaia' and not caldaia_libera %}la caldaia e' in gestione manuale
          {%- elif acc and f == 'caldaia' and not in_heat %}la pompa non e' in Heat: la caldaia non si accende in raffrescamento
          {%- endif %}
    # --- Richiesta non eseguibile: nessuna azione ---
    - if:
        - condition: template
          value_template: "{{ motivo | length > 0 }}"
      then:
        - action: notify.mobile_app_cph2653
          data:
            title: "⛔ Fonte non cambiata"
            message: >-
              Richiesta {{ f }} ({{ da }}) non eseguita: {{ motivo }}.
              Pompa {{ 'accesa' if pompa_accesa else 'spenta' }}, caldaia
              {{ 'accesa' if sat_acceso else 'spenta' }}, valvola su
              {{ 'Pompa' if valvola_su_pompa else 'Caldaia' }}.
        - variables:
            esito:
              ok: false
              motivo: "{{ motivo }}"
        - stop: "Fonte non impostata"
          response_variable: esito
    # --- 1. Spegne la fonte opposta (anche se la valvola e' gia' a posto) ---
    - if:
        - condition: template
          value_template: "{{ f == 'caldaia' and pompa_accesa }}"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.panasonic_heat_pump_main_heatpump_state
    - if:
        - condition: template
          value_template: "{{ f == 'pompa' and sat_acceso }}"
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            hvac_mode: "off"
    # --- 2. Valvola: 30 s dopo lo spegnimento, poi 120 s di manovra ---
    - if:
        - condition: template
          value_template: "{{ sposta }}"
      then:
        - if:
            - condition: template
              value_template: "{{ (f == 'caldaia' and pompa_accesa) or (f == 'pompa' and sat_acceso) }}"
          then:
            - delay: "00:00:30"
        - if:
            - condition: template
              value_template: "{{ f == 'pompa' }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.shelly_box
          else:
            - action: switch.turn_off
              target:
                entity_id: switch.shelly_box
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.fonte_ultima_commutazione
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - delay: "00:02:00"
        # Il rele' della valvola deve risultare nello stato richiesto (la
        # valvola non ha feedback di posizione: si controlla solo il comando).
        - if:
            - condition: template
              value_template: "{{ not is_state('switch.shelly_box', 'on' if f == 'pompa' else 'off') }}"
          then:
            - action: notify.mobile_app_cph2653
              data:
                title: "⛔ Valvola non commutata"
                message: >-
                  Richiesta {{ f }}: dopo 120 s switch.shelly_box risulta
                  {{ states('switch.shelly_box') }}. Nessuna fonte accesa.
            - variables:
                esito:
                  ok: false
                  motivo: "valvola non commutata"
            - stop: "Valvola non commutata"
              response_variable: esito
    # --- 3. Accende la fonte scelta ---
    - if:
        - condition: template
          value_template: "{{ acc and f == 'pompa' }}"
      then:
        - action: switch.turn_on
          target:
            entity_id: switch.panasonic_heat_pump_main_heatpump_state
    - if:
        - condition: template
          value_template: "{{ acc and f == 'caldaia' }}"
      then:
        # Il target lo imposta clima_sync_sat_target all'accensione del SAT
        # (salvo caldaia_manuale: in quel caso lo script manuale).
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            hvac_mode: "heat"
    - variables:
        esito:
          ok: true
          motivo: ""
    - stop: "Fonte impostata"
      response_variable: esito

#==================================================================================
# SCRIPT: POMPA / CALDAIA – COMANDI DALLE PLANCE (scripts_58)
# Usati dalle plance al posto dei comandi diretti (switch pompa, SAT, valvola).
# Non cambiano i flag manuali (pdc_manuale, caldaia_manuale): il flag lo
# alza e lo abbassa solo l'utente dal suo tile. Senza flag alzato le
# automazioni restano libere di riportare l'apparecchio dove serve.
# Le accensioni passano da fonte_imposta (chi = manuale: agisce anche con il
# flag alzato, perche' e' l'utente a chiederlo), che sposta la valvola e spegne
# l'altra fonte; gli spegnimenti sono sempre liberi.
#==================================================================================
pompa_accendi:
  alias: "Pompa – Accendi"
  icon: mdi:heat-pump
  mode: single
  sequence:
    - action: script.fonte_imposta
      data:
        fonte: pompa
        accendi: true
        chi: manuale

pompa_spegni:
  alias: "Pompa – Spegni"
  icon: mdi:heat-pump-outline
  mode: single
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.panasonic_heat_pump_main_heatpump_state

# Sostituisce panasonic_toggle (rimosso in scripts_57): pulsante unico in plancia.
pompa_commuta:
  alias: "Pompa – Accendi/Spegni"
  icon: mdi:heat-pump
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: switch.panasonic_heat_pump_main_heatpump_state
          state: "on"
      then:
        - action: script.pompa_spegni
      else:
        - action: script.pompa_accendi

caldaia_accendi:
  alias: "Caldaia – Accendi riscaldamento"
  icon: mdi:radiator
  mode: single
  sequence:
    - action: script.fonte_imposta
      data:
        fonte: caldaia
        accendi: true
        chi: manuale
      response_variable: esito
    # Senza flag il target lo imposta clima_sync_sat_target all'accensione.
    # Con caldaia_manuale alzato (sync ferma): preset "home" e minimo diurno
    # della sala, modificabili poi dal SAT.
    - if:
        - condition: template
          value_template: "{{ esito.ok and is_state('input_boolean.caldaia_manuale', 'on') }}"
      then:
        - action: climate.set_preset_mode
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            preset_mode: "home"
        - action: climate.set_temperature
          target:
            entity_id: climate.smart_autotune_thermostat_living_room
          data:
            temperature: "{{ states('input_number.mintemp_giorno_inverno_sala') | float(22) }}"

caldaia_spegni:
  alias: "Caldaia – Spegni riscaldamento"
  icon: mdi:radiator-off
  mode: single
  sequence:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.smart_autotune_thermostat_living_room
      data:
        hvac_mode: "off"

#==================================================================================
# SCRIPT: HEISHAMON REBOOT VIA MQTT
#==================================================================================
heishamon_reboot:
  alias: "HeishaMon – Reboot via MQTT"
  mode: single
  sequence:
    - action: mqtt.publish
      data:
        topic: "panasonic_heat_pump/commands/SetReboot"
        payload: "1"

#==================================================================================
# SCRIPT: PANASONIC SET TARGET TEMPERATURA MANDATA
# Legge il valore da input_number.panasonic_target_mandata_manuale e lo invia
#==================================================================================
panasonic_set_target_mandata:
  alias: "Panasonic – Imposta Target Mandata Manuale"
  mode: single
  sequence:
    # Guardia: non pubblica nulla se lo slider non ha un valore numerico
    - condition: template
      value_template: "{{ has_value('input_number.panasonic_target_mandata_manuale') }}"
    - action: mqtt.publish
      data:
        # v55: topic secondo il modo operativo. Prima usava sempre il comando
        # del raffrescamento, anche con la pompa in riscaldamento.
        topic: >-
          {% if states('select.panasonic_heat_pump_main_operating_mode_state') in ['Heat', 'Heat only'] %}panasonic_heat_pump/commands/SetZ1HeatRequestTemperature{% else %}panasonic_heat_pump/commands/SetZ1CoolRequestTemperature{% endif %}
        payload: "{{ states('input_number.panasonic_target_mandata_manuale') | int(0) }}"

#==================================================================================
# SCRIPT: CALDAIA DHW ON
# Invia HW=1 via MQTT e aggiorna helper di stato
#==================================================================================
caldaia_dhw_on:
  alias: "Caldaia – Sanitaria ON"
  mode: single
  sequence:
    - action: mqtt.publish
      data:
        topic: "OTGW/set/otgw-84CCA8ADE1AD/command"
        payload: "HW=1"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.caldaia_dhw_override

#==================================================================================
# SCRIPT: CALDAIA DHW OFF
# Invia HW=0 via MQTT e aggiorna helper di stato
#==================================================================================
caldaia_dhw_off:
  alias: "Caldaia – Sanitaria OFF"
  mode: single
  sequence:
    - action: mqtt.publish
      data:
        topic: "OTGW/set/otgw-84CCA8ADE1AD/command"
        payload: "HW=0"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.caldaia_dhw_override

#==================================================================================
# SCRIPT: FONTE - RIPRISTINA PARAMETRI (NUOVO - scripts_41)
#==================================================================================
# Reimposta tutti i parametri manuali della gestione fonte ai valori
# consigliati/di contratto. Richiamato dalla sentinella all'avvio di HA
# (automations_caldaia, fonte_sentinella_parametri) quando rileva la perdita dello stato salvato,
# oppure manualmente da Strumenti per sviluppatori -> Azioni.
# Provenienza dei valori:
#   rendimento 0.95      -> Baxi a condensazione, PCS
#   COP riserva 3.0      -> media stagionale reale PdC
#   soglia surplus 1000  -> assorbimento tipico compressore (W)
#   GSE 0.10             -> baseline; aggiornato da salva_bolletta a ogni bolletta
#   isteresi 15 / ore 3  -> tuning anti-usura valvola pompa-caldaia
#   gas 1.3338           -> bolletta mag 2026 (indice + componenti, IVA 22%)
#   quote fisse 24.11/19.42 -> bolletta apr-mag 2026 (IVA inclusa)
fonte_ripristina_parametri:
  alias: "Fonte - Ripristina parametri"
  icon: mdi:backup-restore
  mode: single
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.caldaia_rendimento
      data:
        value: 0.95
    - action: input_number.set_value
      target:
        entity_id: input_number.pdc_cop_fallback
      data:
        value: 3.0
    - action: input_number.set_value
      target:
        entity_id: input_number.pv_surplus_soglia
      data:
        value: 1000
    - action: input_number.set_value
      target:
        entity_id: input_number.gse_prezzo_kwh_stima
      data:
        value: 0.10
    - action: input_number.set_value
      target:
        entity_id: input_number.fonte_isteresi_pct
      data:
        value: 15
    - action: input_number.set_value
      target:
        entity_id: input_number.fonte_ore_minime
      data:
        value: 3
    - action: input_number.set_value
      target:
        entity_id: input_number.gas_prezzo_mc
      data:
        value: 1.3338
    - action: input_number.set_value
      target:
        entity_id: input_number.elettricita_quota_fissa_mese
      data:
        value: 24.11
    - action: input_number.set_value
      target:
        entity_id: input_number.gas_quota_fissa_mese
      data:
        value: 19.42

#==================================================================================
# TENDA GIARDINO - Apri all'85%
#
# v53 - Nuovo motore Somfy io: la cover cover.all_house_tenda_giardino_new
# riporta e accetta la posizione reale (0 = chiusa, 100 = tutta estesa).
# Spariti la corsa a tempo di 18 secondi e lo stato logico
# input_boolean.tenda_giardino_aperta: il motore si ferma da solo alla
# posizione richiesta e lo stato lo legge HA.
#
# NOTA: il gateway e' un Connectivity Kit, che non supporta l'API locale di
# Overkiz; il collegamento e' quindi via cloud con polling ogni 30 secondi.
# La posizione mostrata in plancia puo' aggiornarsi con quel ritardo.
# Fonte: https://www.home-assistant.io/integrations/overkiz/
#==================================================================================
tenda_giardino_apri:
  alias: "Tenda Giardino - Apri (85%)"
  icon: mdi:arrow-expand
  mode: single
  max_exceeded: silent
  sequence:
    - action: cover.set_cover_position
      target:
        entity_id: cover.all_house_tenda_giardino_new
      data:
        position: 85

#==================================================================================
# TENDA GIARDINO - Chiudi
#
# Chiusura completa (posizione 0). Nessuna condizione: se e' gia' chiusa il
# comando non produce movimento.
#==================================================================================
tenda_giardino_chiudi:
  alias: "Tenda Giardino - Chiudi"
  icon: mdi:arrow-collapse
  mode: single
  max_exceeded: silent
  sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.all_house_tenda_giardino_new
