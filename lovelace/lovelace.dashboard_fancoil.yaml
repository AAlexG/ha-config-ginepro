        grid_options:
          columns: 4
          rows: 1
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-panasonic
        name: Pompa
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_consumo_energia
