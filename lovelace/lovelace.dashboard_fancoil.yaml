config:
  views:
  - cards: []
    max_columns: 2
    path: fancoil
    sections:
    - cards:
      - heading: Gestione Manuale
        heading_style: title
        icon: mdi:hand-back-right
        type: heading
      - entity: switch.panasonic_heat_pump_main_heatpump_state
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Pompa
        tap_action:
          action: none
        type: tile
        vertical: false
      - grid_options:
          columns: 6
        icon: mdi:heat-pump
        icon_height: 20px
        name: Pompa ON/OFF
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.panasonic_toggle
        type: button
      - entity: binary_sensor.panasonic_heat_pump_lwt
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Pompa Online
        type: tile
        vertical: false
      - entity: switch.solo_auto_contattore_interruttore
        features:
        - type: toggle
        features_position: bottom
        name: Auto contattore
        type: tile
        vertical: false
      - entity: switch.solo_sauna_contatore_interruttore
        features:
        - type: toggle
        features_position: bottom
        name: Sauna
        type: tile
        vertical: false
      - heading: Blocca automatismi fino cambio giorno/notte (07:00 / 23:00)
        heading_style: title
        icon: ''
        type: heading
      - heading: Fancoil
        heading_style: subtitle
        icon: ''
        type: heading
      - entity: switch.camerageorgi_shelly_fancoil_georgi
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Tania ora
        type: tile
        vertical: false
      - entity: input_boolean.fancoil_georgi_manuale
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: ' Tania manuale'
        tap_action:
          action: perform-action
          perform_action: script.fancoil_georgi_toggle_manuale
        type: tile
        vertical: false
      - entity: switch.camerageorgi_shelly_fancoil_georgi_2
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Georgi ora
        type: tile
        vertical: false
      - entity: input_boolean.fancoil_georgi2_manuale
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Georgi manuale
        tap_action:
          action: perform-action
          perform_action: script.fancoil_georgi2_toggle_manuale
        type: tile
        vertical: false
      - entity: switch.sala_fancoil_sala_shelly_1gen4
