        features_position: bottom
        name: PompaTarget
        type: tile
        vertical: false
      - entity: sensor.panasonic_heat_pump_main_main_outlet_temp
        features_position: bottom
        name: PompaOut
        type: tile
        vertical: false
      - entity: sensor.opentherm_gateway_otgw_otgw_control_setpoint
        features_position: bottom
        name: RiscalTarget
        type: tile
        vertical: false
      - entity: sensor.opentherm_gateway_otgw_otgw_boiler_flow_water_temperature
        features_position: bottom
        name: RiscalOUT
        type: tile
        vertical: false
      - entity: sensor.opentherm_gateway_otgw_otgw_dhw_setpoint
        features_position: bottom
        name: Sanit.Target
        type: tile
        vertical: false
      - entity: sensor.opentherm_gateway_otgw_otgw_dhw_temperature
        features_position: bottom
        name: Sanit.Ora
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Consumo ora
        heading_style: title
        icon: mdi:home-thermometer-outline
        type: heading
      - battery:
          energy: 5120
          show_daily: true
          shutdown_soc: 1
        battery2:
          animate: true
          auto_scale: true
          colour: '#ffc0cb'
          dynamic_colour: true
          energy: 0
          hide_soc: false
          invert_flow: false
          invert_power: false
          linear_gradient: true
          navigate: ''
          path_threshold: 100
          remaining_energy_to_shutdown: false
          show_absolute: false
          show_remaining_energy: true
          shutdown_soc: 20
          soc_end_of_charge: 100
        card_height: 100%
        card_width: 100%
        cardstyle: compact
        center_no_grid: false
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        entities:
          battery_current_191: sensor.inverter_uflex_battery_current
          battery_power_190: sensor.inverter_uflex_battery_power
          battery_soc_184: sensor.inverter_uflex_battery
          battery_voltage_183: sensor.inverter_uflex_battery_voltage
          day_battery_charge_70: sensor.inverter_uflex_today_battery_charge
          day_battery_discharge_71: sensor.inverter_uflex_today_battery_discharge
          day_grid_export_77: sensor.inverter_uflex_today_energy_export
          day_grid_import_76: sensor.inverter_uflex_today_energy_import
          day_load_energy_84: sensor.inverter_uflex_today_load_consumption
          day_pv_energy_108: sensor.inverter_uflex_today_production
          essential_power: sensor.inverter_uflex_load_power
          grid_ct_power_172: sensor.inverter_uflex_external_ct1_power
          grid_power_169: sensor.inverter_uflex_external_power
          inverter_status_59: sensor.inverter_uflex_device_state
          inverter_voltage_154: sensor.inverter_uflex_grid_l1_voltage
          load_frequency_192: sensor.inverter_uflex_grid_frequency
          pv1_current_110: sensor.inverter_uflex_pv1_current
          pv1_power_186: sensor.inverter_uflex_pv1_power
          pv1_voltage_109: sensor.inverter_uflex_pv1_voltage
          pv2_current_112: sensor.inverter_uflex_pv2_current
          pv2_power_187: sensor.inverter_uflex_pv2_power
          pv2_voltage_111: sensor.inverter_uflex_pv2_voltage
          pv_total_power: sensor.inverter_uflex_pv_power
        grid:
          show_daily_buy: true
          show_daily_sell: true
          show_nonessential: true
        inverter:
          autarky: power
          auto_scale: true
          colour: '#9e9e9e'
          model: sunsynk
          modern: true
          three_phase: false
        large_font: false
        load:
          show_daily: true
        max_line_width: 4
        min_line_width: 1
        show_battery: true
        show_grid: true
        show_solar: true
        solar:
          mppts: 2
          show_daily: true
        type: custom:sunsynk-power-flow-card
        wide: false
      - color: '#7E57C2'
        entity: sensor.altri_apparecchi_ora
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:home-lightning-bolt-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-consumi/elettricita
        name: Altri apparecchi
        type: tile
        vertical: false
      - entity: sensor.solo_auto_contattore_potenza_di_fase_a
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: Auto
        type: tile
        vertical: false
      - entity: sensor.panasonic_potenza_consumata_calcolata
