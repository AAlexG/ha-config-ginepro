        - step: 5
          type: media-player-volume-buttons
        features_position: bottom
        grid_options:
          rows: auto
        name: Yamaha Volume
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: "Temperature & Umidit\xE0"
        heading_style: title
        icon: mdi:home-thermometer-outline
        type: heading
      - entities:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature
          name: Temp.Sala
        - entity: sensor.termometro_georgi_zigbee_temperature
          name: Georgi
        - entity: sensor.termometro_tania_zigbee_temperature
          name: Tania
        - entity: sensor.termometro_cantina_zigbee_temperature
          name: Cantina
        - entity: sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature
          name: Esterna
        - entity: sensor.hp1000se_pro_pro_v1_6_4_indoor_humidity
          name: Humid.Sala
        - entity: sensor.termometro_georgi_zigbee_humidity
          name: Georgi
        - entity: sensor.termometro_tania_zigbee_humidity
          name: Tania
        - entity: sensor.termometro_cantina_zigbee_humidity
          name: Cantina
        - entity: sensor.hp1000se_pro_pro_v1_6_4_humidity
          name: Esterna
        grid_options:
          columns: full
          rows: auto
        hours_to_show: 24
        refresh_interval: 60
        type: history-graph
