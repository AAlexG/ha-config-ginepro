    - cards:
      - heading: Irrigazione Sonoff switch 4CHPROR3
        heading_style: subtitle
        icon: mdi:sprinkler-variant
        type: heading
      - entity: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_1
        features:
        - type: toggle
        type: tile
      - entity: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_2
        features:
        - type: toggle
        type: tile
      - entity: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_3
        features:
        - type: toggle
        type: tile
      - entity: switch.irrigazione_sonoff_switch_4chpror3_sonoff_10028b1d36_4
        features:
        - type: toggle
        type: tile
