config:
  title: Fancoil & Deumidificatori v.33
  views:
  - cards: []
    header: {}
    max_columns: 2
    path: fancoil
    sections:
    - cards:
      - heading: 'Accensioni Fancoil e Deumidificatori:'
        heading_style: title
        icon: mdi:chart-timeline
        type: heading
      - entities:
        - entity: switch.camerageorgi_shelly_fancoil_georgi
          name: Tania
        - entity: switch.camerageorgi_shelly_fancoil_georgi_2
          name: Georgi
        - entity: switch.sala_fancoil_sala_shelly_1gen4
          name: Sala
        - entity: switch.deumidificatore_armadio_zigbee
          name: Armadio
        - entity: switch.box_deumidificatore_cantina_sonoff
          name: Cantina
        grid_options:
          columns: full
          rows: auto
        hours_to_show: 24
        refresh_interval: 60
        type: history-graph
      - entities:
        - entity: switch.camerageorgi_shelly_fancoil_georgi
          name: Tania
        - entity: switch.camerageorgi_shelly_fancoil_georgi_2
          name: Georgi
        - entity: switch.sala_fancoil_sala_shelly_1gen4
          name: Sala
        - entity: switch.deumidificatore_armadio_zigbee
          name: Armadio
        - entity: switch.box_deumidificatore_cantina_sonoff
          name: Cantina
        grid_options:
          columns: full
          rows: auto
        hours_to_show: 168
        refresh_interval: 300
        type: history-graph
      type: grid
    - cards:
      - heading: Deumid.Cantina(WiFi)&Armadio(Zigbee)
        heading_style: title
        icon: mdi:air-humidifier
        type: heading
      - entity: input_boolean.distacco_deum_cantina
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: D.cantina spento x prelievo>5800w
        tap_action:
          action: toggle
        type: tile
        vertical: false
      - entity: input_boolean.distacco_deum_armadio
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: D.armadio spento x prelievo>5800w
        tap_action:
          action: toggle
        type: tile
        vertical: false
      - entity: sensor.box_deumidificatore_cantina_sonoff_wifi
        features:
        - type: trend-graph
        features_position: bottom
        name: 'CantinaWiFi '
        type: tile
        vertical: false
      - entity: sensor.0xa4c1383e0fd87686_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: ArmadioZigbee
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.consumo_deumidificatore_cantina_oggi
          name: Cantina
        - entity: sensor.deumidificatore_armadio_oggi
          name: Armadio
        period: month
        stat_types:
        - change
        type: statistics-graph
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.box_deumidificatore_cantina_sonoff_energy_day
          name: Cantina
        - entity: sensor.deumidificatore_armadio_oggi
          name: Armadio
        period: day
        stat_types:
        - state
        type: statistics-graph
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: "Cantina - umidit\xE0&potenza deum."
        series:
        - entity: sensor.box_deumidificatore_cantina_sonoff_power
          name: Potenza deum.
          statistics:
            period: day
            type: mean
          type: line
          yaxis_id: W
        - entity: sensor.termometro_cantina_zigbee_humidity
          name: "umidit\xE0"
          statistics:
            period: day
            type: mean
          type: line
          yaxis_id: percent
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: Potenza W
          decimals: 1
          id: W
        - apex_config:
            title:
              text: "umidit\xE0 %"
          decimals: 1
          id: percent
          opposite: true
      type: grid
    - cards:
      - heading: Fancoil via Shelly
        heading_style: title
        icon: mdi:wind-power
        type: heading
      - entity: sensor.shelly1g4_a085e3b3f81c_intensita_del_segnale
        features_position: bottom
        name: WiFi Tania
        type: tile
        vertical: false
      - entity: sensor.shelly1g4_a085e3b3f81c_temperatura
        features_position: bottom
        name: Temp.Tania
        type: tile
        vertical: false
      - entity: sensor.shelly1g4_a085e3b4bee4_intensita_del_segnale
        features_position: bottom
        name: WiFiGeorgi
        type: tile
        vertical: false
      - entity: sensor.shelly1g4_a085e3b4bee4_temperatura
        features_position: bottom
        name: Temp.Georgi
        type: tile
        vertical: false
      - entity: sensor.shelly1g4_a085e3ba36e0_intensita_del_segnale
        features_position: bottom
        name: WiFi Sala
        type: tile
        vertical: false
      - entity: sensor.shelly1g4_a085e3ba36e0_temperatura
        features_position: bottom
        name: Temp.Sala
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.consumo_fancoil_tania_oggi_stimato
          name: Tania
        - entity: sensor.consumo_fancoil_georgi_oggi_stimato
          name: Georgi
        - entity: sensor.consumo_fancoil_sala_oggi_stimato_non_verificato
          name: Sala
        period: day
        stat_types:
        - state
        type: statistics-graph
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.consumo_fancoil_tania_oggi_stimato
          name: Tania
        - entity: sensor.consumo_fancoil_georgi_oggi_stimato
          name: Georgi
        - entity: sensor.consumo_fancoil_sala_oggi_stimato_non_verificato
          name: Sala
        period: month
        stat_types:
        - change
        type: statistics-graph
      type: grid
    - cards:
      - heading: Termometri zigbee (medie giorno)
        heading_style: title
        icon: mdi:coolant-temperature
        type: heading
      - chart_type: line
        days_to_show: 30
        entities:
        - entity: sensor.termometro_cantina_zigbee_temperature
          name: Cantina
        - entity: sensor.termometro_tania_zigbee_temperature
          name: Tania
        - entity: sensor.termometro_georgi_zigbee_temperature
          name: 'Georgi '
        period: day
        stat_types:
        - mean
        type: statistics-graph
      - chart_type: line
        days_to_show: 30
        entities:
        - entity: sensor.termometro_cantina_zigbee_humidity
          name: Cantina
        - entity: sensor.termometro_tania_zigbee_humidity
          name: Tania
        - entity: sensor.termometro_georgi_zigbee_humidity
          name: Georgi
        period: day
        stat_types:
        - mean
        type: statistics-graph
      - chart_type: line
        days_to_show: 30
        entities:
        - entity: sensor.termometro_cantina_zigbee_linkquality
          name: Cantina
        - entity: sensor.0xa4c138e6a0d06219_linkquality
          name: Tania
        - entity: sensor.termometro_georgi_zigbee_linkquality
          name: Georgi
        period: day
        stat_types:
        - mean
        type: statistics-graph
      - entity: sensor.termometro_cantina_zigbee_battery
        features_position: bottom
        name: Batt.Cantina
        type: tile
        vertical: false
      - entity: sensor.termometro_cantina_zigbee_voltage
        features_position: bottom
        name: Tens.Cantina
        type: tile
        vertical: false
      - entity: sensor.termometro_tania_zigbee_battery
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        name: Batt.Tania
        type: tile
        vertical: false
      - entity: sensor.termometro_tania_zigbee_voltage
        features_position: bottom
        name: Tens.Tania
        type: tile
        vertical: false
      - entity: sensor.termometro_georgi_zigbee_battery
        features_position: bottom
        name: Batt.Georgi
        type: tile
        vertical: false
      - entity: sensor.termometro_georgi_zigbee_voltage
        features_position: bottom
        name: Tens.Georgi
        type: tile
        vertical: false
      type: grid
    title: Fancoil & Deumidificatori
    type: sections
