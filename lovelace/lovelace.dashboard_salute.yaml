config:
  title: Salute v.3
  views:
  - icon: mdi:heart-pulse
    max_columns: 3
    path: salute
    sections:
    - cards:
      - heading: Sonno (telefono)
        heading_style: title
        icon: mdi:cellphone
        type: heading
      - entity: sensor.cph2653_sleep_confidence
        features:
        - type: trend-graph
        features_position: bottom
        name: Confidenza
        type: tile
        vertical: false
      - entity: sensor.cph2653_sleep_segment
        features:
        - type: trend-graph
        features_position: bottom
        name: Segmenti
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Ultima notte (Garmin)
        heading_style: title
        icon: mdi:watch
        type: heading
      - entity: sensor.garmin_connect_sleep_score
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Punteggio sonno
        type: tile
        vertical: false
      - entities:
        - entity: sensor.garmin_connect_bedtime
          format: time
          name: Addormentato
        - entity: sensor.garmin_connect_wake_time
          format: time
          name: Sveglia
        - entity: sensor.garmin_connect_total_sleep_duration
          name: Sonno totale
        - entity: sensor.garmin_connect_deep_sleep
          name: Profondo
        - entity: sensor.garmin_connect_light_sleep
          name: Leggero
        - entity: sensor.garmin_connect_rem_sleep
          name: REM
        - entity: sensor.garmin_connect_awake_time
          name: Sveglio
        - entity: sensor.garmin_connect_average_sleep_respiration
          name: Respirazione media
        type: entities
      type: grid
    - cards:
      - heading: Passi
        heading_style: subtitle
        icon: mdi:human-male
        type: heading
      - entity: sensor.garmin_connect_steps
        features_position: bottom
        name: Oggi
        type: tile
        vertical: false
      - entity: sensor.garmin_connect_yesterday_steps
        features_position: bottom
        name: Ieri
        type: tile
        vertical: false
      - entity: sensor.garmin_connect_lifetime_steps
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Lifetime
        type: tile
        vertical: false
      - heading: Respirazione
        heading_style: subtitle
        icon: mdi:molecule-co2
        type: heading
      - entity: sensor.garmin_connect_highest_respiration
        features:
        - type: trend-graph
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Highest
        type: tile
        vertical: false
      - entity: sensor.garmin_connect_lowest_respiration
        features:
        - type: trend-graph
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Lowest
        type: tile
        vertical: false
      - entity: sensor.garmin_connect_latest_respiration
        features:
        - type: trend-graph
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Ultima
        type: tile
        vertical: false
      - heading: "Intensit\xE0 esercizi "
        heading_style: subtitle
        icon: mdi:run
        type: heading
      - entity: sensor.garmin_connect_intensity_minutes
        features:
        - type: trend-graph
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Totale
        type: tile
        vertical: false
      - entity: sensor.garmin_connect_moderate_intensity_minutes
        features:
        - type: trend-graph
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Moderate
        type: tile
        vertical: false
      - entity: sensor.garmin_connect_vigorous_intensity_minutes
        features_position: bottom
        name: Vigorose
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.garmin_connect_wellness_active_calories
          name: Wellness Active calories
        - entity: sensor.garmin_connect_wellness_calories
          name: Wellness calories
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - state
        type: statistics-graph
      type: grid
    title: Salute
    type: sections
