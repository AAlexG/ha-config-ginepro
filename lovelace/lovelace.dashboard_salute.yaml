config:
  title: Salute v.2
  views:
  - icon: mdi:heart-pulse
    max_columns: 3
    path: salute
    sections:
    - cards:
      - heading: Sonno (telefono)
        heading_style: title
        icon: mdi:cellphone
        type: heading
      - entity: sensor.cph2653_sleep_confidence
        features:
        - type: bar-gauge
        - type: trend-graph
        features_position: bottom
        name: Confidenza
        type: tile
        vertical: false
      - entity: sensor.cph2653_sleep_segment
        features:
        - type: bar-gauge
        - type: trend-graph
        features_position: bottom
        name: Segmenti
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Ultima notte (Garmin)
        heading_style: title
        icon: mdi:watch
        type: heading
      - entity: sensor.garmin_connect_sleep_score
        features:
        - type: trend-graph
        features_position: bottom
        name: Punteggio sonno
        type: tile
        vertical: false
      - entities:
        - entity: sensor.garmin_connect_bedtime
          format: time
          name: Addormentato
        - entity: sensor.garmin_connect_wake_time
          format: time
          name: Sveglia
        - entity: sensor.garmin_connect_total_sleep_duration
          name: Sonno totale
        - entity: sensor.garmin_connect_deep_sleep
          name: Profondo
        - entity: sensor.garmin_connect_light_sleep
          name: Leggero
        - entity: sensor.garmin_connect_rem_sleep
          name: REM
        - entity: sensor.garmin_connect_awake_time
          name: Sveglio
        - entity: sensor.garmin_connect_average_sleep_respiration
          name: Respirazione media
        type: entities
      type: grid
    - cards:
      - heading: Lenzuola
        heading_style: title
        icon: mdi:bed
        type: heading
      - entity: switch.lenzuola_sotto
        icon: mdi:bed
        name: Lenzuola
        type: tile
        vertical: false
      - entities:
        - entity: sensor.lenzuola_ora_media_a_letto
          name: Media a letto
        - entity: input_number.lenzuola_tempo_addormentamento
          name: Addormentarsi
        - entity: sensor.lenzuola_accensione_prevista
          name: Accensione
        - entity: sensor.lenzuola_spegnimento_previsto
          name: Spegnimento
        - entity: input_datetime.lenzuola_ultimo_spegnimento_cucina
          name: Luci cucina
        - entity: counter.lenzuola_notti_registrate
          name: Notti registrate
        - entity: counter.lenzuola_notti_garmin
          name: Notti Garmin
        type: entities
      type: grid
    title: Salute
    type: sections
