config:
  views:
  - badges: []
    cards:
    - cards:
      - entity: sensor.0xa4c1383e0fd87686_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Armadio
        type: tile
        vertical: false
      - entity: sensor.0xa4c1384b868fa6bd_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: PresaTania
        type: tile
        vertical: false
      - entity: sensor.presa_porta_box_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Presa porta box
        type: tile
        vertical: false
      - entity: sensor.0xa4c1385040d042fb_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: PresaBox
        type: tile
        vertical: false
      - entity: sensor.cancello_grande_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: CanceloGrande
        type: tile
        vertical: false
      - entity: sensor.0xa4c138013ef60318_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: CancelloEntrata
        type: tile
        vertical: false
      - entity: sensor.0xa4c138f820e17e6e_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: PortoneBox
        type: tile
        vertical: false
      - entity: sensor.persiana_box_sensore_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Pers.Box
        type: tile
        vertical: false
      - entity: sensor.persiana_tania_sensore_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Pers.Tania
        type: tile
        vertical: false
      - entity: sensor.0xa4c138e6a0d06219_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Term.Tania
        type: tile
        vertical: false
      - entity: sensor.termometro_georgi_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Term.Georgi
        type: tile
        vertical: false
      - entity: sensor.termometro_cantina_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: Term.Cantina
        type: tile
        vertical: false
      columns: 2
      square: false
      title: Zigbee
      type: grid
    - entity: input_button.aggiorna_wifi_tabella
      icon: mdi:refresh
      icon_height: 20px
      name: Aggiorna elenco WiFi
      show_icon: true
      show_name: true
      show_state: false
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.aggiorna_wifi_tabella
      type: button
    - content: '{% set c = state_attr(''sensor.wifi_tabella'', ''in_casa'') %}{% set
        f = state_attr(''sensor.wifi_tabella'', ''fuori_casa'') %}{% set g = state_attr(''sensor.wifi_tabella'',
        ''ignoti'') %}{% set n = state_attr(''sensor.wifi_tabella'', ''non_in_elenco'')
        %}{% set a = state_attr(''sensor.wifi_tabella'', ''aggiornato'') %}

        ### Rete Wi-Fi Casa Ginepro


        In casa **{{ c if c is not none else ''?'' }}** / Fuori **{{ f if f is not
        none else ''?'' }}** / Ignoti **{{ g if g is not none else ''?'' }}** su {{
        states(''sensor.wifi_dispositivi'') }} in elenco


        Non in elenco e collegati: **{{ n if n is not none else ''?'' }}**


        Ultimo aggiornamento: **{{ a if a is not none else ''mai'' }}**'
      type: markdown
    - columns:
      - data: sconosciuti
        modify: x.mac
        name: MAC
      - data: sconosciuti
        modify: x.ip
        name: IP
      - data: sconosciuti
        modify: "x.tipo === 'casuale' ? '\u25CB casuale' : '\u25CF fisso'"
        name: Tipo MAC
      - data: sconosciuti
        modify: x.entita
        name: Entita
      css:
        table+: 'width: 150%; font-size: 12px;'
        tbody tr td:nth-child(1)+: 'min-width: 150px; width: 150px;'
        tbody tr td:nth-child(2)+: 'min-width: 110px; width: 110px;'
        tbody tr td:nth-child(3)+: 'min-width: 100px; width: 100px;'
        tbody tr td:nth-child(4)+: 'min-width: 260px; width: 260px; white-space: normal;'
        th:nth-child(1)+: 'min-width: 150px; width: 150px;'
        th:nth-child(2)+: 'min-width: 110px; width: 110px;'
        th:nth-child(3)+: 'min-width: 100px; width: 100px;'
        th:nth-child(4)+: 'min-width: 260px; width: 260px;'
      entities:
        include: sensor.wifi_tabella
      title: Collegati ma non in elenco
      type: custom:flex-table-card
    - columns:
      - data: righe
        modify: x.nome
        name: Dispositivo
      - data: righe
        modify: x.mac
        name: MAC
      - data: righe
        modify: x.ip
        name: IP
      - data: righe
        modify: 'x.ssid === null ? ''n/d'' : x.ssid'
        name: SSID
      - data: righe
        modify: 'x.segnale === null ? ''n/d'' : x.segnale + '' %'''
        name: Segnale
      - data: righe
        modify: "x.stato === 'in_casa' ? '\u2714 In casa' : (x.stato === 'fuori' ?\
          \ '\u2718 Fuori casa' : '\u25B3 Ignoto')"
        name: Stato
      css:
        table+: 'width: 150%; font-size: 12px;'
        tbody tr td:nth-child(1)+: 'min-width: 220px; width: 220px; white-space: normal;'
        tbody tr td:nth-child(2)+: 'min-width: 150px; width: 150px;'
        tbody tr td:nth-child(3)+: 'min-width: 110px; width: 110px;'
        tbody tr td:nth-child(4)+: 'min-width: 140px; width: 140px; white-space: normal;'
        tbody tr td:nth-child(5)+: 'min-width: 70px; width: 70px; text-align: center;'
        tbody tr td:nth-child(6)+: 'min-width: 80px; width: 80px; white-space: normal;'
        th:nth-child(1)+: 'min-width: 220px; width: 220px;'
        th:nth-child(2)+: 'min-width: 150px; width: 150px;'
        th:nth-child(3)+: 'min-width: 110px; width: 110px;'
        th:nth-child(4)+: 'min-width: 140px; width: 140px;'
        th:nth-child(5)+: 'min-width: 70px; width: 70px; text-align: center;'
        th:nth-child(6)+: 'min-width: 80px; width: 80px;'
      entities:
        include: sensor.wifi_tabella
      title: Wi-Fi
      type: custom:flex-table-card
    icon: mdi:wifi
    path: wifi
    title: WiFi
