config:
  title: consumi v.55
  views:
  - cards: []
    header: {}
    max_columns: 4
    path: elettricita
    sections:
    - cards:
      - heading: TOTALI
        heading_style: title
        type: heading
      - heading: 'DA SEMPRE (solo mesi dove esistono rilevato e bolette):'
        heading_style: subtitle
        type: heading
      - entity: input_number.elettricita_totale_rilevato_kwh
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        icon: mdi:solar-power
        name: Rilevato
        type: tile
        vertical: false
      - entity: input_number.elettricita_totale_bollette_kwh
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        name: Bollette
        type: tile
        vertical: false
      - heading: RISPARMIO
        heading_style: subtitle
        icon: ''
        type: heading
      - entity: input_number.pv_totale_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:piggy-bank
        name: Risparmiato
        type: tile
        vertical: false
      - entity: input_number.pv_risparmio_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:solar-power
        name: Autoconsumo
        type: tile
        vertical: false
      - entity: input_number.pv_gse_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:cash-multiple
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-consumi/elettricita
        name: Da GSE
        type: tile
        vertical: false
      - entity: input_number.pv_recupero_pct
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:percent
        name: '% recupero'
        type: tile
        vertical: false
      - heading: TOTALI MENSILI
        heading_style: subtitle
        type: heading
      - content: '{% set d = state_attr(''sensor.pv_tabella_mensile'', ''mesi'') %}
          {%

          if d is none %} _Dati non disponibili_ {% else %} {% set mesi = d

          | reverse | list %} <div

          style="overflow-x:auto;overflow-y:auto;max-height:400px;font-size:11px">

          <table

          style="border-collapse:collapse;width:100%;white-space:nowrap">

          <thead><tr

          style="position:sticky;top:0;background:#1a1a2e;color:#e0e0e0">

          <th style="padding:4px 6px;border:1px solid #444">Mese</th> <th

          style="padding:4px 6px;border:1px solid #444">Prod</th> <th

          style="padding:4px 6px;border:1px solid #444">Consumo da FV</th> <th

          style="padding:4px 6px;border:1px solid #444">% Consumo</th>

          <th style="padding:4px 6px;border:1px solid #444">Da rete</th> <th

          style="padding:4px 6px;border:1px solid #444">Totale Consumi</th> <th

          style="padding:4px 6px;border:1px solid #444">A rete</th> <th

          style="padding:4px 6px;border:1px solid #444">Bat Carica</th> <th

          style="padding:4px 6px;border:1px solid #444">Bat Scarica</th> <th

          style="padding:4px 6px;border:1px solid #444">%Perd</th>

          </tr></thead> <tbody> {% for r in mesi %} {% if loop.first or

          loop.last %} <tr style="font-weight:bold;background:#2a2a3e"> {%

          else %} <tr> {% endif %} <td style="padding:3px 6px;border:1px

          solid #333">{{ r.mese }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.produzione

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.autoconsumo }}</td> <td

          style="padding:3px 6px;border:1px solid #333;text-align:right">{{

          r.pct_auto }}%</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.import }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.consumo_tot

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.export }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.batt_carica

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.batt_scarica }}</td> <td

          style="padding:3px 6px;border:1px solid #333;text-align:right">{{

          r.pct_batt_loss }}%</td> </tr> {% endfor %} </tbody></table></div>

          {% endif %}

          '
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - grid_options:
          columns: full
          rows: auto
        icon: mdi:solar-panel-large
        icon_height: 15px
        name: Panel Analytics
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          data:
            data:
              package_name: appinventor.ai_aagorine.PanelAnalytics
            message: command_launch_app
          perform_action: notify.mobile_app_cph2653
        type: button
      - heading: TOTALI MENSILI x TIPO APPARECCHI
        heading_style: subtitle
        type: heading
      - content: '{% set d = state_attr(''sensor.pv_tabella_mensile'', ''mesi'') %}
          {% if d is none %} _Dati non disponibili_ {% else %} {% set mesi = d | reverse
          | list %} <div style="overflow-x:auto;overflow-y:auto;max-height:400px;font-size:11px">
          <table style="border-collapse:collapse;width:100%;white-space:nowrap"> <thead><tr
          style="position:sticky;top:0;background:#1a1a2e;color:#e0e0e0"> <th style="padding:4px
          6px;border:1px solid #444">Mese</th> <th style="padding:4px 6px;border:1px
          solid #444">Pompa</th> <th style="padding:4px 6px;border:1px solid #444">Fancoil</th>
          <th style="padding:4px 6px;border:1px solid #444">Deumid.</th> <th style="padding:4px
          6px;border:1px solid #444">Lavatr.</th> <th style="padding:4px 6px;border:1px
          solid #444">Auto</th> <th style="padding:4px 6px;border:1px solid #444">Sauna</th>
          <th style="padding:4px 6px;border:1px solid #444">Cucina</th> <th style="padding:4px
          6px;border:1px solid #444">Altri</th> <th style="padding:4px 6px;border:1px
          solid #444">Totale consumi</th> </tr></thead> <tbody> {% for r in mesi %}
          {% if loop.first or loop.last %} <tr style="font-weight:bold;background:#2a2a3e">
          {% else %} <tr> {% endif %} <td style="padding:3px 6px;border:1px solid
          #333">{{ r.mese }}</td> <td style="padding:3px 6px;border:1px solid #333;text-align:right">{{
          (r.get(''pompa'', 0) | string) | replace(''.'', '','') }}</td> <td style="padding:3px
          6px;border:1px solid #333;text-align:right">{{ (r.get(''fancoil'', 0) |
          string) | replace(''.'', '','') }}</td> <td style="padding:3px 6px;border:1px
          solid #333;text-align:right">{{ (r.get(''deumid'', 0) | string) | replace(''.'',
          '','') }}</td> <td style="padding:3px 6px;border:1px solid #333;text-align:right">{{
          (r.get(''lavatrice'', 0) | string) | replace(''.'', '','') }}</td> <td style="padding:3px
          6px;border:1px solid #333;text-align:right">{{ (r.get(''auto'', 0) | string)
          | replace(''.'', '','') }}</td> <td style="padding:3px 6px;border:1px solid
          #333;text-align:right">{{ (r.get(''sauna'', 0) | string) | replace(''.'',
          '','') }}</td> <td style="padding:3px 6px;border:1px solid #333;text-align:right">{{
          (r.get(''cucina'', 0) | string) | replace(''.'', '','') }}</td> <td style="padding:3px
          6px;border:1px solid #333;text-align:right">{{ (r.get(''altri'', 0) | string)
          | replace(''.'', '','') }}</td> <td style="padding:3px 6px;border:1px solid
          #333;text-align:right">{{ r.get(''consumo_tot'', 0) }}</td> </tr> {% endfor
          %} </tbody></table></div> {% endif %} '
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - entity: input_number.elettricita_prezzo_kwh
        grid_options:
          columns: 12
          rows: 2
        name: "Prezzo da rete (\u20AC x 1 kWh)"
        type: entity
      - entity: input_number.elettricita_quota_fissa_mese
        grid_options:
          columns: 12
          rows: 2
        name: Quota fissa mensile in bolletta
        type: entity
      - color: '#009E73'
        entity: sensor.fv_co2_evitata
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        icon: mdi:molecule-co2
        name: CO2 evitata
        type: tile
        vertical: false
      - color: '#009E73'
        entity: sensor.fv_alberi_equivalenti
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        icon: mdi:forest
        name: Alberi equivalenti
        type: tile
        vertical: false
    - cards:
      - heading: CONSUMI ORA
        heading_style: title
        icon: ''
        type: heading
      - entity: sensor.panasonic_potenza_consumata_calcolata
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-panasonic
        name: Pompa
        type: tile
        vertical: false
      - entity: sensor.solo_auto_contattore_potenza_di_fase_a
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:car-back
        name: Auto
        type: tile
        vertical: false
      - entity: sensor.box_deumidificatore_cantina_sonoff_power
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:air-humidifier
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Deum.Cantina
        type: tile
        vertical: false
      - entity: sensor.deumidificatore_armadio_zigbee_power
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:air-humidifier
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Deum.armadio
        type: tile
        vertical: false
      - entity: sensor.shellyem_ec64c9c9b75c_channel_1_potenza
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:fridge-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Cucina
        type: tile
        vertical: false
      - entity: sensor.solo_sauna_contatore_potenza_di_fase_a
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:spa
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Sauna
        type: tile
        vertical: false
      - color: '#7E57C2'
        entity: sensor.altri_apparecchi_ora
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        icon: mdi:home-lightning-bolt-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-consumi/elettricita
        name: Altri apparecchi incluso lavatrice
        type: tile
        vertical: false
      - battery:
          energy: 6990
          show_daily: true
          shutdown_soc: number.inverter_uflex_battery_low_soc
        card_height: 100%
        card_width: 100%
        cardstyle: lite
        center_no_grid: false
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        entities:
          battery_current_191: sensor.inverter_uflex_battery_current
          battery_power_190: sensor.inverter_uflex_battery_power
          battery_soc_184: sensor.inverter_uflex_battery
          battery_temp_182: sensor.inverter_uflex_battery_temperature
          battery_voltage_183: sensor.inverter_uflex_battery_voltage
          day_battery_charge_70: sensor.inverter_uflex_today_battery_charge
          day_battery_discharge_71: sensor.inverter_uflex_today_battery_discharge
          day_grid_export_77: sensor.inverter_uflex_today_energy_export
          day_grid_import_76: sensor.inverter_uflex_today_energy_import
          day_load_energy_84: sensor.inverter_uflex_today_load_consumption
          day_pv_energy_108: sensor.inverter_uflex_today_production
          essential_power: sensor.inverter_uflex_load_power
          grid_ct_power_172: sensor.inverter_uflex_external_ct1_power
          grid_power_169: sensor.inverter_uflex_external_power
          inverter_status_59: sensor.inverter_uflex_device_state
          inverter_voltage_154: sensor.inverter_uflex_grid_l1_voltage
          load_frequency_192: sensor.inverter_uflex_grid_frequency
          pv1_current_110: sensor.inverter_uflex_pv1_current
          pv1_power_186: sensor.inverter_uflex_pv1_power
          pv1_voltage_109: sensor.inverter_uflex_pv1_voltage
          pv2_current_112: sensor.inverter_uflex_pv2_current
          pv2_power_187: sensor.inverter_uflex_pv2_power
          pv2_voltage_111: sensor.inverter_uflex_pv2_voltage
          pv_total_power: sensor.inverter_uflex_pv_power
        grid:
          show_daily_buy: true
          show_daily_sell: true
          show_nonessential: true
        inverter:
          autarky: power
          auto_scale: true
          colour: '#9e9e9e'
          model: sunsynk
          modern: true
          three_phase: false
        large_font: false
        load:
          show_daily: true
        max_line_width: 4
        min_line_width: 1
        show_battery: true
        show_grid: true
        show_solar: true
        solar:
          mppts: 2
          show_daily: true
        type: custom:sunsynk-power-flow-card
        wide: false
      - heading: CONSUMI OGGI
        heading_style: title
        icon: ''
        type: heading
      - entity: sensor.panasonic_consumata_oggi
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        icon: mdi:heat-pump-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-panasonic/panasonic
        name: Pompa
        type: tile
        vertical: false
      - entity: sensor.auto_energia_oggi
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:flash-auto
        name: Auto
        type: tile
        vertical: false
      - entity: sensor.consumo_fancoil_totale_oggi
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        hide_state: false
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Fancoil
        show_entity_picture: false
        type: tile
        vertical: false
      - entity: sensor.consumo_deumidificatori_oggi
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Deumidif.
        type: tile
        vertical: false
      - entity: sensor.lavatrice_oggi
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        hide_state: false
        icon: mdi:washing-machine
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil
        name: Lavatrice
        show_entity_picture: false
        type: tile
        vertical: false
      - entity: sensor.cucina_energia_oggi
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:fridge-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil/fancoil
        name: Cucina
        type: tile
        vertical: false
      - entity: sensor.sauna_energia_oggi
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:spa-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-fancoil
        name: Sauna
        type: tile
        vertical: false
      - color: '#7E57C2'
        entity: sensor.altri_apparecchi_oggi
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        hide_state: false
        icon: mdi:home-lightning-bolt-outline
        icon_tap_action:
          action: navigate
          navigation_path: /dashboard-consumi/elettricita
        name: Altri apparecchi
        show_entity_picture: false
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: ULTIMI 30 GG
        heading_style: title
        icon: mdi:lightning-bolt
        type: heading
      - heading: Produzione e a rete, kWh/gg
        heading_style: subtitle
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.inverter_uflex_today_production
          name: production oggi
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.inverter_uflex_today_energy_export
          name: a rete oggi
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
          min: 0
        - apex_config:
            title:
              text: kwh
          decimals: 1
          id: jwh
          min: 0
          opposite: true
        - apex_config:
            title:
              text: kwh
          decimals: 1
          id: kwh
          min: 0
          opposite: true
      - heading: Da rete, kWh e Euro/gg
        heading_style: subtitle
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.elettricita_oggi_kwh
          name: Da rete oggi
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: kwh
        - entity: sensor.elettricita_oggi_euro
          name: Da rete oggi
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: euro
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
          min: 0
        - apex_config:
            title:
              text: Euro
          decimals: 2
          id: euro
          min: 0
          opposite: true
      - heading: Tutti apparecchi, kWh/gg
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.panasonic_consumata_oggi
          name: Pompa
        - entity: sensor.consumo_fancoil_totale_oggi
          name: Fancoil
        - entity: sensor.consumo_deumidificatori_oggi
          name: Deumidif.
        - entity: sensor.lavatrice_energia
          name: Lavatrice
        - entity: sensor.auto_energia_oggi
          name: Auto
        - entity: sensor.sauna_energia_oggi
          name: Sauna
        - entity: sensor.altri_apparecchi_oggi
          name: 'Altri apparecchi '
        grid_options:
          columns: 12
          rows: auto
        period: day
        stat_types:
        - change
        type: statistics-graph
      - heading: 'Fancoil kWh/gg:'
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.consumo_fancoil_tania_oggi_stimato
          name: Tania
        - entity: sensor.consumo_fancoil_georgi_oggi_stimato
          name: Georgi
        - entity: sensor.consumo_fancoil_sala_oggi_stimato_non_verificato
          name: Sala
        grid_options:
          columns: 12
          rows: auto
        period: day
        stat_types:
        - change
        type: statistics-graph
      - heading: 'Deumidificatori kWh/gg:'
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.deumidificatore_armadio_oggi
          name: 'Armadio '
        - entity: sensor.consumo_deumidificatore_cantina_oggi
          name: Cantina
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - state
        type: statistics-graph
      - heading: 'Lavatrice kWh/gg:'
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.lavatricemielewci870_consumo_energia
          name: Lavatrice
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - change
        type: statistics-graph
      - heading: Cucina kWh/gg
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.shellyem_ec64c9c9b75c_channel_1_energia
          name: Cucina
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - change
        type: statistics-graph
      - heading: Auto kWh/gg
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.solo_auto_contattore_energia_totale
          name: Auto giorno
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - change
        type: statistics-graph
      type: grid
    - cards:
      - heading: ULTIMI 12 MESI
        heading_style: title
        type: heading
      - heading: Da rete, kWh/mese
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.elettricita_mese_kwh
          name: kWh rilevato
        - entity: input_number.bolletta_elec_kwh
          name: kWh bolletta
        grid_options:
          columns: 12
          rows: auto
        period: month
        stat_types:
        - max
        type: statistics-graph
      - heading: "Da rete, \u20AC/mese"
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.elettricita_mese_euro
          name: "\u20AC rilevato"
        - entity: input_number.bolletta_elec_euro
          name: "\u20AC bolletta"
        grid_options:
          columns: 12
          rows: auto
        period: month
        stat_types:
        - max
        type: statistics-graph
      - heading: Tutti apparecchi, kWh/mese
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.panasonic_consumata_oggi
          name: Pompa
        - entity: sensor.consumo_fancoil_totale_oggi
          name: Fancoil
        - entity: sensor.consumo_deumidificatori_oggi
          name: Deumidif.
        - entity: sensor.lavatrice_energia
          name: Lavatrice
        - entity: sensor.auto_energia_oggi
          name: Auto
