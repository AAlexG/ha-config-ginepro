config:
  views:
  - cards: []
    header: {}
    path: elettricita
    sections:
    - cards:
      - heading: TOTALI
        heading_style: title
        type: heading
      - heading: 'DA SEMPRE (solo mesi dove esistono rilevato e bolette):'
        heading_style: subtitle
        type: heading
      - entity: input_number.elettricita_totale_rilevato_kwh
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        icon: mdi:solar-power
        name: Rilevato
        type: tile
        vertical: false
      - entity: input_number.elettricita_totale_bollette_kwh
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        name: Bollette
        type: tile
        vertical: false
      - heading: TOTALI MENSILI
        heading_style: subtitle
        type: heading
      - content: '{% set d = state_attr(''sensor.pv_tabella_mensile'', ''mesi'') %}
          {%

          if d is none %} _Dati non disponibili_ {% else %} {% set mesi = d

          | reverse | list %} <div

          style="overflow-x:auto;overflow-y:auto;max-height:400px;font-size:11px">

          <table

          style="border-collapse:collapse;width:100%;white-space:nowrap">

          <thead><tr

          style="position:sticky;top:0;background:#1a1a2e;color:#e0e0e0">

          <th style="padding:4px 6px;border:1px solid #444">Mese</th> <th

          style="padding:4px 6px;border:1px solid #444">Prod</th> <th

          style="padding:4px 6px;border:1px solid #444">Consumo</th> <th

          style="padding:4px 6px;border:1px solid #444">% Consumo</th>

          <th style="padding:4px 6px;border:1px solid #444">Import</th> <th

          style="padding:4px 6px;border:1px solid #444">Tot Consum</th> <th

          style="padding:4px 6px;border:1px solid #444">Export</th> <th

          style="padding:4px 6px;border:1px solid #444">Bat Carica</th> <th

          style="padding:4px 6px;border:1px solid #444">Bat Scarica</th> <th

          style="padding:4px 6px;border:1px solid #444">%Perd</th>

          </tr></thead> <tbody> {% for r in mesi %} {% if loop.first or

          loop.last %} <tr style="font-weight:bold;background:#2a2a3e"> {%

          else %} <tr> {% endif %} <td style="padding:3px 6px;border:1px

          solid #333">{{ r.mese }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.produzione

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.autoconsumo }}</td> <td

          style="padding:3px 6px;border:1px solid #333;text-align:right">{{

          r.pct_auto }}%</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.import }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.consumo_tot

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.export }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.batt_carica

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.batt_scarica }}</td> <td

          style="padding:3px 6px;border:1px solid #333;text-align:right">{{

          r.pct_batt_loss }}%</td> </tr> {% endfor %} </tbody></table></div>

          {% endif %}

          '
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - grid_options:
          columns: 6
          rows: auto
        icon: mdi:solar-panel-large
        icon_height: 20px
        name: Panel Analytics
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          data:
            data:
              package_name: appinventor.ai_aagorine.PanelAnalytics
            message: command_launch_app
          perform_action: notify.mobile_app_cph2653
        type: button
      - heading: TOTALI MENSILI x TIPO APPARECCHI
        heading_style: subtitle
        type: heading
      - content: '{% set d = state_attr(''sensor.pv_tabella_mensile'', ''mesi'') %}
          {% if d is none %} _Dati non disponibili_ {% else %} {% set mesi = d | reverse
          | list %} <div style="overflow-x:auto;overflow-y:auto;max-height:400px;font-size:11px">
          <table style="border-collapse:collapse;width:100%;white-space:nowrap"> <thead><tr
          style="position:sticky;top:0;background:#1a1a2e;color:#e0e0e0"> <th style="padding:4px
          6px;border:1px solid #444">Mese</th> <th style="padding:4px 6px;border:1px
          solid #444">Pompa</th> <th style="padding:4px 6px;border:1px solid #444">Fancoil</th>
          <th style="padding:4px 6px;border:1px solid #444">Deumid.</th> <th style="padding:4px
          6px;border:1px solid #444">Lavatr.</th> <th style="padding:4px 6px;border:1px
          solid #444">Auto</th> <th style="padding:4px 6px;border:1px solid #444">Sauna</th>
          <th style="padding:4px 6px;border:1px solid #444">Altri</th> <th style="padding:4px
          6px;border:1px solid #444">Totale consumi</th> </tr></thead> <tbody> {%
          for r in mesi %} {% if loop.first or loop.last %} <tr style="font-weight:bold;background:#2a2a3e">
          {% else %} <tr> {% endif %} <td style="padding:3px 6px;border:1px solid
          #333">{{ r.mese }}</td> <td style="padding:3px 6px;border:1px solid #333;text-align:right">{{
          (r.get(''pompa'', 0) | string) | replace(''.'', '','') }}</td> <td style="padding:3px
          6px;border:1px solid #333;text-align:right">{{ (r.get(''fancoil'', 0) |
          string) | replace(''.'', '','') }}</td> <td style="padding:3px 6px;border:1px
          solid #333;text-align:right">{{ (r.get(''deumid'', 0) | string) | replace(''.'',
          '','') }}</td> <td style="padding:3px 6px;border:1px solid #333;text-align:right">{{
          (r.get(''lavatrice'', 0) | string) | replace(''.'', '','') }}</td> <td style="padding:3px
          6px;border:1px solid #333;text-align:right">{{ (r.get(''auto'', 0) | string)
          | replace(''.'', '','') }}</td> <td style="padding:3px 6px;border:1px solid
          #333;text-align:right">{{ (r.get(''sauna'', 0) | string) | replace(''.'',
          '','') }}</td> <td style="padding:3px 6px;border:1px solid #333;text-align:right">{{
          (r.get(''altri'', 0) | string) | replace(''.'', '','') }}</td> <td style="padding:3px
          6px;border:1px solid #333;text-align:right">{{ r.get(''consumo_tot'', 0)
          }}</td> </tr> {% endfor %} </tbody></table></div> {% endif %} '
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - heading: 'Risparmio fotovoltaico (storico):'
        heading_style: subtitle
        type: heading
      - entity: input_number.pv_risparmio_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:solar-power
        name: Autoconsumo
        type: tile
        vertical: false
      - entity: input_number.pv_totale_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:piggy-bank
        name: Totale
        type: tile
        vertical: false
      - entity: input_number.pv_gse_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:cash-multiple
        name: Da GSE
        type: tile
        vertical: false
      - entity: input_number.pv_recupero_pct
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:percent
        name: '% recupero'
        type: tile
        vertical: false
      - entity: input_number.elettricita_prezzo_kwh
        grid_options:
          columns: 12
          rows: 2
        name: Prezzo a consumo (1 kWh)
        type: entity
      - entity: input_number.elettricita_quota_fissa_mese
        grid_options:
          columns: 12
          rows: 2
        name: Quota fissa mensile
        type: entity
    - cards:
      - heading: ULTIMI 30 GG
        heading_style: title
        icon: mdi:lightning-bolt
        type: heading
      - heading: Produzione e a rete, kWh/gg
        heading_style: subtitle
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.inverter_uflex_today_production
          name: production oggi
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.inverter_uflex_today_energy_export
          name: a rete oggi
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
        - apex_config:
            title:
              text: kwh
          decimals: 1
          id: jwh
          opposite: true
        - apex_config:
            title:
              text: kwh
          decimals: 1
          id: kwh
          opposite: true
      - heading: Da rete, kWh e Euro/gg
        heading_style: subtitle
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.elettricita_oggi_kwh
          name: Da rete oggi
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: kwh
        - entity: sensor.elettricita_oggi_euro
          name: Da rete oggi
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: euro
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
        - apex_config:
            title:
              text: Euro
          decimals: 2
          id: euro
          opposite: true
      - heading: Tutti apparecchi, kWh/gg
        heading_style: subtitle
        icon: ''
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.panasonic_consumata_oggi
          name: Pompa
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_fancoil_totale_oggi
          name: Fancoil
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_deumidificatori_oggi
          name: Deumidif.
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.lavatrice_energia
          name: Lavatrice
          statistics:
            period: day
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.auto_energia_oggi
          name: Auto
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.sauna_energia_oggi
          name: Sauna
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - color: '#7E57C2'
          entity: sensor.altri_apparecchi_oggi
          name: Altri apparecchi
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
      - heading: 'Fancoil kWh/gg:'
        heading_style: subtitle
        icon: ''
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.consumo_fancoil_totale_oggi
          name: Totale
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_fancoil_sala_oggi_stimato_non_verificato
          name: Sala
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_fancoil_georgi_oggi_stimato
          name: Georgi
          statistics:
            period: day
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_fancoil_tania_oggi_stimato
          name: Tania
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
          opposite: true
      - heading: 'Deumidificatori kWh/gg:'
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.consumo_deumidificatori_oggi
          name: Totale deumidificatori
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - state
        type: statistics-graph
      - heading: 'Lavatrice kWh/gg:'
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.lavatricemielewci870_consumo_energia
          name: Lavatrice
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - state
        type: statistics-graph
      - heading: Sauna kWh/gg
        heading_style: subtitle
        icon: ''
        type: heading
      - chart_type: bar
        days_to_show: 120
        entities:
        - entity: sensor.solo_sauna_contatore_potenza_di_fase_a
          name: Sauna
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - max
        type: statistics-graph
      type: grid
    - cards:
      - heading: ULTIMI 12 MESI
        heading_style: title
        type: heading
      - heading: Da rete, kWh/mese
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.elettricita_mese_kwh
          name: kWh rilevato
        - entity: input_number.bolletta_elec_kwh
          name: kWh bolletta
        grid_options:
          columns: 12
          rows: auto
        period: month
        stat_types:
        - max
        type: statistics-graph
      - heading: "Da rete, \u20AC/mese"
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.elettricita_mese_euro
          name: "\u20AC rilevato"
        - entity: input_number.bolletta_elec_euro
          name: "\u20AC bolletta"
        grid_options:
          columns: 12
          rows: auto
        period: month
        stat_types:
        - max
        type: statistics-graph
      - heading: Tutti apparecchi, kWh/mese
        heading_style: subtitle
        type: heading
      - graph_span: 120d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
        series:
        - entity: sensor.panasonic_consumata_oggi
          name: Pompa
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_fancoil_totale_oggi
          name: Fancoil
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.consumo_deumidificatori_oggi
          name: Deumidif.
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.lavatrice_energia
          name: Lavatrice
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.auto_energia_oggi
          name: Auto
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.sauna_energia_oggi
          name: Sauna
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - color: '#7E57C2'
          entity: sensor.altri_apparecchi_oggi
          name: Altri apparecchi
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 1
          id: kwh
        - apex_config:
            title:
              text: kwh
          decimals: 1
          id: jwh
          opposite: true
        - apex_config:
            title:
              text: kwh
          decimals: 1
          id: kwh
          opposite: true
      - heading: "A rete stimato-GSE,\u20AC/mese"
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.a_rete_mese_euro
          name: "Stimato (kWh \xD7 tariffa)"
        - entity: input_number.bolletta_gse_euro
          name: Pagato GSE
        grid_options:
          columns: 12
          rows: auto
        period: month
        stat_types:
        - max
        type: statistics-graph
      - heading: "Prezzo GSE \u20AC/kWh mese"
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.gse_prezzo_kwh
          name: "\u20AC/kWh GSE"
        grid_options:
          columns: 12
          rows: auto
        period: month
        stat_types:
        - max
        type: statistics-graph
      type: grid
    - cards:
      - heading: ANNI
        heading_style: title
        type: heading
      - heading: Da rete, kWh/anno
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 730
        entities:
        - entity: sensor.elettricita_mese_kwh
          name: kWh rilevato
        - entity: input_number.bolletta_elec_kwh
          name: kWh bolletta
        grid_options:
          columns: 12
          rows: auto
        period: year
        stat_types:
        - max
        type: statistics-graph
      - heading: Tutti apparecchi, kWh/anno
        heading_style: subtitle
        type: heading
      - chart_type: bar
        days_to_show: 730
        entities:
        - entity: sensor.panasonic_consumata_oggi
          name: Pompa
        - entity: sensor.consumo_fancoil_totale_oggi
          name: Fancoil
        - entity: sensor.consumo_deumidificatori_oggi
          name: Deumidif.
        - entity: sensor.lavatrice_energia
          name: Lavatrice
        - entity: sensor.auto_energia_oggi
          name: Auto
        - entity: sensor.sauna_energia_oggi
          name: Sauna
        - entity: sensor.altri_apparecchi_oggi
          name: 'Altri apparecchi '
        grid_options:
          columns: 12
          rows: auto
        period: year
        stat_types:
        - change
        type: statistics-graph
      type: grid
    title: "Elettricit\xE0"
    type: sections
  - header:
      card:
        content: "CONSUMI \u2013 Acqua"
        text_only: true
        type: markdown
    path: acqua
    sections:
    - cards:
      - heading: 'Totale (solo mesi dove esistono tutti dati):'
        heading_style: title
        type: heading
      - entity: input_number.acqua_totale_rilevato_mc
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        name: Totale rilevato
        type: tile
        vertical: false
      - entity: input_number.acqua_totale_bollette_mc
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        name: Totale bollette
        type: tile
        vertical: false
      - heading: 'Oggi:'
        heading_style: title
        type: heading
      - entity: sensor.acqua_oggi_mc
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Totale
        type: tile
        vertical: false
      - entity: sensor.acqua_oggi_euro
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Totale
        type: tile
        vertical: false
      - entity: sensor.acqua_sanitaria_totale
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Fredda
        type: tile
        vertical: false
      - entity: sensor.acqua_sanitaria_calda_stimata
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Calda
        type: tile
        vertical: false
      - entity: sensor.acqua_irrigazione_oggi
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Irrigazioni
        type: tile
        vertical: false
      - entity: sensor.acqua_lavatrice_oggi
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        icon: mdi:washing-machine
        name: Lavatrice oggi
        type: tile
        vertical: false
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: "Acqua, m\xB3 e Euro/gg"
        series:
        - entity: sensor.acqua_oggi_mc
          name: "m\xB3 oggi"
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: mc
        - entity: sensor.acqua_oggi_euro
          name: Euro oggi
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: euro
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: "m\xB3"
          decimals: 3
          id: mc
        - apex_config:
            title:
              text: Euro
          decimals: 2
          id: euro
          opposite: true
      - heading: Solo Irrigazione oggi
        heading_style: subtitle
        type: heading
      - entity: counter.irrigazione_minuti_oggi
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Minuti oggi
        type: tile
        vertical: false
      - entity: sensor.acqua_irrigazione_oggi
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Consumo Irrigazione
        type: tile
        vertical: false
      - heading: Solo Acqua Sanitaria oggi
        heading_style: subtitle
        type: heading
      - entity: sensor.caldaia_dhw_durata_oggi_minuti
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Durata caldaia
        type: tile
        vertical: false
      - entity: sensor.acqua_sanitaria_calda_stimata
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Acqua calda
        type: tile
        vertical: false
      - entity: sensor.acqua_sanitaria_totale
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: 'Sanitaria totale '
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Ultimi 12 mesi
        heading_style: title
        type: heading
      - entity: sensor.acqua_mese_mc
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
