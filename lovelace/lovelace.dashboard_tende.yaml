config:
  title: Tende v.11
  views:
  - cards: []
    max_columns: 2
    path: tende
    sections:
    - cards:
      - heading: Tenda Giardino
        heading_style: title
        icon: mdi:awning-outline
        type: heading
      - entity: cover.all_house_tenda_giardino_new
        features:
        - type: cover-position-favorite
        - type: cover-open-close
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
        name: Attuale apertura tenda %
        state_content:
        - state
        - current_position
        type: tile
        vertical: false
      - entity: script.tenda_giardino_apri
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        hide_state: true
        icon: mdi:arrow-expand
        name: Apri 85%
        tap_action:
          action: perform-action
          perform_action: script.tenda_giardino_apri
        type: tile
        vertical: false
      - entity: script.tenda_giardino_chiudi
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        hide_state: true
        icon: mdi:arrow-collapse
        name: Chiudi
        tap_action:
          action: perform-action
          perform_action: script.tenda_giardino_chiudi
        type: tile
        vertical: false
      - entity: cover.all_house_tenda_giardino_new
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        hide_state: true
        icon: mdi:stop
        name: Stop
        tap_action:
          action: perform-action
          perform_action: cover.stop_cover
          target:
            entity_id: cover.all_house_tenda_giardino_new
        type: tile
        vertical: false
      - entity: input_boolean.tenda_notifica_vento_oggi
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: E' stata chiusa x vento
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Pergola Terrazza
        heading_style: title
        icon: mdi:awning
        type: heading
      - entity: cover.terrazzo_pergola_terrazza
        features:
        - type: cover-open-close
        - type: cover-position
        - type: cover-tilt-favorite
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
        name: Attuale apertura lamelle %
        state_content:
        - state
        - current_tilt_position
        type: tile
        vertical: false
      - entity: input_boolean.pergola_meteo_chiusura
        features_position: bottom
        grid_options:
          columns: full
          rows: 1
        name: E' stata chiusa X vento o pioggia
        type: tile
        vertical: false
      - content: "**Causa:** {{ states('input_text.pergola_meteo_causa') | default('\u2014\
          ', true) }}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - entity: input_boolean.pergola_blocco_manuale
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
        name: Chiudere fino notte
        tap_action:
          action: perform-action
          perform_action: script.pergola_toggle_manuale
        type: tile
        vertical: false
      - entity: input_number.pergola_min_mattino
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Apertura min mattino(08:30-11:15)
        type: tile
        vertical: false
      type: grid
    title: Tende
    type: sections
