    - cards:
      - heading: "INVERTER \xB7 ACCUMULO: TIPO E CARICA"
        heading_style: title
        type: heading
      - content: "**Tipo di accumulo** \u2013 *Lithium*: l'inverter segue i limiti\
          \ che il BMS del modulo comunica dal cavo. *Lead-Battery*: carica a tensione\
          \ in 4 fasi, senza BMS. Impostato: **{{ states('select.inverter_uflex_battery_control_mode')\
          \ }}**. \u2705 MU p.14.\n\n**Soglie in volt o in %** \u2013 *Voltage*: valgono\
          \ le soglie in volt. *Capacity* (\"Use Batt %\"): valgono quelle in %, sul\
          \ SoC che arriva dal BMS. Impostato: **{{ states('select.inverter_uflex_battery_operation_mode')\
          \ }}**. MI p.27 descrive l'opzione ma non indica quale usare con il supercondensatore.\n\
          \n**Protocollo BMS** \u2013 Impostato: **{{ states('select.inverter_uflex_battery_bms_type')\
          \ }}**. \u2705 MU p.14. \u2753 Lo stesso protocollo compare con tre nomi:\
          \ PYLON in HA, \"Lithium Mode 00 / SUNKET\" sul display, PN_GDLT nell'app\
          \ BMS.\n\n**DIP switch del modulo** \u2013 tutti su OFF per un modulo singolo.\
          \ \u2705 MU p.8 (l'ingegnere aveva indicato DIP 5 su ON, che per il manuale\
          \ vuol dire 2 moduli in parallelo).\n\n**Capacit\xE0** \u2013 {{ states('number.inverter_uflex_battery_capacity')\
          \ }} Ah. \u2705 BR (7,6 kWh). Misurata dai contatori dell'inverter in settembre\u2013\
          ottobre, prima del cavo BMS: 6,5\u20137,0 kWh entrano dal vuoto al pieno,\
          \ circa 6,3 kWh escono ogni notte.\n\n**Corrente max carica / scarica**\
          \ \u2013 {{ states('number.inverter_uflex_battery_max_charging_current')\
          \ }} A / {{ states('number.inverter_uflex_battery_max_discharging_current')\
          \ }} A. \u2705 MU p.12, MI p.27: 100 A. \u2753 Il blocco dell'8/10 \xE8\
          \ arrivato dopo circa un minuto di scarica a 100 A, senza cavo BMS: da chiedere\
          \ se ora il BMS limita da solo la corrente.\n\n**Absorption / Float / Equalization**\
          \ \u2013 {{ states('number.inverter_uflex_battery_absorption') }} / {{ states('number.inverter_uflex_battery_float')\
          \ }} / {{ states('number.inverter_uflex_battery_equalization') }} V. \u2705\
          \ MU p.12: 58,8 / 57 / 58,8 V. In modalit\xE0 *Lithium* non vengono usati:\
          \ la tensione di carica la chiede il BMS (MI p.29).\n\n**Equalizz. ogni\
          \ / Durata equalizz.** \u2013 Non usati in modalit\xE0 *Lithium* (MI p.29).\n\
          \n**Compensaz. temperatura** \u2013 0 vuol dire nessuna correzione. Non\
          \ usata in modalit\xE0 *Lithium*. La temperatura ora arriva dal BMS; prima\
          \ del 12/10 era fissa a 25 \xB0C.\n\n**Resistenza interna** \u2013 {{ states('number.inverter_uflex_battery_resistance')\
          \ }} m\u03A9. \u2753 MI mostra 25 m\u03A9 come esempio, BR indica un ESR\
          \ sotto 10 m\u03A9. Non \xE8 chiaro se serva in modalit\xE0 *Lithium*.\n\
          \n**Efficienza di carica** \u2013 {{ states('number.inverter_uflex_battery_charging_efficiency')\
          \ }} %. \u2753 BR indica il 97,8 % andata e ritorno. Non \xE8 chiaro se\
          \ serva in modalit\xE0 *Lithium*.\n\n**Risveglio accumulo** (\"Activate\
          \ Battery\") \u2013 {{ states('switch.inverter_uflex_battery_wake_up') }}.\
          \ MI p.27: recupera un accumulo scaricato troppo caricandolo lentamente.\
          \ A modulo carico non fa nulla.\n\n**Disable Float / BMS_Err_Stop** \u2013\
          \ Non hanno un'entit\xE0 in HA: si impostano dal display (MI p.27 e p.45).\
          \ \u2753 Domande aperte per l'ingegnere."
        grid_options:
          columns: full
          rows: auto
        type: markdown
