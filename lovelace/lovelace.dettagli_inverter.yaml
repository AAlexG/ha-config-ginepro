    - cards:
      - heading: "INVERTER \xB7 PROGRAMMI ORARI (Time of Use)"
        heading_style: title
        type: heading
      - content: "**Programmi orari attivi** \u2013 Indica in quali giorni valgono\
          \ le 6 fasce. *Week* vuol dire tutti i giorni; *Disabled* le disattiva tutte.\
          \ Impostato: **{{ states('select.inverter_uflex_time_of_use') }}**.\n\n\
          **Come funziona una fascia** \u2013 Ogni fascia va dal suo **Inizio** all'inizio\
          \ della fascia successiva; la fascia 6 arriva fino all'inizio della fascia\
          \ 1.\n- **Potenza max**: potenza massima con cui l'accumulo pu\xF2 scaricare\
          \ in quella fascia.\n- **Soglia accumulo**: in quella fascia l'accumulo\
          \ non viene scaricato sotto questo valore (in V con modalit\xE0 *Voltage*,\
          \ in % con *Capacity*).\n- **Carica da**: se impostato su *Grid* o *Generator*,\
          \ in quella fascia l'accumulo viene caricato da rete o generatore fino alla\
          \ soglia. *Disabled* vuol dire solo FV.\n\n**Valori attuali** (modalit\xE0\
          \ **{{ states('select.inverter_uflex_battery_operation_mode') }}**, quindi\
          \ vale la soglia in {{ '%' if is_state('select.inverter_uflex_battery_operation_mode',\
          \ 'Capacity') else 'V' }}):\n\n| Fascia | Inizio | Carica da | Potenza |\
          \ Soglia % |\n|---|---|---|---|---|\n{%- for i in range(1, 7) %}\n| {{ i\
          \ }} | {{ states('time.inverter_uflex_program_' ~ i ~ '_time')[:5] }} |\
          \ {{ states('select.inverter_uflex_program_' ~ i ~ '_charging') }} | {{\
          \ states('number.inverter_uflex_program_' ~ i ~ '_power') | int(0) }} W\
          \ | {{ states('number.inverter_uflex_program_' ~ i ~ '_soc') }} % |\n{%-\
          \ endfor %}\n\nSoglia % di tutte le fasce: \u2705 10 % (BR: profondit\xE0\
          \ di scarica non oltre il 90 %), impostata il 12/10; prima le fasce lavoravano\
          \ in tensione a 42,5 V. Storia: con la fascia 3 a 49 V, l'8/10 dalle 09:22\
          \ alle 09:31 la casa ha prelevato 1000\u20131500 W dalla rete con l'accumulo\
          \ fermo a 48,6 V."
        grid_options:
          columns: full
          rows: auto
        type: markdown
