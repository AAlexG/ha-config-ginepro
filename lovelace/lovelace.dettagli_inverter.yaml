    - cards:
      - heading: "INVERTER \xB7 ACCUMULO: SOGLIE DI SCARICA"
        heading_style: title
        type: heading
      - content: "Con *Capacity* valgono le soglie in % qui sotto, sul SoC del BMS.\
          \ Le soglie in volt ({{ states('number.inverter_uflex_battery_shutdown_voltage')\
          \ }} / {{ states('number.inverter_uflex_battery_low_voltage') }} / {{ states('number.inverter_uflex_battery_restart_voltage')\
          \ }} V) non vengono usate.\n\n**Spegnimento** \u2013 Sotto questo SoC l'inverter\
          \ smette di scaricare l'accumulo: {{ states('number.inverter_uflex_battery_shutdown_soc')\
          \ }} %. \u2705 BR: profondit\xE0 di scarica non oltre il 90 %.\n\n**Batteria\
          \ bassa** \u2013 Soglia di allarme: {{ states('number.inverter_uflex_battery_low_soc')\
          \ }} %. Abbassata da 35 % a 11 % il 12/10, insieme all'allarme \"Remaining\
          \ capacity\" del BMS (da 15 % a 11 %): sotto quella soglia il BMS blocca\
          \ la scarica.\n\n**Ripartenza** \u2013 Dopo uno spegnimento per accumulo\
          \ scarico, l'inverter ricomincia a scaricarlo solo quando il SoC torna sopra\
          \ {{ states('number.inverter_uflex_battery_restart_soc') }} %. \u2753 Il\
          \ manuale non d\xE0 un valore.\n\n\u2753 Le soglie SoC (spegnimento, batteria\
          \ bassa, ripartenza, fasce) sono fra le domande per l'ingegnere."
        grid_options:
          columns: full
          rows: auto
        type: markdown
