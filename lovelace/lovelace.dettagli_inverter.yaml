      - content: "**Spegnimento** \u2013 Sotto questa tensione l'inverter smette di\
          \ scaricare l'accumulo. \u26A0\uFE0F 42 V coincide con la tensione minima\
          \ di scarica della scheda, quindi non c'\xE8 margine. In pratica non ci\
          \ si arriva, perch\xE9 la mattina l'accumulo si ferma a circa 44 V.\n\n\
          **Batteria bassa** \u2013 \xC8 la soglia di allarme di batteria scarica.\
          \ \xC8 la stessa tensione usata come limite dai programmi orari, tranne\
          \ la fascia delle 09:00. \u2753\n\n**Ripartenza** \u2013 Dopo uno spegnimento\
          \ per batteria scarica, l'inverter ricomincia a scaricare solo quando la\
          \ tensione torna sopra questo valore. \u2753\n\n**Vuoto** \u2013 \u2753\
          \ Il manuale Deye non lo descrive. Dal nome \xE8 la tensione considerata\
          \ \"accumulo vuoto\" per il calcolo della % mostrata. Non verificato.\n\n\
          **Soglie in %** \u2013 Sono le stesse funzioni espresse in percentuale;\
          \ i valori di fabbrica Deye per il piombo sono 20 / 35 / 50 %. Con *Soglie\
          \ in volt o in %* su *Voltage* non vengono usate. La brochure UFLEX raccomanda\
          \ una profondit\xE0 di scarica non oltre il 90 %."
        grid_options:
