      - content: "Parametri letti e scritti direttamente nei registri Modbus dell'inverter\
          \ UFLEX HY-SP-6-IT (integrazione Solarman). **Ogni modifica \xE8 immediata**:\
          \ non c'\xE8 conferma e non c'\xE8 annulla. Per i valori numerici i tasti\
          \ \u2212 / + cambiano di un passo; per scrivere un valore preciso tocca\
          \ il riquadro e usa la finestra che si apre.\n\n**Simboli**\n\u2705 valore\
          \ verificato sulla brochure UFLEX 2024 (inverter pag. 5, supercondensatore\
          \ UFSC48-7.6)\n\u26A0\uFE0F valore al limite o da far verificare a UFLEX\n\
          \u2753 non lo so: nessuna fonte UFLEX per questo valore\n\n**Da dove vengono\
          \ le spiegazioni**\nIl manuale dell'inverter UFLEX non \xE8 disponibile.\
          \ Le spiegazioni sono prese dal manuale Deye SUN-5/8K-SG01LP1 (it.deyeinverter.com).\
          \ L'inverter risponde alla stessa mappa Modbus Deye, ma UFLEX non ha confermato\
          \ che il funzionamento sia identico.\n\n**Sola lettura**\nI parametri dell'ultima\
          \ sezione (rete, protezioni, sistema) non hanno comandi in plancia, perch\xE9\
          \ una modifica sbagliata pu\xF2 staccare l'impianto dalla rete."
