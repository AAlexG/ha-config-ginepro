      - content: "**Carica da rete** \u2013 Se attiva, l'inverter carica l'accumulo\
          \ dalla rete quando scende sotto la soglia di partenza (in V o in %, secondo\
          \ la modalit\xE0), con la corrente impostata. \xC8 **disattiva**, quindi\
          \ l'accumulo si carica solo dal FV.\n\n**Carica da generatore** \u2013 Funziona\
          \ come la carica da rete, ma dalla porta GEN. \xC8 disattiva."
        grid_options:
          columns: full
          rows: auto
        text_only: true
        type: markdown
