          columns: full
          rows: auto
        type: markdown
      type: grid
    - cards:
      - heading: "INVERTER \xB7 MODALIT\xC0 E RETE"
        heading_style: title
        type: heading
      - content: "**Modalit\xE0 di lavoro** \u2013 *Export First*: il surplus va prima\
          \ in rete. *Zero Export To Load*: l'inverter alimenta solo l'uscita di backup.\
          \ *Zero Export To CT*: alimenta tutta la casa e usa il TC sul cavo di rete\
          \ per non immettere energia. A Casa Ginepro \xE8 impostato *Zero Export\
          \ To CT*; con **Cessione eccedenza** attiva il surplus che l'accumulo non\
          \ assorbe viene comunque immesso in rete.\n\n**Priorit\xE0 del FV** \u2013\
          \ *Load First*: il FV alimenta prima la casa, poi l'accumulo. *Battery First*:\
          \ prima l'accumulo, poi la casa. In tutti e due i casi la rete copre quello\
          \ che manca.\n\n**Cessione eccedenza** (\"Solar Sell\") \u2013 Se attiva,\
          \ il FV in eccesso va in rete quando casa e accumulo sono soddisfatti.\n\
          \n**Max potenza ceduta** \u2013 \xC8 la potenza massima immessa in rete.\
          \ \u2705 6000 W \xE8 sotto la potenza AC massima dell'inverter, che \xE8\
          \ 6600 W.\n\n**Prelievo minimo da rete** (\"Zero-export Power\") \u2013\
          \ \xC8 il prelievo che l'inverter mantiene in modalit\xE0 zero export, come\
          \ margine per non immettere. Il manuale Deye consiglia 20\u2013100 W. \u2705\
          \ Il valore impostato \xE8 20 W, ma il prelievo misurato \xE8 di 65\u2013\
          95 W, e l'11/10 \xE8 salito a circa 200 W dalle 09:30 alle 10:15.\n\n**Limite\
          \ potenza FV** (\"Max Solar Power\") \u2013 \xC8 la potenza massima che\
          \ l'inverter accetta dai pannelli. \u26A0\uFE0F La brochure d\xE0 7800 W\
          \ per HY-SP-6 e 6500 W per HY-SP-5: 6500 W \xE8 il valore del modello 5\
          \ kW. L'impianto \xE8 da 8,84 kWp e i picchi registrati sono di circa 6519\
          \ W, quindi la produzione potrebbe essere tagliata. Chiedere a UFLEX prima\
          \ di cambiarlo.\n\n**Limite prelievo rete** (\"Grid Peak Shaving\") \u2013\
          \ Se attivo, l'inverter usa FV e accumulo per non superare la soglia di\
          \ prelievo dalla rete. \xC8 disattivo, quindi la soglia non ha effetto."
        grid_options:
          columns: full
          rows: auto
        type: markdown
