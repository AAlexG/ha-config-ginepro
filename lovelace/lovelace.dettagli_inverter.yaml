    - cards:
      - heading: "INVERTER \xB7 PROGRAMMI ORARI (Time of Use)"
        heading_style: title
        type: heading
      - content: "**Programmi orari attivi** \u2013 Indica in quali giorni valgono\
          \ le 6 fasce. *Week* vuol dire tutti i giorni; *Disabled* le disattiva tutte.\n\
          \n**Come funziona una fascia** \u2013 Ogni fascia va dal suo **Inizio**\
          \ all'inizio della fascia successiva; la fascia 6 arriva fino alle 01:00.\n\
          - **Potenza max**: potenza massima con cui l'accumulo pu\xF2 scaricare in\
          \ quella fascia.\n- **Soglia accumulo**: in quella fascia l'accumulo non\
          \ viene scaricato sotto questo valore (in V con modalit\xE0 *Voltage*, in\
          \ % con *Capacity*).\n- **Carica da**: se impostato su *Grid* o *Generator*,\
          \ in quella fascia l'accumulo viene caricato da rete o generatore fino alla\
          \ soglia. *Disabled* vuol dire solo FV.\n\n**Valori attuali** \u2013 Tutte\
          \ le fasce hanno la carica da rete disattivata e la potenza a 6000 W. La\
          \ soglia \xE8 42,5 V in tutte le fasce. La fascia 3 (09:00\u201313:00) era\
          \ impostata dall'installatore a 49 V ed \xE8 stata abbassata a 42,5 V l'11/10.\
          \ Con 49 V, l'8/10 dalle 09:22 alle 09:31 la casa ha prelevato 1000\u2013\
          1500 W dalla rete con l'accumulo fermo a 48,6 V."
        grid_options:
          columns: full
          rows: auto
        type: markdown
