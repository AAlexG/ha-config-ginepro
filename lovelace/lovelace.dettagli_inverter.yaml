    - cards:
      - heading: "INVERTER \xB7 PORTA GENERATORE / SMART LOAD"
        heading_style: title
        type: heading
      - content: "**Uso della porta GEN** \u2013 La porta GEN pu\xF2 essere usata\
          \ in tre modi.\n- *Generator*: ingresso per un generatore.\n- *SmartLoad*:\
          \ uscita che alimenta un carico solo quando accumulo e FV superano le soglie.\n\
          - *Microinverter*: ingresso per un microinverter (AC coupling).\n\n\xC8\
          \ impostato *Generator*. Se alla porta GEN non \xE8 collegato nulla, i parametri\
          \ di questa sezione non hanno effetto.\n\n**Smart load ON / OFF** \u2013\
          \ In modalit\xE0 SmartLoad la porta si accende sopra la soglia ON (in V\
          \ o in %), purch\xE9 il FV superi il **FV minimo**, e si spegne sotto la\
          \ soglia OFF.\n\n**Sempre ON con rete** (\"On Grid always on\") \u2013 In\
          \ modalit\xE0 SmartLoad la porta resta accesa finch\xE9 c'\xE8 la rete.\n\
          \n**Gen.: peak shaving** \u2013 Se il generatore supera la sua potenza,\
          \ l'inverter copre la parte in eccesso.\n\n**Microinv.: stop cessione**\
          \ \u2013 Blocca l'immissione in rete dell'energia prodotta da un microinverter\
          \ collegato alla porta GEN.\n\n**Gen. lato rete** \u2013 \u2753 Il manuale\
          \ Deye non lo descrive."
        grid_options:
          columns: full
          rows: auto
        type: markdown
