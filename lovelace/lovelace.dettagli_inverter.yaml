    - cards:
      - heading: "INVERTER \xB7 ACCUMULO: TIPO E CARICA"
        heading_style: title
        type: heading
      - content: "**Tipo di accumulo** \u2013 *Lead-Battery*: l'inverter carica a\
          \ tensione, in 4 fasi come una batteria al piombo. *Lithium*: le soglie\
          \ le decide il BMS dell'accumulo attraverso il cavo di comunicazione. Qui\
          \ non c'\xE8 cavo BMS, quindi \xE8 impostato *Lead-Battery*. \u2753 UFLEX\
          \ non dice quale modalit\xE0 usare senza cavo; la brochure descrive inverter\
          \ e modulo con comunicazione BMS (CAN/RS485).\n\n**Soglie in volt o in %**\
          \ \u2013 *Voltage*: valgono le soglie in volt. *Capacity*: valgono quelle\
          \ in %. *No Battery*: l'inverter lavora senza accumulo. Con *Voltage* le\
          \ soglie in % della sezione successiva vengono ignorate.\n\n**Protocollo\
          \ BMS** \u2013 \xC8 il protocollo di comunicazione con il BMS. Conta solo\
          \ in modalit\xE0 *Lithium* con il cavo collegato, quindi ora non ha effetto.\
          \ \u2753 Nell'elenco non c'\xE8 nessuna voce UFLEX.\n\n**Capacit\xE0** \u2013\
          \ \u2705 147 Ah, come da scheda UFSC48-7.6.\n\n**Corrente max carica** \u2013\
          \ \u2705 80 A, sotto i 100 A del modulo e i 135 A dell'inverter.\n\n**Corrente\
          \ max scarica** \u2013 \u2705 90 A, abbassata da 100 A il 9/10 dopo il blocco\
          \ dell'8/10. \xC8 sotto i 100 A del modulo, con margine.\n\n**Tensione Absorption**\
          \ \u2013 \xC8 la tensione di fine carica. \u2705 58 V, cio\xE8 la tensione\
          \ massima di carica della scheda.\n\n**Tensione Float** \u2013 \xC8 la tensione\
          \ di mantenimento a carica completa. \u2705 57 V, il valore consigliato\
          \ da UFLEX.\n\n**Tensione Equalization** \u2013 \xC8 la tensione della carica\
          \ periodica di equalizzazione, che serve alle batterie al piombo. \u2705\
          \ 58 V, uguale ad Absorption, quindi non supera il massimo.\n\n**Equalizz.\
          \ ogni / Durata equalizz.** \u2013 Ogni quanti giorni fare l'equalizzazione\
          \ e per quante ore. \u2753 Con durata 0 h e tensione uguale ad Absorption\
          \ \xE8 probabile che non abbia effetto pratico (deduzione, non verificata).\n\
          \n**Compensaz. temperatura** \u2013 Correzione delle tensioni di carica\
          \ in base alla temperatura, tipica del piombo. 0 vuol dire nessuna correzione.\
          \ \u2753 La brochure dice che il modulo non ha problemi di temperatura,\
          \ ma non d\xE0 un valore. Il sensore di temperatura batteria dell'inverter\
          \ \xE8 fisso a 25 \xB0C.\n\n**Resistenza interna** \u2013 Serve all'inverter\
          \ per correggere la tensione letta sotto carico. \u2753 La scheda d\xE0\
          \ un ESR < 10 m\u03A9 misurato a 1 kHz, che non \xE8 necessariamente la\
          \ stessa grandezza. Il valore di fabbrica Deye \xE8 25 m\u03A9.\n\n**Efficienza\
          \ di carica** \u2013 \u2753 La scheda d\xE0 il 97,8 % andata e ritorno;\
          \ il manuale non spiega come l'inverter usa questo valore.\n\n**Risveglio\
          \ accumulo** (\"Activate Battery\") \u2013 \u2753 Il manuale Deye non lo\
          \ descrive. Dal nome serve a riattivare un accumulo in protezione."
        grid_options:
          columns: full
          rows: auto
        type: markdown
