    - cards:
      - heading: "INVERTER \xB7 RETE, PROTEZIONI E SISTEMA (sola lettura)"
        heading_style: title
        type: heading
      - content: "| Parametro | Valore |\n|---|---|\n| Interruttore senza nome (registro\
          \ 43) | {{ states('switch.inverter_uflex') }} {{ state_attr('switch.inverter_uflex','unit_of_measurement')\
          \ or '' }} |\n| Off Grid | {{ states('switch.inverter_uflex_off_grid') }}\
          \ {{ state_attr('switch.inverter_uflex_off_grid','unit_of_measurement')\
          \ or '' }} |\n| Frequenza di rete | {{ states('select.inverter_uflex_grid_frequency')\
          \ }} {{ state_attr('select.inverter_uflex_grid_frequency','unit_of_measurement')\
          \ or '' }} |\n| Protezione tensione alta | {{ states('number.inverter_uflex_grid_voltage_protection_high')\
          \ }} {{ state_attr('number.inverter_uflex_grid_voltage_protection_high','unit_of_measurement')\
          \ or '' }} |\n| Protezione tensione bassa | {{ states('number.inverter_uflex_grid_voltage_protection_low')\
          \ }} {{ state_attr('number.inverter_uflex_grid_voltage_protection_low','unit_of_measurement')\
          \ or '' }} |\n| Protezione frequenza alta | {{ states('number.inverter_uflex_grid_frequency_protection_high')\
          \ }} {{ state_attr('number.inverter_uflex_grid_frequency_protection_high','unit_of_measurement')\
          \ or '' }} |\n| Protezione frequenza bassa | {{ states('number.inverter_uflex_grid_frequency_protection_low')\
          \ }} {{ state_attr('number.inverter_uflex_grid_frequency_protection_low','unit_of_measurement')\
          \ or '' }} |\n| Meter | {{ states('select.inverter_uflex_meter') }} {{ state_attr('select.inverter_uflex_meter','unit_of_measurement')\
          \ or '' }} |\n| AC Coupling | {{ states('select.inverter_uflex_ac_coupling')\
          \ }} {{ state_attr('select.inverter_uflex_ac_coupling','unit_of_measurement')\
          \ or '' }} |\n| Tempo di autotest | {{ states('number.inverter_uflex_self_check_time')\
          \ }} {{ state_attr('number.inverter_uflex_self_check_time','unit_of_measurement')\
          \ or '' }} |\n| Data e ora inverter | {{ states('datetime.inverter_uflex_date_time')\
          \ }} {{ state_attr('datetime.inverter_uflex_date_time','unit_of_measurement')\
          \ or '' }} |\n| Cloud | {{ states('select.inverter_uflex_cloud') }} {{ state_attr('select.inverter_uflex_cloud','unit_of_measurement')\
          \ or '' }} |\n| Access point | {{ states('switch.inverter_uflex_access_point')\
          \ }} {{ state_attr('switch.inverter_uflex_access_point','unit_of_measurement')\
          \ or '' }} |\n| Riavvio logger | {{ states('button.inverter_uflex_restart')\
          \ }} {{ state_attr('button.inverter_uflex_restart','unit_of_measurement')\
          \ or '' }} |\n\n**Interruttore senza nome (registro 43)** \u2013 Nella definizione\
          \ Solarman non ha nome. \u2753 Non so cosa comandi: potrebbe essere l'accensione\
          \ dell'inverter. Non toccarlo.\n\n**Off Grid** \u2013 \u2753 Non lo so:\
          \ lo stato ON non corrisponde a un funzionamento a isola, perch\xE9 la casa\
          \ \xE8 collegata alla rete.\n\n**Frequenza e protezioni di rete** \u2013\
          \ Sono le soglie di tensione e frequenza oltre le quali l'inverter si stacca\
          \ dalla rete. Le imposta l'installatore secondo la norma di connessione\
          \ e non vanno modificate. La tensione bassa risulta *unknown*: l'integrazione\
          \ non riesce a leggerla.\n\n**Meter / AC Coupling** \u2013 Dicono se c'\xE8\
          \ un contatore esterno o un accoppiamento AC con altri inverter. \u2753\
          \ Il significato esatto di *Meter* non \xE8 descritto nel manuale.\n\n**Tempo\
          \ di autotest** \u2013 \u2753 Dal nome \xE8 l'attesa di autotest prima del\
          \ collegamento alla rete.\n\n**Cloud / Access point / Riavvio logger** \u2013\
          \ Sono funzioni del datalogger Solarman, non dell'inverter, e risultano\
          \ *unavailable*."
        grid_options:
          columns: full
          rows: auto
        type: markdown
      type: grid
    title: Dettagli inverter
    type: sections
