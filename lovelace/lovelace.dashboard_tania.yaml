config:
  title: plancia_Tania_1
  views:
  - sections:
    - cards:
      - heading: Apertura e chiusura cancelli e portone
        heading_style: title
        type: heading
      - grid_options:
          columns: 4
          rows: auto
        icon: mdi:gate-arrow-right
        icon_height: 15px
        name: Cancello giardino
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.apri_cancello_casa
        type: button
      - grid_options:
          columns: 5
          rows: auto
        icon: mdi:garage-open
        icon_height: 15px
        name: Box:Portone e cancellone
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.apri_box_combo
        type: button
      - grid_options:
          columns: 3
          rows: auto
        icon: mdi:boom-gate-up
        icon_height: 15px
        name: Canc. Moto
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.10007c3b31_0
        type: button
      - heading: ___________________________________________
        heading_style: title
        type: heading
      - heading: Apertura/chiusura Pergola e Tenda
        heading_style: title
        type: heading
      - entity: cover.terrazzo_pergola_terrazza
        features:
        - type: cover-open-close
        - type: cover-position
        - type: cover-tilt-favorite
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
        name: 'Pergola: per chiudere - clicca 0%'
        state_content:
        - state
        - current_tilt_position
        type: tile
        vertical: false
      - entity: script.tenda_giardino_chiudi
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        hide_state: true
        icon: mdi:arrow-expand
        name: Chiudi Tenda Giardino
        tap_action:
          action: perform-action
          perform_action: script.tenda_giardino_apri
        type: tile
        vertical: false
      - entity: script.tenda_giardino_apri
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        hide_state: true
        icon: mdi:arrow-expand
        name: Apri Tenda Giardino
        tap_action:
          action: perform-action
          perform_action: script.tenda_giardino_apri
        type: tile
        vertical: false
      - heading: ___________________________________________
        heading_style: title
        type: heading
      - heading: Accensione contattore auto
        heading_style: title
        type: heading
      - entity: switch.solo_auto_contattore_interruttore
        features:
        - type: toggle
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
        name: Contattore auto
        type: tile
        vertical: false
      - heading: ___________________________________________
        heading_style: title
        type: heading
      - heading: Luci
        heading_style: title
        type: heading
      - entity: switch.presa_luci_cucina_socket_1
        features:
        - type: toggle
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Cucina
        type: tile
        vertical: false
      - entity: light.luce_divano
        features:
        - type: toggle
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Divano
        type: tile
        vertical: false
      - entity: light.luce_terrazza
        features:
        - type: toggle
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
        name: Terrazza
        type: tile
        vertical: false
      - entity: light.luce_sopra
        features:
        - type: toggle
        features_position: bottom
        grid_options:
          columns: 6
          rows: 1
