        grid_options:
          columns: 6
          rows: auto
        icon: mdi:play-circle
        icon_height: 24px
        name: Esegui ciclo ora
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.irrigazione_cicla_ora
        type: button
      - color: '#D55E00'
        grid_options:
          columns: 6
          rows: auto
        icon: mdi:stop-circle
        icon_height: 24px
        name: Stop
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.irrigazione_stop
        type: button
      - grid_options:
          columns: 12
          rows: auto
        icon: mdi:water
        icon_height: 10px
        name: 'Dettagli di Irrigazione '
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-irrigazione
        type: button
      type: grid
    type: sections
