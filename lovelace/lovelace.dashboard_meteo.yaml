config:
  path: meteo
  title: Meteo v.7
  views:
  - cards: []
    max_columns: 2
    path: meteo
    sections:
    - cards:
      - heading: Meteo
        heading_style: title
        icon: mdi:weather-sunny
        type: heading
      - entity: sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature
        features_position: bottom
        name: Temp OUT
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_humidity
        features_position: bottom
        name: "Umidit\xE0 OUT"
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_max_daily_gust
        features_position: bottom
        name: Raffiche oggi
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_absolute_pressure
        features_position: bottom
        name: Pressione
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_rain_rate
        features_position: bottom
        name: PioggiaOra
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_rain_intensity
        features_position: bottom
        name: PioggiaTuya
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_solar_radiation
        features_position: bottom
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_illuminance_raw
        features_position: bottom
        name: IllumOraTuya
        type: tile
        vertical: false
      - entity: weather.casa
        forecast_type: hourly
        grid_options:
          columns: full
          rows: auto
        secondary_info_attribute: humidity
        show_current: false
        show_forecast: true
        type: weather-forecast
      - heading: "Temperatura e Umidit\xE0 in dettaglio "
        heading_style: subtitle
        icon: mdi:coolant-temperature
        type: heading
      - entities:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_indoor_temperature
          name: Temp.Sala
        - entity: sensor.termometro_georgi_zigbee_temperature
          name: Georgi
        - entity: sensor.termometro_tania_zigbee_temperature
          name: Tania
        - entity: sensor.termometro_cantina_zigbee_temperature
          name: Cantina
        - entity: sensor.hp1000se_pro_pro_v1_6_4_outdoor_temperature
          name: Esterna
        - entity: sensor.hp1000se_pro_pro_v1_6_4_indoor_humidity
          name: Humid.Sala
        - entity: sensor.termometro_georgi_zigbee_humidity
          name: Georgi
        - entity: sensor.termometro_tania_zigbee_humidity
          name: Tania
        - entity: sensor.termometro_cantina_zigbee_humidity
          name: Cantina
        - entity: sensor.hp1000se_pro_pro_v1_6_4_humidity
          name: Esterna
        grid_options:
          columns: full
          rows: auto
        hours_to_show: 24
        refresh_interval: 60
        type: history-graph
      - heading: "Vento in dettagli\xF2 "
        heading_style: subtitle
        icon: mdi:wind-power
        type: heading
      - entity: sensor.hp1000se_pro_pro_v1_6_4_max_daily_gust
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: Max Raffiche oggi
        type: tile
        vertical: false
      - entity: sensor.raffica_max_365_giorni
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: Max Raffiche Anno
        type: tile
        vertical: false
      - entities:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_wind_speed
          name: Vento ora
        - entity: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
          name: Raffiche ora
        grid_options:
          columns: full
          rows: auto
        hours_to_show: 24
        refresh_interval: 60
        type: history-graph
      - entities:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_wind_gust
          name: Raffiche ora
        grid_options:
          columns: full
          rows: auto
        hours_to_show: 8760
        refresh_interval: 60
        type: history-graph
      - heading: Pioggia in dettaglio
        heading_style: subtitle
        icon: mdi:weather-rainy
        type: heading
      - entity: sensor.hp1000se_pro_pro_v1_6_4_rain_rate
        features_position: bottom
        name: PioggiaOra
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_daily_rain
        features_position: bottom
        name: Giorno
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_weekly_rain
        features_position: bottom
        name: Settimana
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_monthly_rain
        features_position: bottom
        name: Mese
        type: tile
        vertical: false
      - entity: sensor.hp1000se_pro_pro_v1_6_4_yearly_rain
        features_position: bottom
        name: Anno
        type: tile
        vertical: false
      - graph_span: 48h
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Pioggia 48ore, mm/ora
        series:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_monthly_rain
          name: pioggia giorno
          statistics:
            period: hour
            type: change
          type: column
          yaxis_id: mm
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: mm
          decimals: 0
          id: mm
          min: 0
      - graph_span: 30days
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Pioggia 30gg, mm/gg
        series:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_monthly_rain
          name: pioggia giorno
          statistics:
            period: day
            type: change
          type: column
          yaxis_id: mm
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: mm
          decimals: 0
          id: mm
          min: 0
      - graph_span: 730days
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Pioggia 24 mesi, mm/mese
        series:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_monthly_rain
          name: pioggia mese
          statistics:
            period: month
            type: state
          type: column
          yaxis_id: mm
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: mm
          decimals: 0
          id: mm
          min: 0
      - heading: Previsioni in dettaglio
        heading_style: subtitle
        icon: mdi:weather-cloudy-clock
        type: heading
      - entity: weather.casa
        forecast_type: hourly
        grid_options:
          columns: full
          rows: auto
        secondary_info_attribute: humidity
        show_current: false
        show_forecast: true
        type: weather-forecast
      - entity: weather.casa
        forecast_type: daily
        grid_options:
          columns: full
          rows: auto
        show_current: false
        show_forecast: true
        type: weather-forecast
      - graph_span: 72h
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Pioggia-stazione Vs sensore pioggia
        series:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_daily_rain
          name: stazione meteo
          statistics:
            period: 5minute
            type: change
          stroke_width: 1
          type: line
          yaxis_id: mm
        - entity: sensor.sensore_pioggia_tuya_rain_intensity
          group_by:
            duration: 5min
            func: max
          name: sensore pioggia Tuya
          stroke_width: 1
          type: line
          yaxis_id: mV
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: mV
          decimals: 0
          id: mV
          min: 0
        - apex_config:
            title:
              text: mm
          decimals: 1
          id: mm
          opposite: true
      - graph_span: 72h
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Illuminazione-stazione Vs sensore pooggia
        series:
        - entity: sensor.hp1000se_pro_pro_v1_6_4_solar_radiation
          name: stazione meteo
          statistics:
            period: hour
            type: max
          stroke_width: 1
          type: line
          yaxis_id: Wm2
        - entity: sensor.sensore_pioggia_tuya_illuminance_raw
          name: sensore pioggia Tuya
          statistics:
            period: hour
            type: min
          stroke_width: 1
          type: line
          yaxis_id: mV
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: W/m2
          decimals: 0
          id: Wm2
          min: 0
        - apex_config:
            title:
              text: mV
          decimals: 0
          id: mV
          min: 0
          opposite: true
      type: grid
    title: Meteo
    type: sections
