config:
  title: Devices v.4
  views:
  - cards: []
    header: {}
    max_columns: 2
    path: devices
    sections:
    - cards:
      - heading: Normalmente chiusi
        heading_style: subtitle
        icon: mdi:home-thermometer-outline
        type: heading
      - heading: Sensori delle porte/persiane
        heading_style: title
        icon: mdi:home-thermometer-outline
        type: heading
      - entity: binary_sensor.cancello_entrata_zigbee_contact
        features_position: bottom
        name: CancEntrata
        type: tile
        vertical: false
      - entity: sensor.cancello_entrata_zigbee_battery
        features_position: bottom
        name: CancEntrata
        type: tile
        vertical: false
      - entity: binary_sensor.persiana_box_sensore_zigbee_contact
        features_position: bottom
        name: PersianaBox
        type: tile
        vertical: false
      - entity: sensor.persiana_box_sensore_zigbee_battery
        features_position: bottom
        name: PersianaBox
        type: tile
        vertical: false
      - heading: Normalmente aperte
        heading_style: subtitle
        icon: mdi:home-thermometer-outline
        type: heading
      - entity: binary_sensor.cancello_grande_zigbee_contact
        features_position: bottom
        name: CancGrande
        type: tile
        vertical: false
      - entity: sensor.cancello_grande_zigbee_battery
        features_position: bottom
        name: CancGrande
        type: tile
        vertical: false
      - entity: binary_sensor.portone_box_sensore_zigbee_contact
        features_position: bottom
        name: PortoneBox
        type: tile
        vertical: false
      - entity: sensor.portone_box_sensore_zigbee_battery
        features_position: bottom
        name: PortoneBox
        type: tile
        vertical: false
      - entity: binary_sensor.persiana_tania_sensore_zigbee_contact
        features_position: bottom
        name: PersTania
        type: tile
        vertical: false
      - entity: sensor.persiana_tania_sensore_zigbee_battery
        features_position: bottom
        name: 'PersTania '
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Sensore pioggia Tuya
        heading_style: title
        icon: mdi:home-thermometer-outline
        type: heading
      - entity: binary_sensor.sensore_pioggia_tuya_cleaning_reminder
        features_position: bottom
        name: Pulire?
        type: tile
        vertical: false
      - entity: binary_sensor.sensore_pioggia_tuya_rain
        features_position: bottom
        name: PioggiaOra
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_battery
        features_position: bottom
        name: Batteria
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_rain_intensity
        features_position: bottom
        name: "Intensit\xE0Pioggia"
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_illuminance_raw
        features_position: bottom
        name: IllumOra
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_illuminance_average_20min
        features_position: bottom
        name: IllumMedia
        type: tile
        vertical: false
      - entity: sensor.sensore_pioggia_tuya_illuminance_maximum_today
        features_position: bottom
        name: IllumMaxOggi
        type: tile
        vertical: false
      - entity: sensor.0xa4c13844184e6395_linkquality
        features_position: bottom
        name: Linkquality
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: Cantinetta Liebherr WSbl 5001
        heading_style: title
        icon: mdi:liquor
        type: heading
      - entity: number.cantinetta_vino_1_setpoint
        features:
        - style: buttons
          type: numeric-input
        features_position: bottom
        name: TempTarget
        type: tile
        vertical: false
      - entity: sensor.cantinetta_vino_1
        features:
        - type: trend-graph
        features_position: bottom
        name: Temp.ora
        type: tile
        vertical: false
      - heading: Presa cantinetta zigbee
        heading_style: subtitle
        icon: mdi:liquor
        type: heading
      - entity: switch.presa_cantinetta_zigbee
        features_position: bottom
        type: tile
        vertical: false
      - entity: sensor.presa_cantinetta_zigbee_linkquality
        features_position: bottom
        name: Linkquality
        type: tile
        vertical: false
      - entity: sensor.presa_cantinetta_zigbee_power
        features_position: bottom
        name: Potenza
        type: tile
        vertical: false
      - entity: sensor.presa_cantinetta_zigbee_current
        features_position: bottom
        name: Corrente
        type: tile
        vertical: false
      - entity: switch.presa_cantinetta_zigbee_child_lock
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Non si spegni per errore
        type: tile
        vertical: false
      - entity: select.presa_cantinetta_zigbee_power_outage_memory
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Restart Dopo Lockdown
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.presa_cantinetta_zigbee_energy
          name: Consumo giorno
        period: day
        stat_types:
        - change
        type: statistics-graph
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.presa_cantinetta_zigbee_energy
          name: Consumo mese
        period: month
        stat_types:
        - change
        type: statistics-graph
      type: grid
    - cards:
      - heading: Resmed Tania presa Tuya
        heading_style: title
        icon: mdi:medical-cotton-swab
        type: heading
      - entity: switch.cameratania_resmed_tania_presa_tuya_socket_1
        features:
        - type: toggle
        features_position: bottom
        name: Stato
        type: tile
        vertical: false
      - entity: sensor.cameratania_resmed_tania_presa_tuya_potenza
        features:
        - type: trend-graph
        features_position: bottom
        name: Potenza
        type: tile
        vertical: false
      - entity: sensor.cameratania_resmed_tania_presa_tuya_corrente_resmed_tania_presa_tuya
        features_position: bottom
        name: Corrente
        type: tile
        vertical: false
      - entity: sensor.cameratania_resmed_tania_presa_tuya_tensione
        features_position: bottom
        name: Tensione
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.cameratania_resmed_tania_presa_tuya_energia_totale
          name: Resmed al giorno
        period: day
        stat_types:
        - change
        type: statistics-graph
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.cameratania_resmed_tania_presa_tuya_energia_totale
          name: Resmed al mese
        period: month
        stat_types:
        - change
        type: statistics-graph
      type: grid
    - cards:
      - heading: Lavatrice Miele
        heading_style: title
        icon: mdi:washing-machine
        type: heading
      - entity: switch.lavatricemielewci870_accensione
        features_position: bottom
        name: Stato
        type: tile
        vertical: false
      - entity: binary_sensor.lavatricemielewci870_problema
        features_position: bottom
        name: Problemi?
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_tempo_trascorso
        features_position: bottom
        name: Tempo trascorso
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_tempo_residuo
        features_position: bottom
        name: Tempo residuo
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_previsione_consumo_acqua
        features_position: bottom
        name: Previsto acqua
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_previsione_consumo_energia
        features_position: bottom
        name: "Previsto elettricit\xE0 "
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_programma
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: Programma
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_fase_programma
        features_position: bottom
        grid_options:
          columns: full
        name: Fase
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_centrifuga
        features_position: bottom
        name: Centrifuga
        type: tile
        vertical: false
      - entity: sensor.lavatricemielewci870_temperatura_impostata
        features_position: bottom
        name: Temperatura
        type: tile
        vertical: false
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Consumo Energia e Acqua 30/gg
        series:
        - entity: sensor.lavatricemielewci870_consumo_energia
          name: Kwh ultimo lavaggio
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: Kwh
        - entity: sensor.lavatricemielewci870_consumo_acqua
          name: Litri ultimo lavaggio
          statistics:
            period: day
            type: state
          type: column
          yaxis_id: litri
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: Kwh
          decimals: 1
          id: Kwh
        - apex_config:
            title:
              text: Litri
          decimals: 1
          id: litri
          opposite: true
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.lavatricemielewci870_consumo_energia
          name: Lavatrice kWh al mese
        period: month
        stat_types:
        - change
        type: statistics-graph
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.lavatricemielewci870_consumo_acqua
          name: Lavatrice acqua al mese
        period: month
        stat_types:
        - change
        type: statistics-graph
      - heading: 'Lavaggi per programma (ultimi 12 mesi, totale da sempre):'
        heading_style: subtitle
        icon: mdi:format-list-numbered
        type: heading
      - content: "{% set r = state_attr('sensor.lavatrice_tabella_programmi', 'righe')\
          \ %}\n{% set m = state_attr('sensor.lavatrice_tabella_programmi', 'mesi')\
          \ %}\n{% set t = state_attr('sensor.lavatrice_tabella_programmi', 'totali')\
          \ %}\n{% if r is none or r | count == 0 %} _Nessun lavaggio registrato_\
          \ {% else %}\n<div style=\"overflow-x:auto;font-size:11px\"> <table style=\"\
          border-collapse:collapse;width:100%;white-space:nowrap\"> <thead><tr style=\"\
          position:sticky;top:0;background:#1A1A2E;color:#E0E0E0\"> <th style=\"padding:4px\
          \ 6px;border:1px solid #444444;text-align:left\">Programma</th> <th style=\"\
          padding:4px 6px;border:1px solid #444444\">Tot</th> <th style=\"padding:4px\
          \ 6px;border:1px solid #444444\">kWh ciclo</th> <th style=\"padding:4px\
          \ 6px;border:1px solid #444444\">W medi</th> <th style=\"padding:4px 6px;border:1px\
          \ solid #444444\">Litri ciclo</th> {% for x in m %}<th style=\"padding:4px\
          \ 6px;border:1px solid #444444\">{{ x }}</th>{% endfor %} </tr></thead>\
          \ <tbody> {% for row in r %} <tr> <td style=\"padding:3px 6px;border:1px\
          \ solid #333333\">{{ row.programma }}</td> <td style=\"padding:3px 6px;border:1px\
          \ solid #333333;text-align:right;font-weight:bold\">{{ row.totale }}</td>\
          \ <td style=\"padding:3px 6px;border:1px solid #333333;text-align:right\"\
          >{{ (row.kwh ~ '') | replace('.',',') if row.kwh is not none else '' }}</td>\
          \ <td style=\"padding:3px 6px;border:1px solid #333333;text-align:right\"\
          >{{ row.w if row.w is not none else '' }}</td> <td style=\"padding:3px 6px;border:1px\
          \ solid #333333;text-align:right\">{{ row.litri if row.litri is not none\
          \ else '' }}</td> {% for v in row.valori %}<td style=\"padding:3px 6px;border:1px\
          \ solid #333333;text-align:right\">{{ v if v else '' }}</td>{% endfor %}\
          \ </tr> {% endfor %} <tr style=\"font-weight:bold;background:#2A2A3E\">\
          \ <td style=\"padding:3px 6px;border:1px solid #333333\">TOTALE</td> <td\
          \ style=\"padding:3px 6px;border:1px solid #333333;text-align:right\">{{\
          \ t.totale }}</td> <td style=\"padding:3px 6px;border:1px solid #333333;text-align:right\"\
          >{{ (t.kwh ~ '') | replace('.',',') if t.kwh is not none else '' }}</td>\
          \ <td style=\"padding:3px 6px;border:1px solid #333333;text-align:right\"\
          >{{ t.w if t.w is not none else '' }}</td> <td style=\"padding:3px 6px;border:1px\
          \ solid #333333;text-align:right\">{{ t.litri if t.litri is not none else\
          \ '' }}</td> {% for v in t.valori %}<td style=\"padding:3px 6px;border:1px\
          \ solid #333333;text-align:right\">{{ v if v else '' }}</td>{% endfor %}\
          \ </tr> </tbody></table></div>\n\n<span style=\"font-size:11px;color:#B0B0B0\"\
          >kWh/ciclo, W medi e Litri/ciclo: media dei soli lavaggi misurati (energia\
          \ {{ t.misurati | default(0) }}, acqua {{ t.misurati_acqua | default(0)\
          \ }} su {{ t.totale }}). W medi = energia Miele (passi di 0,1 kWh) \xF7\
          \ durata del ciclo: e' la potenza media, non quella di picco.</span>\n{%\
          \ endif %}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      type: grid
    - cards:
      - heading: Presa box bici zigbee
        heading_style: title
        icon: mdi:bike
        type: heading
      - entity: switch.presa_box_bici_zigbee
        features:
        - type: toggle
        features_position: bottom
        name: Stato
        type: tile
        vertical: false
      - entity: sensor.presa_box_bici_zigbee_linkquality
        features:
        - type: trend-graph
        features_position: bottom
        name: LinkQulity
        type: tile
        vertical: false
      - entity: sensor.presa_box_bici_zigbee_power
        features_position: bottom
        name: Potenz.ora
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.presa_box_bici_zigbee_energy
          name: Bici al mese
        period: month
        stat_types:
        - change
        type: statistics-graph
      type: grid
    - cards:
      - heading: Cucina (tutti apparecchi)
        heading_style: title
        icon: mdi:countertop-outline
        type: heading
      - entity: sensor.shellyem_ec64c9c9b75c_channel_1_potenza
        features_position: bottom
        name: Potenz.ora
        type: tile
        vertical: false
      - entity: sensor.shellyem_ec64c9c9b75c_intensita_del_segnale
        features_position: bottom
        name: Segnale
        type: tile
        vertical: false
      - heading: Di cui solo luci cucina
        heading_style: subtitle
        icon: mdi:countertop-outline
        type: heading
      - entity: switch.presa_luci_cucina_socket_1
        features_position: bottom
        name: Stato
        type: tile
        vertical: false
      - entity: sensor.presa_luci_cucina_potenza
        features_position: bottom
        name: Potenz.ora
        type: tile
        vertical: false
      - entity: sensor.presa_luci_cucina_energia_totale
        features_position: bottom
        name: Consum.oggi
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.shellyem_ec64c9c9b75c_channel_1_energia
          name: Cucina al giorno
        grid_options:
          columns: full
          rows: auto
        period: day
        stat_types:
        - change
        type: statistics-graph
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.shellyem_ec64c9c9b75c_channel_1_energia
          name: Cucina al mese
        period: month
        stat_types:
        - change
        type: statistics-graph
      type: grid
    - cards:
      - heading: Lenzuola sotto via Tapo
        heading_style: title
        icon: mdi:bed
        type: heading
      - heading: Presa Tapo
        heading_style: subtitle
        icon: mdi:power-socket-de
        type: heading
      - entity: binary_sensor.lenzuola_sotto_overheated
        features_position: bottom
        name: Overheated?
        type: tile
        vertical: false
      - entity: sensor.camerageorgi_lenzuola_sotto_intensita_del_segnale
        features_position: bottom
        name: 'WiFi '
        type: tile
        vertical: false
      - entity: switch.lenzuola_sotto
        features:
        - type: toggle
        features_position: inline
        icon: mdi:bed
        name: Stato
        type: tile
        vertical: false
      - heading: Condizioni x accensione
        heading_style: subtitle
        icon: mdi:electric-switch
        type: heading
      - entities:
        - entity: sensor.lenzuola_ora_media_a_letto
          name: Media a letto
        - entity: input_number.lenzuola_tempo_addormentamento
          name: Addormentarsi
        - entity: sensor.lenzuola_accensione_prevista
          name: Accensione
        - entity: sensor.lenzuola_spegnimento_previsto
          name: Spegnimento
        - entity: input_datetime.lenzuola_ultimo_spegnimento_cucina
          name: Luci cucina
        - entity: counter.lenzuola_notti_registrate
          name: Notti registrate
        - entity: counter.lenzuola_notti_garmin
          name: Notti Garmin
        type: entities
      type: grid
    - cards:
      - heading: Sauna
        heading_style: title
        icon: mdi:spa
        type: heading
      - entity: sensor.solo_sauna_contatore_corrente_di_fase_a
        features_position: bottom
        name: Corrente
        type: tile
        vertical: false
      - entity: sensor.solo_sauna_contatore_potenza_di_fase_a
        features_position: bottom
        name: Potenza
        type: tile
        vertical: false
      - entity: sensor.sauna_energia_oggi
        features_position: bottom
        name: Consu.Oggi
        type: tile
        vertical: false
      - entity: sensor.solo_sauna_contatore_tensione_di_fase_a
        features_position: bottom
        name: Tensione
        type: tile
        vertical: false
      - chart_type: bar
        days_to_show: 30
        entities:
        - entity: sensor.sauna_energia_mese
          name: Consumo giorno
        period: day
        stat_types:
        - state
        type: statistics-graph
      - chart_type: bar
        days_to_show: 365
        entities:
        - entity: sensor.sauna_energia_mese
          name: Consumo mese
        period: month
        stat_types:
        - state
        type: statistics-graph
      type: grid
    title: Altri Devices
    type: sections
