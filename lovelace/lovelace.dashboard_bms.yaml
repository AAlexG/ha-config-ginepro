config:
  title: BMS
  views:
  - max_columns: 2
    path: bms
    sections:
    - cards:
      - heading: BMS CONDENSATORE (Bluetooth)
        heading_style: title
        type: heading
      - grid_options:
          columns: 4
          rows: auto
        icon: mdi:solar-power-variant
        icon_height: 20px
        name: Fotovoltaico
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-fotovoltaico/fotovoltaico
        type: button
      - entity: sensor.condensatore_bms_soh
        features_position: bottom
        grid_options:
          columns: 8
          rows: auto
        name: SOH (state of health)
        type: tile
        vertical: false
      - content: '{% set a = states(''sensor.condensatore_bms_allarmi'') %}{% if a
          in [''unknown'',''unavailable''] %}**Allarmi BMS:** _nessuna lettura_{%
          elif a == ''Nessuno'' %}**Allarmi BMS:** nessuno{% else %}<ha-alert alert-type="warning">**Allarmi
          BMS:** {{ a }}</ha-alert>{% endif %}'
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - content: "**Stato:** {{ states('sensor.condensatore_bms_stato') }} \xB7 **Bilanciamento:**\
          \ {{ states('sensor.condensatore_bms_bilanciamento') }}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - entity: sensor.condensatore_bms_capacita
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: "Capacit\xE0Max"
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_residuo
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: Residuo
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_soc
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: SOC
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_cicli
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: Cicli
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_tensione
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: Tensione
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_corrente
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: Corrente
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_tensione_porta
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: Tens. porta
        type: tile
        vertical: false
      - entity: sensor.condensatore_celle_differenza
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        name: "\u0394 celle ora"
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: 'CELLE: ULTIME 14 LETTURE'
        heading_style: title
        type: heading
      - entity: button.uflex_bms_leggi_ora
        features:
        - type: button
        features_position: inline
        grid_options:
          columns: 4
          rows: 1
        name: Leggi ora
        type: tile
        vertical: false
      - content: "{% set L = state_attr('sensor.condensatore_celle_riepilogo', 'letture')\
          \ %}{% if not L %}_Nessuna lettura_{% else %}{% set L = L | reverse | list\
          \ %}mV di distacco dalla cella pi\xF9 alta (0 = pi\xF9 alta). **\u2B07 grassetto**\
          \ = cella pi\xF9 bassa \xB7 \u2022 = in bilanciamento\n<div style=\"overflow-x:auto;font-size:11px\"\
          ><table style=\"border-collapse:collapse;white-space:nowrap\"><tr><th style=\"\
          padding:2px 4px;border:1px solid #444\">Cella</th>{% for r in L %}<th style=\"\
          padding:2px 4px;border:1px solid #444\">{{ r.t[6:] }}</th>{% endfor %}</tr><tr><td\
          \ style=\"padding:2px 4px;border:1px solid #333\"><b>Vpacco</b></td>{% for\
          \ r in L %}<td style=\"padding:2px 4px;border:1px solid #333;text-align:right\"\
          ><b>{{ '%.2f' | format((r.c | sum) / 1000) }}</b></td>{% endfor %}</tr><tr><td\
          \ style=\"padding:2px 4px;border:1px solid #333\"><b>SOC%</b></td>{% for\
          \ r in L %}<td style=\"padding:2px 4px;border:1px solid #333;text-align:right\"\
          ><b>{{ r.s | round(1) }}</b></td>{% endfor %}</tr><tr><td style=\"padding:2px\
          \ 4px;border:1px solid #333\"><b>RSSI</b></td>{% for r in L %}<td style=\"\
          padding:2px 4px;border:1px solid #333;text-align:right\">{{ r.get('r') if\
          \ r.get('r') is not none else '\u2013' }}</td>{% endfor %}</tr><tr><td style=\"\
          padding:2px 4px;border:1px solid #333\"><b>Vmax</b></td>{% for r in L %}<td\
          \ style=\"padding:2px 4px;border:1px solid #333;text-align:right\">{{ '%.3f'\
          \ | format((r.c | max) / 1000) }}</td>{% endfor %}</tr>{% for k in range(14)\
          \ %}<tr><td style=\"padding:2px 4px;border:1px solid #333;text-align:right\"\
          ><b>{{ k + 1 }}</b></td>{% for r in L %}{% set v = r.c[k] - r.c | max %}<td\
          \ style=\"padding:2px 4px;border:1px solid #333;text-align:right\">{% if\
          \ r.c[k] == r.c | min %}<b>\u2B07{{ v }}</b>{% else %}{{ v }}{% endif %}{%\
          \ if ((r.b | default(0)) // 2 ** k) % 2 == 1 %}\u2022{% endif %}</td>{%\
          \ endfor %}</tr>{% endfor %}<tr><td style=\"padding:2px 4px;border:1px solid\
          \ #333\"><b>\u0394</b></td>{% for r in L %}<td style=\"padding:2px 4px;border:1px\
          \ solid #333;text-align:right\"><b>{{ r.c | max - r.c | min }}</b></td>{%\
          \ endfor %}</tr></table></div>{% endif %}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - battery:
          energy: 6990
          show_daily: true
          shutdown_soc: number.inverter_uflex_battery_low_soc
        battery2:
          animate: true
          auto_scale: true
          colour: '#ffc0cb'
          dynamic_colour: true
          energy: 0
          hide_soc: false
          invert_flow: false
          invert_power: false
          linear_gradient: true
          navigate: ''
          path_threshold: 100
          remaining_energy_to_shutdown: false
          show_absolute: false
          show_remaining_energy: true
          shutdown_soc: 20
          soc_end_of_charge: 100
        card_height: 100%
        card_width: 100%
        cardstyle: lite
        center_no_grid: false
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        entities:
          battery_current_191: sensor.inverter_uflex_battery_current
          battery_power_190: sensor.inverter_uflex_battery_power
          battery_soc_184: sensor.inverter_uflex_battery
          battery_temp_182: sensor.inverter_uflex_battery_temperature
          battery_voltage_183: sensor.inverter_uflex_battery_voltage
          day_battery_charge_70: sensor.inverter_uflex_today_battery_charge
          day_battery_discharge_71: sensor.inverter_uflex_today_battery_discharge
          day_grid_export_77: sensor.inverter_uflex_today_energy_export
          day_grid_import_76: sensor.inverter_uflex_today_energy_import
          day_load_energy_84: sensor.inverter_uflex_today_load_consumption
          day_pv_energy_108: sensor.inverter_uflex_today_production
          essential_power: sensor.inverter_uflex_load_power
          grid_ct_power_172: sensor.inverter_uflex_external_ct1_power
          grid_power_169: sensor.inverter_uflex_external_power
          inverter_status_59: sensor.inverter_uflex_device_state
          inverter_voltage_154: sensor.inverter_uflex_grid_l1_voltage
          load_frequency_192: sensor.inverter_uflex_grid_frequency
          pv1_current_110: sensor.inverter_uflex_pv1_current
          pv1_power_186: sensor.inverter_uflex_pv1_power
          pv1_voltage_109: sensor.inverter_uflex_pv1_voltage
          pv2_current_112: sensor.inverter_uflex_pv2_current
          pv2_power_187: sensor.inverter_uflex_pv2_power
          pv2_voltage_111: sensor.inverter_uflex_pv2_voltage
          pv_total_power: sensor.inverter_uflex_pv_power
        grid:
          show_daily_buy: true
          show_daily_sell: true
          show_nonessential: true
        inverter:
          autarky: power
          auto_scale: true
          colour: '#9e9e9e'
          model: sunsynk
          modern: true
          three_phase: false
        large_font: true
        load:
          show_daily: true
        max_line_width: 4
        min_line_width: 1
        show_battery: true
        show_grid: true
        show_solar: true
        solar:
          mppts: 2
          show_daily: true
        type: custom:sunsynk-power-flow-card
        wide: false
      - graph_span: 24h
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: "Max SOC e Max \u0394 cella 13 e 4 oggi"
        series:
        - entity: sensor.condensatore_bms_soc
          name: Ora - SOC
          show:
            in_legend: true
          statistics:
            period: 5minute
            type: max
          stroke_dash: 5
          stroke_width: 1
          type: line
          yaxis_id: soc
        - entity: sensor.condensatore_cella_13_distacco
          name: "\u0394 n.13"
          statistics:
            period: 5minute
            type: min
          stroke_width: 1
          transform: 'return x === null ? null : -x;'
          type: line
          yaxis_id: volt
        - entity: sensor.condensatore_cella_04_distacco
          name: "\u0394 n.4"
          statistics:
            period: 5minute
            type: min
          stroke_width: 1
          transform: 'return x === null ? null : -x;'
          type: line
          yaxis_id: volt
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: "\u0394 cella, mV"
          id: volt
          opposite: true
        - apex_config: null
          decimals: 1
          id: soc
      type: grid
    - cards:
      - heading: ULTIMI 7 GIORNI
        heading_style: title
        type: heading
      - graph_span: 7d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: "Max SOC e Max \u0394 cella 13 e 4, 7gg"
        series:
        - entity: sensor.condensatore_bms_soc
          name: oggi Max - SOC
          show:
            in_legend: true
          statistics:
            period: day
            type: max
          stroke_dash: 5
          stroke_width: 1
          type: line
          yaxis_id: soc
        - entity: sensor.condensatore_cella_13_distacco
          name: "\u0394 n.13"
          statistics:
            period: day
            type: min
          stroke_width: 2
          transform: 'return x === null ? null : -x;'
          type: line
          yaxis_id: volt
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: "\u0394 cella, mV"
          decimals: 0
          id: volt
          opposite: true
        - apex_config: null
          decimals: 1
          id: soc
      - graph_span: 7d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: "Min SOC e Min \u0394 celle 13 e 4, 7gg"
        series:
        - entity: sensor.condensatore_bms_soc
          name: oggi Min - SOC
          show:
            in_legend: true
          statistics:
            period: day
            type: min
          stroke_dash: 5
          stroke_width: 1
          type: line
          yaxis_id: soc
        - entity: sensor.condensatore_cella_04_distacco
          name: "\u0394 n.4"
          statistics:
            period: day
            type: max
          stroke_width: 2
          transform: 'return x === null ? null : -x;'
          type: line
          yaxis_id: volt
        - entity: sensor.condensatore_cella_13_distacco
          name: "\u0394 n.13"
          statistics:
            period: day
            type: max
          stroke_width: 2
          transform: 'return x === null ? null : -x;'
          type: line
          yaxis_id: volt
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: "\u0394 cella, mV"
          decimals: 0
          id: volt
          opposite: true
        - apex_config: null
          decimals: 1
          id: soc
      - graph_span: 7d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Temperature BMS
        series:
        - color: '#D55E00'
          entity: sensor.condensatore_bms_temperatura_5
          name: T5
          stroke_width: 1
          type: line
          yaxis_id: C
        - color: '#0072B2'
          entity: sensor.condensatore_bms_temperatura_6
          name: T6
          stroke_width: 1
          type: line
          yaxis_id: C
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: C
          decimals: 1
          id: C
      type: grid
    - cards:
      - content: "C13 e C4 = distacco in mV dalla cella pi\xF9 alta (riferimento del\
          \ bilanciamento BMS: Equalization opening 20 mV, closing 10 mV, solo sopra\
          \ 4,0 V per cella). Min = numero della cella pi\xF9 bassa. \u0394 = cella\
          \ max \u2212 cella min."
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - content: "{% set d = state_attr('sensor.condensatore_celle_riepilogo', 'giorni')\
          \ %}{% if not d %}_Dati non ancora disponibili_{% else %}**Fine scarica**\
          \ (tensione minima del giorno)\n\n| Giorno | Ora | V | SOC | \u0394 mV |\
          \ Min | C13 | C4 |\n|--|--|--:|--:|--:|--:|--:|--:|\n{% for r in d | reverse\
          \ %}| {{ r.g }} | {{ r.hb }} | {{ r.vb }} | {{ r.sob }} | **{{ r.db }}**\
          \ | {{ r.cb }} | {{ r.xb13 if r.xb13 is defined else '\u2013' }} | {{ r.xb4\
          \ if r.xb4 is defined else '\u2013' }} |\n{% endfor %}{% endif %}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - content: "{% set d = state_attr('sensor.condensatore_celle_riepilogo', 'giorni')\
          \ %}{% if not d %}_Dati non ancora disponibili_{% else %}**Fine carica**\
          \ (tensione massima del giorno)\n\n| Giorno | Ora | V | SOC | \u0394 mV\
          \ | Min | C13 | \u0394 max |\n|--|--|--:|--:|--:|--:|--:|--:|\n{% for r\
          \ in d | reverse %}| {{ r.g }} | {{ r.ha }} | {{ r.va }} | {{ r.soa }} |\
          \ **{{ r.da }}** | {{ r.ca }} | {{ r.xa13 if r.xa13 is defined else '\u2013\
          ' }} | {{ r.dmax }} |\n{% endfor %}{% endif %}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      - content: "{% set d = state_attr('sensor.condensatore_celle_riepilogo', 'bilanciamento')\
          \ %}{% if not d %}_Nessun bilanciamento registrato_{% else %}{% set d =\
          \ d | reverse | list %}**Bilanciamento per giorno** \xB7 per ogni cella,\
          \ in quante letture (una ogni 15 min) era in bilanciamento \xB7 C13 = distacco\
          \ della cella 13 dalla pi\xF9 alta, in mV\n<div style=\"overflow-x:auto;font-size:11px\"\
          ><table style=\"border-collapse:collapse;white-space:nowrap\"><tr><th style=\"\
          padding:2px 4px;border:1px solid #444\">Cella</th>{% for r in d %}<th style=\"\
          padding:2px 4px;border:1px solid #444\">{{ r.g }}</th>{% endfor %}</tr>{%\
          \ for k in range(14) %}<tr><td style=\"padding:2px 4px;border:1px solid\
          \ #333;text-align:right\"><b>{{ k + 1 }}</b></td>{% for r in d %}<td style=\"\
          padding:2px 4px;border:1px solid #333;text-align:right\">{{ r.k[k] if r.k[k]\
          \ else '\xB7' }}</td>{% endfor %}</tr>{% endfor %}<tr><td style=\"padding:2px\
          \ 4px;border:1px solid #333\"><b>Letture</b></td>{% for r in d %}<td style=\"\
          padding:2px 4px;border:1px solid #333;text-align:right\"><b>{{ r.n }}</b></td>{%\
          \ endfor %}</tr><tr><td style=\"padding:2px 4px;border:1px solid #333\"\
          ><b>Dalle</b></td>{% for r in d %}<td style=\"padding:2px 4px;border:1px\
          \ solid #333;text-align:right\">{{ r.h1 }}</td>{% endfor %}</tr><tr><td\
          \ style=\"padding:2px 4px;border:1px solid #333\"><b>Alle</b></td>{% for\
          \ r in d %}<td style=\"padding:2px 4px;border:1px solid #333;text-align:right\"\
          >{{ r.h2 }}</td>{% endfor %}</tr><tr><td style=\"padding:2px 4px;border:1px\
          \ solid #333\"><b>C13 inizio</b></td>{% for r in d %}<td style=\"padding:2px\
          \ 4px;border:1px solid #333;text-align:right\">{{ r.x1 }}</td>{% endfor\
          \ %}</tr><tr><td style=\"padding:2px 4px;border:1px solid #333\"><b>C13\
          \ fine</b></td>{% for r in d %}<td style=\"padding:2px 4px;border:1px solid\
          \ #333;text-align:right\"><b>{{ r.x2 }}</b></td>{% endfor %}</tr><tr><td\
          \ style=\"padding:2px 4px;border:1px solid #333\"><b>A fine</b></td>{% for\
          \ r in d %}<td style=\"padding:2px 4px;border:1px solid #333;text-align:right\"\
          >{{ r.i2 }}</td>{% endfor %}</tr></table></div>{% endif %}"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      type: grid
    title: BMS
    type: sections
