config:
  title: Fotovoltaico v.34
  views:
  - cards: []
    max_columns: 2
    path: fotovoltaico
    sections:
    - cards:
      - heading: SISTEMA ORA
        heading_style: title
        type: heading
      - entity: sensor.inverter_uflex_device_state
        features_position: bottom
        grid_options:
          rows: auto
        name: Stato inverter
        type: tile
        vertical: false
      - grid_options:
          columns: 3
          rows: auto
        icon: mdi:tune-vertical
        icon_height: 20px
        name: Dettagli inverter
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dettagli-inverter/inverter
        type: button
      - grid_options:
          columns: 3
          rows: auto
        icon: mdi:battery-heart-variant
        icon_height: 20px
        name: BMS
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-bms/bms
        type: button
      - entity: input_boolean.condensatore_staccato
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Condensatore in avaria
        type: tile
        vertical: false
      - entity: sensor.condensatore_bms_soc
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: SOC (letto ogni 15min da BMS)
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_battery
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: SOC da inverter (momentanea)
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_battery_voltage
        features_position: bottom
        name: Tensione
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_battery_current
        features_position: bottom
        name: Corrente
        type: tile
        vertical: false
      - entity: sensor.condensatore_corrente_scarica_max_oggi
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: Corrente max di carica oggi
        type: tile
        vertical: false
      - entity: sensor.condensatore_tensione_max_oggi
        features_position: bottom
        grid_options:
          columns: 12
          rows: 1
        name: Tensione max oggi
        type: tile
        vertical: false
      - cards:
        - entity: sensor.inverter_uflex_temperature
          features_position: bottom
          name: Temp. inverter
          type: tile
          vertical: false
        - entity: sensor.inverter_uflex_dc_temperature
          features_position: bottom
          name: Temp. DC
          type: tile
          vertical: false
        columns: 2
        square: false
        type: grid
      - battery:
          energy: 6990
          show_daily: true
          shutdown_soc: number.inverter_uflex_battery_low_soc
        battery2:
          animate: true
          auto_scale: true
          colour: '#ffc0cb'
          dynamic_colour: true
          energy: 0
          hide_soc: false
          invert_flow: false
          invert_power: false
          linear_gradient: true
          navigate: ''
          path_threshold: 100
          remaining_energy_to_shutdown: false
          show_absolute: false
          show_remaining_energy: true
          shutdown_soc: 20
          soc_end_of_charge: 100
        card_height: 100%
        card_width: 100%
        cardstyle: lite
        center_no_grid: false
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        entities:
          battery_current_191: sensor.inverter_uflex_battery_current
          battery_power_190: sensor.inverter_uflex_battery_power
          battery_soc_184: sensor.inverter_uflex_battery
          battery_temp_182: sensor.inverter_uflex_battery_temperature
          battery_voltage_183: sensor.inverter_uflex_battery_voltage
          day_battery_charge_70: sensor.inverter_uflex_today_battery_charge
          day_battery_discharge_71: sensor.inverter_uflex_today_battery_discharge
          day_grid_export_77: sensor.inverter_uflex_today_energy_export
          day_grid_import_76: sensor.inverter_uflex_today_energy_import
          day_load_energy_84: sensor.inverter_uflex_today_load_consumption
          day_pv_energy_108: sensor.inverter_uflex_today_production
          essential_power: sensor.inverter_uflex_load_power
          grid_ct_power_172: sensor.inverter_uflex_external_ct1_power
          grid_power_169: sensor.inverter_uflex_external_power
          inverter_status_59: sensor.inverter_uflex_device_state
          inverter_voltage_154: sensor.inverter_uflex_grid_l1_voltage
          load_frequency_192: sensor.inverter_uflex_grid_frequency
          pv1_current_110: sensor.inverter_uflex_pv1_current
          pv1_power_186: sensor.inverter_uflex_pv1_power
          pv1_voltage_109: sensor.inverter_uflex_pv1_voltage
          pv2_current_112: sensor.inverter_uflex_pv2_current
          pv2_power_187: sensor.inverter_uflex_pv2_power
          pv2_voltage_111: sensor.inverter_uflex_pv2_voltage
          pv_total_power: sensor.inverter_uflex_pv_power
        grid:
          show_daily_buy: true
          show_daily_sell: true
          show_nonessential: true
        inverter:
          autarky: power
          auto_scale: true
          colour: '#9e9e9e'
          model: sunsynk
          modern: true
          three_phase: false
        large_font: true
        load:
          show_daily: true
        max_line_width: 4
        min_line_width: 1
        show_battery: true
        show_grid: true
        show_solar: true
        solar:
          mppts: 2
          show_daily: true
        type: custom:sunsynk-power-flow-card
        wide: false
      - heading: Corrente max SC
        heading_style: subtitle
        type: heading
      - entity: number.inverter_uflex_battery_max_charging_current
        features_position: bottom
        grid_options:
          columns: 6
          rows: auto
        name: Carica
        type: tile
        vertical: false
      - entity: number.inverter_uflex_battery_max_discharging_current
        features_position: bottom
        grid_options:
          rows: auto
        name: Scarica
        type: tile
        vertical: false
      - heading: Soglie SOC condensatore
        heading_style: subtitle
        type: heading
      - entity: number.inverter_uflex_battery_shutdown_soc
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        icon_tap_action:
          action: more-info
        name: Shutdown
        tap_action:
          action: more-info
        type: tile
        vertical: false
      - entity: number.inverter_uflex_battery_low_soc
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        icon_tap_action:
          action: more-info
        name: Stop scarica (Battery Low)
        tap_action:
          action: more-info
        type: tile
        vertical: false
      - entity: number.inverter_uflex_battery_restart_soc
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        icon_tap_action:
          action: more-info
        name: Riavvio dopo shutdown
        tap_action:
          action: more-info
        type: tile
        vertical: false
      - heading: Altri parametri
        heading_style: subtitle
        type: heading
      - entity: number.inverter_uflex_pv_power
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        icon_tap_action:
          action: more-info
        name: Limite potenza max produzione FV
        tap_action:
          action: more-info
        type: tile
        vertical: false
      type: grid
    - cards:
      - heading: DG CASA
        heading_style: title
        icon: mdi:electric-switch
        type: heading
      - content: "{% set s = 'sensor.inverter_uflex_load_power' %}\n{% set p = states(s)\
          \ %}\n{% set a = states.automation | selectattr('attributes.id','defined')\n\
          \   | selectattr('attributes.id','eq','elettricita_dg_casa_scattato') |\
          \ list | first | default(none) %}\n{% if not has_value(s) %}\n### <font\
          \ color=\"#7F7F7F\">\u26AA Stato sconosciuto</font>\nCarico casa non disponibile\
          \ ({{ p }}).\n{% elif p | float(0) < 50 %}\n### <font color=\"#D55E00\"\
          >\u26A0\uFE0F DG CASA APERTO</font>\nCarico casa **{{ p | float(0) | round(0)\
          \ }} W** (sotto 50 W)\n{% else %}\n### <font color=\"#0072B2\">\u2714\uFE0F\
          \ DG CASA armato</font>\nCarico casa **{{ p | float(0) | round(0) }} W**\n\
          {% endif %}\n\n| | |\n|---|---|\n| Ultimo scatto | {{ as_timestamp(a.attributes.last_triggered)\
          \ | timestamp_custom('%d/%m %H:%M') if a and a.attributes.last_triggered\
          \ else 'mai' }} |\n| In attesa di riarmo | {{ 's\xEC' if a and a.attributes.current\
          \ | default(0) > 0 else 'no' }} |\n| Automazione | {{ ('attiva' if a.state\
          \ == 'on' else 'DISATTIVATA') if a else 'non trovata' }} |\n\n- **Scattato**:\
          \ carico casa sotto **50 W** per **30 s**\n\n"
        grid_options:
          columns: full
          rows: auto
        type: markdown
      type: grid
    - cards:
      - heading: CONDENSATORE
        heading_style: title
        type: heading
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Tensione max/giorno 30gg
        series:
        - color: '#0072B2'
          entity: sensor.inverter_uflex_battery_voltage
          name: tensione max oggi
          statistics:
            period: day
            type: max
          stroke_width: 2
          type: line
          yaxis_id: volt
        - color: '#D55E00'
          entity: sensor.inverter_uflex_battery_voltage
          name: Absorption
          show:
            in_legend: false
          statistics:
            period: day
            type: max
          stroke_dash: 6
          stroke_width: 2
          transform: return parseFloat(hass.states['number.inverter_uflex_battery_absorption'].state);
          type: line
          yaxis_id: volt
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: max tens.V
          decimals: 2
          id: volt
      - graph_span: 10d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Tensione min/giorno 10gg
        series:
        - entity: sensor.inverter_uflex_battery_voltage
          name: min tensione
          statistics:
            period: day
            type: min
          type: line
          yaxis_id: volt
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: min tens.,V
          decimals: 2
          id: volt
      - graph_span: 3d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Corrente max/ora 72h
        series:
        - color: '#D55E00'
          entity: sensor.inverter_uflex_battery_current
          name: carica
          statistics:
            period: hour
            type: min
          transform: return Math.max(-x, 0);
          type: column
          yaxis_id: amp
        - color: '#0072B2'
          entity: sensor.inverter_uflex_battery_current
          name: scarica
          statistics:
            period: hour
            type: max
          transform: return -Math.max(x, 0);
          type: column
          yaxis_id: amp
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: A
          decimals: 0
          id: amp
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Corente scarica max/gg 30gg
        series:
        - color: '#0072B2'
          entity: sensor.condensatore_corrente_scarica_max_oggi
          name: scarica
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: A
        - color: '#0072B2'
          entity: sensor.condensatore_corrente_scarica_max_oggi
          name: limite
          show:
            in_legend: false
          statistics:
            period: day
            type: max
          stroke_dash: 6
          stroke_width: 2
          transform: return parseFloat(hass.states['number.inverter_uflex_battery_max_discharging_current'].state);
          type: line
          yaxis_id: A
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: A
          decimals: 2
          id: A
          min: 0
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: "Energia vuoto\u2192pieno 30gg"
        series:
        - color: '#009E73'
          entity: sensor.condensatore_energia_al_pieno
          name: energia
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: kwh
        - color: '#D55E00'
          entity: sensor.condensatore_energia_al_pieno
          name: targa 7,6 kWh
          show:
            in_legend: false
          statistics:
            period: day
            type: max
          stroke_dash: 6
          stroke_width: 2
          transform: return 7.6;
          type: line
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: carica kWh
          decimals: 2
          id: kwh
          max: 8
          min: 0
      - graph_span: 60d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Superamenti Absorption/gg, 60gg
        series:
        - color: '#D55E00'
          entity: sensor.condensatore_superamenti_oggi
          name: episodi
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: conteggio
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: episodi/giorno
          decimals: 0
          id: conteggio
          min: 0
      - graph_span: 7d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Temperatura max/giorno 7gg
        series:
        - entity: sensor.condensatore_bms_temperatura_5
          name: Temp BMS T5
          statistics:
            period: day
            type: max
          type: line
          yaxis_id: C
        - entity: sensor.inverter_uflex_dc_temperature
          name: inverter DC
          statistics:
            period: day
            type: max
          type: line
          yaxis_id: C
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: "\xB0C"
          decimals: 2
          id: C
          min: 20
      - graph_span: 1d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: SOC di condens. Vs prodizione 24h
        series:
        - entity: sensor.inverter_uflex_battery
          name: SOC ora
          statistics:
            period: hour
            type: max
          stroke_width: 2
          type: line
          yaxis_id: perc
        - entity: sensor.inverter_uflex_pv_power
          name: prodizione ora
          statistics:
            period: hour
            type: max
          stroke_width: 2
          type: line
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: produzione, kWh
          decimals: 0
          id: kwh
          opposite: true
        - apex_config:
            title:
              text: SOC %
          decimals: 2
          id: perc
      - graph_span: 3d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: SOC di condens. Vs a rete 3gg
        series:
        - entity: sensor.inverter_uflex_battery
          name: SOC ora
          statistics:
            period: hour
            type: max
          stroke_width: 2
          type: line
          yaxis_id: perc
        - entity: sensor.inverter_uflex_today_energy_export
          name: a rete ora
          statistics:
            period: hour
            type: change
          stroke_width: 2
          type: line
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: a rete, kWh
          decimals: 2
          id: kwh
          opposite: true
        - apex_config:
            title:
              text: SOC %
          decimals: 2
          id: perc
      - graph_span: 3d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: SOC di condens. Vs Da rete 3gg
        series:
        - entity: sensor.inverter_uflex_battery
          name: SOC ora
          statistics:
            period: hour
            type: max
          stroke_width: 2
          type: line
          yaxis_id: perc
        - entity: sensor.inverter_uflex_today_energy_import
          name: da rete ora
          statistics:
            period: hour
            type: change
          stroke_width: 2
          type: line
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: da rete, kWh
          decimals: 2
          id: kwh
          opposite: true
        - apex_config:
            title:
              text: SOC %
          decimals: 2
          id: perc
      - graph_span: 12months
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Energia cond.carica/scarica 12 mesi
        series:
        - entity: sensor.inverter_uflex_today_battery_charge
          name: carica
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        - entity: sensor.inverter_uflex_today_battery_discharge
          name: scarica
          statistics:
            period: month
            type: change
          type: column
          yaxis_id: kwh
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: kWh
          decimals: 2
          id: kwh
      type: grid
    - cards:
      - heading: PANELLI FOTOVOLTAICI
        heading_style: title
        type: heading
      - cards:
        - entity: sensor.panel_max_power_summary
          features_position: bottom
          name: Max Potenza
          type: tile
          vertical: false
        - entity: sensor.panel_min_power_summary
          features_position: bottom
          name: Min Potenza
          type: tile
          vertical: false
        - entity: sensor.panel_max_strength_summary
          features_position: bottom
          name: Max Signal
          type: tile
          vertical: false
        - entity: sensor.panel_min_strength_summary
          features_position: bottom
          name: Min Signal
          type: tile
          vertical: false
        - entity: sensor.panels_zero_production
          features_position: bottom
          name: Pannelli 0 produzione
          type: tile
          vertical: false
        columns: 1
        grid_options:
          columns: 6
          rows: auto
        square: false
        type: grid
      - alt_text: Schema pannelli Tigo
        grid_options:
          columns: 6
          rows: auto
        image: /local/schemaTigo.jpg
        type: picture
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Segnale Min/Max pannelli /gg
        series:
        - entity: sensor.panel_max_strength_value
          name: Max Signal
          statistics:
            period: day
            type: max
          type: line
          yaxis_id: signal
        - entity: sensor.panel_min_strength_value
          name: Min Signal
          statistics:
            period: day
            type: min
          type: line
          yaxis_id: signal
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: dBm
          decimals: 0
          id: signal
      type: grid
    - cards:
      - heading: PRODUZIONE ELETTRICA
        heading_style: title
        type: heading
      - grid_options:
          columns: 6
          rows: auto
        icon: mdi:solar-panel-large
        icon_height: 20px
        name: Panel Analytics
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: perform-action
          data:
            data:
              package_name: appinventor.ai_aagorine.PanelAnalytics
            message: command_launch_app
          perform_action: notify.mobile_app_cph2653
        type: button
      - grid_options:
          columns: 6
          rows: auto
        icon: mdi:file-table
        icon_height: 20px
        name: Consumi
        show_icon: true
        show_name: true
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /dashboard-consumi/elettricita
        type: button
      - entity: sensor.inverter_uflex_today_production
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Oggi
        type: tile
        vertical: false
      - entity: sensor.produzione_mese
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Mese
        type: tile
        vertical: false
      - entity: sensor.produzione_anno
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Anno
        type: tile
        vertical: false
      - heading: Dal accensione impianto
        heading_style: subtitle
        type: heading
      - entity: sensor.inverter_uflex_total_production
        features_position: bottom
        grid_options:
          columns: full
          rows: 1
        name: Prodotto da panelli
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_total_energy
        features_position: bottom
        grid_options:
          columns: full
          rows: 1
        name: Da inverter (x perdite AC/DC)
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_total_energy_export
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: A rete
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_total_energy_import
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Da rete
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_total_load_consumption
        features_position: bottom
        grid_options:
          columns: full
          rows: auto
        name: Consumo(da inverter-a rete+da rete)
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_total_battery_charge
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: A batteria
        type: tile
        vertical: false
      - entity: sensor.inverter_uflex_total_battery_discharge
        features_position: bottom
        grid_options:
          columns: 3
          rows: 1
        name: Da batteria
        type: tile
        vertical: false
      - heading: 'Risparmio fotovoltaico (storico):'
        heading_style: subtitle
        type: heading
      - entity: input_number.pv_risparmio_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:solar-power
        name: Autoconsumo
        type: tile
        vertical: false
      - entity: input_number.pv_gse_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:cash-multiple
        name: Da GSE
        type: tile
        vertical: false
      - entity: input_number.pv_totale_euro
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:piggy-bank
        name: Risparmiato
        type: tile
        vertical: false
      - entity: input_number.pv_recupero_pct
        features_position: bottom
        grid_options:
          columns: 4
          rows: 1
        icon: mdi:percent
        name: '% recupero'
        type: tile
        vertical: false
      - heading: 'Riassunto mensile: FFV e consumi, kWh'
        heading_style: subtitle
        type: heading
      - content: '{% set d = state_attr(''sensor.pv_tabella_mensile'', ''mesi'') %}
          {%

          if d is none %} _Dati non disponibili_ {% else %} {% set mesi = d

          | reverse | list %} <div

          style="overflow-x:auto;overflow-y:auto;max-height:400px;font-size:11px">

          <table

          style="border-collapse:collapse;width:100%;white-space:nowrap">

          <thead><tr

          style="position:sticky;top:0;background:#1a1a2e;color:#e0e0e0">

          <th style="padding:4px 6px;border:1px solid #444">Mese</th> <th

          style="padding:4px 6px;border:1px solid #444">Prod</th> <th

          style="padding:4px 6px;border:1px solid #444">Consumo</th> <th

          style="padding:4px 6px;border:1px solid #444">% Consumo</th>

          <th style="padding:4px 6px;border:1px solid #444">Import</th> <th

          style="padding:4px 6px;border:1px solid #444">Tot Consum</th> <th

          style="padding:4px 6px;border:1px solid #444">Export</th> <th

          style="padding:4px 6px;border:1px solid #444">Bat Carica</th> <th

          style="padding:4px 6px;border:1px solid #444">Bat Scarica</th> <th

          style="padding:4px 6px;border:1px solid #444">%Perd</th>

          </tr></thead> <tbody> {% for r in mesi %} {% if loop.first or

          loop.last %} <tr style="font-weight:bold;background:#2a2a3e"> {%

          else %} <tr> {% endif %} <td style="padding:3px 6px;border:1px

          solid #333">{{ r.mese }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.produzione

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.autoconsumo }}</td> <td

          style="padding:3px 6px;border:1px solid #333;text-align:right">{{

          r.pct_auto }}%</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.import }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.consumo_tot

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.export }}</td> <td style="padding:3px

          6px;border:1px solid #333;text-align:right">{{ r.batt_carica

          }}</td> <td style="padding:3px 6px;border:1px solid

          #333;text-align:right">{{ r.batt_scarica }}</td> <td

          style="padding:3px 6px;border:1px solid #333;text-align:right">{{

          r.pct_batt_loss }}%</td> </tr> {% endfor %} </tbody></table></div>

          {% endif %}

          '
        grid_options:
          columns: full
          rows: auto
        type: markdown
      type: grid
    - cards:
      - heading: PRODUZIONE
        heading_style: title
        type: heading
      - card:
          entities:
          - entity: sensor.inverter_uflex_pv_power
            name: Produzione ora
          header: null
          hours_to_show: 24
          refresh_interval: 60
          show: true
          type: history-graph
        conditions: []
        type: conditional
      - graph_span: 30d
        grid_options:
          columns: 12
          rows: auto
        header:
          show: true
          title: Max production durante giorno 30gg, kWh
        series:
        - entity: sensor.inverter_uflex_pv_power
          name: max production
          statistics:
            period: day
            type: max
          type: column
          yaxis_id: W
        type: custom:apexcharts-card
        yaxis:
        - apex_config:
            title:
              text: max production, kWh
          decimals: 0
          id: W
          min: 0
      - graph_span: 30d
